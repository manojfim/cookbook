/wp-content/uploads/2018/09/Apple-Cinnamon-Oat-Bars-1.jpg", "prep": "10 minutes", "cook": "20 minutes", "yield": "10 soft snack bars", "desc": "A nutritious, autumn-spiced breakfast and snack bar sweetened entirely with fresh grated apple and unsweetened applesauce. Packed with rolled oats, almond butter (or sunflower seed butter), and hemp hearts, these soft-baked bars deliver complete plant protein, fiber, and omega-3 fatty acids without any honey or refined sugar.", "desc_te": "తాజాగా తురిమిన యాపిల్, తీపి లేని యాపిల్‌సాస్‌తో మాత్రమే తీపి చేసిన, పోషకాలు నిండిన, శరదృతువు మసాలా వాసనగల అల్పాహారం, స్నాక్ బార్. రోల్డ్ ఓట్స్, ఆల్మండ్ బటర్ (లేదా సన్‌ఫ్లవర్ సీడ్ బటర్), హెంప్ హార్ట్స్‌తో నిండిన ఈ మెత్తగా బేక్ చేసిన బార్స్‌లో పూర్తి ప్లాంట్ ప్రోటీన్, ఫైబర్, ఒమేగా-3 ఫ్యాటీ యాసిడ్లు ఉంటాయి, తేనె లేదా రిఫైన్డ్ చక్కెర లేకుండా.", "tags": [], "ing": ["1.5 cups old-fashioned rolled oats", "1/4 cup hemp hearts (shelled hemp seeds, for complete plant protein & healthy fats)", "1 medium sweet apple (such as Gala or Honeycrisp), peeled and finely grated (approx. 1/2 cup)", "1/2 cup unsweetened smooth applesauce", "1/3 cup creamy almond butter or sunflower seed butter", "1 large egg (or 1 flax egg: 1 tbsp ground flaxseed + 2.5 tbsp water)", "1 tsp pure vanilla extract", "1 tsp ground cinnamon", "1/2 tsp baking powder"], "ing_te": ["1.5 cups ఓల్డ్-ఫ్యాషన్డ్ రోల్డ్ ఓట్స్", "1/4 cup హెంప్ హార్ట్స్ (పొట్టు తీసిన హెంప్ గింజలు, పూర్తి ప్లాంట్ ప్రోటీన్ & ఆరోగ్యకరమైన కొవ్వుల కోసం)", "1 medium తీపి యాపిల్ (గాలా లేదా హనీక్రిస్ప్ వంటిది), పొట్టు తీసి సన్నగా తురిమినది (సుమారు 1/2 cup)", "1/2 cup తీపి లేని మెత్తని యాపిల్‌సాస్", "1/3 cup క్రీమీ ఆల్మండ్ బటర్ లేదా సన్‌ఫ్లవర్ సీడ్ బటర్", "1 large గుడ్డు (లేదా 1 ఫ్లాక్స్ గుడ్డు: 1 tbsp పొడి చేసిన అవిసె గింజలు + 2.5 tbsp నీరు)", "1 tsp స్వచ్ఛమైన వనిల్లా ఎక్స్‌ట్రాక్ట్", "1 tsp దాల్చినచెక్క పొడి", "1/2 tsp బేకింగ్ పౌడర్"], "steps": ["Preheat & Line: Preheat oven to 350°F (175°C). Line an 8x8-inch square baking dish with parchment paper, leaving an overhang for easy lifting.", "Mix Wet Ingredients: In a large bowl, whisk together the applesauce, almond butter (or sunflower butter), egg, and vanilla extract until completely smooth and emulsified.", "Fold Dry & Apple: Stir in the rolled oats, hemp hearts, cinnamon, and baking powder. Fold in the grated fresh apple until evenly distributed.", "Press into Pan: Spread the mixture evenly into the prepared baking dish, pressing down firmly with the back of a spatula to compact the oats.", "Bake: Bake at 350°F (175°C) for 18–20 minutes until the edges are lightly golden and the top feels set to the touch.", "Cool & Slice: Let cool completely in the pan for 20 minutes before lifting out by the parchment paper. Slice into 10 rectangular toddler snack bars."], "steps_te": ["ప్రీహీట్ చేసి లైన్ చేయండి: ఓవెన్‌ను 350°F (175°C) వద్ద ప్రీహీట్ చేయండి. 8x8-inch చతురస్రాకార బేకింగ్ డిష్‌లో పార్చ్‌మెంట్ పేపర్ పరచండి, సులభంగా ఎత్తడానికి అంచులు బయటకు ఉండేలా.", "తడి పదార్థాలు కలపండి: పెద్ద గిన్నెలో యాపిల్‌సాస్, ఆల్మండ్ బటర్ (లేదా సన్‌ఫ్లవర్ బటర్), గుడ్డు, వనిల్లా ఎక్స్‌ట్రాక్ట్‌ను పూర్తిగా మెత్తగా, ఒకేలా అయ్యేవరకు గిలకొట్టండి.", "పొడి పదార్థాలు & యాపిల్ కలపండి: రోల్డ్ ఓట్స్, హెంప్ హార్ట్స్, దాల్చినచెక్క, బేకింగ్ పౌడర్ కలపండి. తురిమిన తాజా యాపిల్‌ను సమానంగా కలిసేవరకు మడత పెట్టినట్లు కలపండి.", "పాన్‌లో నొక్కండి: మిశ్రమాన్ని సిద్ధం చేసిన బేకింగ్ డిష్‌లో సమానంగా పరచి, స్పాటులా వెనుక భాగంతో గట్టిగా నొక్కి ఓట్స్‌ను కుదించండి.", "బేక్ చేయండి: 350°F (175°C) వద్ద 18–20 minutes పాటు బేక్ చేయండి, అంచులు తేలికగా బంగారు రంగు వచ్చి, పైభాగం తాకితే గట్టిగా అనిపించేవరకు.", "చల్లార్చి ముక్కలు చేయండి: పార్చ్‌మెంట్ పేపర్‌తో ఎత్తే ముందు పాన్‌లోనే 20 minutes పాటు పూర్తిగా చల్లారనివ్వండి. 10 దీర్ఘచతురస్రాకార పసిపిల్లల స్నాక్ బార్స్‌గా కత్తిరించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:26.688Z"}, {"n": 88, "title": "Soft-Baked Banana & Cottage Cheese Breakfast Cookies", "title_te": "సాఫ్ట్-బేక్డ్ బనానా & కాటేజ్ చీజ్ బ్రేక్‌ఫాస్ట్ కుకీలు", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍪", "image": "https://www.frostyrecipes.com/wp-content/uploads/2026/01/Banana-Walnut-Cottage-Cheese-Cookies-1.webp", "prep": "10 minutes", "cook": "15 minutes", "yield": "12 soft cookies", "desc": "Cookies for breakfast! These soft, pillowy, wholesome bites are made by blending whole-milk cottage cheese into sweet ripe bananas, rolled oats, and ground flaxseed. They bake into tender, cake-like cookies that provide steady morning energy, healthy fats, and calcium with zero added sugar or honey.", "desc_te": "అల్పాహారం కోసం కుకీలు! హోల్-మిల్క్ కాటేజ్ చీజ్‌ను తీపి పండిన అరటిపండ్లు, రోల్డ్ ఓట్స్ మరియు గ్రౌండ్ ఫ్లాక్స్‌సీడ్‌తో కలిపి బ్లెండ్ చేయడం ద్వారా ఈ మెత్తని, దిండులాంటి, ఆరోగ్యకరమైన బైట్స్ తయారవుతాయి. అవి మెత్తని, కేక్‌లాంటి కుకీలుగా బేక్ అవుతాయి, సున్నా జోడించిన చక్కెర లేదా తేనె లేకుండా స్థిరమైన ఉదయం శక్తి, ఆరోగ్యకరమైన కొవ్వులు మరియు కాల్షియం అందిస్తాయి.", "tags": [], "ing": ["2 medium ripe bananas (well-speckled with brown spots), thoroughly mashed", "1/2 cup whole-milk cottage cheese (blended smooth or whisked well)", "1.5 cups old-fashioned rolled oats", "2 tbsp ground flaxseed or hemp hearts", "1 tsp ground Ceylon cinnamon", "1/2 tsp pure vanilla extract", "1/2 tsp baking powder", "Optional add-in: 2 tbsp finely diced fresh blueberries or unsweetened shredded coconut"], "ing_te": ["2 medium పండిన అరటిపండ్లు (గోధుమ మచ్చలతో బాగా మచ్చలు పడినవి), పూర్తిగా మెదిపినవి", "1/2 cup హోల్-మిల్క్ కాటేజ్ చీజ్ (మెత్తగా బ్లెండ్ చేసినది లేదా బాగా గిలకొట్టినది)", "1.5 cups ఓల్డ్-ఫ్యాషన్డ్ రోల్డ్ ఓట్స్", "2 tbsp గ్రౌండ్ ఫ్లాక్స్‌సీడ్ లేదా హెంప్ హార్ట్స్", "1 tsp గ్రౌండ్ సిలోన్ దాల్చినచెక్క", "1/2 tsp స్వచ్ఛమైన వనిల్లా ఎక్స్‌ట్రాక్ట్", "1/2 tsp బేకింగ్ పౌడర్", "ఐచ్ఛిక అదనం: 2 tbsp సన్నగా కోసిన తాజా బ్లూబెర్రీలు లేదా తీపి లేని తురిమిన కొబ్బరి"], "steps": ["Preheat & Prep: Preheat your oven to 350°F (175°C) and line a baking sheet with parchment paper.", "Combine Wet Ingredients: In a large mixing bowl, mash the bananas thoroughly. Stir in the cottage cheese and vanilla extract until well combined and creamy.", "Add Dry Ingredients: Fold in the rolled oats, ground flaxseed/hemp hearts, cinnamon, and baking powder. Stir well until a thick, moist cookie dough forms. Fold in diced blueberries if using. Let the dough rest for 5 minutes so the oats absorb the moisture.", "Portion Cookies: Use a cookie scoop or tablespoon to drop 12 mounds of dough onto the baking sheet. Flatten gently with the back of a fork or fingers into 2-inch cookie discs (they will not spread much during baking).", "Bake: Bake at 350°F for 14–16 minutes, until the bottoms are golden brown and the tops feel set and springy to the touch.", "Cool & Serve: Allow to cool on the baking sheet for 10 minutes before serving."], "steps_te": ["ప్రీహీట్ & సిద్ధం: ఓవెన్‌ను 350°F (175°C) వద్ద ప్రీహీట్ చేసి బేకింగ్ షీట్‌కు పార్చ్‌మెంట్ పేపర్ వేయండి.", "తడి పదార్థాలు కలపండి: ఒక పెద్ద మిక్సింగ్ బౌల్‌లో అరటిపండ్లను పూర్తిగా మెదపండి. కాటేజ్ చీజ్ మరియు వనిల్లా ఎక్స్‌ట్రాక్ట్ కలిపి బాగా కలిసి క్రీమీగా అయ్యేవరకు కలపండి.", "పొడి పదార్థాలు వేయండి: రోల్డ్ ఓట్స్, గ్రౌండ్ ఫ్లాక్స్‌సీడ్/హెంప్ హార్ట్స్, దాల్చినచెక్క మరియు బేకింగ్ పౌడర్ కలపండి. మందపాటి, తేమగల కుకీ పిండి అయ్యేవరకు బాగా కలపండి. వాడుతుంటే కోసిన బ్లూబెర్రీలు కలపండి. ఓట్స్ తేమ పీల్చుకునేలా పిండిని 5 minutes విశ్రాంతి ఇవ్వండి.", "కుకీలు భాగాలు చేయండి: కుకీ స్కూప్ లేదా టేబుల్‌స్పూన్‌తో బేకింగ్ షీట్‌పై 12 పిండి ముద్దలు వేయండి. ఫోర్క్ వెనుక భాగంతో లేదా వేళ్లతో 2-inch కుకీ డిస్క్‌లుగా మెల్లగా చదును చేయండి (బేక్ చేసేటప్పుడు అవి ఎక్కువగా వ్యాపించవు).", "బేక్ చేయండి: 350°F వద్ద 14–16 minutes బేక్ చేయండి, అడుగు భాగాలు బంగారు గోధుమ రంగులో అయ్యి పైభాగాలు సెట్ అయి, తాకితే స్ప్రింగ్‌గా అనిపించేవరకు.", "చల్లార్చి వడ్డించండి: వడ్డించే ముందు బేకింగ్ షీట్‌పైనే 10 minutes చల్లారనివ్వండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:26.712Z"}, {"n": 135, "title": "Soft-Baked Sweet Berry & Pear Fiber Bars V3", "title_te": "మెత్తని బేక్డ్ స్వీట్ బెర్రీ & పియర్ ఫైబర్ బార్స్ V3", "cat": "Adult", "section": "adult", "emoji": "🥗", "image": "https://ucarecdn.com/7205b21e-0649-45a3-937a-e88afd4f0766/-/format/auto/-/preview/1500x1500/-/quality/lighter/Pear+Blueberry+Crumble+Bars+_+Sweet+Treats+_+Sproutly+Stories.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "A soft, nutrient-dense, and naturally sweet finger food perfect for toddlers. This recipe is completely free of added sugars, salt, and leavening agents like baking soda, utilizing the natural binding properties of eggs and the moisture from fruits to create an ideal texture for healthy digestion.", "desc_te": "చిన్నారులకు సరైన మెత్తని, పోషకాలతో నిండిన, సహజంగా తీపి ఫింగర్ ఫుడ్. ఈ రెసిపీలో చక్కెర, ఉప్పు, బేకింగ్ సోడా వంటి లీవెనింగ్ ఏజెంట్లు అస్సలు లేవు; గుడ్ల సహజ బైండింగ్ గుణం, పండ్ల తేమతో ఆరోగ్యకరమైన జీర్ణక్రియకు అనువైన ఆకృతి ఏర్పడుతుంది.", "tags": [], "ing": ["1 large ripe banana, completely mashed", "3 tablespoons smooth pear puree", "1 large egg (acts as a binder to minimize crumbling)", "1 tablespoon ghee or melted coconut oil", "1/2 cup + 2 tablespoons fine oat powder (prepared by blending rolled oats into a fine flour)", "1/2 cup whole rolled oats", "1/4 cup fresh strawberries, finely diced into tiny bits", "1/4 cup fresh blueberries, halved or quartered to eliminate choking hazards", "1 teaspoon ground flaxseed (optional digestion and fiber booster)"], "ing_te": ["1 పెద్ద పండిన అరటిపండు, పూర్తిగా మెత్తగా చేసినది", "3 tablespoons మృదువైన పియర్ ప్యూరీ", "1 పెద్ద గుడ్డు (నలగకుండా ఉండటానికి బైండర్‌గా పనిచేస్తుంది)", "1 tablespoon నెయ్యి లేదా కరిగించిన కొబ్బరి నూనె", "1/2 cup + 2 tablespoons సన్నని ఓట్ పొడి (రోల్డ్ ఓట్స్‌ను సన్నని పిండిగా బ్లెండ్ చేసి తయారుచేసినది)", "1/2 cup పూర్తి రోల్డ్ ఓట్స్", "1/4 cup తాజా స్ట్రాబెర్రీలు, చిన్న ముక్కలుగా సన్నగా తరిగినవి", "1/4 cup తాజా బ్లూబెర్రీలు, గొంతుకు అడ్డుపడే ప్రమాదాలను తొలగించడానికి సగం లేదా నాలుగు భాగాలుగా చేసినవి", "1 teaspoon రుబ్బిన అవిసె గింజలు (ఐచ్ఛిక జీర్ణక్రియ, ఫైబర్ బూస్టర్)"], "steps": ["Prepare the Wet Base In a medium mixing bowl, thoroughly mash the ripe banana until it reaches a smooth, liquid consistency with no remaining large lumps. Add the pear puree, egg, and ghee. Whisk the mixture vigorously until completely uniform.", "Combine and Hydrate the Oats Stir the whole rolled oats, fine oat powder, and optional ground flaxseed into the wet mixture until fully incorporated.", "Crucial Hydration Step: Allow the batter to rest undisturbed on the counter for 8 to 10 minutes. This allows the oats and flaxseed to fully absorb the liquids, ensuring the final bars bake up soft and tender rather than dry or crumbly.", "Incorporate the Fruit Gently fold the finely diced strawberries and quartered blueberries into the rested batter using a spatula, distributing them evenly without crushing the berries.", "Shape and Bake Preheat your oven to 180°C (350°F). Line a small baking dish or a standard loaf pan with parchment paper. Pour the thick batter into the pan. Use a spatula or lightly damp fingers to press the mixture down evenly until it forms a flat layer approximately 1/2-inch thick. Bake for 20 to 22 minutes. The bars are done when the edges turn a light golden color and the center feels firm and springy to a gentle touch.", "Cool and Slice Remove the pan from the oven and allow it to cool completely at room temperature. Once entirely cooled, lift the parchment paper out of the pan and slice the baked layer into long, thin, finger-sized bars."], "steps_te": ["తడి బేస్ తయారు చేయండి మధ్యస్థ మిక్సింగ్ బౌల్‌లో పండిన అరటిపండును పెద్ద ముక్కలు లేకుండా మృదువైన, ద్రవ స్థిరత్వం వచ్చేవరకు బాగా మెత్తగా చేయండి. పియర్ ప్యూరీ, గుడ్డు, నెయ్యి వేయండి. మిశ్రమం పూర్తిగా ఏకరీతిగా అయ్యేవరకు గట్టిగా గిలకొట్టండి.", "ఓట్స్ కలిపి నానబెట్టండి పూర్తి రోల్డ్ ఓట్స్, సన్నని ఓట్ పొడి, ఐచ్ఛిక రుబ్బిన అవిసె గింజలను తడి మిశ్రమంలో పూర్తిగా కలిసేవరకు కలపండి.", "కీలకమైన నానబెట్టే దశ: పిండిని కౌంటర్‌పై కదపకుండా 8 to 10 minutes ఉంచండి. దీనివల్ల ఓట్స్, అవిసె గింజలు ద్రవాలను పూర్తిగా పీల్చుకుని, చివరి బార్స్ పొడిగా లేదా నలిగేలా కాకుండా మెత్తగా, మృదువుగా బేక్ అవుతాయి.", "పండ్లు కలపండి మెత్తగా తరిగిన స్ట్రాబెర్రీలు, నాలుగు భాగాలు చేసిన బ్లూబెర్రీలను నానిన పిండిలో స్పాటులాతో మెల్లగా కలపండి, బెర్రీలను నలగగొట్టకుండా సమానంగా పంపిణీ చేయండి.", "ఆకారం ఇచ్చి బేక్ చేయండి ఓవెన్‌ను 180°C (350°F) వరకు వేడి చేయండి. చిన్న బేకింగ్ డిష్ లేదా సాధారణ లోఫ్ పాన్‌కు పార్చ్మెంట్ పేపర్ పరచండి. మందపాటి పిండిని పాన్‌లో పోయండి. స్పాటులా లేదా తేలికగా తడిపిన వేళ్లతో మిశ్రమాన్ని సమానంగా నొక్కి సుమారు 1/2-inch మందం గల చదునైన పొరగా చేయండి. 20 to 22 minutes బేక్ చేయండి. అంచులు లేత బంగారు రంగు వచ్చి, మధ్య భాగం మెల్లగా తాకితే గట్టిగా, స్ప్రింగీగా అనిపించినప్పుడు బార్స్ సిద్ధం.", "చల్లబరచి ముక్కలు చేయండి పాన్‌ను ఓవెన్ నుండి తీసి గది ఉష్ణోగ్రత వద్ద పూర్తిగా చల్లబరచనివ్వండి. పూర్తిగా చల్లబడిన తర్వాత, పార్చ్మెంట్ పేపర్‌ను పాన్ నుండి పైకి లేపి, బేక్ చేసిన పొరను పొడవైన, సన్నని, వేలు పరిమాణంలో బార్స్‌గా కోయండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.247Z"}, {"n": 142, "title": "Soft-Baked Tofu Veggie Tots", "title_te": "మెత్తని బేక్డ్ టోఫు వెజ్జీ టాట్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍳", "image": "https://sweetsensitivefree.com/wp-content/uploads/2022/10/tots-11.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "A pillowy, soft finger food that melts easily in the mouth, perfect for gentle chewing and meal prep.", "desc_te": "నోటిలో సులభంగా కరిగే మెత్తని, దిండులాంటి ఫింగర్ ఫుడ్; సున్నితంగా నమలడానికి, ముందుగా తయారుచేసి పెట్టుకోవడానికి సరైనది.", "tags": [], "ing": ["1/2 block firm tofu (pressed and drained)", "1/4 cup carrots, finely grated (supports healthy digestion)", "1/4 cup spinach, finely chopped (adds iron and fiber)", "1 large egg (acts as a binder to hold the tots together)", "3–4 tablespoons fine oat powder (prepared by blending rolled oats into a fine flour)", "A pinch of black pepper and cumin powder"], "ing_te": ["1/2 బ్లాక్ గట్టి టోఫు (నొక్కి, నీరు వడకట్టినది)", "1/4 cup క్యారెట్లు, సన్నగా తురిమినవి (ఆరోగ్యకరమైన జీర్ణక్రియకు తోడ్పడతాయి)", "1/4 cup పాలకూర, సన్నగా తరిగినది (ఐరన్, ఫైబర్ జోడిస్తుంది)", "1 పెద్ద గుడ్డు (టాట్స్‌ను కలిపి ఉంచే బైండర్‌గా పనిచేస్తుంది)", "3–4 tablespoons సన్నని ఓట్ పొడి (రోల్డ్ ఓట్స్‌ను సన్నని పిండిగా బ్లెండ్ చేసి తయారుచేసినది)", "చిటికెడు నల్ల మిరియాలు, జీలకర్ర పొడి"], "steps": ["Mash the Tofu: In a medium mixing bowl, use a fork or clean hands to crumble and mash the firm tofu until it reaches the consistency of fine breadcrumbs.", "Mix: Add the grated carrots, chopped spinach, egg, oat powder, and spices to the bowl. Mix thoroughly until a cohesive dough forms. — — Texture Check: If the mixture feels too wet to hold its shape, add one more tablespoon of fine oat powder.", "Shape: Roll and shape the mixture into small, bite-sized logs or \"tots\" perfectly sized for toddler fingers.", "Bake: Place the tots on a parchment-lined baking sheet. Bake at 180°C (350°F) for 18–20 minutes, turning them over halfway through until they are lightly golden and firm to a gentle touch.", "Serve: Let them cool slightly before serving so they stay soft on the inside while holding their structural shape."], "steps_te": ["టోఫును మెత్తగా చేయండి: మధ్యస్థ మిక్సింగ్ బౌల్‌లో ఫోర్క్ లేదా శుభ్రమైన చేతులతో గట్టి టోఫును సన్నని బ్రెడ్‌క్రంబ్స్ స్థిరత్వం వచ్చేవరకు నలిపి మెత్తగా చేయండి.", "కలపండి: తురిమిన క్యారెట్లు, తరిగిన పాలకూర, గుడ్డు, ఓట్ పొడి, మసాలాలను గిన్నెలో వేయండి. ఒకే ముద్దలాంటి పిండి అయ్యేవరకు బాగా కలపండి. —  — ఆకృతి పరీక్ష: మిశ్రమం ఆకారం నిలబెట్టుకోవడానికి చాలా తడిగా అనిపిస్తే, మరో tablespoon సన్నని ఓట్ పొడి వేయండి.", "ఆకారం ఇవ్వండి: మిశ్రమాన్ని చిన్న, కొరుకుడు పరిమాణంలో లాగ్‌లు లేదా “టాట్స్”గా చుట్టి ఆకారం ఇవ్వండి, చిన్నారి వేళ్లకు సరిగ్గా సరిపోయేలా.", "బేక్ చేయండి: టాట్స్‌ను పార్చ్మెంట్ పరచిన బేకింగ్ షీట్‌పై ఉంచండి. 180°C (350°F) వద్ద 18–20 minutes బేక్ చేయండి, మధ్యలో తిప్పుతూ, అవి తేలికగా బంగారు రంగు వచ్చి, మెల్లగా తాకితే గట్టిగా అనిపించేవరకు.", "వడ్డించండి: వడ్డించే ముందు కొంచెం చల్లబరచనివ్వండి, తద్వారా అవి లోపల మెత్తగా ఉంటూనే ఆకారాన్ని నిలబెట్టుకుంటాయి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.491Z"}, {"n": 100, "title": "Spiced Sweet Potato & Paneer Soft Skillet Kebabs", "title_te": "మసాలా చిలగడదుంప & పనీర్ మెత్తని స్కిల్లెట్ కబాబ్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🧀", "image": "https://navasamaja.com/wp-content/uploads/2025/10/evening-snacks-healthy-and-tasty-potato-paneer-kebab-recipe.jpg", "prep": "15 minutes", "cook": "10 minutes", "yield": "8–10 toddler kebabs", "desc": "Caramelized roasted sweet potato and freshly grated paneer come together to make soft, melt-in-the-mouth cylinder-shaped finger kebabs. Bound with wholesome oat flour and seasoned with mild roasted cumin and coriander, they offer a calcium- and iron-rich meal that is naturally sweet and easy for toddlers to hold.", "desc_te": "కారమెలైజ్ చేసిన వేయించిన చిలగడదుంప, తాజాగా తురిమిన పనీర్ కలిసి మెత్తగా, నోట్లో కరిగిపోయే సిలిండర్ ఆకారపు ఫింగర్ కబాబ్స్ అవుతాయి. ఆరోగ్యకరమైన ఓట్ పిండితో బంధించి, మైల్డ్ వేయించిన జీలకర్ర, ధనియాలతో రుచి చేసిన ఇవి కాల్షియం, ఐరన్ సమృద్ధిగా ఉండి, సహజంగా తీపిగా, పసిపిల్లలు పట్టుకోవడానికి సులభంగా ఉంటాయి.", "tags": [], "ing": ["1 cup sweet potato, steamed or baked until soft and thoroughly mashed", "3/4 cup fresh paneer, finely grated or crumbled", "1/3 cup rolled oats (finely ground into flour)", "1/2 tsp roasted cumin powder (jeera)", "1/4 tsp mild coriander powder", "1/8 tsp turmeric powder", "1 tbsp finely chopped fresh cilantro (optional)", "1 tbsp ghee or avocado oil (for pan-searing)"], "ing_te": ["1 cup చిలగడదుంప, మెత్తగా అయ్యేవరకు ఆవిరిపై ఉడికించిన లేదా బేక్ చేసినది, బాగా మెదిపినది", "3/4 cup తాజా పనీర్, సన్నగా తురిమినది లేదా నలిపినది", "1/3 cup రోల్డ్ ఓట్స్ (సన్నగా పిండిలా చేసినవి)", "1/2 tsp వేయించిన జీలకర్ర పొడి (జీరా)", "1/4 tsp మైల్డ్ ధనియాల పొడి", "1/8 tsp పసుపు పొడి", "1 tbsp సన్నగా తరిగిన తాజా కొత్తిమీర (ఐచ్ఛికం)", "1 tbsp నెయ్యి లేదా అవకాడో ఆయిల్ (పాన్‌లో వేయించడానికి)"], "steps": ["Make Kebab Dough: In a mixing bowl, combine the mashed sweet potato, grated paneer, roasted cumin powder, coriander powder, turmeric, cilantro, and ground oat flour.", "Knead Gently: Mix with a spoon or clean hands until a soft, pliable dough forms. If it feels too moist, add 1 extra tablespoon of oat flour.", "Shape: Divide the mixture into 8–10 small finger-length cylinders/logs (about 2.5 inches long and 3/4 inch thick), ideal for little palms to grasp.", "Pan-Sear: Heat ghee or oil in a non-stick skillet over medium-low heat. Add the kebabs and cook for 2–3 minutes per side, gently rolling them to brown all sides lightly until golden and aromatic.", "Serve: Allow to cool to warm. Serve plain as finger food, or with a side of mild Greek yogurt or mint chutney."], "steps_te": ["కబాబ్ పిండి తయారుచేయండి: ఒక మిక్సింగ్ గిన్నెలో మెదిపిన చిలగడదుంప, తురిమిన పనీర్, వేయించిన జీలకర్ర పొడి, ధనియాల పొడి, పసుపు, కొత్తిమీర, ఓట్ పిండి కలపండి.", "మెల్లగా పిసకండి: మెత్తని, సులభంగా వంగే పిండి అయ్యేవరకు చెంచాతో లేదా శుభ్రమైన చేతులతో కలపండి. చాలా తడిగా అనిపిస్తే 1 extra tablespoon ఓట్ పిండి కలపండి.", "ఆకారం ఇవ్వండి: మిశ్రమాన్ని 8–10 చిన్న వేలు పొడవు సిలిండర్లు/లాగ్‌లుగా (సుమారు 2.5 inches పొడవు, 3/4 inch మందం) విభజించండి, చిన్న అరచేతులు పట్టుకోవడానికి అనువుగా.", "పాన్‌లో వేయించండి: నాన్-స్టిక్ స్కిల్లెట్‌లో మీడియం-తక్కువ మంటపై నెయ్యి లేదా నూనె వేడి చేయండి. కబాబ్స్ వేసి, ప్రతి వైపు 2–3 minutes పాటు మెల్లగా తిప్పుతూ అన్ని వైపులా తేలికగా బంగారు రంగు వచ్చి, సువాసన వచ్చేవరకు ఉడికించండి.", "వడ్డించండి: గోరువెచ్చగా అయ్యేవరకు చల్లారనివ్వండి. ఫింగర్ ఫుడ్‌గా అలాగే, లేదా మైల్డ్ గ్రీక్ పెరుగు లేదా పుదీనా చట్నీతో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:27.042Z"}, {"n": 114, "title": "Spicy Alfredo Pasta", "title_te": "స్పైసీ ఆల్ఫ్రెడో పాస్తా", "cat": "Adult", "section": "adult", "emoji": "🍝", "image": "https://flouronmyface.com/wp-content/uploads/2023/07/linguine_spicy_alredo_meal.jpg", "prep": "10 minutes", "cook": "20 minutes", "yield": "4 people", "desc": "A bold, lighter twist on the classic Italian-American comfort dish. Made with a spiced roux base and milk instead of heavy cream, this vibrant sauce delivers rich, velvety creaminess balanced by a kick of garlic, crushed red pepper flakes, cayenne, and paprika.", "desc_te": "క్లాసిక్ ఇటాలియన్-అమెరికన్ కంఫర్ట్ వంటకానికి ధైర్యమైన, తేలికైన ట్విస్ట్. మసాలా రూ బేస్‌తో, హెవీ క్రీమ్‌కు బదులు పాలతో తయారుచేసిన ఈ ప్రకాశవంతమైన సాస్‌లో వెల్లుల్లి, నలిపిన ఎర్ర మిరియాల రేకులు, కారం, పప్రికా కిక్‌తో సమతుల్యమైన రిచ్, మెత్తని క్రీమీనెస్ ఉంటుంది.", "tags": [], "ing": ["Pasta", "1 lb (16 oz / 450 g) fettuccine, penne, or your favorite pasta", "1 tbsp salt (for boiling pasta water)", "Aromatics & Spices", "3 tbsp unsalted butter", "4 cloves garlic, finely minced", "1 tsp crushed red pepper flakes (adjust to heat preference)", "½ tsp cayenne pepper (adjust to heat preference)", "1 tsp sweet or smoked paprika", "Sauce Base (Roux & Liquid)", "2½ tbsp all-purpose flour", "2½ cups milk (whole milk or 2% milk; used instead of heavy whipping cream)", "Cheese & Seasoning", "1 cup freshly grated Parmesan cheese (Parmigiano-Reggiano)", "Salt and freshly cracked black pepper, to taste", "Fresh flat-leaf parsley, finely chopped (optional, for garnish)", "Key Emulsifier", "½ to 1 cup reserved starchy pasta cooking water"], "ing_te": ["పాస్తా", "1 lb (16 oz / 450 g) ఫెట్టుచిని, పెన్నె, లేదా మీకు ఇష్టమైన పాస్తా", "1 tbsp ఉప్పు (పాస్తా నీరు మరిగించడానికి)", "సుగంధ ద్రవ్యాలు & మసాలాలు", "3 tbsp ఉప్పు లేని వెన్న", "4 cloves వెల్లుల్లి, సన్నగా తరిగినది", "1 tsp నలిపిన ఎర్ర మిరియాల రేకులు (వేడి ఇష్టాన్ని బట్టి సర్దండి)", "½ tsp కారం (వేడి ఇష్టాన్ని బట్టి సర్దండి)", "1 tsp తీపి లేదా స్మోక్డ్ పప్రికా", "సాస్ బేస్ (రూ & లిక్విడ్)", "2½ tbsp మైదా పిండి", "2½ cups పాలు (హోల్ మిల్క్ లేదా 2% మిల్క్; హెవీ విప్పింగ్ క్రీమ్‌కు బదులు వాడినది)", "చీజ్ & సీజనింగ్", "1 cup తాజాగా తురిమిన పార్మెసాన్ చీజ్ (పార్మిజియానో-రెజ్జియానో)", "రుచికి తగినంత ఉప్పు, తాజాగా నలిపిన నల్ల మిరియాలు", "తాజా ఫ్లాట్-లీఫ్ పార్స్లీ, సన్నగా తరిగినది (ఐచ్ఛికం, గార్నిష్ కోసం)", "కీ ఎమల్సిఫైయర్", "½ to 1 cup రిజర్వ్ చేసిన స్టార్చీ పాస్తా వండిన నీరు"], "steps": ["Boil the Pasta & Reserve Pasta Water Bring a large pot of water to a rolling boil. Add about 1 tablespoon of salt to season the water. Add 1 lb of pasta and cook until just al dente according to the package directions (typically 9–11 minutes for dried fettuccine).", "Crucial Step: Right before draining, carefully ladle out and set aside at least ½ to 1 cup of the cloudy, starchy pasta water. Drain the pasta and keep it nearby. Do not rinse the pasta.", "Bloom the Spices & Garlic In a large, deep skillet or Dutch oven, melt the 3 tablespoons of butter over medium heat. Once the butter is melted and gently foaming, add the minced garlic, crushed red pepper flakes, cayenne pepper, and paprika. Sauté gently for 30 to 60 seconds until fragrant, stirring constantly. Blooming the spices in warm butter releases their fat-soluble aromatic oils and creates a vibrant, flavorful reddish-golden base without burning the garlic.", "Make the Roux Sprinkle the 2½ tablespoons of all-purpose flour evenly over the bubbling spiced butter and garlic. Whisk continuously over medium-low heat for 1 to 2 minutes. The mixture will form a thick, aromatic paste (roux). Whisking cooks out the raw flour taste while preserving the spice flavor.", "Add the Milk While whisking vigorously, gradually pour in the 2½ cups of milk in a slow, steady stream. Whisk continuously to ensure the flour paste dissolves completely into the milk without forming any lumps.", "Simmer to Thicken Bring the sauce to a gentle simmer over medium heat, whisking or stirring frequently along the bottom and sides of the pan. Allow the sauce to simmer gently for 3 to 5 minutes until it noticeably thickens and coats the back of a spoon. Stir in a pinch of salt and freshly cracked black pepper to taste. (Keep seasoning modest at this stage, as the Parmesan will contribute additional saltiness).", "Whisk in the Fresh Parmesan Turn the heat down to low (or remove the pan from heat completely). Gradually sprinkle in the 1 cup of freshly grated Parmesan cheese, whisking constantly in a circular motion until the cheese melts smoothly into the sauce. The residual heat will melt the cheese into a luscious, glossy, and velvety spicy Alfredo sauce.", "Toss Pasta & Emulsify Add the drained al dente pasta directly into the skillet with the warm spicy Alfredo sauce. Pour in a splash (about ¼ cup) of the reserved hot starchy pasta water. Using tongs, toss and swirl the pasta vigorously with the sauce over low heat for 1 to 2 minutes. The starches in the reserved water bind the fats and liquid together, creating an emulsified glaze that clings tightly to every noodle. If the sauce feels too thick, add another small splash of pasta water until you reach your desired silky consistency.", "Garnish and Serve Taste and adjust seasoning with additional salt, black pepper, or a pinch of red pepper flakes if you prefer extra heat. Divide into 4 warmed pasta bowls. Top with extra freshly grated Parmesan cheese and a sprinkle of chopped fresh parsley. Serve immediately."], "steps_te": ["పాస్తా ఉడికించండి & పాస్తా నీరు పక్కన ఉంచండి: పెద్ద గిన్నెలో నీటిని బాగా మరిగించండి. నీటికి రుచి కోసం సుమారు 1 tablespoon ఉప్పు వేయండి. 1 lb పాస్తా వేసి, ప్యాకెట్ సూచనల ప్రకారం అల్ డెంటే అయ్యేవరకు ఉడికించండి (ఎండిన ఫెట్టుచినికి సాధారణంగా 9–11 minutes).", "కీలక దశ: నీరు వంపే ముందు, మబ్బుగా, స్టార్చీగా ఉన్న పాస్తా నీటిని కనీసం ½ to 1 cup జాగ్రత్తగా తీసి పక్కన ఉంచండి. పాస్తా నీరు వంపేసి దగ్గరలో ఉంచండి. పాస్తాను కడగవద్దు.", "మసాలాలు & వెల్లుల్లిని బ్లూమ్ చేయండి: పెద్ద, లోతైన స్కిల్లెట్ లేదా డచ్ ఓవెన్‌లో మీడియం మంటపై 3 tablespoons వెన్న కరిగించండి. వెన్న కరిగి మెల్లగా నురుగు వచ్చిన తర్వాత, తరిగిన వెల్లుల్లి, నలిపిన ఎర్ర మిరియాల రేకులు, కారం, పప్రికా వేయండి. సువాసన వచ్చేవరకు నిరంతరం కలుపుతూ 30 to 60 seconds పాటు మెల్లగా వేయించండి. వెచ్చని వెన్నలో మసాలాలను బ్లూమ్ చేయడం వల్ల వాటి కొవ్వులో కరిగే సుగంధ నూనెలు విడుదలై, వెల్లుల్లిని కాల్చకుండా ప్రకాశవంతమైన, రుచికరమైన ఎరుపు-బంగారు బేస్ ఏర్పడుతుంది.", "రూ తయారుచేయండి: బుడగలు వస్తున్న మసాలా వెన్న, వెల్లుల్లిపై 2½ tablespoons మైదా పిండిని సమానంగా చల్లండి. మీడియం-తక్కువ మంటపై 1 to 2 minutes పాటు నిరంతరం గిలకొట్టండి. మిశ్రమం చిక్కని, సువాసనగల పేస్ట్ (రూ) అవుతుంది. గిలకొట్టడం వల్ల పచ్చి పిండి రుచి పోతూ మసాలా రుచి నిలుస్తుంది.", "పాలు వేయండి: గట్టిగా గిలకొడుతూ, 2½ cups పాలను నెమ్మదిగా, స్థిరమైన ధారగా పోయండి. పిండి పేస్ట్ పాలలో పూర్తిగా కరిగి ముద్దలు లేకుండా ఉండేలా నిరంతరం గిలకొట్టండి.", "చిక్కబడేవరకు సిమ్మర్ చేయండి: సాస్‌ను మీడియం మంటపై మెల్లగా సిమ్మర్‌కు తీసుకురండి, గిన్నె అడుగు, పక్కల వెంబడి తరచుగా గిలకొడుతూ లేదా కలుపుతూ. సాస్ గుర్తించదగ్గలా చిక్కబడి చెంచా వెనుక భాగానికి పట్టేవరకు 3 to 5 minutes పాటు మెల్లగా సిమ్మర్ చేయండి. రుచికి చిటికెడు ఉప్పు, తాజాగా నలిపిన నల్ల మిరియాలు కలపండి. (ఈ దశలో సీజనింగ్ మితంగా ఉంచండి, ఎందుకంటే పార్మెసాన్ అదనపు ఉప్పదనం ఇస్తుంది).", "తాజా పార్మెసాన్ గిలకొట్టండి: మంటను తక్కువకు తగ్గించండి (లేదా గిన్నెను మంట నుండి పూర్తిగా తీసేయండి). 1 cup తాజాగా తురిమిన పార్మెసాన్ చీజ్‌ను క్రమంగా చల్లుతూ, చీజ్ సాస్‌లో మెత్తగా కరిగేవరకు వృత్తాకారంలో నిరంతరం గిలకొట్టండి. మిగిలిన వేడి చీజ్‌ను కరిగించి రుచికరమైన, మెరిసే, మెత్తని స్పైసీ ఆల్ఫ్రెడో సాస్ చేస్తుంది.", "పాస్తా కలిపి ఎమల్సిఫై చేయండి: నీరు వంపేసిన అల్ డెంటే పాస్తాను వెచ్చని స్పైసీ ఆల్ఫ్రెడో సాస్ ఉన్న స్కిల్లెట్‌లో నేరుగా వేయండి. రిజర్వ్ చేసిన వేడి స్టార్చీ పాస్తా నీటిని కొద్దిగా (సుమారు ¼ cup) పోయండి. టాంగ్స్‌తో తక్కువ మంటపై 1 to 2 minutes పాటు పాస్తాను సాస్‌తో గట్టిగా కలిపి తిప్పండి. రిజర్వ్ చేసిన నీటిలోని స్టార్చ్‌లు కొవ్వులు, ద్రవాన్ని కలిపి బంధించి, ప్రతి నూడుల్‌కు గట్టిగా పట్టే ఎమల్సిఫైడ్ గ్లేజ్ ఏర్పరుస్తాయి. సాస్ చాలా చిక్కగా అనిపిస్తే, మీకు కావలసిన మెత్తని స్థిరత్వం వచ్చేవరకు మరో చిన్న చుక్క పాస్తా నీరు కలపండి.", "గార్నిష్ చేసి వడ్డించండి: రుచి చూసి అదనపు ఉప్పు, నల్ల మిరియాలు, లేదా మరింత వేడి కావాలంటే చిటికెడు ఎర్ర మిరియాల రేకులతో సీజనింగ్ సర్దండి. 4 వేడి చేసిన పాస్తా బౌల్స్‌లో విభజించండి. పైన అదనపు తాజాగా తురిమిన పార్మెసాన్ చీజ్, చిటికెడు తరిగిన తాజా పార్స్లీ వేయండి. వెంటనే వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:56.747Z"}, {"n": 5, "title": "Spicy Chicken and Mushroom Roast", "title_te": "కారంగా ఉండే చికెన్, పుట్టగొడుగుల రోస్ట్", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://assets.tmecosys.com/image/upload/t_web_rdp_recipe_584x480/img/recipe/ras/Assets/fc3a7fba43c473398bde9c80d4b325bb/Derivates/d2d93f9d62a5036a13b1fb17ab05f8fefc3ae5fd.jpg", "prep": "—", "cook": "about 15 minutes", "yield": "—", "desc": "No-onion, no-tomato chicken and mushroom roast cooked in ghee with a dry spice masala.", "desc_te": "ఉల్లిపాయ, టమోటా లేకుండా, నెయ్యిలో పొడి మసాలాలతో వండిన చికెన్, పుట్టగొడుగుల రోస్ట్.", "tags": ["non-vegetarian", "dinner", "lunch"], "ing": ["250 g chicken", "100 g mushrooms", "1 tbsp ghee", "1 tbsp ginger garlic paste", "Salt", "1/2 tsp turmeric powder", "2 tsp chilli powder", "1 tsp coriander powder", "1 tsp crushed pepper", "1 tsp garam masala", "A few sprigs chopped coriander"], "ing_te": ["250 g చికెన్", "100 g పుట్టగొడుగులు", "1 tbsp నెయ్యి", "1 tbsp అల్లం వెల్లుల్లి పేస్ట్", "ఉప్పు", "1/2 tsp పసుపు పొడి", "2 tsp కారం పొడి", "1 tsp ధనియాల పొడి", "1 tsp నలిగిన మిరియాలు", "1 tsp గరం మసాలా", "కొన్ని రెమ్మలు తరిగిన కొత్తిమీర"], "steps": ["Heat the ghee in a kadai and saute the ginger garlic paste until the raw aroma goes.", "Add the chicken and saute for a few minutes.", "Season with salt, turmeric, chilli and coriander powder, then add the crushed pepper and mushrooms.", "Cover and cook about 15 minutes until the chicken is cooked through, stirring in between so it does not burn.", "Add the garam masala and chopped coriander and reduce the masala a little.", "Serve hot, with steamed rice, chapati or phulka."], "steps_te": ["కడాయిలో నెయ్యి వేడి చేసి పచ్చి వాసన పోయేవరకు అల్లం వెల్లుల్లి పేస్ట్ వేయించండి.", "చికెన్ వేసి కొన్ని నిమిషాలు వేయించండి.", "ఉప్పు, పసుపు, కారం, ధనియాల పొడితో రుచి చేసి, తర్వాత నలిగిన మిరియాలు, పుట్టగొడుగులు వేయండి.", "మూత పెట్టి చికెన్ పూర్తిగా ఉడికేవరకు సుమారు 15 minutes ఉడికించండి, మధ్యలో కలుపుతూ మాడకుండా చూసుకోండి.", "గరం మసాలా, తరిగిన కొత్తిమీర వేసి మసాలాను కొద్దిగా ఇగరనివ్వండి.", "వేడిగా, ఆవిరిపై ఉడికిన అన్నం, చపాతీ లేదా ఫుల్కాతో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:02:39.262Z"}, {"n": 91, "title": "Spinach & Moong Dal Cheela Pinwheel Roll-Ups", "title_te": "స్పినాచ్ & మూంగ్ దాల్ చీలా పిన్‌వీల్ రోల్-అప్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍲", "image": "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgV0t-5NMEYuhHg9PQS1V2meHmwV0cP8D1ZdSfOXX2Sc9v8dHPrhUoFR1ER0q6NPgc30tFZaaXvBAyaOft6mMDr5GdlxhYyD_wns5DEQUh57tXJjvN9o8tvHupXIhcPURFnpO1Um7ixzt0/s640/mung+cheela+roll+ups-2.jpg", "prep": "15 minutes (plus 1 hour soaking)", "cook": "12 minutes", "yield": "4 crepes (16 pinwheels)", "desc": "Vibrant green, soft savory lentil crepes made from yellow moong dal and baby spinach. Yellow moong dal is naturally gentle on little tummies, easy to digest, and rich in plant protein. Spread with whipped cottage cheese or mild cream cheese and rolled into bite-sized \"pinwheels,\" these are perfect for lunchboxes or snack platters.", "desc_te": "పసుపు మూంగ్ దాల్ మరియు బేబీ స్పినాచ్‌తో చేసిన శక్తివంతమైన ఆకుపచ్చ, మెత్తని రుచికరమైన పప్పు క్రెప్స్. పసుపు మూంగ్ దాల్ సహజంగా చిన్న కడుపులకు సున్నితంగా ఉంటుంది, జీర్ణం సులభం, మరియు వృక్ష ప్రోటీన్ అధికంగా ఉంటుంది. గిలకొట్టిన కాటేజ్ చీజ్ లేదా మైల్డ్ క్రీమ్ చీజ్ పూసి, కాటుకు సరిపడే \"పిన్‌వీల్స్\"గా చుట్టిన ఇవి లంచ్‌బాక్స్‌లు లేదా స్నాక్ ప్లేటర్‌లకు పర్ఫెక్ట్.", "tags": [], "ing": ["1/2 cup yellow split moong dal (dhuli moong dal), rinsed and soaked in warm water for 1 hour", "1 cup fresh baby spinach leaves, washed", "1/4 tsp cumin seeds (jeera)", "1/4 tsp mild ginger paste", "1/8 tsp turmeric powder", "1/4 to 1/3 cup water (for blending)", "1 tbsp ghee or avocado oil (for cooking)", "Filling: 1/3 cup smooth whipped whole-milk cottage cheese or mild cream cheese (optionally mixed with 2 tbsp finely grated carrot)"], "ing_te": ["1/2 cup పసుపు స్ప్లిట్ మూంగ్ దాల్ (ధులి మూంగ్ దాల్), కడిగి గోరువెచ్చని నీటిలో 1 hour నానబెట్టినది", "1 cup తాజా బేబీ స్పినాచ్ ఆకులు, కడిగినవి", "1/4 tsp జీలకర్ర (జీరా)", "1/4 tsp మైల్డ్ అల్లం పేస్ట్", "1/8 tsp పసుపు పొడి", "1/4 to 1/3 cup నీరు (బ్లెండింగ్ కోసం)", "1 tbsp నెయ్యి లేదా అవకాడో నూనె (వండడానికి)", "ఫిల్లింగ్: 1/3 cup మెత్తని గిలకొట్టిన హోల్-మిల్క్ కాటేజ్ చీజ్ లేదా మైల్డ్ క్రీమ్ చీజ్ (ఐచ్ఛికంగా 2 tbsp సన్నగా తురిమిన క్యారెట్‌తో కలిపినది)"], "steps": ["Blend Batter: Drain the soaked moong dal. Transfer to a blender along with baby spinach, cumin seeds, ginger paste, turmeric, and 1/4 cup water. Blend until silky, smooth, and pourable (like pancake batter). Add 1–2 extra tablespoons of water if too thick.", "Cook Cheela: Heat a flat non-stick skillet or tava over medium-low heat. Brush lightly with ghee. Pour a small ladle of batter (about 1/4 cup) into the center and gently spread in circular motions into a thin, 6-inch round crepe.", "Flip: Drizzle a few drops of ghee around the edges. Cook for 2 minutes until the top looks dry and the bottom is lightly golden. Flip and cook the other side for 1 minute.", "Cool Slightly: Transfer cheela to a cutting board and let cool for 2–3 minutes until warm (not hot). Repeat with remaining batter.", "Fill & Roll: Spread an even, thin layer of whipped cottage cheese (or cream cheese) over the surface of each cheela. Roll tightly into a firm cylinder.", "Slice Pinwheels: Using a sharp knife, slice each roll across into 1-inch wide pinwheel rounds."], "steps_te": ["పిండి బ్లెండ్ చేయండి: నానబెట్టిన మూంగ్ దాల్ నీరు వడకండి. బేబీ స్పినాచ్, జీలకర్ర, అల్లం పేస్ట్, పసుపు మరియు 1/4 cup నీటితో బ్లెండర్‌లో వేయండి. మృదువుగా, నునుపుగా, పోసేలా (పాన్‌కేక్ పిండిలా) అయ్యేవరకు బ్లెండ్ చేయండి. చాలా చిక్కగా ఉంటే 1–2 extra tablespoons నీరు వేయండి.", "చీలా వండండి: ఫ్లాట్ నాన్-స్టిక్ స్కిల్లెట్ లేదా తవాను మీడియం-తక్కువ మంటపై వేడి చేయండి. నెయ్యితో తేలికగా బ్రష్ చేయండి. ఒక చిన్న గరిటెడు పిండి (సుమారు 1/4 cup) మధ్యలో పోసి వృత్తాకార కదలికలతో సన్నని, 6-inch గుండ్రని క్రెప్‌గా మెల్లగా పరచండి.", "తిప్పండి: అంచుల చుట్టూ కొన్ని చుక్కల నెయ్యి చల్లండి. పైభాగం పొడిగా కనిపించి, అడుగు తేలికగా బంగారు రంగులో అయ్యేవరకు 2 minutes వండండి. తిప్పి మరో వైపు 1 minute వండండి.", "కొద్దిగా చల్లార్చండి: చీలాను కటింగ్ బోర్డ్‌కు మార్చి గోరువెచ్చగా (వేడిగా కాదు) అయ్యేవరకు 2–3 minutes చల్లారనివ్వండి. మిగిలిన పిండితో పునరావృతం చేయండి.", "నింపి చుట్టండి: ప్రతి చీలా ఉపరితలంపై గిలకొట్టిన కాటేజ్ చీజ్ (లేదా క్రీమ్ చీజ్) సమానమైన, సన్నని పొరగా పూయండి. గట్టి సిలిండర్‌గా గట్టిగా చుట్టండి.", "పిన్‌వీల్స్‌గా కోయండి: పదునైన కత్తితో ప్రతి రోల్‌ను అడ్డంగా 1-inch వెడల్పు గల పిన్‌వీల్ రౌండ్‌లుగా కోయండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:26.786Z"}, {"n": 94, "title": "Strawberry & Cottage Cheese Frozen \"Ice Cream\" Snack Bites", "title_te": "స్ట్రాబెర్రీ & కాటేజ్ చీజ్ ఫ్రోజెన్ \"ఐస్‌క్రీమ్\" స్నాక్ బైట్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🧀", "image": "https://ohsnapmacros.com/wp-content/uploads/2024/07/cottagecheeseicecreambars.jpg", "prep": "10 minutes (plus 2 hours freezing)", "cook": "0 minutes", "yield": "16–20 mini frozen bites", "desc": "A nutritious, refreshing frozen treat that tastes just like strawberry ice cream while delivering dairy protein and calcium from whole-milk cottage cheese. Naturally sweetened with ripe strawberries and banana (no honey or refined sugar), these bite-sized drops melt softly on the tongue and provide soothing relief for teething toddlers.", "desc_te": "హోల్-మిల్క్ కాటేజ్ చీజ్ నుండి డైరీ ప్రోటీన్, కాల్షియం అందిస్తూ, స్ట్రాబెర్రీ ఐస్‌క్రీమ్ లాగే రుచించే పోషకాలు నిండిన, రిఫ్రెషింగ్ ఫ్రోజెన్ ట్రీట్. పండిన స్ట్రాబెర్రీలు, అరటిపండుతో సహజంగా తీపి చేసినవి (తేనె లేదా రిఫైన్డ్ చక్కెర లేదు), ఈ చిన్న చిన్న డ్రాప్స్ నాలుకపై మెత్తగా కరిగి, పళ్ళు వస్తున్న పసిపిల్లలకు ఓదార్పునిస్తాయి.", "tags": [], "ing": ["1 cup whole-milk cottage cheese", "1 cup fresh sweet strawberries, hulled (or thawed frozen strawberries)", "1/2 ripe sweet banana (for natural sweetness and smooth texture)", "1/2 tsp pure vanilla extract", "1 tbsp pure maple syrup (optional, only if strawberries are tart)", "Optional add-in: 1 tbsp ground chia seeds or hemp hearts (blended in for omega-3s)"], "ing_te": ["1 cup హోల్-మిల్క్ కాటేజ్ చీజ్", "1 cup తాజా తీపి స్ట్రాబెర్రీలు, తొడిమ తీసేసినవి (లేదా కరిగించిన ఫ్రోజెన్ స్ట్రాబెర్రీలు)", "1/2 పండిన తీపి అరటిపండు (సహజ తీపి, మెత్తని ఆకృతి కోసం)", "1/2 tsp స్వచ్ఛమైన వనిల్లా ఎక్స్‌ట్రాక్ట్", "1 tbsp స్వచ్ఛమైన మేపుల్ సిరప్ (ఐచ్ఛికం, స్ట్రాబెర్రీలు పుల్లగా ఉంటే మాత్రమే)", "ఐచ్ఛిక అదనం: 1 tbsp పొడి చేసిన చియా గింజలు లేదా హెంప్ హార్ట్స్ (ఒమేగా-3ల కోసం బ్లెండ్ చేసినవి)"], "steps": ["Blend Smooth: Place the cottage cheese, strawberries, ripe banana, vanilla extract, and optional maple syrup/chia seeds in a high-speed blender or food processor.", "Process: Blend on high for 45–60 seconds until completely smooth, creamy, and uniform with zero curds remaining.", "Portion on Tray: Line a small baking sheet or plate with parchment paper. Use a tablespoon or small cookie scoop to drop dollops of the mixture onto the parchment (approx. 1 to 1.5 inches wide). Alternatively, pour into silicone mini muffin or candy molds.", "Freeze: Place in the freezer for at least 2 hours, or until completely firm.", "Serve: Remove a few bites from the freezer and let them sit at room temperature for 2–3 minutes so they soften slightly before serving to your toddler."], "steps_te": ["మెత్తగా బ్లెండ్ చేయండి: కాటేజ్ చీజ్, స్ట్రాబెర్రీలు, పండిన అరటిపండు, వనిల్లా ఎక్స్‌ట్రాక్ట్, ఐచ్ఛిక మేపుల్ సిరప్/చియా గింజలను హై-స్పీడ్ బ్లెండర్ లేదా ఫుడ్ ప్రాసెసర్‌లో వేయండి.", "ప్రాసెస్ చేయండి: 45–60 seconds పాటు హై స్పీడ్‌లో బ్లెండ్ చేయండి, ఎలాంటి ముద్దలు లేకుండా పూర్తిగా మెత్తగా, క్రీమీగా, ఒకేలా అయ్యేవరకు.", "ట్రేపై భాగాలు వేయండి: చిన్న బేకింగ్ షీట్ లేదా ప్లేట్‌పై పార్చ్‌మెంట్ పేపర్ పరచండి. మిశ్రమాన్ని టేబుల్‌స్పూన్ లేదా చిన్న కుకీ స్కూప్‌తో పార్చ్‌మెంట్‌పై డాలప్స్‌గా వేయండి (సుమారు 1 to 1.5 inches వెడల్పు). లేదా సిలికాన్ మినీ మఫిన్ లేదా క్యాండీ మోల్డ్స్‌లో పోయండి.", "ఫ్రీజ్ చేయండి: కనీసం 2 hours పాటు, లేదా పూర్తిగా గట్టిపడేవరకు ఫ్రీజర్‌లో ఉంచండి.", "వడ్డించండి: ఫ్రీజర్ నుండి కొన్ని బైట్స్ తీసి, పసిపిల్లలకు వడ్డించే ముందు 2–3 minutes పాటు గది ఉష్ణోగ్రత వద్ద ఉంచి కొద్దిగా మెత్తబడనివ్వండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:26.867Z"}, {"n": 130, "title": "Superhero Green Spinach & Greek Yogurt Mac 'n' Cheese", "title_te": "సూపర్‌హీరో గ్రీన్ స్పినాచ్ & గ్రీక్ యోగర్ట్ మాక్ 'n' చీజ్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🧀", "image": "https://media.consillar.com/r/2025/02/creamy-greek-yogurt-mac-and-cheese-2197.webp", "prep": "10 mins", "cook": "15 mins", "yield": "—", "desc": "Ingredients:", "desc_te": "పదార్థాలు:", "tags": [], "ing": ["1.5 cups whole grain or chickpea elbow pasta", "1 cup fresh baby spinach", "1/2 cup plain Greek yogurt (full fat or 2%)", "1/2 cup shredded mild cheddar cheese", "2 tbsp milk", "1 tbsp nutritional yeast or grated parmesan", "1/4 tsp garlic powder", "Pinch of salt"], "ing_te": ["1.5 cups హోల్ గ్రెయిన్ లేదా చిక్‌పీ ఎల్బో పాస్తా", "1 cup తాజా బేబీ పాలకూర", "1/2 cup ప్లెయిన్ గ్రీక్ యోగర్ట్ (ఫుల్ ఫ్యాట్ లేదా 2%)", "1/2 cup తురిమిన mild చెడార్ చీజ్", "2 tbsp పాలు", "1 tbsp న్యూట్రిషనల్ ఈస్ట్ లేదా తురిమిన పార్మెసన్", "1/4 tsp వెల్లుల్లి పొడి", "Pinch of ఉప్పు"], "steps": ["Cook elbow pasta according to package instructions until tender. Drain, reserving 2 tablespoons of warm pasta water. Steam spinach for 1 minute until wilted, then transfer to a blender with plain Greek yogurt, milk, garlic powder, and reserved pasta water. Blend until smooth and creamy green. Pour warm pasta back into the pot over low heat. Add the green yogurt sauce and shredded cheddar cheese. Stir gently for 1-2 minutes until cheese is melted and pasta is evenly coated. Serve warm."], "steps_te": ["ప్యాకేజీ సూచనల ప్రకారం ఎల్బో పాస్తాను మృదువుగా అయ్యేవరకు వండండి. వడకట్టి, 2 tablespoons వెచ్చని పాస్తా నీటిని రిజర్వ్ చేయండి. పాలకూరను 1 minute ఆవిరిలో ఉడికించి వాడిపోయేవరకు, తర్వాత ప్లెయిన్ గ్రీక్ యోగర్ట్, పాలు, వెల్లుల్లి పొడి మరియు రిజర్వ్ చేసిన పాస్తా నీటితో బ్లెండర్‌కు మార్చండి. మృదువైన క్రీమీ ఆకుపచ్చ రంగు అయ్యేవరకు బ్లెండ్ చేయండి. వెచ్చని పాస్తాను తక్కువ మంటపై పాత్రలోకి తిరిగి పోయండి. ఆకుపచ్చ యోగర్ట్ సాస్ మరియు తురిమిన చెడార్ చీజ్ వేయండి. చీజ్ కరిగి పాస్తా సమానంగా పూసేవరకు 1-2 minutes మెల్లగా కలపండి. వెచ్చగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:19.284Z"}, {"n": 117, "title": "Sweet Potato & Chickpea Veggie Patties", "title_te": "స్వీట్ పొటాటో & చిక్‌పీ వెజ్జీ ప్యాటీలు", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍳", "image": "https://cookleez.com/wp-content/uploads/2025/09/Sweet_Potato_and_Chickpea_Patties_hzadix.webp", "prep": "15 mins", "cook": "20 mins", "yield": "10–12 mini patties", "desc": "A delicious, high-fiber, iron- and protein-rich finger food that is soft on the inside and lightly golden on the outside.", "desc_te": "రుచికరమైన, అధిక ఫైబర్, ఐరన్ మరియు ప్రోటీన్ నిండిన ఫింగర్ ఫుడ్, లోపల మృదువుగా మరియు బయట తేలికగా బంగారు రంగులో ఉంటుంది.", "tags": [], "ing": ["1 can (15 oz) low-sodium chickpeas (garbanzo beans), rinsed, drained, and patted dry", "1 cup cooked mashed sweet potato (about 1 medium sweet potato)", "1/4 cup finely grated zucchini (squeezed dry of excess moisture)", "1/4 cup finely grated carrots", "1/3 cup rolled oats (or oat flour)", "1 egg (or 1 tbsp ground flaxseed mixed with 2.5 tbsp water for egg-free)", "1/4 tsp ground cumin", "1/4 tsp garlic powder", "1/4 tsp onion powder", "1 tbsp olive oil (for brushing or pan-searing)"], "ing_te": ["1 can (15 oz) తక్కువ సోడియం చిక్‌పీస్ (గార్బాంజో బీన్స్), కడిగి, వడకట్టి, పొడిగా తుడిచినవి", "1 cup వండిన మెదిపిన స్వీట్ పొటాటో (సుమారు 1 medium స్వీట్ పొటాటో)", "1/4 cup సన్నగా తురిమిన జుచిని (అదనపు తేమ పిండేసినది)", "1/4 cup సన్నగా తురిమిన క్యారెట్లు", "1/3 cup రోల్డ్ ఓట్స్ (లేదా ఓట్ పిండి)", "1 గుడ్డు (లేదా 1 tbsp పొడి చేసిన అవిసె గింజలు 2.5 tbsp నీటితో కలిపినది, గుడ్డు లేకుండా చేయడానికి)", "1/4 tsp పొడి చేసిన జీలకర్ర", "1/4 tsp వెల్లుల్లి పొడి", "1/4 tsp ఉల్లిపాయ పొడి", "1 tbsp ఆలివ్ నూనె (పూయడానికి లేదా పాన్‌లో వేయించడానికి)"], "steps": ["Preheat Oven: Preheat your oven to 400°F (200°C) and line a baking sheet with parchment paper.", "Mash Chickpeas: In a large mixing bowl, thoroughly mash the chickpeas with a potato masher or fork until mostly smooth, leaving minimal small chunks for light texture.", "Combine Mixture: Add the mashed sweet potato, squeezed grated zucchini, grated carrots, rolled oats/flour, egg, cumin, garlic powder, and onion powder. Mix well until a pliable, cohesive dough forms. If too wet, add an extra tablespoon of oat flour.", "Shape Patties: Scoop 2 tablespoons of mixture and shape into mini patties (about 2 inches in diameter and 1/2 inch thick).", "Bake: Place patties on the baking sheet and lightly brush the tops with olive oil. Bake for 12 minutes, flip gently, and bake for an additional 8–10 minutes until golden and set.", "Cool & Serve: Allow to cool to warm/room temperature before serving to your toddler. Serve as finger food on its own or with a side of mild avocado dip or yogurt."], "steps_te": ["ఓవెన్ ప్రీహీట్ చేయండి: మీ ఓవెన్‌ను 400°F (200°C) వద్ద ప్రీహీట్ చేసి బేకింగ్ షీట్‌ను పార్చ్‌మెంట్ పేపర్‌తో లైన్ చేయండి.", "చిక్‌పీస్ మెదపండి: పెద్ద మిక్సింగ్ గిన్నెలో చిక్‌పీస్‌ను పొటాటో మాషర్ లేదా ఫోర్క్‌తో బాగా మెదపండి, తేలికపాటి ఆకృతి కోసం కనీస చిన్న ముక్కలు మిగిలేలా.", "మిశ్రమం కలపండి: మెదిపిన స్వీట్ పొటాటో, పిండేసిన తురిమిన జుచిని, తురిమిన క్యారెట్లు, రోల్డ్ ఓట్స్/పిండి, గుడ్డు, జీలకర్ర, వెల్లుల్లి పొడి మరియు ఉల్లిపాయ పొడిని వేయండి. మృదువైన, కలిసిపోయే పిండి అయ్యేవరకు బాగా కలపండి. చాలా తడిగా ఉంటే, ఒక అదనపు tablespoon ఓట్ పిండిని వేయండి.", "ప్యాటీలు ఆకారం ఇవ్వండి: 2 tablespoons మిశ్రమాన్ని స్కూప్ చేసి మినీ ప్యాటీలుగా ఆకారం ఇవ్వండి (సుమారు 2 inches వ్యాసం మరియు 1/2 inch మందం).", "బేక్ చేయండి: ప్యాటీలను బేకింగ్ షీట్‌పై ఉంచి పైన ఆలివ్ నూనెను తేలికగా పూయండి. 12 minutes బేక్ చేసి, మెల్లగా తిప్పి, బంగారు రంగు వచ్చి సెట్ అయ్యేవరకు అదనంగా 8–10 minutes బేక్ చేయండి.", "చల్లార్చి వడ్డించండి: మీ పిల్లలకు వడ్డించే ముందు వెచ్చని/గది ఉష్ణోగ్రతకు చల్లారనివ్వండి. ఒంటరిగా ఫింగర్ ఫుడ్‌గా లేదా mild అవకాడో డిప్ లేదా యోగర్ట్‌తో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:18.733Z"}, {"n": 48, "title": "Sweet Potato Crackers", "title_te": "చిలగడదుంప క్రాకర్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍿", "image": "https://www.tashasartisanfoods.com/blog/wp-content/uploads/2022/11/Sweet-Potato-Crackers-Healthy-Snack-Recipe-FEATURE.jpeg", "prep": "—", "cook": "15-20 minutes at 350F", "yield": "—", "desc": "Fiber-rich sweet potato and cheese crackers, cut into small squares and tossed in butter.", "desc_te": "ఫైబర్ అధికంగా ఉండే చిలగడదుంప మరియు చీజ్ క్రాకర్స్, చిన్న చతురస్రాలుగా కోసి వెన్నలో కలిపినవి.", "tags": ["vegetarian", "contains dairy", "snack"], "ing": ["2 cups flour", "1/2 tsp baking powder", "1 1/4 cups sweet potato puree", "4 tbsp melted butter", "1/3-1/2 cup grated cheese", "Melted butter, garlic and parsley flakes, to toss (optional)", "Melted butter and salt, to toss (alternative for kids)"], "ing_te": ["2 cups పిండి", "1/2 tsp బేకింగ్ పౌడర్", "1 1/4 cups చిలగడదుంప ప్యూరీ", "4 tbsp కరిగించిన వెన్న", "1/3-1/2 cup తురిమిన చీజ్", "కలపడానికి కరిగించిన వెన్న, వెల్లుల్లి మరియు పార్స్లీ ఫ్లేక్స్ (ఐచ్ఛికం)", "కలపడానికి కరిగించిన వెన్న మరియు ఉప్పు (పిల్లల కోసం ప్రత్యామ్నాయం)"], "steps": ["Blend the sweet potato puree with the flour, melted butter and grated cheese into a dough; knead by hand.", "Roll flat on parchment paper and cut into small squares with a fluted pastry cutter.", "Poke holes in each cracker with a skewer.", "Bake at 350F for 15-20 minutes or until golden brown.", "Toss in melted butter with garlic and parsley flakes, or just melted butter and salt for kids who do not want the green bits."], "steps_te": ["చిలగడదుంప ప్యూరీని పిండి, కరిగించిన వెన్న మరియు తురిమిన చీజ్‌తో కలిపి పిండిలా చేయండి; చేతితో పిసకండి.", "పార్చ్‌మెంట్ పేపర్‌పై పలుచగా ఒత్తి, ఫ్లూటెడ్ పేస్ట్రీ కట్టర్‌తో చిన్న చతురస్రాలుగా కోయండి.", "ప్రతి క్రాకర్‌లో స్క్యూవర్‌తో రంధ్రాలు చేయండి.", "350F వద్ద 15-20 minutes లేదా బంగారు రంగు వచ్చే వరకు కాల్చండి.", "కరిగించిన వెన్నలో వెల్లుల్లి మరియు పార్స్లీ ఫ్లేక్స్‌తో కలపండి, లేదా ఆకుపచ్చ ముక్కలు వద్దనుకునే పిల్లల కోసం కేవలం కరిగించిన వెన్న మరియు ఉప్పుతో మాత్రమే కలపండి."], "notes": "Small square cracker format; the creator suggests butter and salt only for kids who do not want herbs.", "notes_te": "చిన్న చతురస్రాకార క్రాకర్ రూపం; మూలికలు వద్దనుకునే పిల్లల కోసం కేవలం వెన్న మరియు ఉప్పు మాత్రమే వాడాలని తయారీదారు సూచిస్తారు.", "added_at": "2026-10-22T16:04:22.333Z"}, {"n": 92, "title": "Sweet Potato, Sweet Corn & Black Bean Mini Burger Sliders", "title_te": "చిలగడదుంప, స్వీట్ కార్న్ & బ్లాక్ బీన్ మినీ బర్గర్ స్లైడర్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍔", "image": "https://www.kayceerecipes.com/wp-content/uploads/2025/12/pqcpji6rouonwktgofg3.webp", "prep": "15 minutes", "cook": "15 minutes", "yield": "8–10 mini sliders", "desc": "These mini veggie burger sliders pack black beans (plant protein and iron), mashed sweet potato (vitamin A and natural sweetness), and tender sweet corn kernels into a soft, cohesive patty that won't crumble in little hands. Perfect served on mini slider buns, in whole wheat pita halves, or directly as finger food.", "desc_te": "ఈ మినీ వెజ్జీ బర్గర్ స్లైడర్స్‌లో బ్లాక్ బీన్స్ (ప్లాంట్ ప్రోటీన్, ఐరన్), మెదిపిన చిలగడదుంప (విటమిన్ A, సహజ తీపి), మెత్తని స్వీట్ కార్న్ గింజలు కలిసి చిన్న చేతుల్లో విరిగిపోని మెత్తని, గట్టి ప్యాటీ అవుతాయి. మినీ స్లైడర్ బన్స్‌పై, హోల్ వీట్ పిటా సగాల్లో, లేదా నేరుగా ఫింగర్ ఫుడ్‌గా వడ్డించడానికి పర్ఫెక్ట్.", "tags": [], "ing": ["1 cup cooked black beans (rinsed and drained), lightly mashed", "1 cup sweet potato, steamed or baked until soft and mashed", "1/3 cup sweet corn kernels (steamed, finely chopped or lightly crushed for safety)", "1/2 cup rolled oats (ground into quick oat flour)", "1/4 cup shredded mild cheddar cheese (or Monterey Jack)", "1/2 tsp ground cumin", "1/4 tsp mild smoked paprika", "1/4 tsp onion powder", "1 tbsp olive oil (for pan-searing or baking)"], "ing_te": ["1 cup వండిన బ్లాక్ బీన్స్ (కడిగి నీరు వంపేసినవి), తేలికగా మెదిపినవి", "1 cup చిలగడదుంప, మెత్తగా అయ్యేవరకు ఆవిరిపై ఉడికించిన లేదా బేక్ చేసినది, మెదిపినది", "1/3 cup స్వీట్ కార్న్ గింజలు (ఆవిరిపై ఉడికించి, భద్రత కోసం సన్నగా తరిగిన లేదా తేలికగా నలిపినవి)", "1/2 cup రోల్డ్ ఓట్స్ (త్వరిత ఓట్ పిండిలా పొడి చేసినవి)", "1/4 cup తురిమిన మైల్డ్ చెడార్ చీజ్ (లేదా మాంటెరీ జాక్)", "1/2 tsp జీలకర్ర పొడి", "1/4 tsp మైల్డ్ స్మోక్డ్ పప్రికా", "1/4 tsp ఉల్లిపాయ పొడి", "1 tbsp ఆలివ్ ఆయిల్ (పాన్‌లో వేయించడానికి లేదా బేక్ చేయడానికి)"], "steps": ["Combine Base: In a large mixing bowl, combine the mashed black beans, mashed sweet potato, and crushed sweet corn.", "Add Seasonings & Flour: Add the ground oat flour, shredded cheese, ground cumin, smoked paprika, and onion powder. Mix well with a spoon or clean hands until a soft, moldable patty mixture forms. If the mixture feels too moist, add 1–2 extra tablespoons of oat flour.", "Shape Sliders: Scoop 2 tablespoons of dough and gently press into 2-inch mini slider patties (about 1/2 inch thick).", "Cook (Stovetop): Heat 1 tablespoon of olive oil in a non-stick skillet over medium-low heat. Place patties in the skillet and cook for 3–4 minutes per side until lightly browned and gently firmed up.", "Oven Alternative: Bake on a parchment-lined baking sheet at 375°F (190°C) for 15–18 minutes, flipping halfway.", "Serve: Let cool to warm. Serve plain as finger patties, or tucked into a toasted mini whole wheat slider bun with sliced avocado."], "steps_te": ["బేస్ కలపండి: పెద్ద మిక్సింగ్ గిన్నెలో మెదిపిన బ్లాక్ బీన్స్, మెదిపిన చిలగడదుంప, నలిపిన స్వీట్ కార్న్ కలపండి.", "మసాలాలు & పిండి వేయండి: ఓట్ పిండి, తురిమిన చీజ్, జీలకర్ర పొడి, స్మోక్డ్ పప్రికా, ఉల్లిపాయ పొడి వేయండి. మెత్తని, ఆకారం ఇవ్వగల ప్యాటీ మిశ్రమం అయ్యేవరకు చెంచాతో లేదా శుభ్రమైన చేతులతో బాగా కలపండి. మిశ్రమం చాలా తడిగా అనిపిస్తే 1–2 extra tablespoons ఓట్ పిండి కలపండి.", "స్లైడర్స్ ఆకారం ఇవ్వండి: 2 tablespoons పిండి తీసుకుని మెల్లగా నొక్కి 2-inch మినీ స్లైడర్ ప్యాటీలుగా (సుమారు 1/2 inch మందం) చేయండి.", "ఉడికించండి (స్టవ్‌టాప్): నాన్-స్టిక్ స్కిల్లెట్‌లో మీడియం-తక్కువ మంటపై 1 tablespoon ఆలివ్ ఆయిల్ వేడి చేయండి. ప్యాటీలను స్కిల్లెట్‌లో ఉంచి, ప్రతి వైపు 3–4 minutes పాటు తేలికగా బ్రౌన్ అయ్యి, మెల్లగా గట్టిపడేవరకు ఉడికించండి.", "ఓవెన్ ప్రత్యామ్నాయం: పార్చ్‌మెంట్ పరచిన బేకింగ్ షీట్‌పై 375°F (190°C) వద్ద 15–18 minutes బేక్ చేయండి, మధ్యలో తిప్పుతూ.", "వడ్డించండి: గోరువెచ్చగా అయ్యేవరకు చల్లారనివ్వండి. ఫింగర్ ప్యాటీలుగా అలాగే, లేదా వేయించిన మినీ హోల్ వీట్ స్లైడర్ బన్‌లో అవకాడో ముక్కలతో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:26.814Z"}, {"n": 68, "title": "Toddler-Approved Kaju Katli", "title_te": "చిన్నారులకు అనుకూలమైన కాజు కట్లీ", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍽️", "image": "https://cdn.cdnparenting.com/articles/2019/01/16161342/kaju-katli-kaju-katri-recipe_128021135-768x525.webp", "prep": "—", "cook": "—", "yield": "—", "desc": "An ultra-soft, nutrient-dense version of the classic Indian sweet, redesigned specifically for a 16-month-old toddler. This recipe completely replaces refined white sugar with natural dates and ensures a moist, easily melt-in-the-mouth texture that is completely safe for small teeth and gums.", "desc_te": "16 నెలల చిన్నారి కోసం ప్రత్యేకంగా పునఃరూపకల్పన చేసిన క్లాసిక్ భారతీయ స్వీట్ యొక్క అత్యంత మృదువైన, పోషకాలు అధికంగా ఉన్న వెర్షన్. ఈ రెసిపీ శుద్ధి చేసిన తెల్ల చక్కెరను పూర్తిగా సహజ ఖర్జూరాలతో భర్తీ చేస్తుంది మరియు చిన్న దంతాలు, చిగుళ్లకు పూర్తిగా సురక్షితమైన, తేమగా, నోటిలో సులభంగా కరిగే ఆకృతిని నిర్ధారిస్తుంది.", "tags": [], "ing": ["1 cup raw cashews (un-roasted and unsalted)", "1/2 cup soft, pitted dates (such as Medjool dates)", "3–4 tablespoons warm dairy milk (to help blend the dates smoothly)", "1 teaspoon ghee (adds healthy fats and structural smoothness)", "1/4 teaspoon turmeric (optional, for a beautiful golden hue and anti-inflammatory properties)", "A tiny pinch of cardamom powder (for a warm, mild aroma)"], "ing_te": ["1 cup పచ్చి జీడిపప్పు (వేయించనివి మరియు ఉప్పు లేనివి)", "1/2 cup మెత్తని, గింజలు తీసిన ఖర్జూరాలు (మెడ్జూల్ ఖర్జూరాలు వంటివి)", "3–4 tablespoons గోరువెచ్చని డెయిరీ పాలు (ఖర్జూరాలను మృదువుగా బ్లెండ్ చేయడానికి సహాయపడతాయి)", "1 teaspoon నెయ్యి (ఆరోగ్యకరమైన కొవ్వులు మరియు నిర్మాణాత్మక మృదుత్వాన్ని ఇస్తుంది)", "1/4 teaspoon పసుపు (ఐచ్ఛికం, అందమైన బంగారు రంగు మరియు వాపు తగ్గించే లక్షణాల కోసం)", "చిటికెడు యాలకుల పొడి (వెచ్చని, తేలికైన సువాసన కోసం)"], "steps": ["Prepare the Date Paste (Natural Sweetener) Soak the pitted dates in hot water for 10 to 15 minutes until they are fully plump and soft. Drain the water completely. Place the soaked dates into a small blender along with the 3 to 4 tablespoons of warm milk and blend until it forms an absolutely smooth, velvety paste with no large skin fragments remaining.", "Grind the Cashews Gently Place your room-temperature cashews into a clean, completely dry blender.", "Critical Grinding Tip: Pulse the blender in short 2-to-3 second bursts. Do not run it continuously, or the cashews will heat up and turn into cashew butter. Sieve the ground cashew powder through a fine strainer to catch any coarse pieces. A perfectly fine, soft powder is key to ensuring it is easy for your toddler to chew and swallow.", "Cook the Dough Mixture Heat 1 teaspoon of ghee in a non-stick pan over low heat. Add the smooth date paste, sieved cashew powder, cardamom powder, and turmeric. Stir continuously on low heat. The mixture will combine quickly—within 4 to 5 minutes, it should form a soft, cohesive dough ball that cleanly pulls away from the sides of the pan. Turn off the heat immediately to avoid making the dough dry or rubbery.", "Shape, Cut, and Cool Transfer the warm dough onto a sheet of parchment paper. Let it cool until it is safe to handle but still comfortably warm. Gently pat the dough down with your hands (or roll it lightly with a rolling pin) until it is about 1/4 inch thick. Cut it into small, bite-sized rectangles or traditional diamond shapes that are easy for tiny hands to grasp. Let them cool completely before moving them."], "steps_te": ["ఖర్జూర పేస్ట్ సిద్ధం చేయండి (సహజ స్వీటెనర్): గింజలు తీసిన ఖర్జూరాలను వేడి నీటిలో 10 to 15 minutes పాటు నానబెట్టి పూర్తిగా ఉబ్బి మెత్తబడేవరకు ఉంచండి. నీటిని పూర్తిగా వంపేయండి. నానబెట్టిన ఖర్జూరాలను చిన్న బ్లెండర్‌లో 3 to 4 tablespoons గోరువెచ్చని పాలతో పాటు వేసి, పెద్ద తొక్క ముక్కలు లేకుండా పూర్తిగా మృదువైన, మెత్తని పేస్ట్ అయ్యేవరకు బ్లెండ్ చేయండి.", "జీడిపప్పును మెల్లగా పొడి చేయండి: గది ఉష్ణోగ్రతలో ఉన్న జీడిపప్పును శుభ్రమైన, పూర్తిగా పొడి బ్లెండర్‌లో ఉంచండి.", "కీలకమైన గ్రైండింగ్ చిట్కా: బ్లెండర్‌ను చిన్న 2-to-3 second బర్స్ట్‌లలో పల్స్ చేయండి. నిరంతరం నడపకండి, లేకపోతే జీడిపప్పు వేడెక్కి జీడిపప్పు వెన్నగా మారుతుంది. ముతక ముక్కలను పట్టుకోవడానికి నలిపిన జీడిపప్పు పొడిని సన్నని జల్లెడ ద్వారా జల్లించండి. మీ చిన్నారి సులభంగా నమిలి మింగడానికి పూర్తిగా సన్నని, మృదువైన పొడి కీలకం.", "పిండి మిశ్రమాన్ని వండండి: నాన్-స్టిక్ పాన్‌లో తక్కువ వేడిపై 1 teaspoon నెయ్యి వేడి చేయండి. మృదువైన ఖర్జూర పేస్ట్, జల్లించిన జీడిపప్పు పొడి, యాలకుల పొడి మరియు పసుపు వేయండి. తక్కువ వేడిపై నిరంతరం కలపండి. మిశ్రమం త్వరగా కలుస్తుంది — 4 to 5 minutes లోపు, ఇది మృదువైన, కలిసిన పిండి ఉండగా ఏర్పడి పాన్ వైపుల నుంచి శుభ్రంగా విడిపోవాలి. పిండి పొడిగా లేదా రబ్బరులా మారకుండా వెంటనే వేడి ఆపేయండి.", "ఆకారం ఇచ్చి, కత్తిరించి, చల్లారనివ్వండి: వెచ్చని పిండిని పార్చ్మెంట్ పేపర్ షీట్‌పైకి తీసుకోండి. పట్టుకోవడానికి సురక్షితంగా, కానీ ఇంకా సౌకర్యవంతంగా వెచ్చగా ఉండేవరకు చల్లారనివ్వండి. పిండిని చేతులతో మెల్లగా నొక్కండి (లేదా రోలింగ్ పిన్‌తో తేలికగా చుట్టండి), సుమారు 1/4 inch మందం అయ్యేవరకు చేయండి. చిన్న చేతులు పట్టుకోవడానికి సులభమైన చిన్న, కొరకడానికి వీలైన దీర్ఘచతురస్రాలు లేదా సాంప్రదాయ డైమండ్ ఆకారాలుగా కత్తిరించండి. కదిలించడానికి ముందు పూర్తిగా చల్లారనివ్వండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:46.022Z"}, {"n": 138, "title": "Toddler-Friendly Oatmeal and Almond Cookies V2", "title_te": "చిన్నారికి అనుకూలమైన ఓట్‌మీల్, ఆల్మండ్ కుకీలు V2", "cat": "Kid & Toddler", "section": "kid", "emoji": "🥣", "image": "https://usa.mixmirth.com/wp-content/uploads/2026/01/almond-flour-oatmeal-cookies-2026-01-15-094827-500x500.webp", "prep": "—", "cook": "—", "yield": "—", "desc": "Line Spacing: 1.15", "desc_te": "లైన్ స్పేసింగ్: 1.15", "tags": [], "ing": ["Instant oats: 75g (3/4 cup)", "Wholewheat flour: 50g (1/2 cup)", "Natural Sweetener: 1 medium ripe banana, thoroughly mashed (replaces the brown sugar/jaggery)", "Finely ground almonds or almond flour: 25g (1/4 cup) (Crucial step to remove choking hazards)", "Baking powder: 1/2 teaspoon", "Cinnamon powder: 1/4 teaspoon", "Butter: 50g (1/4 cup), softened or melted", "Liquid: 2 tablespoons of milk, breastmilk, or prepared formula"], "ing_te": ["ఇన్‌స్టంట్ ఓట్స్: 75g (3/4 cup)", "హోల్‌వీట్ పిండి: 50g (1/2 cup)", "సహజ స్వీటెనర్: 1 మధ్యస్థ పండిన అరటిపండు, బాగా మెత్తగా చేసినది (బ్రౌన్ షుగర్/బెల్లం స్థానంలో)", "సన్నగా రుబ్బిన బాదం లేదా ఆల్మండ్ పిండి: 25g (1/4 cup) (గొంతుకు అడ్డుపడే ప్రమాదాలను తొలగించడానికి కీలకమైన దశ)", "బేకింగ్ పౌడర్: 1/2 teaspoon", "దాల్చిన చెక్క పొడి: 1/4 teaspoon", "వెన్న: 50g (1/4 cup), మెత్తబడినది లేదా కరిగించినది", "ద్రవం: 2 tablespoons పాలు, తల్లి పాలు, లేదా తయారుచేసిన ఫార్ములా"], "steps": ["In a medium bowl, mix together the instant oats, wholewheat flour, finely ground almonds, baking powder, and cinnamon powder. Set aside. In a separate bowl, thoroughly mash the ripe banana. Mix in the softened butter and your choice of milk until well combined. Pour the dry ingredients into the wet banana mixture. Stir gently until a soft dough forms. Shape the dough into small, bite-sized cookie rounds appropriate for small hands (roughly 20-25g each, yielding about 14-16 smaller, softer cookies). Gently press them down slightly on the baking sheet, as these will not spread much. Bake at 160°C (320°F) for 12–15 minutes, or until the bottoms are lightly golden but the cookies remain soft and easy to chew. Allow to cool completely before serving."], "steps_te": ["మధ్యస్థ గిన్నెలో ఇన్‌స్టంట్ ఓట్స్, హోల్‌వీట్ పిండి, సన్నగా రుబ్బిన బాదం, బేకింగ్ పౌడర్, దాల్చిన చెక్క పొడి కలపండి. పక్కన పెట్టండి. వేరే గిన్నెలో పండిన అరటిపండును బాగా మెత్తగా చేయండి. మెత్తబడిన వెన్న, మీరు ఎంచుకున్న పాలు బాగా కలిసేవరకు కలపండి. పొడి పదార్థాలను తడి అరటి మిశ్రమంలో పోయండి. మెత్తని పిండి అయ్యేవరకు మెల్లగా కలపండి. పిండిని చిన్న చేతులకు తగిన చిన్న, కొరుకుడు పరిమాణంలో కుకీ రౌండ్లుగా ఆకారం ఇవ్వండి (సుమారు 20-25g చొప్పున, సుమారు 14-16 చిన్న, మెత్తని కుకీలు వస్తాయి). బేకింగ్ షీట్‌పై వాటిని కొంచెం నొక్కండి, ఎందుకంటే ఇవి అంతగా విస్తరించవు. 160°C (320°F) వద్ద 12–15 minutes బేక్ చేయండి, లేదా అడుగు భాగాలు తేలికగా బంగారు రంగు వచ్చి, కుకీలు మెత్తగా, సులభంగా నమలగలిగేలా ఉండేవరకు. వడ్డించే ముందు పూర్తిగా చల్లబరచనివ్వండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.353Z"}, {"n": 64, "title": "Toddler-Friendly Tofu Chips & Veggie Tots", "title_te": "చిన్నారులకు అనుకూలమైన టోఫు చిప్స్ & వెజ్జీ టాట్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍳", "image": "https://thechowdownblog.com/wp-content/uploads/2022/05/IMG_8179.jpg", "prep": "15 mins", "cook": "20–25 mins", "yield": "2 batches", "desc": "Calcium-rich, protein-packed finger foods tailored for toddlers without added salt.", "desc_te": "ఉప్పు వేయకుండా చిన్నారుల కోసం తయారు చేసిన కాల్షియం అధికంగా, ప్రోటీన్ నిండిన ఫింగర్ ఫుడ్స్.", "tags": [], "ing": ["Chips: 1/2 block firm tofu (pressed thin), avocado oil, garlic powder, turmeric", "Tots: 1/2 block firm tofu (crumbled), 1/4 cup grated carrots, 1/4 cup chopped spinach, 1 egg, 3–4 tbsp oat flour, black pepper, cumin"], "ing_te": ["చిప్స్: 1/2 block గట్టి టోఫు (సన్నగా నొక్కినది), అవకాడో ఆయిల్, వెల్లుల్లి పొడి, పసుపు", "టాట్స్: 1/2 block గట్టి టోఫు (నలిపినది), 1/4 cup తురిమిన క్యారెట్లు, 1/4 cup తరిగిన పాలకూర, 1 గుడ్డు, 3–4 tbsp ఓట్ పిండి, నల్ల మిరియాలు, జీలకర్ర"], "steps": ["Chips: slice pressed tofu paper-thin, coat with oil and spices, and bake at 350°F for 25–30 minutes until crispy.", "Tots: mash crumbled tofu with carrots, spinach, egg, and oat flour; shape into tots and bake at 350°F for 18–20 minutes."], "steps_te": ["చిప్స్: నొక్కిన టోఫును కాగితంలా సన్నగా కత్తిరించి, నూనె, మసాలాలతో పూసి, క్రిస్పీ అయ్యేవరకు 350°F వద్ద 25–30 minutes పాటు బేక్ చేయండి.", "టాట్స్: నలిపిన టోఫును క్యారెట్లు, పాలకూర, గుడ్డు మరియు ఓట్ పిండితో మెదపండి; టాట్స్ ఆకారం ఇచ్చి 350°F వద్ద 18–20 minutes పాటు బేక్ చేయండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:45.901Z"}, {"n": 50, "title": "Tofu Vegetable Fried Rice", "title_te": "టోఫు వెజిటబుల్ ఫ్రైడ్ రైస్", "cat": "Adult", "section": "adult", "emoji": "🍚", "image": "https://www.herwholesomekitchen.com/wp-content/uploads/2021/10/tofu-fried-rice-1-3-1.jpg", "prep": "10 minutes", "cook": "15 minutes", "yield": "2-3", "desc": "High-protein fried rice with tofu crumbled into a sesame-garlic-chili paste, mixed vegetables, and cooked rice, finished with lemon juice.", "desc_te": "నువ్వులు-వెల్లుల్లి-మిరప పేస్ట్‌లో నలిపిన టోఫు, మిశ్రమ కూరగాయలు మరియు వండిన అన్నంతో చేసిన అధిక ప్రోటీన్ ఫ్రైడ్ రైస్, చివరలో నిమ్మరసంతో పూర్తి చేయబడింది.", "tags": ["high-protein", "tofu", "fried rice", "vegetarian", "quick dinner"], "ing": ["3 garlic cloves", "1 tsp red chili powder", "1 tbsp sesame seeds", "1/4 tsp turmeric", "Salt to taste", "200 g firm tofu", "2 cups cooked rice", "1 tbsp lemon juice", "1 cup mixed vegetables (carrots, peas, corn, green beans)", "2 tbsp oil"], "ing_te": ["3 వెల్లుల్లి రెబ్బలు", "1 tsp ఎర్ర మిరప పొడి", "1 tbsp నువ్వులు", "1/4 tsp పసుపు", "రుచికి తగినంత ఉప్పు", "200 g గట్టి టోఫు", "2 cups వండిన అన్నం", "1 tbsp నిమ్మరసం", "1 cup మిశ్రమ కూరగాయలు (క్యారెట్లు, బఠాణీలు, మొక్కజొన్న, పచ్చి బీన్స్)", "2 tbsp నూనె"], "steps": ["Grind the sesame seeds, garlic cloves, red chili powder, salt, and turmeric together into a thick paste.", "Heat the oil in a pan and sauté the paste until fragrant.", "Add the mixed vegetables and stir.", "Add the tofu, breaking it apart with a spatula, and mix thoroughly with the vegetables and spices.", "Add the cooked rice and toss until evenly coated and colored.", "Squeeze lemon juice over the finished fried rice and serve, garnished with a lime wedge if desired."], "steps_te": ["నువ్వులు, వెల్లుల్లి రెబ్బలు, ఎర్ర మిరప పొడి, ఉప్పు మరియు పసుపును కలిపి మందపాటి పేస్ట్‌లా రుబ్బండి.", "పాన్‌లో నూనె వేడి చేసి, పేస్ట్ సువాసన వచ్చే వరకు వేయించండి.", "మిశ్రమ కూరగాయలు వేసి కలపండి.", "టోఫు వేసి, గరిటెతో విడదీస్తూ, కూరగాయలు మరియు మసాలాలతో బాగా కలపండి.", "వండిన అన్నం వేసి, సమానంగా పట్టి, రంగు వచ్చే వరకు కలపండి.", "తయారైన ఫ్రైడ్ రైస్‌పై నిమ్మరసం పిండి, కావాలంటే నిమ్మ ముక్కతో అలంకరించి వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T15:44:59.092Z"}, {"n": 29, "title": "Tomato Garlic Cheese Pasta", "title_te": "టమోటా గార్లిక్ చీజ్ పాస్తా", "cat": "Adult", "section": "adult", "emoji": "🍝", "image": "https://recipesxpert.com/wp-content/uploads/2026/04/creamy-garlic-tomato-pasta-3.jpg", "prep": "—", "cook": "10 minutes", "yield": "—", "desc": "10-minute creamy tomato garlic pasta with melted cheese and fresh cream.", "desc_te": "కరిగిన చీజ్ మరియు తాజా క్రీమ్‌తో చేసిన 10 నిమిషాల క్రీమీ టమోటా గార్లిక్ పాస్తా.", "tags": ["vegetarian", "contains dairy", "dinner", "quick"], "ing": ["1 tbsp oil", "2 tbsp butter", "4 tomatoes, cut in half", "1 big onion, chopped", "8-10 garlic cloves", "Salt", "1/2 cup water", "2 tbsp oregano pizza mix", "1 tbsp chilli flakes", "1 tsp Kashmiri red chilli powder", "Some coriander", "Handful of cheese", "1/2 cup fresh cream", "2 cups boiled pasta", "Some pasta water", "Coriander, oregano and chilli flakes, to garnish"], "ing_te": ["1 tbsp నూనె", "2 tbsp వెన్న", "4 టమోటాలు, సగానికి కత్తిరించినవి", "1 పెద్ద ఉల్లిపాయ, తరిగినది", "8-10 వెల్లుల్లి రెబ్బలు", "ఉప్పు", "1/2 cup నీరు", "2 tbsp ఒరెగానో పిజ్జా మిక్స్", "1 tbsp చిల్లీ ఫ్లేక్స్", "1 tsp కాశ్మీరీ ఎర్ర కారం పొడి", "కొంత కొత్తిమీర", "గుప్పెడు చీజ్", "1/2 cup తాజా క్రీమ్", "2 cups ఉడికించిన పాస్తా", "కొంత పాస్తా నీరు", "అలంకరణకు కొత్తిమీర, ఒరెగానో మరియు చిల్లీ ఫ్లేక్స్"], "steps": ["Heat the oil and butter; add the halved tomatoes with the chopped onion, garlic cloves and salt.", "Cover and cook until the tomatoes are soft.", "Remove the tomato peels.", "Add 1/2 cup water with the oregano pizza mix, chilli flakes, Kashmiri red chilli powder and some coriander; mash into a sauce.", "Add a handful of cheese with the fresh cream.", "Add the boiled pasta and some pasta water.", "Garnish with coriander, oregano and chilli flakes and serve."], "steps_te": ["నూనె మరియు వెన్న వేడి చేసి, సగానికి కత్తిరించిన టమోటాలను తరిగిన ఉల్లిపాయ, వెల్లుల్లి రెబ్బలు మరియు ఉప్పుతో వేయండి.", "మూత పెట్టి టమోటాలు మెత్తబడే వరకు ఉడికించండి.", "టమోటా తొక్కలు తీసివేయండి.", "1/2 cup నీటితో పాటు ఒరెగానో పిజ్జా మిక్స్, చిల్లీ ఫ్లేక్స్, కాశ్మీరీ ఎర్ర కారం పొడి మరియు కొంత కొత్తిమీర వేసి, సాస్‌లా మెదపండి.", "గుప్పెడు చీజ్‌తో పాటు తాజా క్రీమ్ వేయండి.", "ఉడికించిన పాస్తా మరియు కొంత పాస్తా నీరు వేయండి.", "కొత్తిమీర, ఒరెగానో మరియు చిల్లీ ఫ్లేక్స్‌తో అలంకరించి వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:40.825Z"}, {"n": 26, "title": "Trader Joe's Masala Burrata Sandwich", "title_te": "ట్రేడర్ జోస్ మసాలా బుర్రాటా శాండ్‌విచ్", "cat": "Adult", "section": "adult", "emoji": "🥪", "image": "https://d1w7312wesee68.cloudfront.net/Dw7-sAYDA_yjyGRZQdHh5gGwsN-Ekohe7eh1HWNqeKI/resize:fit:1080:1080/plain/s3://toasttab/restaurants/restaurant-37090000000000000/menu/items/3/item-400000038684749903_1759165881.jpg", "prep": "—", "cook": "not stated (per package for patties)", "yield": "1", "desc": "Fusion sandwich of masala burger patties, vegan pesto, burrata and pickled onions on toasted sandwich bread.", "desc_te": "మసాలా బర్గర్ ప్యాటీలు, వీగన్ పెస్టో, బుర్రాటా మరియు ఊరగాయ ఉల్లిపాయలతో కాల్చిన శాండ్‌విచ్ బ్రెడ్‌పై చేసిన ఫ్యూజన్ శాండ్‌విచ్.", "tags": ["vegetarian", "contains dairy", "lunch", "snack", "quick"], "ing": ["Trader Joe's Sandwich Starter bread", "Trader Joe's Vegan Pesto", "Trader Joe's Masala Burger Patties", "Trader Joe's Burrata Filling", "Tomato slices", "Pickled onions", "Fresh spinach", "Salt and black pepper", "Butter or oil for toasting (optional)"], "ing_te": ["ట్రేడర్ జోస్ శాండ్‌విచ్ స్టార్టర్ బ్రెడ్", "ట్రేడర్ జోస్ వీగన్ పెస్టో", "ట్రేడర్ జోస్ మసాలా బర్గర్ ప్యాటీలు", "ట్రేడర్ జోస్ బుర్రాటా ఫిల్లింగ్", "టమోటా ముక్కలు", "ఊరగాయ ఉల్లిపాయలు", "తాజా పాలకూర", "ఉప్పు మరియు నల్ల మిరియాలు", "కాల్చడానికి వెన్న లేదా నూనె (ఐచ్ఛికం)"], "steps": ["Toast the sandwich bread on a pan or toaster until golden and crispy, lightly buttering for extra crunch if liked.", "Cook the masala burger patties according to package instructions until hot and slightly crispy outside.", "Spread a generous layer of vegan pesto on one side of the toasted bread.", "Place the cooked masala burger patty on the bread.", "Top with tomato slices, burrata filling, pickled onions and fresh spinach.", "Sprinkle salt and black pepper to taste.", "Close with the second slice of toasted bread, slice in half and serve warm."], "steps_te": ["శాండ్‌విచ్ బ్రెడ్‌ను పాన్‌లో లేదా టోస్టర్‌లో బంగారు రంగు వచ్చి కరకరలాడే వరకు కాల్చండి; ఇష్టమైతే అదనపు కరకర కోసం కొద్దిగా వెన్న రాయండి.", "మసాలా బర్గర్ ప్యాటీలను ప్యాకెట్ సూచనల ప్రకారం వేడిగా, బయట కొద్దిగా కరకరలాడే వరకు ఉడికించండి.", "కాల్చిన బ్రెడ్ ఒక వైపు వీగన్ పెస్టోను దట్టంగా రాయండి.", "ఉడికించిన మసాలా బర్గర్ ప్యాటీని బ్రెడ్‌పై ఉంచండి.", "పైన టమోటా ముక్కలు, బుర్రాటా ఫిల్లింగ్, ఊరగాయ ఉల్లిపాయలు మరియు తాజా పాలకూర వేయండి.", "రుచికి తగినంత ఉప్పు మరియు నల్ల మిరియాలు చల్లండి.", "రెండవ కాల్చిన బ్రెడ్ ముక్కతో మూసి, సగానికి కత్తిరించి వేడిగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:26.427Z"}, {"n": 34, "title": "Turkish Egg Toast Sandwich (Yumurtali Tost)", "title_te": "టర్కిష్ ఎగ్ టోస్ట్ శాండ్‌విచ్ (యుముర్తాలీ టోస్ట్)", "cat": "Adult", "section": "adult", "emoji": "🥪", "image": "https://i.pinimg.com/originals/8b/b3/12/8bb31205ad2cdcb7aa186cd927120421.jpg", "prep": "—", "cook": "—", "yield": "1", "desc": "Turkish-style egg toast sandwich: egg folded around bread, layered with cheese, tomato, avocado and lettuce, toasted golden.", "desc_te": "టర్కిష్ శైలి ఎగ్ టోస్ట్ శాండ్‌విచ్: బ్రెడ్ చుట్టూ మడిచిన గుడ్డు, చీజ్, టమాటా, అవకాడో మరియు లెట్యూస్ పొరలతో, బంగారు రంగు వచ్చే వరకు టోస్ట్ చేసినది.", "tags": ["vegetarian", "contains dairy", "breakfast"], "ing": ["2 tbsp oil", "2 eggs", "Salt", "Sandwich or toast bread, 2 slices", "Tomato", "Avocado", "2 slices kasar cheese", "Lettuce leaves"], "ing_te": ["2 tbsp నూనె", "2 గుడ్లు", "ఉప్పు", "శాండ్‌విచ్ లేదా టోస్ట్ బ్రెడ్, 2 ముక్కలు", "టమాటా", "అవకాడో", "2 ముక్కలు కసార్ చీజ్", "లెట్యూస్ ఆకులు"], "steps": ["Beat the eggs with salt and pour into a pan.", "Place bread on the egg and fold the omelet around it.", "Layer cheese, tomato, fanned avocado and lettuce.", "Top with bread and toast until golden.", "Cut and serve."], "steps_te": ["గుడ్లను ఉప్పుతో కొట్టి పాన్‌లో పోయండి.", "గుడ్డు మీద బ్రెడ్ ఉంచి ఆమ్లెట్‌ను దాని చుట్టూ మడవండి.", "చీజ్, టమాటా, విచ్చిన అవకాడో మరియు లెట్యూస్ పొరలుగా వేయండి.", "పైన బ్రెడ్ ఉంచి బంగారు రంగు వచ్చే వరకు టోస్ట్ చేయండి.", "కోసి వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:56.009Z"}, {"n": 79, "title": "Vankaaya Dum Biryani", "title_te": "వంకాయ దమ్ బిర్యానీ", "cat": "Adult", "section": "adult", "emoji": "🍽️", "image": "https://subbucooks.com/wp-content/uploads/2018/06/IMG_3803-1024x683.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "A flavorful vegetarian biryani featuring spiced, stuffed eggplants (brinjals) layered with aromatic basmati rice.", "desc_te": "మసాలా కూరిన వంకాయలు (బ్రింజల్స్) సువాసనభరితమైన బాస్మతి అన్నంతో పొరలుగా పేర్చిన రుచికరమైన శాకాహార బిర్యానీ.", "tags": [], "ing": ["For the Eggplant Base", "Eggplants (small, purple): 10-12 pieces", "Onions: 3 large, thinly sliced", "Green chilies: 5 pieces, slit", "Ginger-garlic paste: 1 tablespoon", "Cashews: 1/4 cup", "Red chili powder: 1.5 teaspoons", "Coriander powder: 1 teaspoon", "Turmeric powder: 1/2 teaspoon", "Salt: to taste", "Oil: 3-4 tablespoons", "Fresh coriander and mint leaves: 1/2 cup, chopped", "For the Masala Paste", "Peanuts: 1/4 cup, roasted", "Cashews: 1 tablespoon", "Cloves: 10 pieces", "Cinnamon: 2-3 sticks", "Cardamom: 3 pieces", "Sesame seeds: 1 tablespoon", "For the Rice", "Basmati rice: 2 cups, soaked for 30 minutes", "Whole biryani spices (bay leaf, cloves, cinnamon, cardamom)", "Mint leaves: a handful", "Ginger-garlic paste: 1 teaspoon", "Salt: to taste"], "ing_te": ["వంకాయ బేస్ కోసం", "వంకాయలు (చిన్నవి, ఊదా రంగు): 10-12 pieces", "ఉల్లిపాయలు: 3 large, సన్నగా తరిగినవి", "పచ్చిమిర్చి: 5 pieces, చీల్చినవి", "అల్లం-వెల్లుల్లి పేస్ట్: 1 tablespoon", "జీడిపప్పు: 1/4 cup", "కారం పొడి: 1.5 teaspoons", "ధనియాల పొడి: 1 teaspoon", "పసుపు పొడి: 1/2 teaspoon", "ఉప్పు: రుచికి తగ్గట్టు", "నూనె: 3-4 tablespoons", "తాజా కొత్తిమీర మరియు పుదీనా ఆకులు: 1/2 cup, తరిగినవి", "మసాలా పేస్ట్ కోసం", "వేరుశనగలు: 1/4 cup, వేయించినవి", "జీడిపప్పు: 1 tablespoon", "లవంగాలు: 10 pieces", "దాల్చినచెక్క: 2-3 sticks", "యాలకులు: 3 pieces", "నువ్వులు: 1 tablespoon", "అన్నం కోసం", "బాస్మతి బియ్యం: 2 cups, 30 minutes నానబెట్టినవి", "గరం బిర్యానీ మసాలా దినుసులు (బిర్యానీ ఆకు, లవంగాలు, దాల్చినచెక్క, యాలకులు)", "పుదీనా ఆకులు: గుప్పెడు", "అల్లం-వెల్లుల్లి పేస్ట్: 1 teaspoon", "ఉప్పు: రుచికి తగ్గట్టు"], "steps": ["Prepare the Eggplants: Slit the eggplants into four quarters (keeping the stalks attached) and soak them in salt water. Sauté them in a pan with oil, turmeric, and salt until softened. Remove and set aside.", "Make the Masala Paste: Roast peanuts, cashews, cloves, cinnamon, cardamom, and sesame seeds. Blend into a smooth paste with a little water.", "Sauté Aromatics: In the same pan, fry sliced onions, green chilies, cashews, and ginger-garlic paste until golden. Add red chili powder and coriander powder.", "Simmer the Gravy: Stir in the masala paste and some water. Add garam masala, salt, chopped coriander, and mint. Cook until the oil separates. Pour this gravy over the fried eggplants.", "Cook the Rice: Boil water with whole spices, mint, salt, and ginger-garlic paste. Add soaked rice and cook until 95% done. Drain the water.", "Layer and Dum: Layer the cooked rice over the eggplant gravy. Top with fried onions, mint, coriander, and a mixture of milk and turmeric for color. Cover tightly and cook on low heat (dum) for 30 minutes."], "steps_te": ["వంకాయలు సిద్ధం చేయండి: వంకాయలను నాలుగు భాగాలుగా చీల్చండి (కాడలు అలాగే ఉంచి) ఉప్పు నీటిలో నానబెట్టండి. పాన్‌లో నూనె, పసుపు మరియు ఉప్పుతో మెత్తబడేవరకు వేయించండి. తీసి పక్కన పెట్టండి.", "మసాలా పేస్ట్ చేయండి: వేరుశనగలు, జీడిపప్పు, లవంగాలు, దాల్చినచెక్క, యాలకులు మరియు నువ్వులను వేయించండి. కొద్దిగా నీరు వేసి మెత్తని పేస్ట్‌గా రుబ్బండి.", "సువాసన దినుసులు వేయించండి: అదే పాన్‌లో తరిగిన ఉల్లిపాయలు, పచ్చిమిర్చి, జీడిపప్పు మరియు అల్లం-వెల్లుల్లి పేస్ట్ బంగారు రంగు వచ్చేవరకు వేయించండి. కారం పొడి మరియు ధనియాల పొడి వేయండి.", "గ్రేవీ ఉడికించండి: మసాలా పేస్ట్ మరియు కొంత నీరు కలపండి. గరం మసాలా, ఉప్పు, తరిగిన కొత్తిమీర మరియు పుదీనా వేయండి. నూనె పైకి తేలేవరకు వండండి. ఈ గ్రేవీని వేయించిన వంకాయలపై పోయండి.", "అన్నం వండండి: గరం మసాలా దినుసులు, పుదీనా, ఉప్పు మరియు అల్లం-వెల్లుల్లి పేస్ట్‌తో నీరు మరిగించండి. నానబెట్టిన బియ్యం వేసి 95% ఉడికేవరకు వండండి. నీరు వడకండి.", "పొరలు పేర్చి దమ్ చేయండి: వంకాయ గ్రేవీపై వండిన అన్నాన్ని పరచండి. పైన వేయించిన ఉల్లిపాయలు, పుదీనా, కొత్తిమీర మరియు రంగు కోసం పాలు-పసుపు మిశ్రమం వేయండి. గట్టిగా మూసి తక్కువ మంటపై (దమ్) 30 minutes వండండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:06:17.594Z"}, {"n": 17, "title": "Veggie Cheese Loaf", "title_te": "వెజ్జీ చీజ్ లోఫ్", "cat": "Adult", "section": "adult", "emoji": "🍳", "image": "https://i.pinimg.com/originals/c9/e5/58/c9e558c3fef2e22a3d39700a51a1b90a.jpg", "prep": "—", "cook": "about 40 minutes (50 minutes total)", "yield": "—", "desc": "Baked veggie and cheddar loaf that hides egg and vegetables, pitched by the creator as a toddler breakfast and on-the-go snack (filed under adult because it came from the Diet Food collection).", "desc_te": "గుడ్డు మరియు కూరగాయలను దాచి చేసిన కాల్చిన వెజ్జీ మరియు చెడార్ లోఫ్, చిన్న పిల్లల అల్పాహారం మరియు ప్రయాణంలో తినే స్నాక్‌గా సృష్టికర్త సూచించారు (Diet Food సేకరణ నుండి వచ్చినందున adult విభాగంలో ఉంచబడింది).", "tags": ["vegetarian", "contains dairy", "breakfast", "snack"], "ing": ["2 eggs", "125 g plain flour", "1 tsp baking powder", "100 ml milk", "110 g grated cheddar", "1 medium carrot", "1 medium courgette (zucchini)"], "ing_te": ["2 గుడ్లు", "125 g సాదా పిండి", "1 tsp బేకింగ్ పౌడర్", "100 ml పాలు", "110 g తురిమిన చెడార్", "1 మధ్యస్థ క్యారెట్", "1 మధ్యస్థ కూర్గెట్ (జుకినీ)"], "steps": ["Preheat the oven to 180C.", "Grate the courgette and carrot and squeeze out the liquid.", "In a bowl whisk the eggs, flour, baking powder and milk until smooth.", "Add half the grated cheese to the batter and mix well.", "Add the grated vegetables and mix well.", "Pour the batter into a tin lined with baking paper.", "Top with the remaining cheese, pressing lightly into the batter.", "Bake about 40 minutes until golden brown outside and cooked through; if the top browns before the middle is done, cover with foil."], "steps_te": ["ఓవెన్‌ను 180C వరకు వేడి చేయండి.", "కూర్గెట్ మరియు క్యారెట్‌ను తురిమి నీరు పిండండి.", "ఒక గిన్నెలో గుడ్లు, పిండి, బేకింగ్ పౌడర్ మరియు పాలు మెత్తగా అయ్యేవరకు గిలకొట్టండి.", "పిండి మిశ్రమంలో సగం తురిమిన చీజ్ వేసి బాగా కలపండి.", "తురిమిన కూరగాయలు వేసి బాగా కలపండి.", "బేకింగ్ పేపర్ పరచిన టిన్‌లో పిండి మిశ్రమం పోయండి.", "మిగిలిన చీజ్‌ను పైన వేసి పిండిలోకి తేలికగా నొక్కండి.", "బయట బంగారు రంగులోకి వచ్చి లోపల పూర్తిగా ఉడికేవరకు about 40 minutes కాల్చండి; మధ్య భాగం ఉడకకముందే పైన గోధుమ రంగులోకి వస్తే ఫాయిల్‌తో కప్పండి."], "notes": "Creator pitches this for toddlers and little hands as an on-the-go snack; soft baked texture, cut into fingers.", "notes_te": "చిన్న పిల్లలు మరియు చిన్న చేతుల కోసం ప్రయాణంలో తినే స్నాక్‌గా సృష్టికర్త దీన్ని సూచించారు; మెత్తని కాల్చిన ఆకృతి, వేళ్ళలా కత్తిరించండి.", "added_at": "2026-10-22T16:03:00.806Z"}, {"n": 107, "title": "Vibrant Beetroot & Paneer Soft Tikkis (Cutlets)", "title_te": "రంగురంగుల బీట్‌రూట్ & పనీర్ మృదువైన టిక్కీలు (కట్లెట్స్)", "cat": "Kid & Toddler", "section": "kid", "emoji": "🧀", "image": "https://img-cdn.publive.online/fit-in/580x348/filters:format(webp)/indian-express-gujarati/media/media_files/2026/09/02/beetroot-paneer-tikki-recipe-weight-loss-tips-2026-09-02-11-27-35.jpg", "prep": "15 minutes", "cook": "12 minutes", "yield": "8–10 mini tikkis", "desc": "These bright pink, naturally sweet patties combine antioxidant-packed beetroot with fresh grated paneer for a calcium and protein punch. Bound with whole oat flour, they are tender on the inside, easy to chew, and fun for toddlers to self-feed.", "desc_te": "ఈ ప్రకాశవంతమైన గులాబీ రంగు, సహజంగా తీపి ప్యాటీలు యాంటీఆక్సిడెంట్లు నిండిన బీట్‌రూట్‌ను తాజా తురిమిన పనీర్‌తో కలిపి కాల్షియం మరియు ప్రోటీన్ శక్తిని అందిస్తాయి. హోల్ ఓట్ పిండితో బంధించబడి, ఇవి లోపల మృదువుగా, నమలడానికి సులభంగా ఉంటాయి మరియు పిల్లలు స్వయంగా తినడానికి సరదాగా ఉంటాయి.", "tags": [], "ing": ["1 medium beetroot, boiled, peeled, and finely grated (approx. 1 cup)", "1/2 cup fresh paneer, finely crumbled or grated", "1 small potato (or sweet potato), boiled and smoothly mashed (approx. 1/2 cup)", "1/4 cup rolled oats, finely ground into flour", "1/2 tsp roasted cumin powder", "1/4 tsp amchur (dry mango powder) or a squeeze of fresh lemon juice", "Pinch of turmeric powder", "Pinch of salt (optional, for toddlers over 12 months)", "1 tbsp ghee or avocado oil (for pan-searing or air-frying)"], "ing_te": ["1 medium బీట్‌రూట్, ఉడికించి, తొక్క తీసి, సన్నగా తురిమినది (approx. 1 cup)", "1/2 cup తాజా పనీర్, సన్నగా నలిపినది లేదా తురిమినది", "1 small బంగాళాదుంప (లేదా చిలగడదుంప), ఉడికించి మృదువుగా మెదిపినది (approx. 1/2 cup)", "1/4 cup రోల్డ్ ఓట్స్, సన్నగా పిండి చేసినది", "1/2 tsp వేయించిన జీలకర్ర పొడి", "1/4 tsp ఆమ్చూర్ (ఎండిన మామిడి పొడి) లేదా తాజా నిమ్మరసం కొద్దిగా", "Pinch of పసుపు పొడి", "Pinch of ఉప్పు (optional, 12 నెలలు పైబడిన పిల్లలకు)", "1 tbsp నెయ్యి లేదా అవకాడో నూనె (పాన్‌లో వేయించడానికి లేదా ఎయిర్-ఫ్రై చేయడానికి)"], "steps": ["Prepare the Dough: In a medium mixing bowl, combine the grated beetroot, crumbled paneer, and mashed potato. Mix thoroughly.", "Add Seasonings & Binder: Add roasted cumin powder, amchur/lemon juice, turmeric, pinch of salt, and ground oat flour. Knead gently until a soft, non-sticky dough forms. If too wet, add an extra tablespoon of oat flour.", "Shape: Divide the mixture into small, flat round discs (toddler palm-sized).", "Cook (Stovetop Method): Heat a flat skillet or tava over medium-low heat and grease lightly with ghee. Place the tikkis on the skillet and cook for 3–4 minutes per side until golden brown with a slight crisp edge.", "Air Fryer Alternative: Lightly brush tikkis with ghee/oil, place in the air fryer basket at 350°F (175°C), and air fry for 10–12 minutes, flipping halfway.", "Serve: Allow to cool to warm room temperature. Serve with mint-yogurt dip or mild avocado puree."], "steps_te": ["పిండి సిద్ధం చేయండి: ఒక మధ్యస్థ మిక్సింగ్ గిన్నెలో తురిమిన బీట్‌రూట్, నలిపిన పనీర్ మరియు మెదిపిన బంగాళాదుంపను కలపండి. బాగా కలపండి.", "మసాలాలు & బైండర్ వేయండి: వేయించిన జీలకర్ర పొడి, ఆమ్చూర్/నిమ్మరసం, పసుపు, చిటికెడు ఉప్పు మరియు పొడి చేసిన ఓట్ పిండిని వేయండి. మృదువైన, అంటుకోని పిండి అయ్యేవరకు మెల్లగా పిసకండి. చాలా తడిగా ఉంటే, ఒక అదనపు tablespoon ఓట్ పిండిని వేయండి.", "ఆకారం ఇవ్వండి: మిశ్రమాన్ని చిన్న, చదునైన గుండ్రని డిస్క్‌లుగా (పిల్లల అరచేతి పరిమాణంలో) విభజించండి.", "వండండి (స్టవ్‌టాప్ పద్ధతి): మధ్యస్థ-తక్కువ మంటపై చదునైన స్కిల్లెట్ లేదా తవాను వేడి చేసి నెయ్యితో తేలికగా గ్రీజ్ చేయండి. టిక్కీలను స్కిల్లెట్‌పై ఉంచి, బంగారు గోధుమ రంగు వచ్చి కొద్దిగా క్రిస్ప్ అంచులు వచ్చేవరకు ప్రతి వైపు 3–4 minutes వండండి.", "ఎయిర్ ఫ్రైయర్ ప్రత్యామ్నాయం: టిక్కీలకు నెయ్యి/నూనెను తేలికగా పూసి, ఎయిర్ ఫ్రైయర్ బాస్కెట్‌లో 350°F (175°C) వద్ద ఉంచి, మధ్యలో తిప్పుతూ 10–12 minutes ఎయిర్ ఫ్రై చేయండి.", "వడ్డించండి: గది ఉష్ణోగ్రతకు చల్లారనివ్వండి. పుదీనా-పెరుగు డిప్ లేదా మైల్డ్ అవకాడో ప్యూరీతో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:56.545Z"}, {"n": 97, "title": "Zucchini, Ricotta & Sweet Corn Crustless Mini Quiches", "title_te": "జుకీని, రికోటా & స్వీట్ కార్న్ క్రస్ట్‌లెస్ మినీ క్విచ్‌లు", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍲", "image": "https://www.libbysvegetables.com/wp-content/uploads/2017/02/Mini-Corn-Quiches_result-768x747.webp", "prep": "10 minutes", "   const r = RECIPES.find(x=>x.n===n); if(!r) return;

  const img = r.image ? `<img src="${esc(r.image)}" alt="${esc(tTitle(r))}" onerror="this.outerHTML=String.fromCodePoint(...[...r.emoji].map(c=>c.codePointAt(0)))">` : r.emoji;
  document.getElementById('modalContent').innerHTML = `<div class="modal-img">${img}</div><div class="modal-body"><div class="modal-lang"><button class="${lang==='en'?'on':''}" onclick="setLang('en')">English</button><button class="${lang==='te'?'on':''}" onclick="setLang('te')">తెలుగు</button></div><div class="cat">${esc(tCat(r))}</div><h2>${esc(tTitle(r))}</h2><p style="color:var(--ink-soft)">${esc(tDesc(r))}</p><div class="meta"><div class="mm"><b>${esc(r.prep)}</b><span>${u.prep}</span></div><div class="mm"><b>${esc(r.cook)}</b><span>${u.cook}</span></div><div class="mm"><b>${esc(r.yield)}</b><span>${u.yield}</span></div></div><div class="chips">${r.tags.map(t=>`<span class="chip">${esc(tTag(t))}</span>` ).join('')}</div><h3>${u.ing}</h3><ul class="ing-list">${tIng(r).map(i=>`<li>${esc(i)}</li>`).join('')}</ul><h3>${u.steps}</h3><ol class="steps">${tSteps(r).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${tNotes(r)?`<div class="notes"><b>${u.notes} —</b> ${esc(tNotes(r))}</div>`:''}</div>`;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  const cb = document.getElementById('modalClose'); if(cb) cb.focus();
  document.getElementById('overlay').dataset.open = n;
  if(!keepOpen) document.getElementById('overlay').scrollTop = 0;
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); document.body.style.overflow = ''; delete document.getElementById('overlay').dataset.open; if(lastFocused && lastFocused.focus) lastFocused.focus(); }
document.addEventListener('keydown', e=>{ if(e.key!=='Tab' || !document.getElementById('overlay').classList.contains('open')) return; const els=[...document.querySelectorAll('#overlay button, #overlay a, #overlay input, #overlay select')].filter(el=>el.offsetParent!==null); if(!els.length) return; const first=els[0], last=els[els.length-1]; if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); } else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); } });
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
document.getElementById('search').addEventListener('input', e=>{ q=e.target.value; render(); });
document.getElementById('sectionFilter').addEventListener('change', e=>{ section=e.target.value; render(); });
document.getElementById('sortSel').addEventListener('change', e=>{ sort=e.target.value; render(); });
document.getElementById('langEnTop').onclick=()=>setLang('en');
document.getElementById('langTeTop').onclick=()=>setLang('te');
if(window.innerWidth>820) document.getElementById('sidebar').classList.add('open');
render();
</script></body></html>

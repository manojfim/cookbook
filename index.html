n bites", "desc": "Inspired by velvety sous-vide egg bites, blending whole-milk cottage cheese with eggs creates an ultra-tender, melt-in-the-mouth texture that prevents eggs from getting rubbery. Sweet corn and finely minced baby spinach add natural sweetness and vibrant color.", "desc_te": "వెల్వెట్ సూ-వీడ్ ఎగ్ బైట్స్ నుండి ప్రేరణ పొంది, హోల్-మిల్క్ కాటేజ్ చీజ్‌ను గుడ్లతో కలపడం వల్ల గుడ్లు రబ్బరులా కాకుండా అత్యంత మృదువైన, నోటిలో కరిగే ఆకృతి వస్తుంది. స్వీట్ కార్న్ మరియు సన్నగా తరిగిన బేబీ పాలకూర సహజ తీపిని మరియు ప్రకాశవంతమైన రంగును జోడిస్తాయి.", "tags": [], "ing": ["4 large eggs", "1/2 cup whole-milk cottage cheese (good quality, smooth/curd)", "1/3 cup sweet corn kernels (steamed or thawed frozen)", "1/3 cup baby spinach, finely chopped", "1/3 cup mild cheddar cheese or mozzarella, shredded", "1/8 tsp garlic powder", "1/8 tsp onion powder", "Pinch of black pepper"], "ing_te": ["4 large గుడ్లు", "1/2 cup హోల్-మిల్క్ కాటేజ్ చీజ్ (మంచి నాణ్యత, మృదువైన/పెరుగు)", "1/3 cup స్వీట్ కార్న్ గింజలు (ఆవిరిలో ఉడికించినవి లేదా కరిగించిన ఫ్రోజెన్)", "1/3 cup బేబీ పాలకూర, సన్నగా తరిగినది", "1/3 cup mild చెడార్ చీజ్ లేదా మోజరెల్లా, తురిమినది", "1/8 tsp వెల్లుల్లి పొడి", "1/8 tsp ఉల్లిపాయ పొడి", "Pinch of నల్ల మిరియాలు"], "steps": ["Preheat & Prep: Preheat your oven to 350°F (175°C). Grease a 12-cup silicone mini muffin pan generously with avocado oil or butter (silicone pans work best for easy release).", "Blend the Base: In a blender or food processor, combine the eggs, cottage cheese, garlic powder, onion powder, and black pepper. Blend on high for 30–45 seconds until completely smooth, frothy, and creamy.", "Fill the Tins: Divide the chopped spinach and sweet corn evenly among the 12 mini muffin cups.", "Pour & Top: Pour the blended egg mixture over the vegetables in each cup, filling about 3/4 full. Sprinkle shredded cheese on top of each bite.", "Bake: Bake at 350°F (175°C) for 18–20 minutes, or until the egg bites are puffed, set in the center, and lightly golden on top.", "Cool & Serve: Let them rest in the pan for 5 minutes (they will settle slightly), then pop them out. Serve warm."], "steps_te": ["ప్రీహీట్ & సిద్ధం: మీ ఓవెన్‌ను 350°F (175°C) వద్ద ప్రీహీట్ చేయండి. 12-cup సిలికాన్ మినీ మఫిన్ పాన్‌కు అవకాడో నూనె లేదా వెన్నతో బాగా గ్రీజ్ చేయండి (సులభంగా తీయడానికి సిలికాన్ పాన్‌లు ఉత్తమం).", "బేస్ బ్లెండ్ చేయండి: బ్లెండర్ లేదా ఫుడ్ ప్రాసెసర్‌లో గుడ్లు, కాటేజ్ చీజ్, వెల్లుల్లి పొడి, ఉల్లిపాయ పొడి మరియు నల్ల మిరియాలను కలపండి. పూర్తిగా మృదువుగా, నురుగులా, క్రీమీగా అయ్యేవరకు హై స్పీడ్‌లో 30–45 seconds బ్లెండ్ చేయండి.", "టిన్‌లు నింపండి: తరిగిన పాలకూర మరియు స్వీట్ కార్న్‌ను 12 మినీ మఫిన్ కప్పులలో సమానంగా విభజించండి.", "పోసి పైన వేయండి: ప్రతి కప్పులోని కూరగాయలపై బ్లెండ్ చేసిన గుడ్డు మిశ్రమాన్ని పోసి, సుమారు 3/4 వరకు నింపండి. ప్రతి బైట్ పైన తురిమిన చీజ్ చల్లండి.", "బేక్ చేయండి: ఎగ్ బైట్స్ ఉబ్బి, మధ్యలో సెట్ అయి, పైన తేలికగా బంగారు రంగు వచ్చేవరకు 350°F (175°C) వద్ద 18–20 minutes బేక్ చేయండి.", "చల్లార్చి వడ్డించండి: పాన్‌లో 5 minutes ఉంచండి (అవి కొద్దిగా తగ్గుతాయి), తర్వాత బయటకు తీయండి. వెచ్చగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:56.659Z"}, {"n": 19, "title": "Chia Cinnamon Ginger Morning Drink", "title_te": "చియా దాల్చినచెక్క అల్లం ఉదయం పానీయం", "cat": "Adult", "section": "adult", "emoji": "🍿", "image": "https://juicytable.com/wp-content/uploads/2025/04/munil0506_httpss.mj_.runhW3uhra84QY_A_glass_jar_filled_with_cr_4894ab2f-a409-47f5-a6cf-a4a9366f569c_0-1024x771.webp", "prep": "not stated (chia soaked ahead)", "cook": "—", "yield": "1", "desc": "Warm water drink with soaked chia seeds, cinnamon, ginger and cardamom, pitched by the creator as a morning wellness drink. Creator's disclaimer: general wellness only, not a treatment or cure; consult a healthcare provider before dietary changes.", "desc_te": "నానబెట్టిన చియా గింజలు, దాల్చినచెక్క, అల్లం మరియు ఏలకులతో చేసిన గోరువెచ్చని నీటి పానీయం, ఉదయం ఆరోగ్య పానీయంగా సృష్టికర్త సూచించారు. సృష్టికర్త హెచ్చరిక: సాధారణ ఆరోగ్యం కోసం మాత్రమే, చికిత్స లేదా నివారణ కాదు; ఆహారంలో మార్పులు చేసే ముందు ఆరోగ్య సంరక్షణ నిపుణుడిని సంప్రదించండి.", "tags": ["vegetarian", "breakfast", "snack", "quick"], "ing": ["1.5 cups warm water", "1 tbsp soaked chia seeds (soaked in 1/2 cup water)", "1/8 tsp Ceylon cinnamon", "1/8 tsp ginger powder or 1/2 tsp grated ginger", "1/8 tsp cardamom powder", "1/2 tsp lemon juice or 1 tsp apple cider vinegar (optional)"], "ing_te": ["1.5 cups గోరువెచ్చని నీరు", "1 tbsp నానబెట్టిన చియా గింజలు (1/2 cup నీటిలో నానబెట్టినవి)", "1/8 tsp సిలోన్ దాల్చినచెక్క", "1/8 tsp అల్లం పొడి లేదా 1/2 tsp తురిమిన అల్లం", "1/8 tsp ఏలకుల పొడి", "1/2 tsp నిమ్మరసం లేదా 1 tsp ఆపిల్ సైడర్ వెనిగర్ (ఐచ్ఛికం)"], "steps": ["Add the cinnamon, ginger and cardamom to the warm water.", "Add the soaked chia and the lemon juice or vinegar if using.", "Mix well and sip slowly.", "Creator suggests best on an empty stomach or 30 minutes before meals."], "steps_te": ["గోరువెచ్చని నీటిలో దాల్చినచెక్క, అల్లం మరియు ఏలకులు వేయండి.", "నానబెట్టిన చియా మరియు ఉపయోగిస్తుంటే నిమ్మరసం లేదా వెనిగర్ వేయండి.", "బాగా కలిపి నెమ్మదిగా తాగండి.", "ఖాళీ కడుపుతో లేదా భోజనానికి 30 minutes ముందు తీసుకోవడం ఉత్తమమని సృష్టికర్త సూచించారు."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:15.433Z"}, {"n": 131, "title": "Chicken Sherva", "title_te": "చికెన్ షేర్వా", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://www.myspicykitchen.net/wp-content/uploads/2023/06/Chicken-Shorva-1.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "This recipe creates a traditional, thin-style curry (sherva) designed specifically to be soaked into parottas. The result should be roughly 65% liquid to ensure the perfect consistency for dipping and soaking.", "desc_te": "పరోటాల్లో ముంచి తినడానికి ప్రత్యేకంగా తయారుచేసే సాంప్రదాయకమైన, పలుచని కూర (షేర్వా) ఇది. ముంచడానికి, నానబెట్టడానికి సరైన స్థిరత్వం కోసం దీనిలో సుమారు 65% ద్రవం ఉండాలి.", "tags": [], "ing": ["Category", "Items", "Main", "1 kg chicken (cut into small pieces)", "Vegetables", "4 tomatoes (2 for paste, 2 chopped), 2 onions (chopped), 4 green chilies (slit), handful of fresh mint, handful of fresh coriander, 2 sprigs of curry leaves", "Paste Base", "100g dry coconut, 6 tbsp white sesame seeds", "Dry Masala", "3 tbsp coriander seeds, 1 tbsp fennel seeds, 1 tbsp black pepper, 6 green cardamom, 6 cloves, 2 inches cinnamon stick, 2 black cardamom", "Aromatics/Other", "2 tbsp ginger-garlic paste, 1 tbsp salt, 1 tbsp turmeric, 2 tbsp chili powder"], "ing_te": ["వర్గం", "వస్తువులు", "ప్రధానం", "1 kg చికెన్ (చిన్న ముక్కలుగా కోసినది)", "కూరగాయలు", "4 టమోటాలు (2 పేస్ట్ కోసం, 2 తరిగినవి), 2 ఉల్లిపాయలు (తరిగినవి), 4 పచ్చిమిర్చి (చీల్చినవి), గుప్పెడు తాజా పుదీనా, గుప్పెడు తాజా కొత్తిమీర, 2 రెమ్మల కరివేపాకు", "పేస్ట్ బేస్", "100g ఎండు కొబ్బరి, 6 tbsp తెల్ల నువ్వులు", "ఎండు మసాలా", "3 tbsp ధనియాలు, 1 tbsp సోంపు, 1 tbsp నల్ల మిరియాలు, 6 పచ్చ ఏలకులు, 6 లవంగాలు, 2 inches దాల్చిన చెక్క, 2 నల్ల ఏలకులు", "సువాసనలు/ఇతరాలు", "2 tbsp అల్లం-వెల్లుల్లి పేస్ట్, 1 tbsp ఉప్పు, 1 tbsp పసుపు, 2 tbsp కారం పొడి"], "steps": ["Prepare the Paste: Blend the dry coconut, white sesame seeds, and 2 tomatoes into a smooth paste.", "Prepare the Masala Powder: Lightly roast the dry masala ingredients (coriander seeds, fennel, pepper, cardamoms, cloves, cinnamon) until fragrant. Grind them into a fine powder.", "Sauté: Heat oil in a pan. Sauté the onions until deeply browned. Stir in the ginger-garlic paste for 2 minutes, then add the chopped tomatoes and green chilies until soft.", "Cook Chicken: Add the chicken, salt, and turmeric. Mix well, cover, and cook on low heat for 10–12 minutes until the chicken releases its own juices.", "Simmer: Stir in the ground coconut-sesame paste, chili powder, and 2 tablespoons of the freshly prepared masala powder. Cook for 2–3 minutes.", "Add Liquid: Pour in 1.5 liters of water. Cover and boil for 10 minutes.", "Garnish & Serve: Add the fresh mint, coriander, and curry leaves. Boil uncovered for another 5–6 minutes."], "steps_te": ["పేస్ట్ తయారు చేయండి: ఎండు కొబ్బరి, తెల్ల నువ్వులు, 2 టమోటాలను మెత్తని పేస్ట్‌గా రుబ్బండి.", "మసాలా పొడి తయారు చేయండి: ఎండు మసాలా పదార్థాలను (ధనియాలు, సోంపు, మిరియాలు, ఏలకులు, లవంగాలు, దాల్చిన చెక్క) సువాసన వచ్చేవరకు తేలికగా వేయించండి. వాటిని మెత్తని పొడిగా రుబ్బండి.", "వేయించండి: బాణలిలో నూనె వేడి చేయండి. ఉల్లిపాయలు బాగా గోధుమ రంగు వచ్చేవరకు వేయించండి. అల్లం-వెల్లుల్లి పేస్ట్ వేసి 2 minutes కలపండి, తర్వాత తరిగిన టమోటాలు, పచ్చిమిర్చి మెత్తబడేవరకు వేయండి.", "చికెన్ ఉడికించండి: చికెన్, ఉప్పు, పసుపు వేయండి. బాగా కలపి, మూత పెట్టి, చికెన్ సొంత రసం విడిచేవరకు తక్కువ మంటపై 10–12 minutes ఉడికించండి.", "ఉడకబెట్టండి: రుబ్బిన కొబ్బరి-నువ్వుల పేస్ట్, కారం పొడి, తాజాగా తయారుచేసిన మసాలా పొడిలో 2 tablespoons వేసి కలపండి. 2–3 minutes ఉడికించండి.", "ద్రవం వేయండి: 1.5 liters నీరు పోయండి. మూత పెట్టి 10 minutes మరిగించండి.", "అలంకరించి వడ్డించండి: తాజా పుదీనా, కొత్తిమీర, కరివేపాకు వేయండి. మూత లేకుండా మరో 5–6 minutes మరిగించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.116Z"}, {"n": 33, "title": "Chicken, Mushroom and Broccoli Stir Fry", "title_te": "చికెన్, మష్రూమ్ మరియు బ్రోకలీ స్టిర్ ఫ్రై", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://www.theseasonedmom.com/wp-content/uploads/2021/03/Chicken-and-Broccoli-Stir-Fry-Horizontal-6.jpg", "prep": "10-15 minutes (marinade)", "cook": "under 20 minutes", "yield": "2 (about 220 g each)", "desc": "Under-20-minute sticky-spicy soy-honey-chilli-crisp stir fry with velveted chicken; 2 servings, about 240 kcal and 28g protein each.", "desc_te": "20 నిమిషాలలోపు తయారయ్యే జిగురుగా, కారంగా ఉండే సోయా-తేనె-చిల్లీ క్రిస్ప్ స్టిర్ ఫ్రై, మెత్తగా మెరినేట్ చేసిన చికెన్‌తో; 2 సర్వింగ్‌లు, ఒక్కోదానికి సుమారు 240 kcal మరియు 28g ప్రోటీన్.", "tags": ["non-vegetarian", "dinner", "quick"], "ing": ["1 large chicken breast (about 250 g), sliced into strips", "1 tbsp arrowroot or corn flour", "1/4 tsp baking soda", "1 tsp soy sauce", "Salt to taste", "Pepper to taste", "1 tsp neutral oil (light olive oil)", "1 tsp oil (for stir fry)", "1.5 tbsp crushed ginger and garlic (combined)", "1/4 cup chopped onion or spring onion whites", "1 cup sliced mushrooms", "1 cup broccoli florets", "Salt to taste", "1.5 tsp soy sauce", "1 tsp chilli crisp", "1 tsp honey", "2 tbsp spring onion greens, to finish"], "ing_te": ["1 పెద్ద చికెన్ బ్రెస్ట్ (సుమారు 250 g), సన్నని ముక్కలుగా కోసినది", "1 tbsp ఆరోరూట్ లేదా కార్న్ ఫ్లోర్", "1/4 tsp బేకింగ్ సోడా", "1 tsp సోయా సాస్", "రుచికి సరిపడా ఉప్పు", "రుచికి సరిపడా మిరియాలు", "1 tsp న్యూట్రల్ ఆయిల్ (లైట్ ఆలివ్ ఆయిల్)", "1 tsp నూనె (స్టిర్ ఫ్రై కోసం)", "1.5 tbsp నలిపిన అల్లం మరియు వెల్లుల్లి (కలిపి)", "1/4 cup తరిగిన ఉల్లిపాయ లేదా స్ప్రింగ్ ఆనియన్ తెల్ల భాగాలు", "1 cup సన్నగా కోసిన మష్రూమ్స్", "1 cup బ్రోకలీ పువ్వులు", "రుచికి సరిపడా ఉప్పు", "1.5 tsp సోయా సాస్", "1 tsp చిల్లీ క్రిస్ప్", "1 tsp తేనె", "2 tbsp స్ప్రింగ్ ఆనియన్ ఆకులు, చివరగా వేయడానికి"], "steps": ["Marinate the chicken strips with arrowroot, baking soda, soy sauce, salt and pepper; rest 10-15 minutes.", "Pan-fry on high heat in a little oil until golden brown, max 2 minutes on each side; set aside.", "In the same pan add a little oil and saute the crushed ginger and garlic, then the onion or spring onion whites.", "Add the mushrooms, broccoli and salt; stir-fry on high flame until the broccoli is crisp-tender.", "Add the soy sauce and toss.", "Return the chicken to the pan with the chilli crisp and honey; toss until glossy, 1-2 more minutes.", "Finish with spring onion greens and serve hot."], "steps_te": ["చికెన్ ముక్కలను ఆరోరూట్, బేకింగ్ సోడా, సోయా సాస్, ఉప్పు మరియు మిరియాలతో మెరినేట్ చేసి 10-15 నిమిషాలు ఉంచండి.", "కొద్దిగా నూనెలో అధిక మంటపై బంగారు రంగు వచ్చే వరకు వేయించండి, ప్రతి వైపు గరిష్ఠంగా 2 నిమిషాలు; పక్కన పెట్టండి.", "అదే పాన్‌లో కొద్దిగా నూనె వేసి నలిపిన అల్లం మరియు వెల్లుల్లిని వేయించి, తర్వాత ఉల్లిపాయ లేదా స్ప్రింగ్ ఆనియన్ తెల్ల భాగాలు వేయండి.", "మష్రూమ్స్, బ్రోకలీ మరియు ఉప్పు వేసి, బ్రోకలీ కరకరలాడుతూ మెత్తబడే వరకు అధిక మంటపై స్టిర్ ఫ్రై చేయండి.", "సోయా సాస్ వేసి కలపండి.", "చికెన్‌ను తిరిగి పాన్‌లో వేసి చిల్లీ క్రిస్ప్ మరియు తేనెతో కలిపి, మెరుస్తూ వచ్చే వరకు మరో 1-2 నిమిషాలు కలపండి.", "స్ప్రింగ్ ఆనియన్ ఆకులతో అలంకరించి వేడిగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:40.962Z"}, {"n": 149, "title": "Chickpeas Masala", "title_te": "శనగల మసాలా", "cat": "Adult", "section": "adult", "emoji": "🍲", "image": "https://healthpromotion.uga.edu/wp-content/uploads/sites/20/2023/04/chana-masala-sm-768x768.jpg", "prep": "not stated", "cook": "not stated", "yield": "not stated", "desc": "High-protein chickpea and potato curry in a thick yogurt-blended masala, finished with kasuri methi and fresh coriander. About 27g protein and 500 calories per serving as shared by the creator.", "desc_te": "పెరుగు కలిపి మెత్తగా రుబ్బిన మసాలాలో చేసిన అధిక ప్రోటీన్ కలిగిన శనగ, బంగాళాదుంప కూర, చివరగా కసూరి మేతి, తాజా కొత్తిమీరతో అలంకరించబడింది. సృష్టికర్త చెప్పిన ప్రకారం ఒక్కో సర్వింగ్‌కు సుమారు 27g ప్రోటీన్, 500 కేలరీలు.", "tags": ["vegetarian", "contains dairy", "dinner", "high-protein"], "ing": ["100g raw chickpeas", "2 small potatoes", "10ml oil", "50g yogurt", "2 bay leaves", "Fresh ginger, chopped, to taste", "2 green chillies, chopped", "2 green chillies, slit", "2 onions, chopped", "1/2 tsp turmeric powder", "1 tsp Kashmiri red chilli powder", "1 tsp chana masala", "1/2 tsp coriander powder", "Kasuri methi, a pinch", "Coriander leaves, for garnish", "Salt, to taste", "Water, as needed"], "ing_te": ["100g పచ్చి శనగలు", "2 చిన్న బంగాళాదుంపలు", "10ml నూనె", "50g పెరుగు", "2 బిర్యానీ ఆకులు", "తాజా అల్లం, తరిగినది, రుచికి తగినంత", "2 పచ్చి మిరపకాయలు, తరిగినవి", "2 పచ్చి మిరపకాయలు, చీల్చినవి", "2 ఉల్లిపాయలు, తరిగినవి", "1/2 tsp పసుపు పొడి", "1 tsp కాశ్మీరీ ఎర్ర మిరప పొడి", "1 tsp శనగ మసాలా", "1/2 tsp ధనియాల పొడి", "కసూరి మేతి, చిటికెడు", "కొత్తిమీర ఆకులు, అలంకరణ కోసం", "ఉప్పు, రుచికి తగినంత", "నీరు, అవసరమైనంత"], "steps": ["Pressure cook the chickpeas, potatoes and bay leaves with water and salt until tender.", "Blend one cooked potato with some of the cooked chickpeas and the yogurt into a smooth paste and set aside.", "Heat the oil in a pan and saute the ginger, chopped green chillies and onion on high heat for about 4 minutes.", "Lower the heat, add the turmeric, Kashmiri red chilli powder, chana masala and coriander powder, and saute for about a minute.", "Stir in the blended chickpea-potato-yogurt paste and cook on high heat for about 3 minutes.", "Add the remaining cooked chickpeas and potatoes with some water and salt, and cook on high heat for about 3 minutes.", "Check the salt, turn off the heat, and finish with kasuri methi, coriander leaves, slit green chillies and a ginger garnish. Serve hot."], "steps_te": ["శనగలు, బంగాళాదుంపలు, బిర్యానీ ఆకులను నీరు, ఉప్పుతో మెత్తబడే వరకు ప్రెషర్ కుక్ చేయండి.", "ఉడికిన ఒక బంగాళాదుంపను, కొన్ని ఉడికిన శనగలను, పెరుగును కలిపి మెత్తని పేస్ట్‌లా రుబ్బి పక్కన ఉంచండి.", "ఒక పాన్‌లో నూనె వేడి చేసి, అల్లం, తరిగిన పచ్చి మిరపకాయలు, ఉల్లిపాయను అధిక మంటపై సుమారు 4 నిమిషాలు వేయించండి.", "మంట తగ్గించి, పసుపు, కాశ్మీరీ ఎర్ర మిరప పొడి, శనగ మసాలా, ధనియాల పొడి వేసి సుమారు ఒక నిమిషం వేయించండి.", "రుబ్బిన శనగ-బంగాళాదుంప-పెరుగు పేస్ట్‌ను కలిపి అధిక మంటపై సుమారు 3 నిమిషాలు ఉడికించండి.", "మిగిలిన ఉడికిన శనగలు, బంగాళాదుంపలను కొంత నీరు, ఉప్పుతో కలిపి అధిక మంటపై సుమారు 3 నిమిషాలు ఉడికించండి.", "ఉప్పు సరిచూసి, మంట ఆపి, కసూరి మేతి, కొత్తిమీర ఆకులు, చీల్చిన పచ్చి మిరపకాయలు, అల్లం అలంకరణతో ముగించండి. వేడిగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-24T15:50:13.686Z"}, {"n": 47, "title": "Chocolate-like Date Chana Bites", "title_te": "చాక్లెట్ లాంటి ఖర్జూర శనగ బైట్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍿", "image": "https://www.flavourstreat.com/wp-content/uploads/2021/02/chocolate-energy-balls-04.jpg", "prep": "30 minutes (date soak)", "cook": "15-20 minutes (chill)", "yield": "—", "desc": "No-sugar chocolate-style bites from dates, roasted chana and cocoa, pitched as an occasional homemade treat for kids who keep asking for chocolate.", "desc_te": "ఖర్జూరాలు, వేయించిన శనగలు మరియు కోకోతో చేసిన, చక్కెర లేని చాక్లెట్ తరహా బైట్స్, చాక్లెట్ అని పదే పదే అడిగే పిల్లల కోసం అప్పుడప్పుడు ఇంట్లో చేసే ట్రీట్‌గా సూచించబడ్డాయి.", "tags": ["vegetarian", "snack"], "ing": ["7 dates, soaked in hot water 30 minutes", "1/2 cup roasted chana (roasted Bengal gram)", "1 tbsp cocoa powder", "1 tbsp cocoa powder (for coating, optional)", "1 tsp honey (for coating, optional)"], "ing_te": ["7 ఖర్జూరాలు, వేడి నీటిలో 30 minutes నానబెట్టినవి", "1/2 cup వేయించిన శనగలు (వేయించిన బెంగాల్ గ్రామ్)", "1 tbsp కోకో పౌడర్", "1 tbsp కోకో పౌడర్ (పూత కోసం, ఐచ్ఛికం)", "1 tsp తేనె (పూత కోసం, ఐచ్ఛికం)"], "steps": ["Soak the dates in hot water 30 minutes and drain.", "Blend the soaked dates, roasted chana and 1 tbsp cocoa powder until smooth.", "Roll into small balls or press into a silicone mold of choice.", "Mix 1 tbsp cocoa powder with honey for a simple coating and coat each bite, or dust with plain cocoa powder.", "Refrigerate 15-20 minutes before serving (the video shows freezing 10 minutes instead).", "Store in an airtight container in the refrigerator 5-7 days."], "steps_te": ["ఖర్జూరాలను వేడి నీటిలో 30 minutes నానబెట్టి, నీరు వడకట్టండి.", "నానబెట్టిన ఖర్జూరాలు, వేయించిన శనగలు మరియు 1 tbsp కోకో పౌడర్‌ను మెత్తగా అయ్యే వరకు బ్లెండ్ చేయండి.", "చిన్న ఉండలుగా చుట్టండి లేదా నచ్చిన సిలికాన్ మోల్డ్‌లో ఒత్తండి.", "సాధారణ పూత కోసం 1 tbsp కోకో పౌడర్‌ను తేనెతో కలిపి ప్రతి బైట్‌కు పూయండి, లేదా సాదా కోకో పౌడర్ చల్లండి.", "వడ్డించే ముందు 15-20 minutes ఫ్రిజ్‌లో ఉంచండి (వీడియోలో బదులుగా 10 minutes ఫ్రీజ్ చేయడం చూపించారు).", "గాలి చొరబడని డబ్బాలో ఫ్రిజ్‌లో 5-7 days ఉంచండి."], "notes": "Small ball or molded-bite format; honey coating is optional and can be skipped.", "notes_te": "చిన్న ఉండ లేదా మోల్డ్ చేసిన బైట్ రూపం; తేనె పూత ఐచ్ఛికం, వదిలేయవచ్చు.", "added_at": "2026-10-22T16:04:16.200Z"}, {"n": 45, "title": "Chunky Monkey Yogurt Bites", "title_te": "చంకీ మంకీ పెరుగు బైట్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍿", "image": "https://theplantbasedschool.com/wp-content/uploads/2026/06/Chunky-m ేదా 180C వద్ద 35 minutes ఓవెన్‌లో కాల్చండి.", "మధ్య భాగం ఉడకకపోతే, దాన్ని తిప్పి, కింద బేకింగ్ పేపర్ లేకుండా మరో 3-5 minutes ఉడికించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:02:50.582Z"}, {"n": 59, "title": "Cottage Cheese Chapati Rolls", "title_te": "కాటేజ్ చీజ్ చపాతీ రోల్స్", "cat": "Adult", "section": "adult", "emoji": "🧀", "image": "https://www.juliesapron.com/wp-content/uploads/2024/01/cottage-cheese-wrap-7-720x1080.webp", "prep": "—", "cook": "—", "yield": "—", "desc": "Enjoy two delicious, high-protein ways to turn standard chapatis and cottage cheese into a satisfying meal: a warm, spiced \"Tikka-Style\" roll and a quick, refreshing cold wrap.", "desc_te": "సాధారణ చపాతీలు మరియు కాటేజ్ చీజ్‌ను సంతృప్తికరమైన భోజనంగా మార్చే రెండు రుచికరమైన, అధిక ప్రోటీన్ పద్ధతులను ఆస్వాదించండి: వెచ్చని, మసాలా \"టిక్కా-స్టైల్\" రోల్ మరియు త్వరిత, రిఫ్రెషింగ్ కోల్డ్ ర్యాప్.", "tags": [], "ing": ["Chapatis: 2 fresh or warmed chapatis", "Cottage Cheese: 1 cup (preferably strained slightly if very watery)", "Vegetables: 1/4 cup sliced onions and 1/4 cup sliced bell peppers", "Oil/Butter: 1 teaspoon", "Spices: A pinch of turmeric, 1/4 teaspoon garam masala, 1/4 teaspoon chili powder, and salt to taste", "Finishing touches: A squeeze of fresh lemon juice, and optional mint chutney or green chutney"], "ing_te": ["చపాతీలు: 2 తాజా లేదా వేడి చేసిన చపాతీలు", "కాటేజ్ చీజ్: 1 cup (చాలా నీరుగా ఉంటే కొంచెం వడకట్టడం మంచిది)", "కూరగాయలు: 1/4 cup తరిగిన ఉల్లిపాయలు మరియు 1/4 cup తరిగిన బెల్ పెప్పర్లు", "నూనె/వెన్న: 1 teaspoon", "మసాలాలు: చిటికెడు పసుపు, 1/4 teaspoon గరం మసాలా, 1/4 teaspoon మిరప పొడి మరియు రుచికి తగినంత ఉప్పు", "చివరి మెరుగులు: తాజా నిమ్మరసం పిండడం, మరియు ఐచ్ఛిక పుదీనా చట్నీ లేదా గ్రీన్ చట్నీ"], "steps": ["Sauté the Veggies: Heat the oil or butter in a pan over medium heat. Sauté the sliced onions and bell peppers for about 2 minutes so they soften slightly but still retain a nice crunch.", "Season and Thicken: Turn the heat down to low. Add the cottage cheese directly to the pan and immediately sprinkle in the turmeric, garam masala, chili powder, and salt.", "Cook Briefly: Stir continuously on low heat for just 1 to 2 minutes. This warms the cheese through and allows the excess moisture to evaporate. Do not overcook, or the cottage cheese will liquefy.", "Assemble and Roll: Warm your chapatis on a tawa or skillet. Spread a thin layer of chutney down the center if desired, then spoon the warm spiced cottage cheese and veggie mixture on top. Add a squeeze of lemon juice, roll tightly, and enjoy immediately.", "Option 2: The Quick Cold Chapati Wrap A zero-cooking, refreshing alternative that uses crisp raw vegetables and tangy street-food spices for a fast, high-protein lunch. Ingredients", "Chapatis: 2 chapatis (warmed and allowed to cool slightly)", "Cottage Cheese: 1 cup", "Moisture Barrier: Fresh spinach leaves or crisp lettuce", "Crunchy Toppings: Finely chopped raw onions, cucumbers, and fresh cilantro", "Seasoning: 1/2 teaspoon chaat masala, a pinch of roasted cumin powder (jeera), and black pepper Instructions", "Lay the Shield: Place your chapatis flat on a clean surface. Lay down a layer of spinach or lettuce leaves first. This acts as a dry barrier to keep the chapati from getting soggy.", "Add Cottage Cheese & Season: Spoon the cottage cheese evenly over the leafy greens. Season generously with the chaat masala, roasted cumin powder, and black pepper.", "Top with Crunch: Scatter the finely chopped raw onions, cucumbers, and fresh cilantro over the seasoned cottage cheese.", "Roll Tightly: Roll the chapati up tightly. If taking it on the go, wrap the bottom half in parchment paper or foil to secure any loose filling. Eat immediately! Chef's Pro-Tip Because cottage cheese has a high moisture content, spoon the amount you want to use into a fine-mesh strainer or over a paper towel for 5 minutes before cooking or assembling. Removing the excess whey makes rolling much easier and prevents leaks!"], "steps_te": ["కూరగాయలు వేయించండి: పాన్‌లో మీడియం వేడిపై నూనె లేదా వెన్న వేడి చేయండి. తరిగిన ఉల్లిపాయలు మరియు బెల్ పెప్పర్లను సుమారు 2 minutes పాటు వేయించండి, అవి కొంచెం మెత్తబడి, మంచి కరకరలాడే ఆకృతి ఉండేలా చూడండి.", "రుచి చేసి చిక్కగా చేయండి: వేడిని తక్కువకు తగ్గించండి. కాటేజ్ చీజ్‌ను నేరుగా పాన్‌లో వేసి వెంటనే పసుపు, గరం మసాలా, మిరప పొడి మరియు ఉప్పు చల్లండి.", "కొద్దిసేపు వండండి: తక్కువ వేడిపై కేవలం 1 to 2 minutes పాటు నిరంతరం కలపండి. ఇది చీజ్‌ను వేడి చేసి అదనపు తేమ ఆవిరయ్యేలా చేస్తుంది. ఎక్కువగా వండకండి, లేకపోతే కాటేజ్ చీజ్ ద్రవంగా మారుతుంది.", "అసెంబుల్ చేసి చుట్టండి: మీ చపాతీలను తవా లేదా పాన్‌పై వేడి చేయండి. కావాలంటే మధ్యలో చట్నీ పలుచని పొరగా రాయండి, తర్వాత వెచ్చని మసాలా కాటేజ్ చీజ్ మరియు కూరగాయల మిశ్రమాన్ని పైన వేయండి. నిమ్మరసం పిండి, గట్టిగా చుట్టి వెంటనే ఆస్వాదించండి.", "ఎంపిక 2: త్వరిత కోల్డ్ చపాతీ ర్యాప్ — వేగవంతమైన, అధిక ప్రోటీన్ భోజనం కోసం కరకరలాడే పచ్చి కూరగాయలు మరియు ఘాటైన స్ట్రీట్-ఫుడ్ మసాలాలను ఉపయోగించే వండని, రిఫ్రెషింగ్ ప్రత్యామ్నాయం. పదార్థాలు", "చపాతీలు: 2 చపాతీలు (వేడి చేసి కొంచెం చల్లారనిచ్చినవి)", "కాటేజ్ చీజ్: 1 cup", "తేమ అడ్డంకి: తాజా పాలకూర ఆకులు లేదా కరకరలాడే లెట్యూస్", "కరకరలాడే టాపింగ్స్: సన్నగా తరిగిన పచ్చి ఉల్లిపాయలు, దోసకాయలు మరియు తాజా కొత్తిమీర", "రుచి: 1/2 teaspoon చాట్ మసాలా, చిటికెడు వేయించిన జీలకర్ర పొడి (జీరా) మరియు నల్ల మిరియాలు. సూచనలు", "అడ్డంకి వేయండి: మీ చపాతీలను శుభ్రమైన ఉపరితలంపై చదునుగా ఉంచండి. ముందుగా పాలకూర లేదా లెట్యూస్ ఆకుల పొర వేయండి. ఇది చపాతీ తడిసిపోకుండా పొడి అడ్డంకిగా పనిచేస్తుంది.", "కాటేజ్ చీజ్ వేసి రుచి చేయండి: ఆకుకూరలపై కాటేజ్ చీజ్‌ను సమానంగా వేయండి. చాట్ మసాలా, వేయించిన జీలకర్ర పొడి మరియు నల్ల మిరియాలతో గట్టిగా రుచి చేయండి.", "కరకరతో పైన వేయండి: రుచి చేసిన కాటేజ్ చీజ్‌పై సన్నగా తరిగిన పచ్చి ఉల్లిపాయలు, దోసకాయలు మరియు తాజా కొత్తిమీర చల్లండి.", "గట్టిగా చుట్టండి: చపాతీని గట్టిగా చుట్టండి. బయటకు తీసుకెళ్తుంటే, వదులుగా ఉన్న ఫిల్లింగ్‌ను భద్రపరచడానికి దిగువ సగాన్ని పార్చ్మెంట్ పేపర్ లేదా ఫాయిల్‌లో చుట్టండి. వెంటనే తినండి! చెఫ్ చిట్కా: కాటేజ్ చీజ్‌లో తేమ ఎక్కువగా ఉంటుంది కాబట్టి, వండడానికి లేదా అసెంబుల్ చేయడానికి ముందు వాడాలనుకున్న మొత్తాన్ని సన్నని మెష్ స్ట్రైనర్‌లో లేదా పేపర్ టవల్‌పై 5 minutes పాటు ఉంచండి. అదనపు పాలవిరుగుడు తొలగించడం వల్ల చుట్టడం చాలా సులభం అవుతుంది మరియు లీక్‌లు నివారించబడతాయి!"], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:25.735Z"}, {"n": 36, "title": "Cottage Cheese Dip (Bougie Dip)", "title_te": "కాటేజ్ చీజ్ డిప్ (బూజీ డిప్)", "cat": "Adult", "section": "adult", "emoji": "🧀", "image": "https://katefork.com/wp-content/uploads/2026/05/cottage-cheese-dip-768x960.webp", "prep": "5 minutes", "cook": "none", "yield": "not stated (full batch)", "desc": "Five-minute creamy high-protein cottage cheese dip with cilantro, jalapeno and lime; 28g protein in the full batch, no mayo or protein powder.", "desc_te": "ఐదు నిమిషాల్లో తయారయ్యే క్రీమీ, అధిక ప్రోటీన్ గల కాటేజ్ చీజ్ డిప్, కొత్తిమీర, జలపెనో మరియు నిమ్మతో; మొత్తం బ్యాచ్‌లో 28g ప్రోటీన్, మయోనైస్ లేదా ప్రోటీన్ పౌడర్ లేకుండా.", "tags": ["vegetarian", "contains dairy", "snack", "quick"], "ing": ["1 cup cottage cheese", "Handful of cilantro", "1 jalapeno", "Green garlic powder", "Salt", "Squeeze of fresh lime", "Finely chopped onion, to mix in", "Bell pepper, finely chopped, to mix in"], "ing_te": ["1 cup కాటేజ్ చీజ్", "గుప్పెడు కొత్తిమీర", "1 జలపెనో", "గ్రీన్ గార్లిక్ పౌడర్", "ఉప్పు", "తాజా నిమ్మరసం పిండినది", "సన్నగా తరిగిన ఉల్లిపాయ, కలపడానికి", "బెల్ పెప్పర్, సన్నగా తరిగినది, కలపడానికి"], "steps": ["Blend the cottage cheese, cilantro, jalapeno, green garlic powder, salt and lime until smooth and creamy.", "When ready to eat, mix in the finely chopped onion and bell pepper for crunch.", "Serve spread on sourdough toast, as a veggie dip, or in wraps and sandwiches.", "Meal-prep tip: keep the blended dip refrigerated in an airtight container and add the onion and bell pepper fresh when serving."], "steps_te": ["కాటేజ్ చీజ్, కొత్తిమీర, జలపెనో, గ్రీన్ గార్లిక్ పౌడర్, ఉప్పు మరియు నిమ్మరసాన్ని మృదువుగా, క్రీమీగా అయ్యే వరకు బ్లెండ్ చేయండి.", "తినడానికి సిద్ధంగా ఉన్నప్పుడు, కరకర కోసం సన్నగా తరిగిన ఉల్లిపాయ మరియు బెల్ పెప్పర్ కలపండి.", "సోర్‌డో టోస్ట్‌పై రాసి, వెజిటబుల్ డిప్‌గా, లేదా ర్యాప్స్ మరియు శాండ్‌విచ్‌లలో వడ్డించండి.", "మీల్-ప్రెప్ చిట్కా: బ్లెండ్ చేసిన డిప్‌ను గాలి చొరబడని డబ్బాలో ఫ్రిజ్‌లో ఉంచండి మరియు వడ్డించేటప్పుడు ఉల్లిపాయ మరియు బెల్ పెప్పర్‌ను తాజాగా వేయండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:56.068Z"}, {"n": 1, "title": "Cottage Cheese Everything Bagels", "title_te": "కాటేజ్ చీజ్ ఎవ్రీథింగ్ బేగెల్స్", "cat": "Adult", "section": "adult", "emoji": "🥯", "image": "https://recipesbylina.com/wp-content/uploads/2025/03/Image_3-119.webp", "prep": "not stated", "cook": "20-25 minutes at 375F", "yield": "4 bagels", "desc": "The easiest, fluffiest cottage cheese everything bagels, no yeast. About 174 calories and 10g protein each.", "desc_te": "అత్యంత సులభమైన, అత్యంత మెత్తని కాటేజ్ చీజ్ ఎవ్రీథింగ్ బేగెల్స్, ఈస్ట్ లేకుండా. ఒక్కోదానిలో సుమారు 174 calories మరియు 10g protein ఉంటాయి.", "tags": ["vegetarian", "contains dairy", "breakfast", "snack"], "ing": ["1 cup (240g) blended cottage cheese", "1 cup (150g) all-purpose flour", "1 tsp baking powder", "1/2 tsp salt", "1 egg, whisked (for egg wash)", "everything but the bagel seasoning"], "ing_te": ["1 cup (240g) బ్లెండ్ చేసిన కాటేజ్ చీజ్", "1 cup (150g) మైదా పిండి", "1 tsp బేకింగ్ పౌడర్", "1/2 tsp ఉప్పు", "1 గుడ్డు, గిలకొట్టినది (egg wash కోసం)", "everything but the bagel seasoning"], "steps": ["Mix blended cottage cheese, flour, baking powder, and salt in a bowl until a thick dough forms.", "Flour surface and cut dough into 4 equal parts.", "Shape into bagels and lay on a parchment-lined baking sheet.", "Coat with egg wash and top with everything but the bagel seasoning.", "Bake in the oven at 375F for 20-25 minutes, and enjoy!"], "steps_te": ["బ్లెండ్ చేసిన కాటేజ్ చీజ్, మైదా, బేకింగ్ పౌడర్, ఉప్పును ఒక గిన్నెలో మందపాటి పిండి అయ్యేవరకు కలపండి.", "పిండి పరచిన ఉపరితలంపై పిండిని 4 సమాన భాగాలుగా కత్తిరించండి.", "బేగెల్స్ ఆకారంలో చేసి పార్చ్మెంట్ పరచిన బేకింగ్ షీట్‌పై ఉంచండి.", "egg wash పూసి పైన everything bu

వరకు సుమారు 5 minutes ఉడికించండి.", "వెంటనే వడ్డించండి లేదా ఫ్రిజ్‌లో ఉంచండి లేదా తర్వాత కోసం ఫ్రీజ్ చేయండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:02:50.504Z"}, {"n": 57, "title": "Creamy Avocado Ice Cream", "title_te": "క్రీమీ అవకాడో ఐస్‌క్రీమ్", "cat": "Adult", "section": "adult", "emoji": "🥑", "image": "https://www.recipesloop.com/wp-content/uploads/2025/05/avocado-ice-cream-768x768.webp", "prep": "—", "cook": "—", "yield": "4–6", "desc": "No Heavy Cream | No Refined Sugar | Kids-Friendly | Serves 4–6", "desc_te": "భారీ క్రీమ్ లేదు | శుద్ధి చేసిన చక్కెర లేదు | పిల్లలకు అనుకూలం | 4–6 మందికి సరిపోతుంది", "tags": [], "ing": ["Nutrient-Dense Base", "3/4 cup makhana (fox nuts)", "1/3 cup almonds, soaked and peeled", "1/3 cup cashews, soaked", "2 tablespoons pumpkin seeds", "1 1/2 cups hot dairy milk (essential for softening the base ingredients)", "The Flavor Core", "2 large ripe avocados, flesh scooped out", "1/3 cup honey (adjust to taste)", "1 teaspoon cardamom powder", "1 teaspoon vanilla essence", "Optional Add-ins & Garnishes", "Chocolate chips (folded in before freezing)", "Fresh banana slices", "Finely chopped nuts"], "ing_te": ["పోషకాలు అధికంగా ఉన్న బేస్", "3/4 cup మఖానా (ఫాక్స్ నట్స్)", "1/3 cup బాదం, నానబెట్టి పొట్టు తీసినవి", "1/3 cup జీడిపప్పు, నానబెట్టినవి", "2 tablespoons గుమ్మడి గింజలు", "1 1/2 cups వేడి డెయిరీ పాలు (బేస్ పదార్థాలను మెత్తగా చేయడానికి అవసరం)", "రుచి కేంద్రం", "2 పెద్ద పండిన అవకాడోలు, గుజ్జు తీసినవి", "1/3 cup తేనె (రుచికి తగ్గట్టు సర్దండి)", "1 teaspoon యాలకుల పొడి", "1 teaspoon వెనిల్లా ఎసెన్స్", "ఐచ్ఛిక అదనపు పదార్థాలు & గార్నిష్‌లు", "చాక్లెట్ చిప్స్ (ఫ్రీజ్ చేయడానికి ముందు కలపాలి)", "తాజా అరటి ముక్కలు", "సన్నగా తరిగిన గింజలు"], "steps": ["Hydrate the Creamy Base In a medium heat-proof bowl, combine the makhana, peeled almonds, cashews, and pumpkin seeds. Pour the 1 1/2 cups of hot milk directly over the mixture. Let it sit undisturbed for 25 to 30 minutes until all components are softened.", "Blend to a Velvet Texture Transfer the entirety of the soaked nut, seed, and milk mixture into a high-speed blender. Add the fresh scooped avocado flesh, honey, cardamom powder, and vanilla essence. Blend on high until completely smooth, uniform, and velvety.", "Chocolate Variation: If you prefer a chocolate variation, blend in a tablespoon of unsweetened cocoa powder during this step and fold in chocolate chips right before pouring.", "Initial Freeze Pour the smooth green mixture into a shallow, freezer-safe container. To completely prevent ice crystals from forming on top, press a layer of cling wrap directly onto the liquid surface. Cover with a lid and freeze for 1.5 to 2 hours.", "Churn for Smoothness Remove the container from the freezer. Use a sturdy spoon or a whisk to thoroughly mix and mash the semi-frozen ice cream. This breaks up any early crystallization, making the final result much softer. Return the cling wrap to the surface and freeze for another 3 to 4 hours until fully set.", "Temper and Serve Because this recipe contains no heavy cream or chemical softeners, it will freeze quite firm. Remove the ice cream from the freezer and let it sit at room temperature for 20 to 25 minutes before scooping to allow it to soften beautifully. Garnish with banana slices or chopped nuts if desired.", "Alternative Option: You can also pour the freshly blended mixture straight into popsicle molds for an easy, toddler-friendly frozen treat!"], "steps_te": ["క్రీమీ బేస్‌ను నానబెట్టండి: మీడియం వేడిని తట్టుకునే గిన్నెలో మఖానా, పొట్టు తీసిన బాదం, జీడిపప్పు మరియు గుమ్మడి గింజలు కలపండి. దానిపై 1 1/2 cups వేడి పాలు నేరుగా పోయండి. అన్నీ మెత్తబడేవరకు 25 to 30 minutes పాటు కదలకుండా ఉంచండి.", "మెత్తని ఆకృతికి బ్లెండ్ చేయండి: నానబెట్టిన గింజలు, విత్తనాలు మరియు పాల మిశ్రమం మొత్తాన్ని హై-స్పీడ్ బ్లెండర్‌లోకి తీసుకోండి. తాజాగా తీసిన అవకాడో గుజ్జు, తేనె, యాలకుల పొడి మరియు వెనిల్లా ఎసెన్స్ వేయండి. పూర్తిగా మృదువుగా, సమానంగా, మెత్తగా అయ్యేవరకు హై స్పీడ్‌లో బ్లెండ్ చేయండి.", "చాక్లెట్ వేరియేషన్: చాక్లెట్ వేరియేషన్ కావాలంటే, ఈ దశలో ఒక tablespoon తియ్యని కోకో పౌడర్ బ్లెండ్ చేసి, పోయడానికి ముందు చాక్లెట్ చిప్స్ కలపండి.", "మొదటి ఫ్రీజ్: మృదువైన ఆకుపచ్చ మిశ్రమాన్ని లోతు తక్కువ, ఫ్రీజర్‌లో పెట్టగల కంటైనర్‌లో పోయండి. పైన మంచు స్ఫటికాలు ఏర్పడకుండా పూర్తిగా నివారించడానికి, ద్రవ ఉపరితలంపై నేరుగా క్లింగ్ ర్యాప్ పొరను నొక్కండి. మూత పెట్టి 1.5 to 2 hours పాటు ఫ్రీజ్ చేయండి.", "మృదువుగా చేయడానికి కలపండి: కంటైనర్‌ను ఫ్రీజర్ నుంచి తీసేయండి. గట్టి చెంచా లేదా విస్క్‌తో సగం ఫ్రీజ్ అయిన ఐస్‌క్రీమ్‌ను బాగా కలిపి మెదపండి. ఇది మొదటి స్ఫటికాలను విచ్ఛిన్నం చేసి తుది ఫలితాన్ని చాలా మృదువుగా చేస్తుంది. క్లింగ్ ర్యాప్‌ను తిరిగి ఉపరితలంపై ఉంచి, పూర్తిగా గట్టిపడేవరకు మరో 3 to 4 hours పాటు ఫ్రీజ్ చేయండి.", "మెత్తబడనిచ్చి వడ్డించండి: ఈ రెసిపీలో భారీ క్రీమ్ లేదా రసాయన సాఫ్ట్‌నర్లు లేవు కాబట్టి ఇది చాలా గట్టిగా ఫ్రీజ్ అవుతుంది. ఫ్రీజర్ నుంచి తీసి, స్కూప్ చేయడానికి ముందు గది ఉష్ణోగ్రత వద్ద 20 to 25 minutes పాటు ఉంచి అందంగా మెత్తబడనివ్వండి. కావాలంటే అరటి ముక్కలు లేదా తరిగిన గింజలతో గార్నిష్ చేయండి.", "ప్రత్యామ్నాయ ఎంపిక: తాజాగా బ్లెండ్ చేసిన మిశ్రమాన్ని నేరుగా పాప్సికల్ మోల్డ్స్‌లో పోస్తే చిన్న పిల్లలకు సులభమైన ఫ్రోజెన్ ట్రీట్ అవుతుంది!"], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:25.679Z"}, {"n": 93, "title": "Creamy Avocado, Spinach & White Bean \"Green Dip\" with Soft Pita Soldiers", "title_te": "క్రీమీ అవకాడో, పాలకూర & వైట్ బీన్ \"గ్రీన్ డిప్\" మెత్తని పిటా సోల్జర్స్‌తో", "cat": "Kid & Toddler", "section": "kid", "emoji": "🥑", "image": "https://images-tastehub.mdlzapps.cloud/images/5e8c0115-cf29-408e-9ffa-44d22d640a9c.jpg", "prep": "10 minutes", "cook": "0 minutes", "yield": "3–4 toddler portions", "desc": "A vibrant, velvety green spread that makes dipping fun and mess-free. Cannellini beans provide creamy plant protein and dietary fiber, ripe avocado delivers brain-building monounsaturated fats, and fresh baby spinach adds folate and iron. Paired with warm whole wheat pita soldiers (strips) for easy grasping.", "desc_te": "డిప్పింగ్‌ను సరదాగా, చిందరవందర లేకుండా చేసే ప్రకాశవంతమైన, మెత్తని ఆకుపచ్చ స్ప్రెడ్. కన్నెల్లిని బీన్స్ క్రీమీ ప్లాంట్ ప్రోటీన్, డైటరీ ఫైబర్ ఇస్తాయి, పండిన అవకాడో మెదడుకు మేలు చేసే మోనోఅన్‌శాచురేటెడ్ కొవ్వులు ఇస్తుంది, తాజా బేబీ పాలకూర ఫోలేట్, ఐరన్ జోడిస్తుంది. సులభంగా పట్టుకోవడానికి వెచ్చని హోల్ వీట్ పిటా సోల్జర్స్ (స్ట్రిప్స్)తో కలిపి వడ్డిస్తారు.", "tags": [], "ing": ["1 cup cooked cannellini or navy white beans (rinsed and drained)", "1 ripe avocado, peeled and pitted", "1 cup fresh baby spinach leaves (steamed for 1 minute or packed fresh)", "1 tbsp extra virgin olive oil", "1 tbsp fresh lemon juice", "1 tbsp whole-milk plain Greek yogurt (optional, for extra creaminess)", "1/4 tsp ground cumin", "Pinch of garlic powder", "For serving: 1–2 whole wheat pita breads or flatbreads, warmed and cut into finger-length strips (\"soldiers\")"], "ing_te": ["1 cup వండిన కన్నెల్లిని లేదా నేవీ వైట్ బీన్స్ (కడిగి నీరు వంపేసినవి)", "1 పండిన అవకాడో, పొట్టు తీసి గింజ తీసేసినది", "1 cup తాజా బేబీ పాలకూర ఆకులు (1 minute పాటు ఆవిరిపై ఉడికించినవి లేదా తాజాగా నిండుగా)", "1 tbsp ఎక్స్‌ట్రా వర్జిన్ ఆలివ్ ఆయిల్", "1 tbsp తాజా నిమ్మరసం", "1 tbsp హోల్-మిల్క్ ప్లెయిన్ గ్రీక్ పెరుగు (ఐచ్ఛికం, మరింత క్రీమీగా కోసం)", "1/4 tsp జీలకర్ర పొడి", "చిటికెడు వెల్లుల్లి పొడి", "వడ్డించడానికి: 1–2 హోల్ వీట్ పిటా బ్రెడ్స్ లేదా ఫ్లాట్‌బ్రెడ్స్, వేడి చేసి వేలు పొడవు స్ట్రిప్స్‌గా (\"సోల్జర్స్\") కత్తిరించినవి"], "steps": ["Blend: In a food processor or blender, place the white beans, ripe avocado, baby spinach, olive oil, lemon juice, Greek yogurt, cumin, and garlic powder.", "Puree: Blend on high speed for 45–60 seconds, scraping down the sides as necessary, until completely silky, thick, and smooth. If too thick, stream in 1 tablespoon of warm water or olive oil.", "Warm Pita: Toast or warm the whole wheat pita in a dry skillet or toaster until soft and pliable. Slice into finger-width rectangular strips (\"soldiers\").", "Assemble & Serve: Spoon the green dip into a shallow toddler suction bowl. Arrange the warm pita soldiers on the side for self-dipping."], "steps_te": ["బ్లెండ్ చేయండి: ఫుడ్ ప్రాసెసర్ లేదా బ్లెండర్‌లో వైట్ బీన్స్, పండిన అవకాడో, బేబీ పాలకూర, ఆలివ్ ఆయిల్, నిమ్మరసం, గ్రీక్ పెరుగు, జీలకర్ర, వెల్లుల్లి పొడి వేయండి.", "ప్యూరీ చేయండి: 45–60 seconds పాటు హై స్పీడ్‌లో బ్లెండ్ చేయండి, అవసరమైనప్పుడు పక్కలు తుడుస్తూ, పూర్తిగా మెత్తగా, చిక్కగా, నునుపుగా అయ్యేవరకు. చాలా చిక్కగా ఉంటే 1 tablespoon వెచ్చని నీరు లేదా ఆలివ్ ఆయిల్‌ను ధారగా పోయండి.", "పిటా వేడి చేయండి: హోల్ వీట్ పిటాను పొడి స్కిల్లెట్‌లో లేదా టోస్టర్‌లో మెత్తగా, వంగేలా అయ్యేవరకు టోస్ట్ చేయండి లేదా వేడి చేయండి. వేలు వెడల్పు దీర్ఘచతురస్రాకార స్ట్రిప్స్‌గా (\"సోల్జర్స్\") కత్తిరించండి.", "కూర్చి వడ్డించండి: గ్రీన్ డిప్‌ను లోతులేని పసిపిల్లల సక్షన్ బౌల్‌లో వేయండి. స్వయంగా డిప్ చేసుకోవడానికి వెచ్చని పిటా సోల్జర్స్‌ను పక్కన అమర్చండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:26.836Z"}, {"n": 95, "title": "Creamy Butternut Squash & Chickpea Coconut Curry", "title_te": "క్రీమీ బటర్‌నట్ స్క్వాష్ & చిక్‌పీ కొబ్బరి కర్రీ", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍛", "image": "https://sarahsvegankitchen.com/wp-content/uploads/2024/10/Squash-curry-edited.jpg", "prep": "10 minutes", "cook": "20 minutes", "yield": "4 toddler portions", "desc": "A mildly spiced, creamy, golden curry naturally sweetened by caramelized butternut squash. Cooked with tender chickpeas and simmered in coconut milk, it delivers healthy fats, plant protein, and loads of vitamin A. Served over soft warm basmati rice.", "desc_te": "కారమెలైజ్ చేసిన బటర్‌నట్ స్క్వాష్‌తో సహజంగా తీపి చేసిన, మైల్డ్ మసాలాగల, క్రీమీ, బంగారు రంగు కర్రీ. మెత్తని చిక్‌పీస్‌తో ఉడికించి, కొబ్బరి పాలలో సిమ్మర్ చేసిన ఇది ఆరోగ్యకరమైన కొవ్వులు, ప్లాంట్ ప్రోటీన్, విటమిన్ A పుష్కలంగా ఇస్తుంది. మెత్తని వెచ్చని బాస్మతి అన్నంతో వడ్డిస్తారు.", "tags": [], "ing": ["1.5 cups peeled, cubed butternut squash (small 1/2-inch toddler bites)", "1 cup cooked chickpeas (rinsed and skins gently rubbed off if preferred for younger toddlers)", "1 cup full-fat coconut milk (canned)", "1/2 cup low-sodium vegetable broth or water", "1 cup fresh baby spinach, finely chopped", "1 tbsp ghee or coconut oil", "1/2 tsp ground cumin", "1/2 tsp ground turmeric", "1/4 tsp mild ground coriander", "1/4 tsp garlic powder or 1 minced garlic clove", "1/4 tsp ginger paste", "For serving: Warm cooked basmati or jasmine rice"], "ing_te": ["1.5 cups పొట్టు తీసి, ముక్కలు చేసిన బటర్‌నట్ స్క్వాష్ (చిన్న 1/2-inch పసిపిల్లల కాటు పరిమాణం)", "1 cup వండిన చిక్‌పీస్ (కడిగి, చిన్న పసిపిల్లల కోసం కావాలనుకుంటే పొట్టు మెల్లగా రుద్ది తీసేసినవి)", "1 cup ఫుల్-ఫ్యాట్ కొబ్బరి పాలు (క్యాన్‌వి)", "1/2 cup తక్కువ-సోడియం వెజిటబుల్ బ్రాత్ లేదా నీరు", "1 cup తాజా బేబీ పాలకూర, సన్నగా తరిగినది", "1 tbsp నెయ్యి లేదా కొబ్బరి నూనె", "1/2 tsp జీలకర్ర పొడి", "1/2 tsp పసుపు పొడి", "1/4 tsp మైల్డ్ ధనియాల పొడి", "1/4 tsp వెల్లుల్లి పొడి లేదా 1 సన్నగా తరిగిన వెల్లుల్లి రెబ్బ", "1/4 tsp అల్లం పేస్ట్", "వడ్డించడానికి: వెచ్చని వండిన బాస్మతి లేదా జాస్మిన్ అన్నం"], "steps": ["Sauté Aromatics: Heat ghee or coconut oil in a medium saucepan over medium heat. Add garlic, ginger, cumin, turmeric, and coriander. Sauté for 30 seconds until fragrant.", "Add Squash & Simmer: Add cubed butternut squash, coconut milk, and vegetable broth. Bring to a gentle boil, then lower heat to medium-low. Cover and simmer for 12–15 minutes until the butternut squash is melt-in-the-mouth fork tender.", "Add Chickpeas & Greens: Stir in the cooked chickpeas and finely chopped baby spinach. Simmer uncovered for another 3–4 minutes until spinach is wilted and the sauce is thick and velvety.", "Adjust Texture: Slightly mash some of the squash and chickpeas with the back of a spoon to create a rich, thick consistency that clings nicely to rice.", "Serve: Spoon warm curry over soft rice and let cool to safe toddler eating temperature."], "steps_te": ["సుగంధ ద్రవ్యాలు వేయించండి: మీడియం మంటపై మీడియం సాస్‌పాన్‌లో నెయ్యి లేదా కొబ్బరి నూనె వేడి చేయండి. వెల్లుల్లి, అల్లం, జీలకర్ర, పసుపు, ధనియాలు వేయండి. సువాసన వచ్చేవరకు 30 seconds పాటు వేయించండి.", "స్క్వాష్ వేసి సిమ్మర్ చేయండి: ముక్కలు చేసిన బటర్‌నట్ స్క్వాష్, కొబ్బరి పాలు, వెజిటబుల్ బ్రాత్ వేయండి. మెల్లగా మరిగించి, మంటను మీడియం-తక్కువకు తగ్గించండి. మూత పెట్టి 12–15 minutes పాటు సిమ్మర్ చేయండి, బటర్‌నట్ స్క్వాష్ నోట్లో కరిగిపోయేలా మెత్తగా అయ్యేవరకు.", "చిక్‌పీస్ & ఆకుకూరలు వేయండి: వండిన చిక్‌పీస్, సన్నగా తరిగిన బేబీ పాలకూర కలపండి. పాలకూర వాడిపోయి, సాస్ చిక్కగా, మెత్తగా అయ్యేవరకు మూత లేకుండా మరో 3–4 minutes సిమ్మర్ చేయండి.", "ఆకృతి సర్దండి: అన్నానికి చక్కగా పట్టే రిచ్, చిక్కని స్థిరత్వం కోసం కొంత స్క్వాష్, చిక్‌పీస్‌ను చెంచా వెనుక భాగంతో కొద్దిగా మెదపండి.", "వడ్డించండి: మెత్తని అన్నంపై వెచ్చని కర్రీ వేసి, పసిపిల్లలు తినడానికి సురక్షితమైన ఉష్ణోగ్రతకు చల్లారనివ్వండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:26.898Z"}, {"n": 96, "title": "Creamy Cauliflower, Cheddar & White Bean \"Mac\" Shells", "title_te": "క్రీమీ కాలీఫ్లవర్, చెడార్ & వైట్ బీన్ \"మ్యాక్\" షెల్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍲", "image": "https://www.nelliebellie.com/wp-content/uploads/cauliflower-mac5-small-720x720.jpg", "prep": "10 minutes", "cook": "15 minutes", "yield": "3–4 toddler servings", "desc": "A velvety, golden homemade pasta sauce made by blending steamed cauliflower florets with soft cannellini beans, mild cheddar, and a hint of warm butter. Tofu or white beans melt seamlessly into the sauce, boosting protein and fiber while coating mini pasta shells perfectly.", "desc_te": "ఆవిరిపై ఉడికించిన కాలీఫ్లవర్ ముక్కలను మెత్తని కన్నెల్లిని బీన్స్, మైల్డ్ చెడార్, కొద్దిగా వెచ్చని వెన్నతో కలిపి బ్లెండ్ చేసి తయారుచేసిన మెత్తని, బంగారు రంగు ఇంట్లో తయారైన పాస్తా సాస్. టోఫు లేదా వైట్ బీన్స్ సాస్‌లో సులభంగా కలిసిపోయి, ప్రోటీన్, ఫైబర్‌ను పెంచుతూ చిన్న పాస్తా షెల్స్‌కు చక్కగా పట్టుతాయి.", "tags": [], "ing": ["1.5 cups mini whole wheat pasta shells (or elbow macaroni)", "1 cup cooked cannellini (white) beans, rinsed and drained", "1.5 cups cauliflower florets, steamed until fork-tender", "3/4 cup shredded mild cheddar cheese", "1/2 cup warm whole milk (or fortified plant milk)", "1 tbsp butter or olive oil", "1/4 tsp garlic powder", "1/4 tsp ground turmeric (for golden color and gentle antioxidants)", "Pinch of black pepper"], "ing_te": ["1.5 cups మినీ హోల్ వీట్ పాస్తా షెల్స్ (లేదా ఎల్బో మకరోనీ)", "1 cup వండిన కన్నెల్లిని (వైట్) బీన్స్, కడిగి నీరు వంపేసినవి", "1.5 cups కాలీఫ్లవర్ ముక్కలు, మెత్తగా అయ్యేవరకు ఆవిరిపై ఉడికించినవి", "3/4 cup తురిమిన మైల్డ్ చెడార్ చీజ్", "1/2 cup వెచ్చని హోల్ మిల్క్ (లేదా ఫోర్టిఫైడ్ ప్లాంట్ మిల్క్)", "1 tbsp వెన్న లేదా ఆలివ్ ఆయిల్", "1/4 tsp వెల్లుల్లి పొడి", "1/4 tsp పసుపు పొడి (బంగారు రంగు కోసం మరియు సున్నితమైన యాంటీఆక్సిడెంట్ల కోసం)", "చిటికెడు నల్ల మిరియాలు"], "steps": ["Cook Pasta: Boil pasta in water according to package directions until tender. Drain, reserve 1/4 cup pasta water, and return pasta to the pot.", "Blend Sauce: In a blender or food processor, combine the steamed cauliflower, rinsed white beans, warm milk, butter, garlic powder, turmeric, and black pepper. Blend on high speed for 60 seconds until silky smooth and creamy.", "Melt Cheese: Pour the warm pureed sauce into the pot with the pasta over low heat. Add the shredded cheddar cheese and stir gently until the cheese has melted completely into a luscious sauce. (Stir in 1–2 tablespoons of pasta water if needed to loosen).", "Serve: Let cool to a safe toddler eating temperature. Serve in a toddler bowl with a spoon or fork."], "steps_te": ["పాస్తా ఉడికించండి: ప్యాకెట్‌పై సూచనల ప్రకారం నీటిలో పాస్తాను మెత్తగా అయ్యేవరకు ఉడికించండి. నీరు వంపేసి, 1/4 cup పాస్తా నీటిని పక్కన ఉంచి, పాస్తాను తిరిగి గిన్నెలో వేయండి.", "సాస్ బ్లెండ్ చేయండి: బ్లెండర్ లేదా ఫుడ్ ప్రాసెసర్‌లో ఆవిరిపై ఉడికించిన కాలీఫ్లవర్, కడిగిన వైట్ బీన్స్, వెచ్చని పాలు, వెన్న, వెల్లుల్లి పొడి, పసుపు, నల్ల మిరియాలు వేసి కలపండి. 60 seconds పాటు హై స్పీడ్‌లో మెత్తగా, క్రీమీగా అయ్యేవరకు బ్లెండ్ చేయండి.", "చీజ్ కరిగించండి: తక్కువ మంటపై పాస్తా ఉన్న గిన్నెలోకి వెచ్చని ప్యూరీ చేసిన సాస్ పోయండి. తురిమిన చెడార్ చీజ్ వేసి, చీజ్ పూర్తిగా కరిగి రుచికరమైన సాస్ అయ్యేవరకు మెల్లగా కలపండి. (అవసరమైతే 1–2 tablespoons పాస్తా నీరు కలిపి పలచబరచండి).", "వడ్డించండి: పసిపిల్లలు తినడానికి సురక్షితమైన ఉష్ణోగ్రతకు చల్లారనివ్వండి. పసిపిల్లల గిన్నెలో చెంచా లేదా ఫోర్క్‌తో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:26.934Z"}, {"n": 40, "title": "Creamy Dal Pasta", "title_te": "క్రీమీ దాల్ పాస్తా", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍲", "image": "https://i.ytimg.com/vi/z7eSinxQmCI/maxresdefault.jpg", "prep": "—", "cook": "not stated (2-3 whistles plus 2-3 minutes)", "yield": "—", "desc": "Toddler pasta coated in a smooth blended masoor dal, carrot, tomato and cashew sauce.", "desc_te": "మృదువుగా బ్లెండ్ చేసిన మసూర్ దాల్, క్యారెట్, టమాటా మరియు జీడిపప్పు సాస్‌తో పూసిన చిన్నపిల్లల పాస్తా.", "tags": ["vegetarian", "contains dairy", "lunch", "dinner"], "ing": ["1/2 cup masoor dal, washed", "1 carrot, chopped", "1 tomato, chopped", "1/4 onion (optional)", "2-3 garlic cloves (optional)", "5-6 cashews", "1-2 tsp ghee or oil", "1-1.5 cups boiled pasta", "Salt (only if baby is above 1 year)", "A pinch of black pepper", "Italian seasoning"], "ing_te": ["1/2 cup మసూర్ దాల్, కడిగినది", "1 క్యారెట్, తరిగినది", "1 టమాటా, తరిగినది", "1/4 ఉల్లిపాయ (ఐచ్ఛికం)", "2-3 వెల్లుల్లి రెబ్బలు (ఐచ్ఛికం)", "5-6 జీడిపప్పులు", "1-2 tsp నెయ్యి లేదా నూనె", "1-1.5 cups ఉడికించిన పాస్తా", "ఉప్పు (బిడ్డ 1 సంవత్సరం పైబడి ఉంటే మాత్రమే)", "చిటికెడు నల్ల మిరియాలు", "ఇటాలియన్ సీజనింగ్"], "steps": ["Heat ghee or oil in a pressure cooker.", "Add the garlic and onion if using, followed by the carrot, tomatoes, cashews and washed masoor dal.", "Add a little water and pressure cook 2-3 whistles, or until everything is soft.", "Let it cool slightly and blend into a smooth, creamy sauce.", "Heat a little ghee, butter or oil in a pan and add the blended sauce.", "Cook on low flame 2-3 minutes.", "Add salt (1 year+), black pepper and Italian seasoning.", "Add the boiled pasta and mix well until everything comes together."], "steps_te": ["ప్రెషర్ కుక్కర్‌లో నెయ్యి లేదా నూనె వేడి చేయండి.", "వాడితే వెల్లుల్లి మరియు ఉల్లిపాయ వేసి, తర్వాత క్యారెట్, టమాటాలు, జీడిపప్పులు మరియు కడిగిన మసూర్ దాల్ వేయండి.", "కొద్దిగా నీరు వేసి 2-3 విజిల్స్ వచ్చే వరకు లేదా అన్నీ మెత్తబడే వరకు ప్రెషర్ కుక్ చేయండి.", "కొద్దిగా చల్లారనిచ్చి మృదువైన, క్రీమీ సాస్‌గా బ్లెండ్ చేయండి.", "పాన్‌లో కొద్దిగా నెయ్యి, వెన్న లేదా నూనె వేడి చేసి బ్లెండ్ చేసిన సాస్ వేయండి.", "తక్కువ మంటపై 2-3 నిమిషాలు ఉడికించండి.", "ఉప్పు (1 సంవత్సరం పైబడిన పిల్లలకు మాత్రమే), నల్ల మిరియాలు మరియు ఇటాలియన్ సీజనింగ్ వేయండి.", "ఉడికించిన పాస్తా వేసి అన్నీ కలిసే వరకు బాగా కలపండి."], "notes": "Creator's note: add salt only if the baby is above 1 year. Smooth creamy sauce coats small pasta; cashews are tree nuts, check for allergy.", "notes_te": "సృష్టికర్త గమనిక: బిడ్డ 1 సంవత్సరం పైబడి ఉంటే మాత్రమే ఉప్పు వేయండి. మృదువైన క్రీమీ సాస్ చిన్న పాస్తాను పూస్తుంది; జీడిపప్పులు ట్రీ నట్స్, అలెర్జీ ఉందో లేదో చూసుకోండి.", "added_at": "2026-10-22T16:04:06.460Z"}, {"n": 109, "title": "Creamy Golden Carrot & Red Lentil Soup with Naan Dippers", "title_te": "క్రీమీ గోల్డెన్ క్యారెట్ & ఎర్ర లెంటిల్ సూప్ నాన్ డిప్పర్స్‌తో", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍜", "image": "https://hungryhealthyhappy.com/wp-content/uploads/2014/10/Carrot-and-Lentil-Soup-3.jpg", "prep": "10 minutes", "cook": "20 minutes", "yield": "4 toddler portions", "desc": "Inspired by MJ and Hungryman and Creative Nourish", "desc_te": "ఎంజే అండ్ హంగ్రీమ్యాన్ మరియు క్రియేటివ్ నరిష్ నుండి ప్రేరణ పొందినది", "tags": [], "ing": ["3/4 cup split red lentils (masoor dal), rinsed thoroughly", "2 medium carrots, peeled and sliced into thin rounds", "1 small yellow potato (or sweet potato), peeled and diced", "1 tbsp olive oil or butter", "1/4 tsp ground cumin", "1/4 tsp ground turmeric", "1/4 tsp garlic powder", "2.5 cups low-sodium vegetable broth or water", "1/4 cup whole-milk plain Greek yogurt or canned coconut milk (for rich creaminess and healthy fats)", "For serving: Mini whole wheat naan or pita bread, warmed and sliced into dipper strips"], "ing_te": ["3/4 cup చీలిన ఎర్ర లెంటిల్స్ (మసూర్ దాల్), బాగా కడిగినవి", "2 medium క్యారెట్లు, పొట్టు తీసి సన్నని గుండ్రని ముక్కలుగా కోసినవి", "1 small పసుపు బంగాళాదుంప (లేదా చిలగడదుంప), పొట్టు తీసి ముక్కలు చేసినది", "1 tbsp ఆలివ్ ఆయిల్ లేదా వెన్న", "1/4 tsp జీలకర్ర పొడి", "1/4 tsp పసుపు పొడి", "1/4 tsp వెల్లుల్లి పొడి", "2.5 cups తక్కువ-సోడియం వెజిటబుల్ బ్రాత్ లేదా నీరు", "1/4 cup హోల్-మిల్క్ ప్లెయిన్ గ్రీక్ పెరుగు లేదా క్యాన్ కొబ్బరి పాలు (రిచ్ క్రీమీనెస్, ఆరోగ్యకరమైన కొవ్వుల కోసం)", "వడ్డించడానికి: మినీ హోల్ వీట్ నాన్ లేదా పిటా బ్రెడ్, వేడి చేసి డిప్పర్ స్ట్రిప్స్‌గా కోసినది"], "steps": ["Sauté Vegetables: Heat olive oil or butter in a medium pot over medium heat. Add sliced carrots and diced potato; cook for 2–3 minutes until slightly softened.", "Add Spices & Lentils: Stir in cumin, turmeric, and garlic powder for 30 seconds until fragrant. Add rinsed red lentils and pour in broth or water.", "Simmer: Bring to a boil, then reduce heat to low. Cover and simmer for 15–18 minutes, or until the lentils and carrots are completely soft and falling apart.", "Blend: Remove from heat and allow to cool slightly. Use an immersion blender (or transfer to a countertop blender) to puree until silky smooth.", "Enrich: Stir in the Greek yogurt or coconut milk to add velvety texture, healthy fats, and protein.", "Serve: Toast mini whole wheat naan or pita and cut into long rectangular strips. Serve soup warm in a shallow bowl or cup with naan dippers alongside for interactive eating."], "steps_te": ["కూరగాయలు వేయించండి: మీడియం గిన్నెలో మీడియం మంటపై ఆలివ్ ఆయిల్ లేదా వెన్న వేడి చేయండి. కోసిన క్యారెట్లు, ముక్కలు చేసిన బంగాళాదుంప వేసి, కొద్దిగా మెత్తబడేవరకు 2–3 minutes పాటు ఉడికించండి.", "మసాలాలు & లెంటిల్స్ వేయండి: సువాసన వచ్చేవరకు 30 seconds పాటు జీలకర్ర, పసుపు, వెల్లుల్లి పొడి కలపండి. కడిగిన ఎర్ర లెంటిల్స్ వేసి బ్రాత్ లేదా నీరు పోయండి.", "సిమ్మర్ చేయండి: మరిగించి, మంటను తక్కువకు తగ్గించండి. మూత పెట్టి 15–18 minutes పాటు సిమ్మర్ చేయండి, లేదా లెంటిల్స్, క్యారెట్లు పూర్తిగా మెత్తగా, విడిపోయేవరకు.", "బ్లెండ్ చేయండి: మంట నుండి తీసి కొద్దిగా చల్లారనివ్వండి. మెత్తగా, నునుపుగా ప్యూరీ అయ్యేవరకు ఇమ్మర్షన్ బ్లెండర్ (లేదా కౌంటర్‌టాప్ బ్లెండర్‌కు బదిలీ చేసి) వాడండి.", "సమృద్ధం చేయండి: మెత్తని ఆకృతి, ఆరోగ్యకరమైన కొవ్వులు, ప్రోటీన్ కోసం గ్రీక్ పెరుగు లేదా కొబ్బరి పాలు కలపండి.", "వడ్డించండి: మినీ హోల్ వీట్ నాన్ లేదా పిటాను టోస్ట్ చేసి పొడవైన దీర్ఘచతురస్రాకార స్ట్రిప్స్‌గా కత్తిరించండి. ఇంటరాక్టివ్‌గా తినడానికి నాన్ డిప్పర్స్‌తో పాటు లోతులేని గిన్నె లేదా కప్పులో సూప్‌ను వెచ్చగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:56.603Z"}, {"n": 25, "title": "Creamy Hidden Veggie Protein Pasta", "title_te": "క్రీమీ హిడెన్ వెజ్జీ ప్రోటీన్ పాస్తా", "cat": "Adult", "section": "adult", "emoji": "🍳", "image": "https://www.indianveggiedelight.com/wp-content/uploads/2025/11/hidden-veggie-pasta-featured.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "Creamy pasta with a blended sauce of bottle gourd, tofu or paneer, makhana and cashews, no cream or flour.", "desc_te": "సొరకాయ, టోఫు లేదా పనీర్, మఖానా మరియు జీడిపప్పుతో బ్లెండ్ చేసిన సాస్‌తో చేసిన క్రీమీ పాస్తా; క్రీమ్ లేదా మైదా లేకుండా.", "tags": ["vegetarian", "contains dairy", "dinner", "lunch"], "ing": ["2.5 cups raw pasta", "Oil", "2-3 cubes butter", "3-4 garlic cloves", "1 medium onion, chopped", "1 cup bottle gourd (lauki) or any squash", "1/2 cup capsicum", "1/3 cup cashews", "1/2 cup tofu or paneer", "1/2 cup makhana", "Pasta water as needed", "1 tbsp oregano", "Mixed herbs", "Chilli flakes", "1/2 cup cheese", "Salt to taste", "1 tsp dry mango powder (amchur)"], "ing_te": ["2.5 cups పచ్చి పాస్తా", "నూనె", "2-3 ముక్కల వెన్న", "3-4 వెల్లుల్లి రెబ్బలు", "1 మధ్యస్థ ఉల్లిపాయ, తరిగినది", "1 cup సొరకాయ (లౌకీ) లేదా ఏదైనా గుమ్మడికాయ", "1/2 cup క్యాప్సికమ్", "1/3 cup జీడిపప్పు", "1/2 cup టోఫు లేదా పనీర్", "1/2 cup మఖానా", "అవసరమైనంత పాస్తా నీరు", "1 tbsp ఒరెగానో", "మిక్స్‌డ్ హెర్బ్స్", "చిల్లీ ఫ్లేక్స్", "1/2 cup చీజ్", "రుచికి తగినంత ఉప్పు", "1 tsp ఎండిన మామిడి పొడి (ఆమ్చూర్)"], "steps": ["Boil the pasta and keep aside.", "For the sauce, heat oil and butter; add garlic and roast well.", "Add the onions and saute until golden.", "Add the bottle gourd and capsicum, then the cashews, tofu or paneer, and makhana.", "Cover and cook on low flame until everything is soft.", "Switch off the flame, add some ice cubes to cool quickly, then blend into a super smooth creamy sauce.", "In a pan add a little butter, the prepared sauce, pasta water, oregano, herbs, chilli flakes, cheese, salt and amchur.", "Mix in the boiled pasta and serve."], "steps_te": ["పాస్తాను ఉడికించి పక్కన పెట్టండి.", "సాస్ కోసం నూనె మరియు వెన్న వేడి చేసి, వెల్లుల్లి వేసి బాగా వేయించండి.", "ఉల్లిపాయలు వేసి బంగారు రంగు వచ్చే వరకు వేయించండి.", "సొరకాయ మరియు క్యాప్సికమ్ వేసి, ఆ తర్వాత జీడిపప్పు, టోఫు లేదా పనీర్, మరియు మఖానా వేయండి.", "మూత పెట్టి తక్కువ మంటపై అన్నీ మెత్తబడే వరకు ఉడికించండి.", "మంట ఆపి, త్వరగా చల్లబరచడానికి కొన్ని ఐస్ ముక్కలు వేసి, ఆ తర్వాత చాలా మృదువైన క్రీమీ సాస్‌లా బ్లెండ్ చేయండి.", "ఒక పాన్‌లో కొద్దిగా వెన్న, తయారుచేసిన సాస్, పాస్తా నీరు, ఒరెగానో, హెర్బ్స్, చిల్లీ ఫ్లేక్స్, చీజ్, ఉప్పు మరియు ఆమ్చూర్ వేయండి.", "ఉడికించిన పాస్తా కలిపి వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:26.402Z"}, {"n": 115, "title": "Creamy Mango & Greek Yogurt Layered Chia Pudding", "title_te": "క్రీమీ మామిడి & గ్రీక్ యోగర్ట్ లేయర్డ్ చియా పుడ్డింగ్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🥗", "image": "https://ifoodreal.com/wp-content/uploads/2023/01/fg-mango-chia-pudding.jpg", "prep": "10 minutes (plus 2 hours chilling)", "cook": "0 minutes", "yield": "2 jars / cups", "desc": "A refreshing, tropical, no-cook breakfast or snack. Chia seeds provide omega-3 fatty acids, calcium, and fiber, while Greek yogurt adds thick, creamy protein. Layered with naturally sweet fresh mango puree, this recipe requires zero added sugars or artificial sweeteners.", "desc_te": "రిఫ్రెషింగ్, ట్రాపికల్, వండకుండా చేసే అల్పాహారం లేదా స్నాక్. చియా గింజలు ఒమేగా-3 ఫ్యాటీ యాసిడ్లు, కాల్షియం మరియు ఫైబర్‌ను అందిస్తాయి, గ్రీక్ యోగర్ట్ మందపాటి, క్రీమీ ప్రోటీన్‌ను జోడిస్తుంది. సహజంగా తీపి తాజా మామిడి ప్యూరీతో పొరలుగా వేయబడిన ఈ రెసిపీకి జోడించిన చక్కెరలు లేదా కృత్రిమ స్వీటెనర్లు అవసరం లేదు.", "tags": [], "ing": ["3 tbsp white or black chia seeds", "3/4 cup whole milk (or fortified unsweetened oat/almond/coconut milk)", "1/4 tsp pure vanilla extract", "1/2 cup plain whole-milk Greek yogurt", "1 ripe sweet mango (peeled, pitted, and blended into a smooth puree)", "Optional topping: A few soft diced mango cubes or hemp seeds"], "ing_te": ["3 tbsp తెలుపు లేదా నలుపు చియా గింజలు", "3/4 cup హోల్ మిల్క్ (లేదా ఫోర్టిఫైడ్ తీపిలేని ఓట్/బాదం/కొబ్బరి పాలు)", "1/4 tsp స్వచ్ఛమైన వెనిల్లా ఎక్స్‌ట్రాక్ట్", "1/2 cup ప్లెయిన్ హోల్-మిల్క్ గ్రీక్ యోగర్ట్", "1 పండిన తీపి మామిడి (తొక్క తీసి, గింజ తీసి మృదువైన ప్యూరీగా బ్లెండ్ చేసినది)", "Optional topping: కొన్ని మృదువైన చిన్న మామిడి ముక్కలు లేదా హెంప్ గింజలు"], "steps": ["Mix the Chia Base: In a small glass bowl or mason jar, whisk together the chia seeds, milk, and vanilla extract. Let sit for 5 minutes, then whisk again to prevent seeds from settling at the bottom.", "Chill & Thicken: Cover and refrigerate for at least 2 hours (or overnight) until thick and gelatinous.", "Assemble the Layers: In two small toddler-safe cups, layer the bottom with 2 tablespoons of Greek yogurt, followed by a layer of the set chia pudding, and topped with fresh mango puree.", "Garnish & Serve: Top with tiny soft mango cubes or a sprinkle of hemp seeds for extra crunch and nutrients."], "steps_te": ["చియా బేస్ కలపండి: చిన్న గాజు గిన్నె లేదా మేసన్ జార్‌లో చియా గింజలు, పాలు మరియు వెనిల్లా ఎక్స్‌ట్రాక్ట్‌ను కలపండి. 5 minutes ఉంచి, గింజలు అడుగున స్థిరపడకుండా మళ్లీ కలపండి.", "చల్లబరచి చిక్కబరచండి: కవర్ చేసి కనీసం 2 hours (లేదా రాత్రంతా) రిఫ్రిజిరేట్ చేయండి, మందంగా జెలటిన్‌లా అయ్యేవరకు.", "పొరలు అమర్చండి: రెండు చిన్న పిల్లలకు సురక్షితమైన కప్పులలో, అడుగున 2 tablespoons గ్రీక్ యోగర్ట్ పొర వేసి, తర్వాత సెట్ అయిన చియా పుడ్డింగ్ పొర వేసి, పైన తాజా మామిడి ప్యూరీతో అలంకరించండి.", "గార్నిష్ & వడ్డించండి: అదనపు క్రంచ్ మరియు పోషకాల కోసం పైన చిన్న మృదువైన మామిడి ముక్కలు లేదా హెంప్ గింజల చల్లుకోండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:56.778Z"}, {"n": 124, "title": "Creamy Red Lentil & Vegetable Moong Dal Khichdi", "title_te": "క్రీమీ రెడ్ లెంటిల్ & వెజిటబుల్ మూంగ్ దాల్ ఖిచ్డీ", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍲", "image": "https://greenbowl2soul.com/wp-content/uploads/2020/01/moong-dal-khichdi-3.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "Meal Type", "desc_te": "భోజన రకం", "tags": [], "ing": ["1/4 cup yellow moong dal (split yellow lentils)", "1/4 cup red lentils (masoor dal)", "1/4 cup white or brown rice", "2 cups water or low-sodium vegetable broth", "1 tbsp ghee or olive oil", "1/4 tsp cumin seeds", "1/2 cup finely diced mixed vegetables (carrots, green peas, zucchini)", "A pinch of turmeric powder"], "ing_te": ["1/4 cup పసుపు మూంగ్ దాల్ (స్ప్లిట్ పసుపు కందిపప్పు)", "1/4 cup రెడ్ లెంటిల్స్ (మసూర్ దాల్)", "1/4 cup తెలుపు లేదా బ్రౌన్ బియ్యం", "2 cups నీరు లేదా తక్కువ సోడియం వెజిటబుల్ బ్రాత్", "1 tbsp నెయ్యి లేదా ఆలివ్ నూనె", "1/4 tsp జీలకర్ర గింజలు", "1/2 cup సన్నగా చిన్న ముక్కలు చేసిన మిశ్రమ కూరగాయలు (క్యారెట్లు, ఆకుపచ్చ బఠానీలు, జుచిని)", "A pinch of పసుపు పొడి"], "steps": ["Rinse lentils and rice together until water runs clear. Drain well. In a saucepan or pressure cooker, heat ghee over medium heat. Add cumin seeds and let them sizzle for 30 seconds. Add diced mixed vegetables and saute for 1–2 minutes. Stir in rinsed lentils, rice, turmeric powder, and water/broth. Cover and simmer on low heat for 18–20 minutes until soft, mashable, and porridge-like. Mash gently with a fork to desired texture. Serve warm with a dab of extra ghee."], "steps_te": ["నీరు స్పష్టంగా వచ్చేవరకు కందిపప్పులు మరియు బియ్యాన్ని కలిపి కడగండి. బాగా వడకట్టండి. సాస్‌పాన్ లేదా ప్రెషర్ కుక్కర్‌లో మధ్యస్థ మంటపై నెయ్యిని వేడి చేయండి. జీలకర్ర గింజలు వేసి 30 seconds చిటపటలాడే అయ్యేవరకు ఉంచండి. చిన్న ముక్కలు చేసిన మిశ్రమ కూరగాయలు వేసి 1–2 minutes వేయించండి. కడిగిన కందిపప్పులు, బియ్యం, పసుపు పొడి మరియు నీరు/బ్రాత్‌ను కలపండి. కవర్ చేసి మృదువుగా, మెదపగలిగేలా, గంజిలా అయ్యేవరకు తక్కువ మంటపై 18–20 minutes ఉడికించండి. కావలసిన ఆకృతికి ఫోర్క్‌తో మెల్లగా మెదపండి. అదనపు నెయ్యి కొద్దిగా వేసి వెచ్చగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:19.016Z"}, {"n": 83, "title": "Creamy Roasted Red Pepper & Red Lentil Pasta", "title_te": "క్రీమీ రోస్టెడ్ రెడ్ పెప్పర్ & రెడ్ లెంటిల్ పాస్తా", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍝", "image": "https://jessicainthekitchen.com/wp-content/uploads/2021/11/Roasted-Red-Lentil-Pepper-Pasta-21.jpg", "prep": "10 minutes", "cook": "18 minutes", "yield": "3–4 toddler portions", "desc": "A silky, vibrant sauce that transforms everyday pasta into a high-protein powerhouse. Quick-cooking red lentils are simmered until soft with sweet roasted red bell peppers, mild garlic, and olive oil, then pureed with a dollop of ricotta cheese or coconut milk. It coats pasta beautifully, delivering plant protein, folate, and vitamin C in every spoonful.", "desc_te": "రోజువారీ పాస్తాను హై-ప్రోటీన్ శక్తివంతమైన వంటకంగా మార్చే మృదువైన, శక్తివంతమైన సాస్. త్వరగా ఉడికే ఎర్ర కందిపప్పును తీపి వేయించిన ఎర్ర బెల్ పెప్పర్స్, మైల్డ్ వెల్లుల్లి మరియు ఆలివ్ నూనెతో మెత్తగా ఉడికేవరకు ఉడికించి, తర్వాత రికోటా చీజ్ లేదా కొబ్బరి పాలతో ప్యూరీ చేస్తారు. ఇది పాస్తాను అందంగా పూస్తుంది, ప్రతి చెంచాలో వృక్ష ప్రోటీన్, ఫోలేట్ మరియు విటమిన్ C అందిస్తుంది.", "tags": [], "ing": ["1.5 cups mini penne, rotini, or shell pasta (whole grain or legume pasta)", "1/2 cup split red lentils (masoor dal), thoroughly rinsed", "1 cup roasted red bell peppers (from a jar of unsalted roasted peppers, drained, or freshly roasted)", "1.5 cups low-sodium vegetable broth or water", "1/4 cup whole-milk ricotta cheese or plain Greek yogurt (for rich creaminess and extra protein)", "1 tbsp olive oil", "1/4 tsp garlic powder", "1/4 tsp Italian seasoning or dried basil", "2 tbsp grated parmesan cheese (optional)"], "ing_te": ["1.5 cups మినీ పెన్నె, రొటినీ లేదా షెల్ పాస్తా (హోల్ గ్రెయిన్ లేదా లెగ్యూమ్ పాస్తా)", "1/2 cup స్ప్లిట్ ఎర్ర కందిపప్పు (మసూర్ దాల్), బాగా కడిగినది", "1 cup వేయించిన ఎర్ర బెల్ పెప్పర్స్ (ఉప్పు లేని వేయించిన పెప్పర్స్ జార్ నుండి, నీరు వడకినవి, లేదా తాజాగా వేయించినవి)", "1.5 cups తక్కువ సోడియం వెజిటబుల్ బ్రాత్ లేదా నీరు", "1/4 cup హోల్-మిల్క్ రికోటా చీజ్ లేదా సాదా గ్రీక్ పెరుగు (గొప్ప క్రీమీతనం మరియు అదనపు ప్రోటీన్ కోసం)", "1 tbsp ఆలివ్ నూనె", "1/4 tsp వెల్లుల్లి పొడి", "1/4 tsp ఇటాలియన్ సీజనింగ్ లేదా ఎండిన తులసి", "2 tbsp తురిమిన పార్మెసన్ చీజ్ (ఐచ్ఛికం)"], "steps": ["Cook Lentils: In a small pot, combine the rinsed red lentils, garlic powder, Italian seasoning, and vegetable broth. Bring to a boil, then reduce heat to low, cover, and simmer for 12–15 minutes until the lentils are completely soft and mushy.", "Cook Pasta: While lentils are simmering, cook the pasta in a separate pot of water until tender. Drain, reserving 1/4 cup of starchy pasta water.", "Blend Sauce: Transfer the cooked soft lentils (with any remaining liquid) and the roasted red bell peppers into a blender. Add olive oil and ricotta cheese. Blend on high for 45–60 seconds until silky smooth, creamy, and bright orange-red.", "Combine: Pour the warm sauce over the cooked pasta in the pot over low heat. Toss gently to coat each piece evenly. (Add 1–2 tablespoons of reserved pasta water if needed to adjust thickness).", "Serve: Spoon into toddler bowls, sprinkle with a pinch of grated parmesan, and allow to cool to warm before serving."], "steps_te": ["కందిపప్పు వండండి: ఒక చిన్న పాత్రలో కడిగిన ఎర్ర కందిపప్పు, వెల్లుల్లి పొడి, ఇటాలియన్ సీజనింగ్ మరియు వెజిటబుల్ బ్రాత్ కలపండి. మరిగించి, తర్వాత మంట తగ్గించి, మూసి, కందిపప్పు పూర్తిగా మెత్తగా, ముద్దగా అయ్యేవరకు 12–15 minutes తక్కువ మంటపై ఉడికించండి.", "పాస్తా వండండి: కందిపప్పు ఉడుకుతుండగా, వేరే పాత్రలో నీటిలో పాస్తాను మెత్తగా అయ్యేవరకు వండండి. వడకండి, 1/4 cup స్టార్చీ పాస్తా నీరు దాచుకోండి.", "సాస్ బ్లెండ్ చేయండి: వండిన మెత్తని కందిపప్పు (మిగిలిన ద్రవంతో సహా) మరియు వేయించిన ఎర్ర బెల్ పెప్పర్స్‌ను బ్లెండర్‌లో వేయండి. ఆలివ్ నూనె మరియు రికోటా చీజ్ వేయండి. మృదువుగా, క్రీమీగా, ప్రకాశవంతమైన నారింజ-ఎరుపు రంగులో అయ్యేవరకు 45–60 seconds అధిక వేగంతో బ్లెండ్ చేయండి.", "కలపండి: వేడి సాస్‌ను తక్కువ మంటపై పాత్రలో వండిన పాస్తాపై పోయండి. ప్రతి ముక్క సమానంగా పూత పట్టేలా మెల్లగా కలపండి. (మందం సర్దుకోవడానికి అవసరమైతే 1–2 tablespoons దాచిన పాస్తా నీరు వేయండి).", "వడ్డించండి: పసిపిల్లల గిన్నెల్లో వేసి, చిటికెడు తురిమిన పార్మెసన్ చల్లి, వడ్డించే ముందు గోరువెచ్చగా అయ్యేవరకు చల్లారనివ్వండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:06:17.728Z"}, {"n": 129, "title": "Creamy Roasted Veggie & Cottage Cheese Pasta", "title_te": "క్రీమీ రోస్టెడ్ వెజ్జీ & కాటేజ్ చీజ్ పాస్తా", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍳", "image": "https://cdn.apartmenttherapy.info/image/upload/f_auto,q_auto:eco,c_fill,g_auto,w_1500,ar_3:2/k/Edit/2021-06-Cottage-Cheese-Pasta/AfterlightImage_1", "prep": "10 mins", "cook": "15 mins", "yield": "3 toddler servings", "desc": "Silky, nutrient-rich pasta sauce blended with high-protein whole-milk cottage cheese, steamed carrots, and tender green peas.", "desc_te": "అధిక ప్రోటీన్ హోల్-మిల్క్ కాటేజ్ చీజ్, ఆవిరిలో ఉడికించిన క్యారెట్లు మరియు మృదువైన ఆకుపచ్చ బఠానీలతో బ్లెండ్ చేసిన మృదువైన, పోషకాలు నిండిన పాస్తా సాస్.", "tags": [], "ing": ["1 cup bite-sized toddler-friendly pasta (e.g., rotini, mini shells, or chickpea pasta elbows)", "3/4 cup whole-milk cottage cheese", "1/2 cup steamed carrot coins", "1/4 cup steamed sweet green peas", "1/4 cup reserved warm pasta water", "2 tbsp grated mild Parmesan or mild cheddar cheese", "1/2 tsp olive oil or butter", "1/8 tsp garlic powder", "1/8 tsp dried oregano or Italian herb blend"], "ing_te": ["1 cup చిన్న ముక్కల పిల్లలకు అనుకూలమైన పాస్తా (e.g., రొటిని, మినీ షెల్స్, లేదా చిక్‌పీ పాస్తా ఎల్బోలు)", "3/4 cup హోల్-మిల్క్ కాటేజ్ చీజ్", "1/2 cup ఆవిరిలో ఉడికించిన క్యారెట్ ముక్కలు", "1/4 cup ఆవిరిలో ఉడికించిన తీపి ఆకుపచ్చ బఠానీలు", "1/4 cup రిజర్వ్ చేసిన వెచ్చని పాస్తా నీరు", "2 tbsp తురిమిన mild పార్మెసన్ లేదా mild చెడార్ చీజ్", "1/2 tsp ఆలివ్ నూనె లేదా వెన్న", "1/8 tsp వెల్లుల్లి పొడి", "1/8 tsp ఎండిన ఒరెగానో లేదా ఇటాలియన్ హెర్బ్ బ్లెండ్"], "steps": ["Cook Pasta: Boil pasta in water according to package instructions until tender (cook slightly past al dente for easier chewing for young toddlers). Reserve 1/4 cup of the starchy cooking water, then drain pasta.", "Blend Sauce: In a blender or food processor, combine cottage cheese, steamed carrots, steamed peas, garlic powder, dried oregano, grated Parmesan, and 2 tablespoons of warm reserved pasta water. Blend on high until completely smooth, creamy, and vibrant orange/green. Add an extra splash of pasta water if too thick.", "Combine: In the warm pot, melt olive oil or butter over low heat. Pour in the blended cottage cheese sauce and the cooked pasta. Stir gently for 1–2 minutes until warmed through and the sauce coats the pasta evenly.", "Serve: Let cool to a safe toddler temperature. Serve with soft whole peas or steamed carrot stars on top for tactile fun."], "steps_te": ["పాస్తా వండండి: ప్యాకేజీ సూచనల ప్రకారం నీటిలో పాస్తాను మృదువుగా అయ్యేవరకు ఉడికించండి (చిన్న పిల్లలు సులభంగా నమలడానికి al dente కంటే కొద్దిగా ఎక్కువ ఉడికించండి). 1/4 cup స్టార్చీ వంట నీటిని రిజర్వ్ చేసి, తర్వాత పాస్తాను వడకట్టండి.", "సాస్ బ్లెండ్ చేయండి: బ్లెండర్ లేదా ఫుడ్ ప్రాసెసర్‌లో కాటేజ్ చీజ్, ఆవిరిలో ఉడికించిన క్యారెట్లు, ఆవిరిలో ఉడికించిన బఠానీలు, వెల్లుల్లి పొడి, ఎండిన ఒరెగానో, తురిమిన పార్మెసన్ మరియు 2 tablespoons వెచ్చని రిజర్వ్ చేసిన పాస్తా నీటిని కలపండి. పూర్తిగా మృదువుగా, క్రీమీగా, ప్రకాశవంతమైన ఆరెంజ్/ఆకుపచ్చ రంగులో అయ్యేవరకు హై స్పీడ్‌లో బ్లెండ్ చేయండి. చాలా చిక్కగా ఉంటే పాస్తా నీటిని అదనంగా కొద్దిగా వేయండి.", "కలపండి: వెచ్చని పాత్రలో తక్కువ మంటపై ఆలివ్ నూనె లేదా వెన్నను కరిగించండి. బ్లెండ్ చేసిన కాటేజ్ చీజ్ సాస్ మరియు వండిన పాస్తాను పోయండి. సాస్ పాస్తాకు సమానంగా పూసి వెచ్చగా అయ్యేవరకు 1–2 minutes మెల్లగా కలపండి.", "వడ్డించండి: పిల్లలకు సురక్షితమైన ఉష్ణోగ్రతకు చల్లారనివ్వండి. స్పర్శ సరదా కోసం పైన మృదువైన హోల్ బఠానీలు లేదా ఆవిరిలో ఉడికించిన క్యారెట్ నక్షత్రాలతో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:19.242Z"}, {"n": 112, "title": "Creamy Silken Tofu, Avocado & Cacao \"Chocolate\" Pudding", "title_te": "క్రీమీ సిల్కెన్ టోఫు, అవకాడో & కకావో \"చాక్లెట్\" పుడ్డింగ్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🥑", "image": "https://kidspot.co.nz/wp-content/uploads/2016/04/48a78ab7-f182-4ea8-a90b-b6f49bbe8a85-1024x572.png", "prep": "5 minutes", "cook": "0 minutes", "yield": "3 toddler servings", "desc": "A luscious, chocolatey pudding that toddlers adore, made entirely from whole nutrient-rich foods without refined sugar. Silken tofu provides complete plant protein and a silky texture, while ripe avocado contributes heart-healthy monounsaturated fats and creaminess. Naturally sweetened with ripe banana.", "desc_te": "రిఫైన్డ్ చక్కెర లేకుండా పూర్తిగా ఆరోగ్యకరమైన ఆహారాలతో మాత్రమే తయారుచేసిన, పసిపిల్లలు ఇష్టపడే మెత్తని, చాక్లెట్ రుచిగల పుడ్డింగ్. సిల్కెన్ టోఫు పూర్తి ప్లాంట్ ప్రోటీన్, మెత్తని ఆకృతి ఇస్తుంది, పండిన అవకాడో గుండెకు మేలు చేసే మోనోఅన్‌శాచురేటెడ్ కొవ్వులు, క్రీమీనెస్ ఇస్తుంది. పండిన అరటిపండుతో సహజంగా తీపి చేసినది.", "tags": [], "ing": ["1 cup soft silken tofu (approx. 8 oz), drained", "1/2 ripe avocado, peeled and pitted", "1 ripe sweet banana (with brown spots for natural sweetness)", "2 tbsp unsweetened Dutch-process cocoa or raw cacao powder", "1/2 tsp pure vanilla extract", "1 tbsp pure maple syrup or 2 soft pitted Medjool dates (soaked in warm water)", "1 tbsp whole milk or oat milk (if needed to adjust blending consistency)", "Optional garnish: A sprinkle of hemp seeds or sliced fresh strawberries"], "ing_te": ["1 cup మెత్తని సిల్కెన్ టోఫు (సుమారు 8 oz), నీరు వంపేసినది", "1/2 పండిన అవకాడో, పొట్టు తీసి గింజ తీసేసినది", "1 పండిన తీపి అరటిపండు (సహజ తీపి కోసం గోధుమ మచ్చలున్నది)", "2 tbsp తీపి లేని డచ్-ప్రాసెస్ కోకో లేదా ముడి కకావో పొడి", "1/2 tsp స్వచ్ఛమైన వనిల్లా ఎక్స్‌ట్రాక్ట్", "1 tbsp స్వచ్ఛమైన మేపుల్ సిరప్ లేదా 2 మెత్తని గింజ తీసిన మెడ్జూల్ ఖర్జూరాలు (వెచ్చని నీటిలో నానబెట్టినవి)", "1 tbsp హోల్ మిల్క్ లేదా ఓట్ మిల్క్ (బ్లెండింగ్ స్థిరత్వం సర్దడానికి అవసరమైతే)", "ఐచ్ఛిక గార్నిష్: హెంప్ గింజల చల్లు లేదా సన్నగా కోసిన తాజా స్ట్రాబెర్రీలు"], "steps": ["Prep Blender: Place the silken tofu, ripe avocado, banana, cocoa powder, vanilla extract, and maple syrup (or soaked dates) into a high-speed blender or mini food processor.", "Puree: Blend on high for 45–60 seconds, scraping down the sides as needed, until completely smooth, glossy, and velvety with no visible avocado or tofu flecks.", "Chill: Spoon the pudding into small toddler cups or ramekins. Chill in the refrigerator for at least 30 minutes to let the pudding set and flavors meld.", "Serve: Garnish with fresh berry slices or hemp hearts and serve with a toddler spoon."], "steps_te": ["బ్లెండర్ సిద్ధం చేయండి: సిల్కెన్ టోఫు, పండిన అవకాడో, అరటిపండు, కోకో పొడి, వనిల్లా ఎక్స్‌ట్రాక్ట్, మేపుల్ సిరప్ (లేదా నానబెట్టిన ఖర్జూరాలు)ను హై-స్పీడ్ బ్లెండర్ లేదా మినీ ఫుడ్ ప్రాసెసర్‌లో వేయండి.", "ప్యూరీ చేయండి: అవసరమైనప్పుడు పక్కలు తుడుస్తూ, 45–60 seconds పాటు హై స్పీడ్‌లో బ్లెండ్ చేయండి, అవకాడో లేదా టోఫు ముక్కలు ఏమీ కనిపించకుండా పూర్తిగా మెత్తగా, మెరిసేలా, మృదువుగా అయ్యేవరకు.", "చల్లబరచండి: పుడ్డింగ్‌ను చిన్న పసిపిల్లల కప్పులు లేదా రామెకిన్స్‌లో వేయండి. పుడ్డింగ్ గట్టిపడి, రుచులు కలిసేలా కనీసం 30 minutes పాటు ఫ్రిజ్‌లో చల్లబరచండి.", "వడ్డించండి: తాజా బెర్రీ ముక్కలు లేదా హెంప్ హార్ట్స్‌తో గార్నిష్ చేసి పసిపిల్లల చెంచాతో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:56.680Z"}, {"n": 53, "title": "Crispy Air Fryer Tofu", "title_te": "క్రిస్పీ ఎయిర్ ఫ్రైయర్ టోఫు", "cat": "Adult", "section": "adult", "emoji": "🍢", "image": "https://www.heynutritionlady.com/wp-content/uploads/2025/10/Crispy-Seasoned-Air-Fryer-Tofu-SQ.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "A fast, high-protein dish featuring crispy cubed tofu seasoned with Ching's Dark Soy Sauce, corn flour, and aromatic spices.", "desc_te": "చింగ్స్ డార్క్ సోయా సాస్, కార్న్ ఫ్లోర్ మరియు సుగంధ దినుసులతో రుచి చేసిన క్రిస్పీ టోఫు ముక్కలతో కూడిన వేగవంతమైన, అధిక ప్రోటీన్ వంటకం.", "tags": [], "ing": ["1 block (14–16 oz) extra-firm tofu", "1 tbsp olive oil (or sesame oil)", "1.5 tsp Ching's Dark Soy Sauce", "1 tbsp corn flour (or cornstarch)", "1/2 tsp garlic powder", "1/2 tsp paprika", "1/4 tsp freshly cracked black pepper"], "ing_te": ["1 block (14–16 oz) ఎక్స్ట్రా-ఫర్మ్ టోఫు", "1 tbsp ఆలివ్ ఆయిల్ (లేదా నువ్వుల నూనె)", "1.5 tsp చింగ్స్ డార్క్ సోయా సాస్", "1 tbsp కార్న్ ఫ్లోర్ (లేదా కార్న్‌స్టార్చ్)", "1/2 tsp వెల్లుల్లి పొడి", "1/2 tsp పప్రికా", "1/4 tsp తాజాగా పొడి చేసిన నల్ల మిరియాలు"], "steps": ["Press and Drain Tofu: Wrap the tofu block in clean paper towels or a dish towel. Place a heavy weight (such as a skillet or cutting board) on top for 10–15 minutes to remove excess moisture.", "Cut into Cubes: Slice the pressed tofu block into bite-sized 3/4-inch cubes (or tear into textured bite-sized chunks for extra crispiness).", "Season Liquids: Transfer tofu cubes to a mixing bowl. Drizzle with 1 tbsp olive oil and 1.5 tsp Ching's Dark Soy Sauce. Gently toss until evenly coated.", "Coat Dry Ingredients: Sprinkle 1 tbsp corn flour, 1/2 tsp garlic powder, 1/2 tsp paprika, and 1/4 tsp black pepper over the tofu. Toss gently until all pieces are lightly and evenly coated.", "Air Fry: Preheat your air fryer to 400°F (200°C). Arrange the coated tofu in a single layer in the basket. Cook for 12 to 15 minutes, shaking the basket halfway through for even crisping.", "Serve: Remove once deep golden-brown and crispy. Serve warm."], "steps_te": ["టోఫును నొక్కి నీరు తీసేయండి: టోఫు బ్లాక్‌ను శుభ్రమైన పేపర్ టవల్స్ లేదా డిష్ టవల్‌లో చుట్టండి. అదనపు తేమ తొలగించడానికి 10–15 minutes పాటు దానిపై భారీ బరువు (పాన్ లేదా కటింగ్ బోర్డ్ వంటిది) ఉంచండి.", "ముక్కలుగా కత్తిరించండి: నొక్కిన టోఫు బ్లాక్‌ను కొరకడానికి వీలైన 3/4-inch ముక్కలుగా కత్తిరించండి (ఎక్కువ క్రిస్పీగా ఉండటానికి చిన్న చిన్న ముక్కలుగా చింపవచ్చు).", "ద్రవ పదార్థాలతో రుచి చేయండి: టోఫు ముక్కలను మిక్సింగ్ బౌల్‌లోకి తీసుకోండి. దానిపై 1 tbsp ఆలివ్ ఆయిల్ మరియు 1.5 tsp చింగ్స్ డార్క్ సోయా సాస్ చల్లండి. సమానంగా పట్టేలా మెల్లగా కలపండి.", "పొడి పదార్థాలతో పూత పూయండి: టోఫుపై 1 tbsp కార్న్ ఫ్లోర్, 1/2 tsp వెల్లుల్లి పొడి, 1/2 tsp పప్రికా మరియు 1/4 tsp నల్ల మిరియాలు చల్లండి. అన్ని ముక్కలకు తేలికగా, సమానంగా పట్టేలా మెల్లగా కలపండి.", "ఎయిర్ ఫ్రై చేయండి: మీ ఎయిర్ ఫ్రైయర్‌ను 400°F (200°C) వరకు వేడి చేయండి. పూత పూసిన టోఫును బాస్కెట్‌లో ఒకే పొరగా అమర్చండి. సమానంగా క్రిస్పీ అవ్వడానికి మధ్యలో బాస్కెట్‌ను కదిలిస్తూ 12 to 15 minutes వండండి.", "వడ్డించండి: బంగారు రంగులో, క్రిస్పీగా అయిన తర్వాత తీసేయండి. వేడిగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:25.555Z"}, {"n": 90, "title": "Crispy Air-Fryer Paneer Popcorn Bites", "title_te": "క్రిస్పీ ఎయిర్-ఫ్రైయర్ పనీర్ పాప్‌కార్న్ బైట్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🧀", "image": "https://www.cookwithkushi.com/wp-content/uploads/2025/10/paneer_popcorn_nuggets_01.jpg", "prep": "10 minutes", "cook": "8 minutes", "yield": "18–20 mini bites (3–4 toddler portions)", "desc": "Tender, golden popcorn-style bites featuring protein- and calcium-packed fresh paneer. Cut into bite-sized cubes, lightly tossed in mild aromatic spices, and coated in fine oat flour or whole wheat breadcrumbs, they air-fry into a lightly crisp exterior while keeping the center soft, warm, and easy for toddlers to chew.", "desc_te": "ప్రోటీన్, కాల్షియం నిండిన తాజా పనీర్‌తో చేసిన మెత్తని, బంగారు రంగు పాప్‌కార్న్ తరహా బైట్స్. చిన్న ముక్కలుగా కత్తిరించి, మైల్డ్ సువాసనగల మసాలాల్లో తేలికగా దొర్లించి, సన్నని ఓట్ పిండి లేదా హోల్ వీట్ బ్రెడ్‌క్రంబ్స్‌తో పూత వేసిన ఇవి ఎయిర్-ఫ్రైయర్‌లో బయట తేలికగా క్రిస్పీగా అవుతూ, లోపల మెత్తగా, వెచ్చగా, పసిపిల్లలు నమలడానికి సులభంగా ఉంటాయి.", "tags": [], "ing": ["150g (approx. 1 cup) fresh paneer, cut into 1/2-inch toddler bite-sized cubes", "1 tbsp whole-milk plain Greek yogurt (or milk)", "1/3 cup fine whole wheat breadcrumbs or finely ground rolled oats", "1/4 tsp ground roasted cumin", "1/4 tsp mild garlic powder", "1/8 tsp mild turmeric powder", "1 tbsp olive oil or avocado oil spray", "Optional for serving: Mild cucumber-mint yogurt dip or avocado mash"], "ing_te": ["150g (సుమారు 1 cup) తాజా పనీర్, 1/2-inch పసిపిల్లల కాటు పరిమాణ ముక్కలుగా కత్తిరించినది", "1 tbsp హోల్-మిల్క్ ప్లెయిన్ గ్రీక్ పెరుగు (లేదా పాలు)", "1/3 cup సన్నని హోల్ వీట్ బ్రెడ్‌క్రంబ్స్ లేదా సన్నగా పొడి చేసిన రోల్డ్ ఓట్స్", "1/4 tsp వేయించిన జీలకర్ర పొడి", "1/4 tsp మైల్డ్ వెల్లుల్లి పొడి", "1/8 tsp మైల్డ్ పసుపు పొడి", "1 tbsp ఆలివ్ ఆయిల్ లేదా అవకాడో ఆయిల్ స్ప్రే", "వడ్డించడానికి ఐచ్ఛికం: మైల్డ్ దోసకాయ-పుదీనా పెరుగు డిప్ లేదా అవకాడో మాష్"], "steps": ["Prep Paneer: Cut paneer into uniform 1/2-inch cubes. Pat dry gently with a clean paper towel.", "Season & Batter: In a small bowl, mix the Greek yogurt with cumin, garlic powder, and turmeric. Gently fold in the paneer cubes until each piece is lightly and evenly coated.", "Coat: Place the breadcrumbs or oat flour in a shallow bowl. Dredge the coated paneer cubes in the breadcrumbs until covered on all sides.", "Air Fry: Preheat air fryer to 375°F (190°C). Place the paneer bites in a single layer in the air fryer basket (do not overcrowd). Lightly spray or brush with olive oil.", "Cook: Air fry for 6–8 minutes, shaking the basket gently at the 4-minute mark, until lightly golden and crispy on the outside. (Oven alternative: Bake on a parchment-lined sheet at 400°F / 200°C for 10–12 minutes).", "Cool & Serve: Allow to cool for 3–5 minutes until pleasantly warm. Serve alongside a soothing yogurt dip."], "steps_te": ["పనీర్ సిద్ధం చేయండి: పనీర్‌ను సమానమైన 1/2-inch ముక్కలుగా కత్తిరించండి. శుభ్రమైన పేపర్ టవల్‌తో మెల్లగా తుడవండి.", "మసాలా & బ్యాటర్: చిన్న గిన్నెలో గ్రీక్ పెరుగును జీలకర్ర, వెల్లుల్లి పొడి, పసుపుతో కలపండి. పనీర్ ముక్కలను మెల్లగా కలిపి ప్రతి ముక్కకు తేలికగా, సమానంగా పూత పట్టేలా చేయండి.", "పూత వేయండి: బ్రెడ్‌క్రంబ్స్ లేదా ఓట్ పిండిని లోతులేని గిన్నెలో ఉంచండి. పూత వేసిన పనీర్ ముక్కలను అన్ని వైపులా కప్పబడేవరకు బ్రెడ్‌క్రంబ్స్‌లో దొర్లించండి.", "ఎయిర్ ఫ్రై చేయండి: ఎయిర్ ఫ్రైయర్‌ను 375°F (190°C) వద్ద ప్రీహీట్ చేయండి. పనీర్ బైట్స్‌ను ఎయిర్ ఫ్రైయర్ బాస్కెట్‌లో ఒకే పొరలో ఉంచండి (ఎక్కువగా నింపవద్దు). ఆలివ్ ఆయిల్‌ను తేలికగా స్ప్రే చేయండి లేదా బ్రష్ చేయండి.", "ఉడికించండి: 6–8 minutes పాటు ఎయిర్ ఫ్రై చేయండి, 4-minute మార్క్ వద్ద బాస్కెట్‌ను మెల్లగా కదిలిస్తూ, బయట తేలికగా బంగారు రంగు, క్రిస్పీగా అయ్యేవరకు. (ఓవెన్ ప్రత్యామ్నాయం: పార్చ్‌మెంట్ పరచిన షీట్‌పై 400°F / 200°C వద్ద 10–12 minutes బేక్ చేయండి).", "చల్లార్చి వడ్డించండి: ఆహ్లాదకరంగా వెచ్చగా అయ్యేవరకు 3–5 minutes చల్లారనివ్వండి. ఓదార్పునిచ్చే పెరుగు డిప్‌తో పాటు వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:26.756Z"}, {"n": 120, "title": "Crispy Baked Sesame Tofu Nuggets", "title_te": "క్రిస్పీ బేక్డ్ నువ్వుల టోఫు నగ్గెట్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍢", "image": "https://missmemesplace.com/wp-content/uploads/2025/11/crispy_sesame_tofu_nuggets_2.png", "prep": "—", "cook": "—", "yield": "—", "desc": "Meal Type", "desc_te": "భోజన రకం", "tags": [], "ing": ["1 block (14 oz) extra-firm tofu, pressed and cut into bite-sized cubes", "1 tbsp olive oil or avocado oil", "1 tbsp low-sodium soy sauce or tamari", "2 tbsp cornstarch", "1 tbsp sesame seeds", "1 tbsp nutritional yeast (optional, for extra flavor & B-vitamins)"], "ing_te": ["1 block (14 oz) ఎక్స్‌ట్రా-ఫర్మ్ టోఫు, నొక్కి చిన్న ముక్కలుగా కోసినది", "1 tbsp ఆలివ్ నూనె లేదా అవకాడో నూనె", "1 tbsp తక్కువ సోడియం సోయా సాస్ లేదా తమారి", "2 tbsp కార్న్‌స్టార్చ్", "1 tbsp నువ్వులు", "1 tbsp న్యూట్రిషనల్ ఈస్ట్ (optional, అదనపు రుచి & B-విటమిన్ల కోసం)"], "steps": ["Preheat oven to 400°F (200°C) and line a baking tray with parchment paper. In a bowl, toss the tofu cubes gently with olive oil and low-sodium soy sauce. Sprinkle cornstarch, sesame seeds, and nutritional yeast over the tofu. Gently toss until evenly coated. Arrange tofu cubes in a single layer on the prepared baking tray, leaving space between pieces. Bake for 20 minutes, flipping halfway, until golden and crispy on the outside while soft inside. Cool before serving."], "steps_te": ["ఓవెన్‌ను 400°F (200°C) వద్ద ప్రీహీట్ చేసి బేకింగ్ ట్రేను పార్చ్‌మెంట్ పేపర్‌తో లైన్ చేయండి. ఒక గిన్నెలో టోఫు ముక్కలను ఆలివ్ నూనె మరియు తక్కువ సోడియం సోయా సాస్‌తో మెల్లగా కలపండి. టోఫుపై కార్న్‌స్టార్చ్, నువ్వులు మరియు న్యూట్రిషనల్ ఈస్ట్ చల్లండి. సమానంగా పూసేవరకు మెల్లగా కలపండి. సిద్ధం చేసిన బేకింగ్ ట్రేపై టోఫు ముక్కలను మధ్యలో ఖాళీతో ఒకే పొరలో అమర్చండి. బయట బంగారు రంగులో క్రిస్పీగా మరియు లోపల మృదువుగా అయ్యేవరకు మధ్యలో తిప్పుతూ 20 minutes బేక్ చేయండి. వడ్డించే ముందు చల్లారనివ్వండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:18.838Z"}, {"n": 108, "title": "Crispy Baked Sweet Potato & Black Bean Taquitos", "title_te": "క్రిస్పీ బేక్ చేసిన చిలగడదుంప & బ్లాక్ బీన్ టాకిటోస్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🥗", "image": "https://www.purelykaylie.com/wp-content/uploads/2020/04/Sweet-Potato-Black-Bean-Taquitos-450K.jpg", "prep": "15 minutes", "cook": "20 minutes", "yield": "8 mini taquitos (3–4 toddler servings)", "desc": "Inspired by Super Healthy Kids and Peas and Crayons", "desc_te": "సూపర్ హెల్తీ కిడ్స్ మరియు పీస్ అండ్ క్రేయాన్స్ నుండి ప్రేరణ పొందినది", "tags": [], "ing": ["1 medium sweet potato, baked or steamed until fork-tender and peeled (approx. 1 cup mashed)", "1 cup cooked black beans (rinsed and drained if canned), lightly mashed", "1/2 cup shredded mild cheddar cheese (or Monterey Jack)", "1/2 tsp ground cumin", "1/4 tsp mild garlic powder", "1/4 tsp mild smoked paprika", "1 tbsp olive oil (or avocado oil)", "8 small (5-to-6-inch) soft yellow corn or whole wheat tortillas", "Optional for serving: Mashed avocado or whole-milk plain Greek yogurt for dipping"], "ing_te": ["1 medium చిలగడదుంప, ఫోర్క్‌తో గుచ్చితే మెత్తగా అయ్యేవరకు బేక్ చేసిన లేదా ఆవిరిపై ఉడికించినది, పొట్టు తీసినది (సుమారు 1 cup మెదిపినది)", "1 cup వండిన బ్లాక్ బీన్స్ (క్యాన్‌వి అయితే కడిగి నీరు వంపేసినవి), తేలికగా మెదిపినవి", "1/2 cup తురిమిన మైల్డ్ చెడార్ చీజ్ (లేదా మాంటెరీ జాక్)", "1/2 tsp జీలకర్ర పొడి", "1/4 tsp మైల్డ్ వెల్లుల్లి పొడి", "1/4 tsp మైల్డ్ స్మోక్డ్ పప్రికా", "1 tbsp ఆలివ్ ఆయిల్ (లేదా అవకాడో ఆయిల్)", "8 small (5-to-6-inch) మెత్తని పసుపు కార్న్ లేదా హోల్ వీట్ టోర్టిల్లాలు", "వడ్డించడానికి ఐచ్ఛికం: డిప్పింగ్ కోసం మెదిపిన అవకాడో లేదా హోల్-మిల్క్ ప్లెయిన్ గ్రీక్ పెరుగు"], "steps": ["Preheat & Prep: Preheat your oven to 425°F (220°C). Line a large baking sheet with parchment paper and lightly brush or spray with oil.", "Make the Filling: In a mixing bowl, mash the warm sweet potato and black beans together with a fork or potato masher, leaving a little texture but avoiding whole rolling beans.", "Season: Stir in the ground cumin, garlic powder, smoked paprika, and shredded cheddar cheese until well combined.", "Warm Tortillas: Wrap tortillas in a damp paper towel and warm in the microwave for 20–25 seconds so they become soft, pliable, and easy to roll without tearing.", "Roll Taquitos: Spoon approximately 2 tablespoons of filling down the center of each tortilla. Roll tightly and place seam-side down on the prepared baking sheet.", "Bake: Lightly brush the tops of the rolled taquitos with olive oil. Bake for 18–20 minutes (flipping halfway through) until the edges are golden and lightly crispy. (Air-fryer alternative: 375°F for 8–10 minutes).", "Serve: Let cool for 5 minutes, then cut in halves or thirds for easy toddler gripping. Serve with a dollop of Greek yogurt or mashed avocado."], "steps_te": ["ప్రీహీట్ & సిద్ధం: మీ ఓవెన్‌ను 425°F (220°C) వద్ద ప్రీహీట్ చేయండి. పెద్ద బేకింగ్ షీట్‌పై పార్చ్‌మెంట్ పేపర్ పరచి నూనెను తేలికగా బ్రష్ చేయండి లేదా స్ప్రే చేయండి.", "ఫిల్లింగ్ తయారుచేయండి: మిక్సింగ్ గిన్నెలో వెచ్చని చిలగడదుంప, బ్లాక్ బీన్స్‌ను ఫోర్క్ లేదా పొటాటో మాషర్‌తో కలిపి మెదపండి, కొద్దిగా ఆకృతి ఉంచుతూ కానీ పూర్తి గుండ్రని బీన్స్ లేకుండా.", "మసాలా వేయండి: జీలకర్ర పొడి, వెల్లుల్లి పొడి, స్మోక్డ్ పప్రికా, తురిమిన చెడార్ చీజ్‌ను బాగా కలిసేవరకు కలపండి.", "టోర్టిల్లాలు వేడి చేయండి: టోర్టిల్లాలను తడి పేపర్ టవల్‌లో చుట్టి 20–25 seconds పాటు మైక్రోవేవ్‌లో వేడి చేయండి, అవి చిరిగిపోకుండా చుట్టడానికి మెత్తగా, వంగేలా అయ్యేలా.", "టాకిటోస్ చుట్టండి: ప్రతి టోర్టిల్లా మధ్యలో సుమారు 2 tablespoons ఫిల్లింగ్ వేయండి. గట్టిగా చుట్టి, సీమ్ వైపు కింద ఉండేలా సిద్ధం చేసిన బేకింగ్ షీట్‌పై ఉంచండి.", "బేక్ చేయండి: చుట్టిన టాకిటోస్ పైన ఆలివ్ ఆయిల్‌ను తేలికగా బ్రష్ చేయండి. 18–20 minutes పాటు బేక్ చేయండి (మధ్యలో తిప్పుతూ), అంచులు బంగారు రంగు, తేలికగా క్రిస్పీగా అయ్యేవరకు. (ఎయిర్-ఫ్రైయర్ ప్రత్యామ్నాయం: 375°F వద్ద 8–10 minutes).", "వడ్డించండి: 5 minutes చల్లారనివ్వండి, తర్వాత పసిపిల్లలు సులభంగా పట్టుకోవడానికి సగాలుగా లేదా మూడు భాగాలుగా కత్తిరించండి. గ్రీక్ పెరుగు లేదా మెదిపిన అవకాడో డాలప్‌తో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:56.569Z"}, {"n": 86, "title": "Crispy Baked Tofu \"Fishless\" Sticks with Mild Tartar Dip", "title_te": "క్రిస్పీ బేక్డ్ టోఫు \"ఫిష్‌లెస్\" స్టిక్స్, మైల్డ్ టార్టార్ డిప్‌తో", "cat": "Kid & Toddler", "section": "kid", "emoji": "🐟", "image": "https://i.pinimg.com/originals/12/70/14/127014ae24c3d12f692a5e4e0d8bc59d.jpg", "prep": "15 minutes", "cook": "20 minutes", "yield": "12–14 finger sticks (3–4 toddler servings)", "desc": "A fun, plant-based twist on classic fish sticks. Extra-firm tofu is sliced into sturdy batons, lightly seasoned with dried dill, garlic powder, and fresh lemon juice, then coated in golden panko breadcrumbs. Baked or air-fried until delightfully crunchy on the outside while remaining tender inside, these sticks are paired with a probiotic-rich Greek yogurt tartar dip.", "desc_te": "క్లాసిక్ ఫిష్ స్టిక్స్‌పై సరదా, వృక్ష ఆధారిత ట్విస్ట్. ఎక్స్‌ట్రా-ఫర్మ్ టోఫును గట్టి బాటన్‌లుగా కోసి, ఎండిన దిల్, వెల్లుల్లి పొడి మరియు తాజా నిమ్మరసంతో తేలికగా సీజన్ చేసి, తర్వాత బంగారు పాంకో బ్రెడ్‌క్రంబ్స్‌లో పూత వేస్తారు. బయట ఆహ్లాదకరంగా కరకరలాడేవరకు, లోపల మెత్తగా ఉండేవరకు బేక్ లేదా ఎయిర్-ఫ్రై చేస్తారు, ప్రోబయోటిక్ అధికంగా ఉండే గ్రీక్ పెరుగు టార్టార్ డిప్‌తో జత చేస్తారు.", "tags": [], "ing": ["For the Tofu Sticks:", "1 block (14 oz) extra-firm organic tofu, pressed with a kitchen towel for 15 minutes to remove excess moisture", "2 tbsp cornstarch or arrowroot starch", "1/4 cup whole milk (or unsweetened fortified soy milk)", "3/4 cup whole wheat panko breadcrumbs (or fine breadcrumbs)", "1 tbsp nutritional yeast (for savory depth and B vitamins)", "1/2 tsp dried dill weed", "1/4 tsp garlic powder", "1/4 tsp onion powder", "1 tbsp olive oil or avocado oil spray", "For the Mild Toddler Tartar Dip:", "1/3 cup whole-milk plain Greek yogurt", "1 tbsp finely grated cucumber (or mild dill pickle, minced very fine)", "1 tsp fresh lemon juice", "1/2 tsp olive oil"], "ing_te": ["టోఫు స్టిక్స్ కోసం:", "1 block (14 oz) ఎక్స్‌ట్రా-ఫర్మ్ ఆర్గానిక్ టోఫు, అదనపు తేమ తొలగించడానికి కిచెన్ టవల్‌తో 15 minutes నొక్కినది", "2 tbsp కార్న్‌స్టార్చ్ లేదా ఆరోరూట్ స్టార్చ్", "1/4 cup హోల్ మిల్క్ (లేదా తీపి లేని ఫోర్టిఫైడ్ సోయా మిల్క్)", "3/4 cup హోల్ వీట్ పాంకో బ్రెడ్‌క్రంబ్స్ (లేదా సన్నని బ్రెడ్‌క్రంబ్స్)", "1 tbsp న్యూట్రిషనల్ ఈస్ట్ (రుచికరమైన లోతు మరియు B విటమిన్ల కోసం)", "1/2 tsp ఎండిన దిల్ వీడ్", "1/4 tsp వెల్లుల్లి పొడి", "1/4 tsp ఉల్లిపాయ పొడి", "1 tbsp ఆలివ్ నూనె లేదా అవకాడో ఆయిల్ స్ప్రే", "మైల్డ్ టాడ్లర్ టార్టార్ డిప్ కోసం:", "1/3 cup హోల్-మిల్క్ సాదా గ్రీక్ పెరుగు", "1 tbsp సన్నగా తురిమిన దోసకాయ (లేదా మైల్డ్ దిల్ పికిల్, చాలా సన్నగా తరిగినది)", "1 tsp తాజా నిమ్మరసం", "1/2 tsp ఆలివ్ నూనె"], "steps": ["Slice Tofu: Cut the pressed tofu block lengthwise into 1/2-inch thick slabs, then cut across into finger-length sticks (about 3 inches long and 1/2 inch wide). Setup Breading Station:", "Bowl 1: Whisk together cornstarch and milk to make a smooth slurry.", "Bowl 2: Combine panko breadcrumbs, nutritional yeast, dried dill, garlic powder, and onion powder.", "Coat Sticks: Dip each tofu stick into the milk-cornstarch slurry, let excess drip off, then roll thoroughly in the seasoned panko mixture, gently pressing crumbs onto all sides. Bake / Air Fry:", "Oven Method: Preheat oven to 400°F (200°C). Arrange sticks on a parchment-lined baking sheet and lightly spray with olive oil. Bake for 18–20 minutes, flipping halfway through, until golden brown and crispy.", "Air Fryer Method: Air fry at 375°F (190°C) for 10–12 minutes, shaking the basket halfway through.", "Make Dip: Stir together Greek yogurt, grated cucumber/pickle, lemon juice, and olive oil in a small dish.", "Serve: Let tofu sticks cool for 5 minutes until safely warm. Serve alongside the tartar dip for interactive finger-dipping."], "steps_te": ["టోఫు ముక్కలు కోయండి: నొక్కిన టోఫు బ్లాక్‌ను పొడవుగా 1/2-inch మందం గల స్లాబ్‌లుగా కోసి, తర్వాత అడ్డంగా వేలు పొడవు స్టిక్స్‌గా (సుమారు 3 inches పొడవు మరియు 1/2 inch వెడల్పు) కోయండి. బ్రెడ్డింగ్ స్టేషన్ సిద్ధం చేయండి:", "బౌల్ 1: కార్న్‌స్టార్చ్ మరియు పాలను గిలకొట్టి మెత్తని స్లర్రీ చేయండి.", "బౌల్ 2: పాంకో బ్రెడ్‌క్రంబ్స్, న్యూట్రిషనల్ ఈస్ట్, ఎండిన దిల్, వెల్లుల్లి పొడి మరియు ఉల్లిపాయ పొడి కలపండి.", "స్టిక్స్‌కు పూత వేయండి: ప్రతి టోఫు స్టిక్‌ను పాలు-కార్న్‌స్టార్చ్ స్లర్రీలో ముంచి, అదనపు ద్రవం కారనిచ్చి, తర్వాత సీజన్ చేసిన పాంకో మిశ్రమంలో బాగా దొర్లించి, అన్ని వైపులా ముక్కలు గట్టిగా నొక్కండి. బేక్ / ఎయిర్ ఫ్రై:", "ఓవెన్ పద్ధతి: ఓవెన్‌ను 400°F (200°C) వద్ద ప్రీహీట్ చేయండి. పార్చ్‌మెంట్ వేసిన బేకింగ్ షీట్‌పై స్టిక్స్‌ను అమర్చి ఆలివ్ నూనెను తేలికగా స్ప్రే చేయండి. బంగారు గోధుమ రంగులో, కరకరలాడేవరకు సగంలో తిప్పుతూ 18–20 minutes బేక్ చేయండి.", "ఎయిర్ ఫ్రైయర్ పద్ధతి: 375°F (190°C) వద్ద 10–12 minutes ఎయిర్ ఫ్రై చేయండి, సగంలో బాస్కెట్‌ను కదిలించండి.", "డిప్ చేయండి: ఒక చిన్న డిష్‌లో గ్రీక్ పెరుగు, తురిమిన దోసకాయ/పికిల్, నిమ్మరసం మరియు ఆలివ్ నూనె కలపండి.", "వడ్డించండి: టోఫు స్టిక్స్‌ను 5 minutes చల్లారనివ్వండి, సురక్షితంగా గోరువెచ్చగా అయ్యేవరకు. ఇంటరాక్టివ్ వేలు-ముంచడం కోసం టార్టార్ డిప్‌తో పాటు వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:26.651Z"}, {"n": 137, "title": "Crispy Baked Tofu Chips", "title_te": "క్రిస్పీ బేక్డ్ టోఫు చిప్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍢", "image": "https://thecrookedcarrot.com/wp-content/uploads/2020/03/crispy-baked-tofu-4.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "A thin, crunchy alternative to store-bought crackers that makes a fantastic snack for developing fine motor skills.", "desc_te": "దుకాణంలో కొన్న క్రాకర్లకు బదులుగా సన్నని, కరకరలాడే ప్రత్యామ్నాయం; చిన్నారి చేతి నైపుణ్యాల అభివృద్ధికి అద్భుతమైన స్నాక్.", "tags": [], "ing": ["1/2 block firm tofu", "1 tablespoon avocado oil or melted ghee", "1/2 teaspoon garlic powder", "1/4 teaspoon turmeric (for color and anti-inflammatory benefits)"], "ing_te": ["1/2 బ్లాక్ గట్టి టోఫు", "1 tablespoon అవకాడో నూనె లేదా కరిగించిన నెయ్యి", "1/2 teaspoon వెల్లుల్లి పొడి", "1/4 teaspoon పసుపు (రంగు, యాంటీ-ఇన్‌ఫ్లమేటరీ ప్రయోజనాల కోసం)"], "steps": ["Press the Tofu (Crucial for Crunch): Wrap the tofu block in a clean kitchen towel or paper towels. Place a heavy plate or skillet on top for 10–15 minutes to squeeze out as much water as possible. The drier the tofu, the crispier the chips will be.", "Slice Paper-Thin: Cut the tofu into ultra-thin slices (about 1/16-inch thick). Cut these slices into small squares or triangles that are easy for tiny hands to pick up.", "Season: Gently toss the thin slices in a bowl with the avocado oil, garlic powder, and turmeric until lightly and evenly coated.", "Bake: Preheat your oven to 180°C (350°F). Line a baking sheet with parchment paper and arrange the tofu slices in a single layer, making sure they do not overlap.", "Cook: Bake for 25–30 minutes, flipping them halfway through. Watch them closely during the last 5 minutes to prevent burning; they should finish golden brown and crisp.", "Cool: Let them cool completely on the baking sheet to achieve maximum crunch."], "steps_te": ["టోఫును నొక్కండి (కరకర కోసం కీలకం): టోఫు బ్లాక్‌ను శుభ్రమైన కిచెన్ టవల్ లేదా పేపర్ టవల్స్‌లో చుట్టండి. వీలైనంత నీటిని పిండేయడానికి పైన భారీ ప్లేట్ లేదా స్కిల్లెట్‌ను 10–15 minutes ఉంచండి. టోఫు ఎంత పొడిగా ఉంటే చిప్స్ అంత కరకరలాడతాయి.", "కాగితంలా సన్నగా కోయండి: టోఫును అతి సన్నని ముక్కలుగా (సుమారు 1/16-inch మందం) కోయండి. ఈ ముక్కలను చిన్న చతురస్రాలు లేదా త్రిభుజాలుగా కోయండి, చిన్న చేతులు సులభంగా పట్టుకోగలిగేలా.", "మసాలా వేయండి: సన్నని ముక్కలను గిన్నెలో అవకాడో నూనె, వెల్లుల్లి పొడి, పసుపుతో తేలికగా, సమానంగా పూత పట్టేవరకు మెల్లగా కలపండి.", "బేక్ చేయండి: ఓవెన్‌ను 180°C (350°F) వరకు వేడి చేయండి. బేకింగ్ షీట్‌పై పార్చ్మెంట్ పేపర్ పరచి, టోఫు ముక్కలను ఒకే పొరలో, ఒకదానిపై ఒకటి పడకుండా అమర్చండి.", "ఉడికించండి: 25–30 minutes బేక్ చేయండి, మధ్యలో తిప్పండి. కాలిపోకుండా చివరి 5 minutes దగ్గరగా గమనించండి; అవి బంగారు గోధుమ రంగులో, కరకరలాడుతూ పూర్తవ్వాలి.", "చల్లబరచండి: గరిష్ఠ కరకర కోసం బేకింగ్ షీట్‌పైనే పూర్తిగా చల్లబరచనివ్వండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.320Z"}, {"n": 30, "title": "Crispy Peri Peri Paneer Tacos with Fresh Salsa", "title_te": "క్రిస్పీ పెరి పెరి పనీర్ టాకోస్ మరియు తాజా సాల్సా", "cat": "Adult", "section": "adult", "emoji": "🌮", "image": "https://tb-static.uber.com/prod/image-proc/processed_images/f9b1ec5341e7137d34458d16a419520f/c67fc65e9b4e16a553eb7574fba090f1.jpeg", "prep": "15 minutes (marinade)", "cook": "about 5-6 minutes (paneer) plus toasting", "yield": "4 tacos", "desc": "Crispy peri peri paneer tacos with melted cheese and a fresh tomato-jalapeno salsa.", "desc_te": "కరిగిన చీజ్ మరియు తాజా టమోటా-జలపెనో సాల్సాతో చేసిన కరకరలాడే పెరి పెరి పనీర్ టాకోస్.", "tags": ["vegetarian", "contains dairy", "dinner", "snack"], "ing": ["300 g paneer cubes", "2 tbsp peri peri spice mix", "2 tbsp curd or Greek yogurt", "1 tsp lemon juice", "1 tbsp ginger-garlic paste", "Salt and pepper", "1 tbsp olive oil (for marinade)", "1/2 tbsp garlic powder", "1/2 tbsp chilli flakes", "1/2 tbsp parsley (optional)", "2 tbsp sriracha sauce", "1 tbsp olive oil (for cooking)", "2 tbsp chopped garlic", "4 taco-size tortillas", "Grated mozzarella or cheddar", "2 medium tomatoes, finely chopped", "1 medium onion, finely chopped", "4 tbsp jalapenos, finely chopped", "1/2 cup coriander leaves, chopped", "1/2 tsp salt (for salsa)", "1 tsp lemon juice (for salsa)", "Drizzle of olive oil (for salsa)"], "ing_te": ["300 g పనీర్ ముక్కలు", "2 tbsp పెరి పెరి స్పైస్ మిక్స్", "2 tbsp పెరుగు లేదా గ్రీక్ పెరుగు", "1 tsp నిమ్మరసం", "1 tbsp అల్లం-వెల్లుల్లి పేస్ట్", "ఉప్పు మరియు మిరియాలు", "1 tbsp ఆలివ్ నూనె (మ్యారినేడ్ కోసం)", "1/2 tbsp వెల్లుల్లి పొడి", "1/2 tbsp చిల్లీ ఫ్లేక్స్", "1/2 tbsp పార్స్లీ (ఐచ్ఛికం)", "2 tbsp శ్రీరాచా సాస్", "1 tbsp ఆలివ్ నూనె (వండటానికి)", "2 tbsp తరిగిన వెల్లుల్లి", "4 టాకో సైజు టార్టిల్లాలు", "తురిమిన మొజ్జారెల్లా లేదా చెడార్", "2 మధ్యస్థ టమోటాలు, సన్నగా తరిగినవి", "1 మధ్యస్థ ఉల్లిపాయ, సన్నగా తరిగినది", "4 tbsp జలపెనోలు, సన్నగా తరిగినవి", "1/2 cup కొత్తిమీర ఆకులు, తరిగినవి", "1/2 tsp ఉప్పు (సాల్సా కోసం)", "1 tsp నిమ్మరసం (సాల్సా కోసం)", "సాల్సా కోసం కొద్దిగా ఆలివ్ నూనె చిలకరించడం"], "steps": ["In a bowl mix the paneer cubes with peri peri spice, curd or yogurt, lemon juice, ginger-garlic paste, salt and pepper, olive oil, garlic powder, chilli flakes, parsley and sriracha; marinate 15 minutes.", "Heat 1 tbsp olive oil in a pan, add the chopped garlic and saute until golden.", "Add the marinated paneer and cook 5-6 minutes until slightly crispy.", "Place the tortillas on a hot tawa, sprinkle grated mozzarella or cheddar and fill with the paneer mixture.", "Fold and toast on the pan until golden and crispy.", "For the salsa, mix the tomatoes, onion, jalapenos, coriander, salt, lemon juice and a drizzle of olive oil.", "Serve the tacos with salsa and a dip of choice."], "steps_te": ["ఒక గిన్నెలో పనీర్ ముక్కలను పెరి పెరి స్పైస్, పెరుగు లేదా యోగర్ట్, నిమ్మరసం, అల్లం-వెల్లుల్లి పేస్ట్, ఉప్పు మరియు మిరియాలు, ఆలివ్ నూనె, వెల్లుల్లి పొడి, చిల్లీ ఫ్లేక్స్, పార్స్లీ మరియు శ్రీరాచాతో కలిపి 15 నిమిషాలు మ్యారినేట్ చేయండి.", "ఒక పాన్‌లో 1 tbsp ఆలివ్ నూనె వేడి చేసి, తరిగిన వెల్లుల్లి వేసి బంగారు రంగు వచ్చే వరకు వేయించండి.", "మ్యారినేట్ చేసిన పనీర్ వేసి కొద్దిగా కరకరలాడే వరకు 5-6 నిమిషాలు ఉడికించండి.", "టార్టిల్లాలను వేడి తవాపై ఉంచి, తురిమిన మొజ్జారెల్లా లేదా చెడార్ చల్లి, పనీర్ మిశ్రమంతో నింపండి.", "మడిచి, బంగారు రంగు వచ్చి కరకరలాడే వరకు పాన్‌లో కాల్చండి.", "సాల్సా కోసం టమోటాలు, ఉల్లిపాయ, జలపెనోలు, కొత్తిమీర, ఉప్పు, నిమ్మరసం మరియు కొద్దిగా ఆలివ్ నూనె కలపండి.", "టాకోస్‌ను సాల్సా మరియు ఇష్టమైన డిప్‌తో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:40.874Z"}, {"n": 42, "title": "Dates Oats Mini Cookies", "title_te": "ఖర్జూర ఓట్స్ మినీ కుకీలు", "cat": "Kid & Toddler", "section": "kid", "emoji": "🥣", "image": "https://ukmindonesia.id/uploads/cms/2026-03-02/ChatGPT-Image-Mar-2-2026-11_52_26-AM.png", "prep": "10 minutes (date soak)", "cook": "12-15 minutes at 170C (oven) or 8-10 minutes at 160C (air fryer)", "yield": "—", "desc": "Eggless mini cookies naturally sweetened with dates, soft and chewy inside and crisp outside.", "desc_te": "ఖర్జూరాలతో సహజంగా తీపి చేసిన, గుడ్లు లేని మినీ కుకీలు, లోపల మెత్తగా, నమిలేలా ఉండి బయట కరకరలాడుతాయి.", "tags": ["vegetarian", "snack"], "ing": ["1 cup (90 g) rolled oats", "1/2 cup (50 g) almond flour (or oat flour)", "10-12 soft dates (120 g), deseeded", "2 tbsp (32 g) peanut butter (optional)", "1/2 tsp baking powder", "1 tsp vanilla extract", "2-3 tbsp milk, if needed", "1-2 tbsp maple syrup or honey (optional, for extra sweetness)", "Chopped pistachios or other nuts, to top"], "ing_te": ["1 cup (90 g) రోల్డ్ ఓట్స్", "1/2 cup (50 g) బాదం పిండి (లేదా ఓట్ పిండి)", "10-12 మెత్తని ఖర్జూరాలు (120 g), గింజలు తీసినవి", "2 tbsp (32 g) వేరుశనగ వెన్న (ఐచ్ఛికం)", "1/2 tsp బేకింగ్ పౌడర్", "1 tsp వెనిల్లా ఎసెన్స్", "2-3 tbsp పాలు, అవసరమైతే", "1-2 tbsp మేపుల్ సిరప్ లేదా తేనె (ఐచ్ఛికం, మరింత తీపి కోసం)", "పైన వేయడానికి తరిగిన పిస్తాలు లేదా ఇతర గింజలు"], "steps": ["Soak the dates in warm water 10 minutes and blend into a smooth paste.", "Add the rolled oats, almond flour, baking powder, date paste, peanut butter and vanilla to a bowl; add maple syrup if using.", "Mix well; add milk only if needed.", "Shape into mini cookies and top with chopped pistachios.", "Oven: preheat to 170C for 10 minutes, then bake at 170C for 12-15 minutes until lightly golden.", "Air fryer: preheat to 170C for 3 minutes, then air fry at 160C for 8-10 minutes."], "steps_te": ["ఖర్జూరాలను గోరువెచ్చని నీటిలో 10 minutes నానబెట్టి, మెత్తని పేస్ట్‌లా బ్లెండ్ చేయండి.", "ఒక గిన్నెలో రోల్డ్ ఓట్స్, బాదం పిండి, బేకింగ్ పౌడర్, ఖర్జూర పేస్ట్, వేరుశనగ వెన్న మరియు వెనిల్లా వేయండి; వాడుతుంటే మేపుల్ సిరప్ వేయండి.", "బాగా కలపండి; అవసరమైతే మాత్రమే పాలు వేయండి.", "మినీ కుకీలుగా ఆకారం ఇచ్చి, పైన తరిగిన పిస్తాలు వేయండి.", "ఓవెన్: 170C కు 10 minutes ముందుగా వేడి చేసి, తర్వాత 170C వద్ద 12-15 minutes తేలికగా బంగారు రంగు వచ్చే వరకు కాల్చండి.", "ఎయిర్ ఫ్రైయర్: 170C కు 3 minutes ముందుగా వేడి చేసి, తర్వాత 160C వద్ద 8-10 minutes ఎయిర్ ఫ్రై చేయండి."], "notes": "Soft, chewy center suits toddlers; skip whole nut toppings (pistachios) for a toddler and use oat flour if nut-free is needed. Peanut butter is a common allergen: check for allergy.", "notes_te": "మెత్తని, నమిలే మధ్యభాగం పసిపిల్లలకు అనుకూలం; పసిపిల్లల కోసం మొత్తం గింజల టాపింగ్‌లను (పిస్తాలు) వదిలేయండి మరియు గింజలు లేకుండా కావాలంటే ఓట్ పిండి వాడండి. వేరుశనగ వెన్న సాధారణ అలర్జీ కారకం: అలర్జీ ఉందో లేదో చూసుకోండి.", "added_at": "2026-10-22T16:04:06.540Z"}, {"n": 65, "title": "Double Chocolate Veggie Muffins", "title_te": "డబుల్ చాక్లెట్ వెజ్జీ మఫిన్స్", "cat": "Adult", "section": "adult", "emoji": "🍳", "image": "https://sarahremmer.com/wp-content/uploads/2026/03/beauty-shot-of-triple-veggie-chocolate-muffins-scaled.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "This recipe for double chocolate veggie muffins, inspired by The Balanced Nutritionist, is a nutrient-dense snack perfect for meal prep. It incorporates three cups of vegetables into the batter, making it an excellent way to boost fiber and nutrient intake.", "desc_te": "ది బ్యాలెన్స్‌డ్ న్యూట్రిషనిస్ట్ నుంచి ప్రేరణ పొందిన ఈ డబుల్ చాక్లెట్ వెజ్జీ మఫిన్స్ రెసిపీ మీల్ ప్రెప్‌కు సరైన పోషకాలు అధికంగా ఉన్న స్నాక్. ఇది బ్యాటర్‌లో మూడు కప్పుల కూరగాయలను కలుపుతుంది, ఫైబర్ మరియు పోషకాల తీసుకోవడం పెంచడానికి అద్భుతమైన మార్గం.", "tags": [], "ing": ["Category", "Ingredient", "Dry", "1 1/2 cups white whole wheat flour (or regular whole wheat)", "Dry", "1/3 cup Dutch-process cocoa powder", "Dry", "1 tsp baking powder", "Dry", "1 tsp baking soda", "Dry", "1/2 tsp salt", "Dry", "1/2–2/3 cup mini chocolate chips (plus extra for topping)", "Wet", "1 cup carrots, grated", "Wet", "1 cup zucchini, grated", "Wet", "1 cup baby spinach", "Wet", "1/2 cup plain Greek yogurt", "Wet", "1/2 cup honey (or maple syrup)", "Wet", "1/4 cup avocado oil (or any neutral oil)", "Wet", "2 eggs", "Wet", "1 tsp vanilla extract"], "ing_te": ["వర్గం", "పదార్థం", "పొడి", "1 1/2 cups వైట్ హోల్ వీట్ పిండి (లేదా సాధారణ హోల్ వీట్)", "పొడి", "1/3 cup డచ్-ప్రాసెస్ కోకో పౌడర్", "పొడి", "1 tsp బేకింగ్ పౌడర్", "పొడి", "1 tsp బేకింగ్ సోడా", "పొడి", "1/2 tsp ఉప్పు", "పొడి", "1/2–2/3 cup మినీ చాక్లెట్ చిప్స్ (పైన వేయడానికి అదనంగా)", "తడి", "1 cup క్యారెట్లు, తురిమినవి", "తడి", "1 cup జుచిని, తురిమినది", "తడి", "1 cup బేబీ పాలకూర", "తడి", "1/2 cup సాదా గ్రీక్ పెరుగు", "తడి", "1/2 cup తేనె (లేదా మేపుల్ సిరప్)", "తడి", "1/4 cup అవకాడో ఆయిల్ (లేదా ఏదైనా తటస్థ నూనె)", "తడి", "2 గుడ్లు", "తడి", "1 tsp వెనిల్లా ఎక్స్‌ట్రాక్ట్"], "steps": ["Prep: Preheat your oven to 350°F (175°C) and line a 12-tin muffin pan with liners.", "Mix Dry Ingredients: In a large bowl, whisk together the flour, cocoa powder, baking powder, baking soda, and salt. Set aside.", "Blend Wet Ingredients: Add all the wet ingredients (grated carrots, zucchini, baby spinach, Greek yogurt, honey, oil, eggs, and vanilla) into a high-speed blender. Blend on high until completely smooth, scraping down the sides as needed.", "Combine: Pour the blended wet mixture into the bowl with the dry ingredients. Stir gently until just combined. Be careful not to overmix.", "Add Chips: Gently fold in the mini chocolate chips using a rubber spatula.", "Bake: Scoop the batter evenly into the muffin tins. Sprinkle extra chocolate chips on top if desired. Bake for 18–24 minutes, or until a toothpick inserted into the center comes out clean.", "Cool: Allow the muffins to cool completely on a wire rack before storing."], "steps_te": ["సిద్ధం చేయండి: మీ ఓవెన్‌ను 350°F (175°C) వద్ద వేడి చేసి, 12-టిన్ మఫిన్ పాన్‌లో లైనర్లు వేయండి.", "పొడి పదార్థాలు కలపండి: పెద్ద గిన్నెలో పిండి, కోకో పౌడర్, బేకింగ్ పౌడర్, బేకింగ్ సోడా మరియు ఉప్పును కలిపి గిలకొట్టండి. పక్కన ఉంచండి.", "తడి పదార్థాలు బ్లెండ్ చేయండి: తడి పదార్థాలన్నింటినీ (తురిమిన క్యారెట్లు, జుచిని, బేబీ పాలకూర, గ్రీక్ పెరుగు, తేనె, నూనె, గుడ్లు మరియు వెనిల్లా) హై-స్పీడ్ బ్లెండర్‌లో వేయండి. పూర్తిగా మృదువుగా అయ్యేవరకు హై స్పీడ్‌లో బ్లెండ్ చేయండి, అవసరమైతే వైపులను కిందికి నెట్టండి.", "కలపండి: బ్లెండ్ చేసిన తడి మిశ్రమాన్ని పొడి పదార్థాలున్న గిన్నెలో పోయండి. కేవలం కలిసేవరకు మెల్లగా కలపండి. ఎక్కువగా కలపకుండా జాగ్రత్త వహించండి.", "చిప్స్ వేయండి: రబ్బర్ స్పాచులా ఉపయోగించి మినీ చాక్లెట్ చిప్స్‌ను మెల్లగా కలపండి.", "బేక్ చేయండి: బ్యాటర్‌ను మఫిన్ టిన్‌లలో సమానంగా స్కూప్ చేయండి. కావాలంటే పైన అదనపు చాక్లెట్ చిప్స్ చల్లండి. 18–24 minutes పాటు, లేదా మధ్యలో గుచ్చిన టూత్‌పిక్ శుభ్రంగా వచ్చేవరకు బేక్ చేయండి.", "చల్లారనివ్వండి: నిల్వ చేయడానికి ముందు మఫిన్‌లను వైర్ ర్యాక్‌పై పూర్తిగా చల్లారనివ్వండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:45.930Z"}, {"n": 13, "title": "Easy Chicken Fry", "title_te": "సులభమైన చికెన్ ఫ్రై", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://www.sharmispassions.com/wp-content/uploads/2024/01/chicken-fry3.jpg", "prep": "—", "cook": "about 15-20 minutes", "yield": "—", "desc": "Simple spicy pan-fried chicken thighs with Kashmiri chilli and garam masala; about 740 kcal and 68g protein.", "desc_te": "కాశ్మీరీ కారం మరియు గరం మసాలాతో చేసిన సాధారణ కారంగా వేయించిన చికెన్ తొడలు; about 740 kcal and 68g protein.", "tags": ["non-vegetarian", "contains dairy", "dinner", "lunch"], "ing": ["1 tbsp ghee", "500 g bone-in chopped chicken thighs", "1 tbsp Kashmiri chilli powder", "1.5 tbsp coriander powder", "1 tbsp garam masala", "1/2 tsp cumi ve oil or avocado oil (for pan cooking or brushing)"], "ing_te": ["1 cup షెల్ తీసిన ఎడమామె (వండినవి మరియు కరిగించినవి)", "½ cup తురిమిన క్యారెట్ (తేలికగా ఆవిరిలో ఉడికించినది లేదా సన్నగా తురిమినది)", "¼ cup బేబీ పాలకూర (సన్నగా తరిగినది)", "1 large గుడ్డు (లేదా 1 flax egg: 1 tbsp పొడి చేసిన అవిసె గింజలు + 2.5 tbsp నీరు)", "⅓ cup ఓట్ పిండి (లేదా హోల్ వీట్ పిండి)", "2 tbsp హోల్ మిల్క్ (లేదా తీపిలేని ప్లాంట్ మిల్క్)", "¼ tsp వెల్లుల్లి పొడి", "¼ tsp పొడి చేసిన జీలకర్ర", "1 tbsp ఆలివ్ నూనె లేదా అవకాడో నూనె (పాన్ వంట కోసం లేదా పూయడానికి)"], "steps": ["Blend Ingredients: In a food processor, pulse the edamame, grated carrot, spinach, milk, cumin, and garlic powder until smooth but slightly textured.", "Form Batter: Transfer the blended mixture to a mixing bowl. Stir in the egg and oat flour until a thick, scoopable batter forms.", "Cook (Stovetop): Heat 1 tsp oil in a non-stick skillet over medium-low heat. Scoop tablespoon-sized portions and flatten gently with the back of a spoon. Cook for 2–3 minutes per side until golden brown and cooked through.", "Cook (Air Fryer Option): Line the air fryer basket with parchment paper, brush lightly with oil, and air-fry at 350°F (175°C) for 8–10 minutes, flipping halfway.", "Serve: Allow to cool before serving. Cut into strips or bite-sized pieces for easy toddler gripping. Toddler Nutrition & Storage Tips", "Serving Idea: Serve with plain Greek yogurt or mashed avocado as a dipping sauce."], "steps_te": ["పదార్థాలు బ్లెండ్ చేయండి: ఫుడ్ ప్రాసెసర్‌లో ఎడమామె, తురిమిన క్యారెట్, పాలకూర, పాలు, జీలకర్ర మరియు వెల్లుల్లి పొడిని మృదువుగా కానీ కొద్దిగా ఆకృతితో ఉండేవరకు పల్స్ చేయండి.", "బ్యాటర్ చేయండి: బ్లెండ్ చేసిన మిశ్రమాన్ని మిక్సింగ్ గిన్నెకు మార్చండి. మందపాటి, స్కూప్ చేయగల బ్యాటర్ అయ్యేవరకు గుడ్డు మరియు ఓట్ పిండిని కలపండి.", "వండండి (స్టవ్‌టాప్): మధ్యస్థ-తక్కువ మంటపై నాన్-స్టిక్ స్కిల్లెట్‌లో 1 tsp నూనె వేడి చేయండి. tablespoon పరిమాణంలో భాగాలను స్కూప్ చేసి చెంచా వెనుక భాగంతో మెల్లగా చదును చేయండి. బంగారు గోధుమ రంగు వచ్చి పూర్తిగా వండేవరకు ప్రతి వైపు 2–3 minutes వండండి.", "వండండి (ఎయిర్ ఫ్రైయర్ ఎంపిక): ఎయిర్ ఫ్రైయర్ బాస్కెట్‌ను పార్చ్‌మెంట్ పేపర్‌తో లైన్ చేసి, నూనెతో తేలికగా పూసి, మధ్యలో తిప్పుతూ 350°F (175°C) వద్ద 8–10 minutes ఎయిర్-ఫ్రై చేయండి.", "వడ్డించండి: వడ్డించే ముందు చల్లారనివ్వండి. పిల్లలు సులభంగా పట్టుకోవడానికి స్ట్రిప్‌లుగా లేదా చిన్న ముక్కలుగా కోయండి. టాడ్లర్ పోషణ & నిల్వ చిట్కాలు", "వడ్డించే ఆలోచన: డిప్పింగ్ సాస్‌గా ప్లెయిన్ గ్రీక్ యోగర్ట్ లేదా మెదిపిన అవకాడోతో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:56.707Z"}, {"n": 119, "title": "Fluffy Greek Yogurt & Spiced Apple Cinnamon Mini Waffles", "title_te": "మెత్తని గ్రీక్ యోగర్ట్ & స్పైస్డ్ ఆపిల్ సిన్నమన్ మినీ వాఫుల్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍽️", "image": "https://whatsgabycooking.com/wp-content/uploads/2022/09/Stonyfield-__-Cinnamon-Apple-Greek-Yogurt-Waffles-5-copy.jpg", "prep": "10 mins", "cook": "10 mins", "yield": "8–10 mini waffles", "desc": "Description", "desc_te": "వివరణ", "tags": [], "ing": ["1 medium sweet apple (peeled and finely grated)", "½ cup whole milk plain Greek yogurt", "1 large egg", "2 tbsp whole milk (or oat milk)", "1 tbsp melted coconut oil or unsalted butter", "¾ cup oat flour (or ½ cup whole wheat flour + ¼ cup almond flour)", "1 tsp baking powder", "½ tsp ground Ceylon cinnamon", "½ tsp pure vanilla extract"], "ing_te": ["1 medium తీపి ఆపిల్ (తొక్క తీసి సన్నగా తురిమినది)", "½ cup హోల్ మిల్క్ ప్లెయిన్ గ్రీక్ యోగర్ట్", "1 large గుడ్డు", "2 tbsp హోల్ మిల్క్ (లేదా ఓట్ మిల్క్)", "1 tbsp కరిగించిన కొబ్బరి నూనె లేదా ఉప్పులేని వెన్న", "¾ cup ఓట్ పిండి (లేదా ½ cup హోల్ వీట్ పిండి + ¼ cup బాదం పిండి)", "1 tsp బేకింగ్ పౌడర్", "½ tsp పొడి చేసిన సిలోన్ దాల్చినచెక్క", "½ tsp స్వచ్ఛమైన వెనిల్లా ఎక్స్‌ట్రాక్ట్"], "steps": ["Preheat Waffle Iron: Preheat and lightly grease a mini waffle maker or standard waffle iron.", "Combine Wet Ingredients: In a mixing bowl, whisk together the grated apple, Greek yogurt, egg, milk, melted coconut oil/butter, and vanilla extract until well combined.", "Add Dry Ingredients: Stir in the oat flour, baking powder, and ground cinnamon. Mix gently until just combined. Let batter sit for 3 minutes to thicken.", "Cook Waffles: Spoon 2–3 tablespoons of batter into the preheated waffle maker. Cook for 3–4 minutes until steam subsides and waffles are golden and fluffy.", "Serve: Cool slightly on a wire rack, then cut into strips or bite-sized quarters for self-feeding. Toddler Nutrition & Storage Tips", "Naturally Sweet: No refined sugar needed—the grated apple and cinnamon provide plenty of natural flavor.", "Freezer Friendly: Freeze cooled waffles in a single layer, then bag them. Reheat in a toaster in under 2 minutes for busy mornings!"], "steps_te": ["వాఫుల్ ఐరన్ ప్రీహీట్ చేయండి: మినీ వాఫుల్ మేకర్ లేదా స్టాండర్డ్ వాఫుల్ ఐరన్‌ను ప్రీహీట్ చేసి తేలికగా గ్రీజ్ చేయండి.", "తడి పదార్థాలు కలపండి: ఒక మిక్సింగ్ గిన్నెలో తురిమిన ఆపిల్, గ్రీక్ యోగర్ట్, గుడ్డు, పాలు, కరిగించిన కొబ్బరి నూనె/వెన్న మరియు వెనిల్లా ఎక్స్‌ట్రాక్ట్‌ను బాగా కలిసేవరకు గిలకొట్టండి.", "పొడి పదార్థాలు వేయండి: ఓట్ పిండి, బేకింగ్ పౌడర్ మరియు పొడి చేసిన దాల్చినచెక్కను కలపండి. కేవలం కలిసేవరకు మెల్లగా కలపండి. బ్యాటర్ చిక్కబడటానికి 3 minutes ఉంచండి.", "వాఫుల్స్ వండండి: ప్రీహీట్ చేసిన వాఫుల్ మేకర్‌లో 2–3 tablespoons బ్యాటర్ వేయండి. ఆవిరి తగ్గి వాఫుల్స్ బంగారు రంగులో మెత్తగా అయ్యేవరకు 3–4 minutes వండండి.", "వడ్డించండి: వైర్ ర్యాక్‌పై కొద్దిగా చల్లార్చి, తర్వాత స్వయంగా తినడానికి స్ట్రిప్‌లుగా లేదా చిన్న క్వార్టర్‌లుగా కోయండి. టాడ్లర్ పోషణ & నిల్వ చిట్కాలు", "సహజంగా తీపి: రిఫైన్డ్ చక్కెర అవసరం లేదు—తురిమిన ఆపిల్ మరియు దాల్చినచెక్క పుష్కలంగా సహజ రుచిని అందిస్తాయి.", "ఫ్రీజర్ ఫ్రెండ్లీ: చల్లారిన వాఫుల్స్‌ను ఒకే పొరలో ఫ్రీజ్ చేసి, తర్వాత బ్యాగ్‌లో పెట్టండి. బిజీ ఉదయాల కోసం 2 minutes లోపు టోస్టర్‌లో మళ్లీ వేడి చేయండి!"], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:18.806Z"}, {"n": 8, "title": "Garlic Butter Eggs with Rice", "title_te": "వెల్లుల్లి వెన్న గుడ్లతో అన్నం", "cat": "Adult", "section": "adult", "emoji": "🍳", "image": "https://dail

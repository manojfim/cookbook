paneer and coconut, pitched as a 15-minute protein breakfast.", "desc_te": "గుడ్లు, పనీర్ మరియు కొబ్బరితో చేసిన పిండి లేని ఆవిరిలో ఉడికించిన ఇడ్లీలు; 15 నిమిషాల ప్రోటీన్ బ్రేక్‌ఫాస్ట్‌గా చెప్పబడింది.", "tags": ["vegetarian", "contains dairy", "breakfast", "snack"], "ing": ["3 eggs", "1 cup paneer", "1 cup fresh coconut (optional, recommended for juicy texture)", "1/2 green chilli", "Little salt", "Little baking soda (optional)", "3-4 tbsp water", "Ghee or oil, for greasing"], "ing_te": ["3 గుడ్లు", "1 cup పనీర్", "1 cup తాజా కొబ్బరి (ఐచ్ఛికం, జ్యూసీగా ఉండటానికి సిఫార్సు చేయబడింది)", "1/2 పచ్చిమిర్చి", "కొద్దిగా ఉప్పు", "కొద్దిగా బేకింగ్ సోడా (ఐచ్ఛికం)", "3-4 tbsp నీరు", "గ్రీజింగ్ కోసం నెయ్యి లేదా నూనె"], "steps": ["Grate or blend the paneer and fresh coconut separately.", "Add the mixture to the eggs with the finely chopped green chilli.", "Add a little salt, a little baking soda and 3-4 tbsp water.", "Mix well with a spoon or spatula.", "Grease idli plates with ghee or oil.", "Pour the mixture into idli moulds.", "Steam like normal idli for 15 minutes.", "Serve hot with karam podi, chutney, sambar or any seed powder."], "steps_te": ["పనీర్ మరియు తాజా కొబ్బరిని విడివిడిగా తురమండి లేదా బ్లెండ్ చేయండి.", "ఆ మిశ్రమాన్ని గుడ్లలో సన్నగా తరిగిన పచ్చిమిర్చితో కలపండి.", "కొద్దిగా ఉప్పు, కొద్దిగా బేకింగ్ సోడా మరియు 3-4 tbsp నీరు వేయండి.", "చెంచా లేదా స్పాచులాతో బాగా కలపండి.", "ఇడ్లీ ప్లేట్లకు నెయ్యి లేదా నూనె రాయండి.", "మిశ్రమాన్ని ఇడ్లీ మూసలలో పోయండి.", "సాధారణ ఇడ్లీలాగా 15 నిమిషాలు ఆవిరిలో ఉడికించండి.", "కారం పొడి, చట్నీ, సాంబార్ లేదా ఏదైనా గింజల పొడితో వేడిగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:26.474Z"}, {"n": 122, "title": "Panini-Pressed Paneer & Veggie Mini Quesadillas", "title_te": "పనినీ-ప్రెస్డ్ పనీర్ & వెజ్జీ మినీ క్వెసాడిల్లాలు", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍳", "image": "https://www.honeywhatscooking.com/wp-content/uploads/2022/05/Paneer-Tikka-Quesdillas29-1200x1078.jpg", "prep": "10 mins", "cook": "5 mins", "yield": "2 quesadillas (4 toddler portions)", "desc": "Description", "desc_te": "వివరణ", "tags": [], "ing": ["2 small whole wheat tortillas or rotis", "½ cup fresh crumbled or grated paneer", "¼ cup shredded mozzarella or mild cheddar cheese", "¼ cup finely grated zucchini (excess moisture squeezed out)", "2 tbsp sweet corn kernels (steamed and lightly mashed)", "¼ tsp ground cumin", "¼ tsp dried oregano or Italian herb seasoning", "1 tsp butter or ghee (for brushing)"], "ing_te": ["2 small హోల్ వీట్ టోర్టిల్లాలు లేదా రోటీలు", "½ cup తాజా నలిపిన లేదా తురిమిన పనీర్", "¼ cup తురిమిన మోజరెల్లా లేదా mild చెడార్ చీజ్", "¼ cup సన్నగా తురిమిన జుచిని (అదనపు తేమ పిండేసినది)", "2 tbsp స్వీట్ కార్న్ గింజలు (ఆవిరిలో ఉడికించి తేలికగా మెదిపినవి)", "¼ tsp పొడి చేసిన జీలకర్ర", "¼ tsp ఎండిన ఒరెగానో లేదా ఇటాలియన్ హెర్బ్ సీజనింగ్", "1 tsp వెన్న లేదా నెయ్యి (పూయడానికి)"], "steps": ["Mix Filling: In a bowl, combine the crumbled paneer, grated zucchini, mashed sweet corn, cumin, oregano, and shredded cheese.", "Assemble: Lay the tortillas flat. Spread the paneer-veggie mixture evenly over one half of each tortilla, then fold the other half over to form a semicircle.", "Press & Cook: Preheat the panini press to medium-high heat. Brush the outside of the tortillas lightly with ghee or butter. Place in the panini press, gently close the lid, and cook for 3–4 minutes until golden with crisp grill marks and melted cheese. (If using a stovetop skillet, cook for 2–3 minutes per side while gently pressing with a spatula).", "Slice & Serve: Let cool for 2 minutes, then slice into easy-to-hold triangle fingers. Toddler Nutrition & Storage Tips", "Protein & Calcium: Paneer combined with mozzarella provides muscle-building protein and calcium for growing bones and teeth.", "Mess-Free: The melted cheese holds the veggies and paneer securely inside the tortilla."], "steps_te": ["ఫిల్లింగ్ కలపండి: ఒక గిన్నెలో నలిపిన పనీర్, తురిమిన జుచిని, మెదిపిన స్వీట్ కార్న్, జీలకర్ర, ఒరెగానో మరియు తురిమిన చీజ్‌ను కలపండి.", "అమర్చండి: టోర్టిల్లాలను చదునుగా ఉంచండి. ప్రతి టోర్టిల్లాలో సగం భాగంపై పనీర్-వెజ్జీ మిశ్రమాన్ని సమానంగా పరచండి, తర్వాత మరో సగాన్ని మడిచి అర్ధవృత్తాకారంగా చేయండి.", "ప్రెస్ & వండండి: పనినీ ప్రెస్‌ను మధ్యస్థ-అధిక మంటకు ప్రీహీట్ చేయండి. టోర్టిల్లాల బయట భాగాన్ని నెయ్యి లేదా వెన్నతో తేలికగా పూయండి. పనినీ ప్రెస్‌లో ఉంచి, మూతను మెల్లగా మూసి, బంగారు రంగు వచ్చి క్రిస్ప్ గ్రిల్ గుర్తులు వచ్చి చీజ్ కరిగేవరకు 3–4 minutes వండండి. (స్టవ్‌టాప్ స్కిల్లెట్ ఉపయోగిస్తే, స్పాచులాతో మెల్లగా నొక్కుతూ ప్రతి వైపు 2–3 minutes వండండి).", "కోసి వడ్డించండి: 2 minutes చల్లారనివ్వండి, తర్వాత సులభంగా పట్టుకోగల త్రిభుజాకార వేళ్లుగా కోయండి. టాడ్లర్ పోషణ & నిల్వ చిట్కాలు", "ప్రోటీన్ & కాల్షియం: మోజరెల్లాతో కలిపిన పనీర్ పెరుగుతున్న ఎముకలు మరియు దంతాలకు కండరాలు నిర్మించే ప్రోటీన్ మరియు కాల్షియంను అందిస్తుంది.", "మెస్-ఫ్రీ: కరిగిన చీజ్ కూరగాయలు మరియు పనీర్‌ను టోర్టిల్లా లోపల సురక్షితంగా పట్టి ఉంచుతుంది."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:18.932Z"}, {"n": 126, "title": "Peanut Butter & Chia Berry Overnight Oats", "title_te": "పీనట్ బటర్ & చియా బెర్రీ ఓవర్‌నైట్ ఓట్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🥣", "image": "https://foodsharingvegan.com/wp-content/uploads/2025/06/PB-J-Overnight-Oats-10-e1749187503881.jpg", "prep": "5 mins", "cook": "0 mins (Refrigerate overnight)", "yield": "—", "desc": "Ingredients:", "desc_te": "పదార్థాలు:", "tags": [], "ing": ["1/2 cup rolled oats", "1/2 cup milk (whole milk or fortified plant milk)", "1 tbsp chia seeds", "1 tbsp smooth peanut butter (or almond butter)", "1/2 ripe banana, mashed", "2 tbsp mashed blueberries or raspberries"], "ing_te": ["1/2 cup రోల్డ్ ఓట్స్", "1/2 cup పాలు (హోల్ మిల్క్ లేదా ఫోర్టిఫైడ్ ప్లాంట్ మిల్క్)", "1 tbsp చియా గింజలు", "1 tbsp స్మూత్ పీనట్ బటర్ (లేదా బాదం బటర్)", "1/2 పండిన అరటిపండు, మెదిపినది", "2 tbsp మెదిపిన బ్లూబెర్రీలు లేదా రాస్ప్‌బెర్రీలు"], "steps": ["In a small jar or bowl, combine rolled oats, chia seeds, milk, smooth peanut butter, and mashed banana. Stir well until peanut butter is evenly distributed. Top with mashed fresh berries. Cover and place in the refrigerator overnight (or for at least 3 hours). Serve cold or at room temperature."], "steps_te": ["చిన్న జార్ లేదా గిన్నెలో రోల్డ్ ఓట్స్, చియా గింజలు, పాలు, స్మూత్ పీనట్ బటర్ మరియు మెదిపిన అరటిపండును కలపండి. పీనట్ బటర్ సమానంగా పంపిణీ అయ్యేవరకు బాగా కలపండి. పైన మెదిపిన తాజా బెర్రీలు వేయండి. కవర్ చేసి రిఫ్రిజిరేటర్‌లో రాత్రంతా (లేదా కనీసం 3 hours) ఉంచండి. చల్లగా లేదా గది ఉష్ణోగ్రత వద్ద వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:19.135Z"}, {"n": 35, "title": "Peri Peri Paneer Sourdough Toast", "title_te": "పెరి పెరి పనీర్ సోర్‌డో టోస్ట్", "cat": "Adult", "section": "adult", "emoji": "🧀", "image": "https://someindiangirl.com/wp-content/uploads/2022/03/Paneer-Bhurji-Toast-8-of-8-1024x1536.jpg", "prep": "—", "cook": "—", "yield": "2 slices", "desc": "Toasted sourdough topped with a creamy peri peri paneer, capsicum and cheese mixture.", "desc_te": "క్రీమీ పెరి పెరి పనీర్, క్యాప్సికమ్ మరియు చీజ్ మిశ్రమంతో పైన వేసిన టోస్ట్ చేసిన సోర్‌డో బ్రెడ్.", "tags": ["vegetarian", "contains dairy", "breakfast", "snack"], "ing": ["2 tbsp hung curd", "1 tsp mayonnaise", "1 tsp tomato ketchup", "1/2 tsp salt", "1 tsp peri peri masala", "1/2 tsp oregano", "1 tsp chilli flakes", "2 tbsp finely chopped onion", "2 tsp red capsicum, finely chopped", "2 tsp green capsicum, finely chopped", "30 g diced paneer", "30 g diced cheese", "2 slices sourdough bread", "Additional diced cheese, to top", "Butter, for greasing the griddle"], "ing_te": ["2 tbsp హంగ్ కర్డ్", "1 tsp మయోనైస్", "1 tsp టమాటా కెచప్", "1/2 tsp ఉప్పు", "1 tsp పెరి పెరి మసాలా", "1/2 tsp ఒరెగానో", "1 tsp చిల్లీ ఫ్లేక్స్", "2 tbsp సన్నగా తరిగిన ఉల్లిపాయ", "2 tsp ఎర్ర క్యాప్సికమ్, సన్నగా తరిగినది", "2 tsp పచ్చ క్యాప్సికమ్, సన్నగా తరిగినది", "30 g ముక్కలుగా కోసిన పనీర్", "30 g ముక్కలుగా కోసిన చీజ్", "2 ముక్కలు సోర్‌డో బ్రెడ్", "పైన వేయడానికి అదనంగా ముక్కలుగా కోసిన చీజ్", "గ్రిడిల్‌కు రాయడానికి వెన్న"], "steps": ["Mix the hung curd, mayonnaise and tomato ketchup in a bowl.", "Add the salt, peri peri masala, oregano and chilli flakes and stir into a sauce.", "Fold in the onion, red and green capsicum, diced paneer and diced cheese.", "Spoon generously onto two slices of sourdough bread and top with additional diced cheese.", "Cook on a hot butter-greased griddle or pan until the cheese melts and the bread is toasted."], "steps_te": ["హంగ్ కర్డ్, మయోనైస్ మరియు టమాటా కెచప్‌ను ఒక గిన్నెలో కలపండి.", "ఉప్పు, పెరి పెరి మసాలా, ఒరెగానో మరియు చిల్లీ ఫ్లేక్స్ వేసి సాస్‌గా కలపండి.", "ఉల్లిపాయ, ఎర్ర మరియు పచ్చ క్యాప్సికమ్, ముక్కలుగా కోసిన పనీర్ మరియు ముక్కలుగా కోసిన చీజ్‌ను మెల్లగా కలపండి.", "రెండు సోర్‌డో బ్రెడ్ ముక్కలపై దీనిని ఉదారంగా వేసి పైన అదనంగా ముక్కలుగా కోసిన చీజ్ వేయండి.", "వెన్న రాసిన వేడి గ్రిడిల్ లేదా పాన్‌పై చీజ్ కరిగి, బ్రెడ్ టోస్ట్ అయ్యే వరకు ఉడికించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:56.047Z"}, {"n": 23, "title": "Protein Breakfast Bowl (Cottage Cheese, Egg and Avocado)", "title_te": "ప్రోటీన్ బ్రేక్‌ఫాస్ట్ బౌల్ (కాటేజ్ చీజ్, గుడ్డు మరియు అవకాడో)", "cat": "Adult", "section": "adult", "emoji": "🍳", "image": "https://mybudgetrecipes.com/wp-content/uploads/2026/01/v2-17bvrh-o279a.jpg", "prep": "—", "cook": "about 1-2 minutes (tomato saute)", "yield": "1", "desc": "Layered breakfast bowl of runny eggs, cottage cheese, tomato, avocado and jalapeno; 406 kcal, 26g protein.", "desc_te": "జారుడు గుడ్లు, కాటేజ్ చీజ్, టమోటా, అవకాడో మరియు జలపెనోలతో పొరలుగా చేసిన బ్రేక్‌ఫాస్ట్ బౌల్; 406 kcal, 26g ప్రోటీన్.", "tags": ["vegetarian", "contains dairy", "breakfast", "quick"], "ing": ["1/2 cup cottage cheese", "2 large eggs", "1 medium tomato, diced", "2 tbsp onion, finely chopped", "1/4 avocado, sliced", "1 tbsp jalapeno, chopped", "2 tsp olive oil", "1 tsp everything bagel seasoning", "Pinch of salt"], "ing_te": ["1/2 cup కాటేజ్ చీజ్", "2 పెద్ద గుడ్లు", "1 మధ్యస్థ టమోటా, ముక్కలు చేసినది", "2 tbsp ఉల్లిపాయ, సన్నగా తరిగినది", "1/4 అవకాడో, ముక్కలు చేసినది", "1 tbsp జలపెనో, తరిగినది", "2 tsp ఆలివ్ నూనె", "1 tsp ఎవ్రీథింగ్ బేగెల్ సీజనింగ్", "చిటికెడు ఉప్పు"], "steps": ["Saute the tomato in 1 tsp olive oil with salt for 1-2 minutes.", "Add the eggs and stir gently, keeping them runny.", "Layer the cottage cheese, then the eggs.", "Top with onion, avocado, jalapeno, 1 tsp olive oil and everything bagel seasoning."], "steps_te": ["1 tsp ఆలివ్ నూనెలో ఉప్పుతో టమోటాను 1-2 నిమిషాలు వేయించండి.", "గుడ్లు వేసి మెల్లగా కలపండి, అవి జారుడుగా ఉండేలా చూసుకోండి.", "ముందు కాటేజ్ చీజ్, ఆ తర్వాత గుడ్లు పొరలుగా వేయండి.", "పైన ఉల్లిపాయ, అవకాడో, జలపెనో, 1 tsp ఆలివ్ నూనె మరియు ఎవ్రీథింగ్ బేగెల్ సీజనింగ్ వేయండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:15.612Z"}, {"n": 14, "title": "Protein Roti", "title_te": "ప్రోటీన్ రోటీ", "cat": "Adult", "section": "adult", "emoji": "🥗", "image": "https://snapcalorie-webflow-website.s3.us-east-2.amazonaws.com/media/recipe_pics_v2/medium/tandoori_roti.jpg", "prep": "10 minutes (rest)", "cook": "—", "yield": "2-3 rotis", "desc": "Soft, puffy roti enriched with tofu and Greek yogurt, no protein powder; about 22g protein per serving of 2-3 rotis.", "desc_te": "టోఫు మరియు గ్రీక్ యోగర్ట్‌తో సమృద్ధి చేసిన మెత్తని, ఉబ్బిన రోటీ, ప్రోటీన్ పౌడర్ లేకుండా; 2-3 rotis సర్వింగ్‌కు about 22g protein.", "tags": ["vegetarian", "contains dairy", "lunch", "dinner", "breakfast"], "ing": ["2 cups whole wheat flour", "1/4 cup Greek yogurt", "125 g tofu", "Paneer whey (or water), to blend the tofu"], "ing_te": ["2 cups గోధుమ పిండి", "1/4 cup గ్రీక్ యోగర్ట్", "125 g టోఫు", "టోఫును బ్లెండ్ చేయడానికి పనీర్ పాలు (లేదా నీరు)"], "steps": ["Blend the tofu with paneer whey or water.", "Mix into a soft dough and rest 10 minutes.", "Roll out by hand or with a roti maker.", "Cook on a hot tawa until beautifully puffed."], "steps_te": ["టోఫును పనీర్ పాలు లేదా నీటితో బ్లెండ్ చేయండి.", "మెత్తని పిండిగా కలిపి 10 minutes విశ్రాంతి ఇవ్వండి.", "చేతితో లేదా రోటీ మేకర్‌తో చపాతీలా వత్తండి.", "అందంగా ఉబ్బేవరకు వేడి పెనంపై కాల్చండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:00.682Z"}, {"n": 125, "title": "Quinoa & Cottage Cheese Veggie Bites", "title_te": "క్వినోవా & కాటేజ్ చీజ్ వెజ్జీ బైట్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍳", "image": "https://www.recipesbyeliana.com/wp-content/uploads/2025/12/uzsizjqwsx5gmnwmklru.webp", "prep": "10 mins", "cook": "15 mins", "yield": "—", "desc": "Ingredients:", "desc_te": "పదార్థాలు:", "tags": [], "ing": ["1 cup cooked quinoa", "1/2 cup finely chopped cooked broccoli", "1/2 cup cottage cheese (or shredded cheddar cheese)", "1 large egg", "2 tbsp chickpea flour (or whole wheat flour)", "1/4 tsp garlic powder", "Pinch of salt"], "ing_te": ["1 cup వండిన క్వినోవా", "1/2 cup సన్నగా తరిగిన వండిన బ్రోకలీ", "1/2 cup కాటేజ్ చీజ్ (లేదా తురిమిన చెడార్ చీజ్)", "1 large గుడ్డు", "2 tbsp చిక్‌పీ పిండి (లేదా హోల్ వీట్ పిండి)", "1/4 tsp వెల్లుల్లి పొడి", "Pinch of ఉప్పు"], "steps": ["Preheat oven or air fryer to 375°F (190°C). In a large bowl, combine cooked quinoa, chopped broccoli, cottage cheese, egg, flour, garlic powder, and salt. Mix thoroughly until well combined. Form into small, toddler-sized balls or press into a mini muffin pan. Bake for 15-18 minutes until firm and golden brown. Allow to cool completely before serving."], "steps_te": ["ఓవెన్ లేదా ఎయిర్ ఫ్రైయర్‌ను 375°F (190°C) వద్ద ప్రీహీట్ చేయండి. పెద్ద గిన్నెలో వండిన క్వినోవా, తరిగిన బ్రోకలీ, కాటేజ్ చీజ్, గుడ్డు, పిండి, వెల్లుల్లి పొడి మరియు ఉప్పును కలపండి. బాగా కలిసేవరకు పూర్తిగా కలపండి. చిన్న, పిల్లల పరిమాణంలో బంతులుగా చేయండి లేదా మినీ మఫిన్ పాన్‌లో నొక్కండి. గట్టిగా బంగారు గోధుమ రంగు అయ్యేవరకు 15-18 minutes బేక్ చేయండి. వడ్డించే ముందు పూర్తిగా చల్లారనివ్వండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:19.049Z"}, {"n": 32, "title": "Red Pepper Pasta", "title_te": "రెడ్ పెప్పర్ పాస్తా", "cat": "Adult", "section": "adult", "emoji": "🍝", "image": "https://cdn.loveandlemons.com/wp-content/uploads/opengraph/2023/06/roasted-red-pepper-pasta-1.jpg", "prep": "— "చల్లారనిచ్చి, పుదీనా ఆకులతో కలిపి మిక్సర్‌లో వేసి మృదువైన క్రీమీ సాస్‌గా బ్లెండ్ చేయండి.", "సాస్‌ను తిరిగి కడాయిలో పోయండి.", "ఇంతలో ఉప్పు వేసిన నీటిని మరిగించి స్పగెట్టిని 10 నిమిషాలు ఉడికే వరకు ఉడికించండి.", "ఉడికించిన పాస్తాను సాస్‌లో వేయండి.", "చిల్లీ ఫ్లేక్స్, ఒరెగానో, నల్ల మిరియాలు, ఉప్పు మరియు కొద్దిగా పాస్తా నీరు వేయండి.", "అధిక మంటపై 2-3 నిమిషాలు బాగా కలిపి, సిల్కీగా, సాస్ పట్టేలా చేయండి.", "తాజా కొత్తిమీర ఆకులతో అలంకరించి వేడిగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:40.926Z"}, {"n": 6, "title": "Salmon Fried Rice", "title_te": "సాల్మన్ ఫ్రైడ్ రైస్", "cat": "Adult", "section": "adult", "emoji": "🍚", "image": "https://down-tw.img.susercontent.com/file/tw-11134207-820l6-mlpzlqehdam81a@resize_w1920_nl.webp", "prep": "—", "cook": "—", "yield": "—", "desc": "Quick seared-salmon fried rice with egg, onions and a soy-oyster sauce, pitched as an easy dinner.", "desc_te": "గుడ్డు, ఉల్లిపాయలు, సోయా-ఆయిస్టర్ సాస్‌తో త్వరగా చేసే సాల్మన్ ఫ్రైడ్ రైస్; సులభమైన రాత్రి భోజనంగా సూచించబడింది.", "tags": ["non-vegetarian", "dinner", "quick"], "ing": ["8 oz salmon fillet", "1/4 tsp salt", "1/4 tsp black pepper", "2 tbsp olive oil", "1/3 cup diced white onions", "1/3 cup sliced green onions", "1 tbsp minced garlic", "2 eggs", "3 cups day-old rice", "2 tbsp soy sauce", "1 tbsp oyster sauce", "1 tbsp sugar"], "ing_te": ["8 oz సాల్మన్ ఫిల్లెట్", "1/4 tsp ఉప్పు", "1/4 tsp నల్ల మిరియాలు", "2 tbsp ఆలివ్ నూనె", "1/3 cup తరిగిన తెల్ల ఉల్లిపాయలు", "1/3 cup తరిగిన పచ్చి ఉల్లిపాయలు", "1 tbsp తరిగిన వెల్లుల్లి", "2 గుడ్లు", "3 cups నిన్నటి అన్నం (day-old rice)", "2 tbsp సోయా సాస్", "1 tbsp ఆయిస్టర్ సాస్", "1 tbsp చక్కెర"], "steps": ["Season the salmon with salt and pepper.", "Heat the oil on medium-high and sear the salmon skin-side down for 2 minutes, flip and cook 2 more minutes.", "Turn the heat to low, peel off the crispy skin and break the salmon into pieces.", "Toss in the onions, green onions and garlic and cook about 1 minute.", "Scramble in the two eggs.", "Add the rice and the sauces and cook on high for 1-2 minutes."], "steps_te": ["సాల్మన్‌కు ఉప్పు, మిరియాలు పట్టించండి.", "మీడియం-హై మంటపై నూనె వేడి చేసి సాల్మన్‌ను చర్మం వైపు కిందికి ఉంచి 2 minutes వేయించండి, తిప్పి మరో 2 minutes ఉడికించండి.", "మంటను తక్కువకు తగ్గించి, కరకరలాడే చర్మాన్ని తీసి సాల్మన్‌ను ముక్కలుగా విడగొట్టండి.", "ఉల్లిపాయలు, పచ్చి ఉల్లిపాయలు, వెల్లుల్లి వేసి సుమారు 1 minute ఉడికించండి.", "రెండు గుడ్లను గిలకొట్టి కలపండి.", "అన్నం, సాస్‌లు వేసి హై మంటపై 1-2 minutes ఉడికించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:02:39.340Z"}, {"n": 61, "title": "Savory Cheesy Zucchini Waffles", "title_te": "రుచికరమైన చీజీ జుచిని వాఫిల్స్", "cat": "Adult", "section": "adult", "emoji": "🍲", "image": "https://sweetnessbyella.com/assets/images/1757874352210-f8voe5r0.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "A soft, flavorful, and nutrient-dense savory waffle recipe that seamlessly packs in green vegetables and healthy fats. It is perfectly textured for a 16-month-old toddler to enjoy as a soft finger food, while remaining easily adaptable into a delicious, fully seasoned breakfast or dinner for adults.", "desc_te": "ఆకుపచ్చ కూరగాయలు మరియు ఆరోగ్యకరమైన కొవ్వులను సులభంగా కలిపిన మృదువైన, రుచికరమైన, పోషకాలు అధికంగా ఉన్న రుచికరమైన వాఫిల్ రెసిపీ. 16 నెలల చిన్నారికి మృదువైన ఫింగర్ ఫుడ్‌గా ఇది పూర్తిగా సరిపోతుంది, అయితే పెద్దలకు రుచికరమైన, పూర్తిగా మసాలా చేసిన అల్పాహారం లేదా రాత్రి భోజనంగా సులభంగా మార్చుకోవచ్చు.", "tags": [], "ing": ["250g (approx. 1 medium) young zucchini, grated", "40g butter, melted", "1 large egg", "1 tablespoon sour cream (or plain whole-milk Greek yogurt for a protein boost)", "100g (approx. 1 cup) semi-hard cheese, finely grated (such as mild cheddar or mozzarella)", "1 tablespoon fresh parsley, finely chopped", "1 teaspoon baking powder", "120g (approx. 1 cup) all-purpose flour (or fine oat flour for an extra fiber boost)", "Oil or ghee for greasing the waffle iron", "Seasoning Adjustment Guide", "For Toddlers (16 Months): Use a tiny pinch of garlic powder and omit added salt (the cheese naturally provides a mild, savory sodium profile).", "For Adults: Add 1/2 teaspoon of salt, a pinch of black pepper, and 1/4 teaspoon of garlic powder or a minced garlic clove to the batter."], "ing_te": ["250g (సుమారు 1 మీడియం) చిన్న జుచిని, తురిమినది", "40g వెన్న, కరిగించినది", "1 పెద్ద గుడ్డు", "1 tablespoon సోర్ క్రీమ్ (లేదా ప్రోటీన్ పెంచడానికి సాదా హోల్-మిల్క్ గ్రీక్ పెరుగు)", "100g (సుమారు 1 cup) సెమీ-హార్డ్ చీజ్, సన్నగా తురిమినది (మైల్డ్ చెడార్ లేదా మోజారెల్లా వంటిది)", "1 tablespoon తాజా పార్స్లీ, సన్నగా తరిగినది", "1 teaspoon బేకింగ్ పౌడర్", "120g (సుమారు 1 cup) ఆల్-పర్పస్ పిండి (లేదా ఎక్కువ ఫైబర్ కోసం సన్నని ఓట్ పిండి)", "వాఫిల్ ఐరన్‌కు గ్రీజ్ చేయడానికి నూనె లేదా నెయ్యి", "రుచి సర్దుబాటు మార్గదర్శి", "చిన్నారుల కోసం (16 నెలలు): చిటికెడు వెల్లుల్లి పొడి వాడి, అదనపు ఉప్పు వేయకండి (చీజ్ సహజంగా తేలికైన, రుచికరమైన సోడియం ప్రొఫైల్‌ను ఇస్తుంది).", "పెద్దల కోసం: బ్యాటర్‌లో 1/2 teaspoon ఉప్పు, చిటికెడు నల్ల మిరియాలు మరియు 1/4 teaspoon వెల్లుల్లి పొడి లేదా తరిగిన వెల్లుల్లి రెబ్బ వేయండి."], "steps": ["Squeeze the Zucchini (The Most Critical Step) Grate the zucchini using a fine or medium grater. If preparing the adult version, toss with a pinch of salt and let it sit for 5 minutes to draw out moisture. Place the grated zucchini into a clean kitchen towel or cheesecloth and wring it out aggressively.", "Why this matters: Zucchini is over 90% water. Squeezing out every drop of excess liquid prevents the waffle batter from turning soggy, gummy, or watery, ensuring a perfectly fluffy interior.", "Mix the Wet Base In a large mixing bowl, whisk together the egg, melted butter, sour cream (or Greek yogurt), and your chosen garlic seasoning until smooth and uniform.", "Fold in the Texture Add the thoroughly squeezed zucchini, finely grated cheese, and chopped parsley into the wet mixture. Stir until the zucchini strands and cheese are evenly distributed.", "Combine with Dry Ingredients Whisk the baking powder into the flour, then gently fold the dry mix into the wet batter using a spatula. Mix just until a thick, scoopable batter forms—do not overmix, or the waffles will lose their tenderness.", "Cook to Golden Perfection Preheat your waffle maker and grease both the top and bottom plates generously with avocado oil or ghee.", "Waffle Iron Method: Scoop the batter onto the hot iron, close, and cook for 5 to 7 minutes until steam stops escaping and the waffle is golden-brown and holds its shape cleanly.", "Skillet Pancake Alternative: If you don't have a waffle iron handy, drop spoonfuls of the batter onto a hot, greased skillet over medium-low heat. Flatten slightly, cook for 3 to 4 minutes until bubbles form, then flip and cook for another 2 to 3 minutes until soft and cooked through."], "steps_te": ["జుచినిని పిండండి (అత్యంత కీలకమైన దశ): జుచినిని సన్నని లేదా మీడియం గ్రేటర్‌తో తురమండి. పెద్దల వెర్షన్ చేస్తుంటే, చిటికెడు ఉప్పుతో కలిపి తేమ బయటకు రావడానికి 5 minutes పాటు ఉంచండి. తురిమిన జుచినిని శుభ్రమైన కిచెన్ టవల్ లేదా చీజ్‌క్లాత్‌లో ఉంచి గట్టిగా పిండండి.", "ఇది ఎందుకు ముఖ్యం: జుచినిలో 90% కంటే ఎక్కువ నీరు ఉంటుంది. అదనపు ద్రవం ప్రతి చుక్కను పిండడం వల్ల వాఫిల్ బ్యాటర్ తడిగా, జిగురుగా లేదా నీరుగా మారకుండా, పూర్తిగా మెత్తని లోపలి భాగం లభిస్తుంది.", "తడి బేస్ కలపండి: పెద్ద మిక్సింగ్ బౌల్‌లో గుడ్డు, కరిగించిన వెన్న, సోర్ క్రీమ్ (లేదా గ్రీక్ పెరుగు) మరియు మీరు ఎంచుకున్న వెల్లుల్లి మసాలాను మృదువుగా, సమానంగా అయ్యేవరకు గిలకొట్టండి.", "ఆకృతిని కలపండి: బాగా పిండిన జుచిని, సన్నగా తురిమిన చీజ్ మరియు తరిగిన పార్స్లీని తడి మిశ్రమంలో వేయండి. జుచిని తీగలు మరియు చీజ్ సమానంగా పంపిణీ అయ్యేవరకు కలపండి.", "పొడి పదార్థాలతో కలపండి: బేకింగ్ పౌడర్‌ను పిండిలో గిలకొట్టి, తర్వాత స్పాచులా ఉపయోగించి పొడి మిశ్రమాన్ని తడి బ్యాటర్‌లో మెల్లగా కలపండి. మందపాటి, స్కూప్ చేయగల బ్యాటర్ అయ్యేవరకు మాత్రమే కలపండి — ఎక్కువగా కలపకండి, లేకపోతే వాఫిల్స్ మృదుత్వాన్ని కోల్పోతాయి.", "బంగారు రంగులోకి వచ్చేవరకు వండండి: మీ వాఫిల్ మేకర్‌ను వేడి చేసి, పై మరియు కింది ప్లేట్‌లకు అవకాడో ఆయిల్ లేదా నెయ్యితో గట్టిగా గ్రీజ్ చేయండి.", "వాఫిల్ ఐరన్ పద్ధతి: బ్యాటర్‌ను వేడి ఐరన్‌పై స్కూప్ చేసి, మూసి, ఆవిరి రావడం ఆగి, వాఫిల్ బంగారు రంగులోకి వచ్చి ఆకారాన్ని శుభ్రంగా నిలుపుకునేవరకు 5 to 7 minutes పాటు వండండి.", "స్కిల్లెట్ పాన్‌కేక్ ప్రత్యామ్నాయం: వాఫిల్ ఐరన్ లేకపోతే, బ్యాటర్‌ను చెంచాలతో వేడి, గ్రీజ్ చేసిన స్కిల్లెట్‌పై మీడియం-తక్కువ వేడిపై వేయండి. కొంచెం చదును చేసి, బుడగలు వచ్చేవరకు 3 to 4 minutes పాటు వండండి, తర్వాత తిప్పి మరో 2 to 3 minutes పాటు మృదువుగా, పూర్తిగా వండేవరకు వండండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:45.784Z"}, {"n": 70, "title": "Savory Tofu & Bean High-Protein Patties", "title_te": "రుచికరమైన టోఫు & బీన్ అధిక ప్రోటీన్ ప్యాటీలు", "cat": "Adult", "section": "adult", "emoji": "🍢", "image": "https://plantbasedandbroke.com/wp-content/uploads/2019/06/Black-Bean-Tofu-Burger-Toppings-Feature-800x600-1.jpeg", "prep": "—", "cook": "—", "yield": "—", "desc": "Ingredients (Yields 4 thin patties)", "desc_te": "పదార్థాలు (4 సన్నని ప్యాటీలు అవుతాయి)", "tags": [], "ing": ["84g extra-firm tofu (pressed and drained)", "3/4 cup canned kidney beans (rinsed and drained) OR 1/4 cup dry kidney beans (boiled and drained)", "15g chickpea flour (besan) – used as a binding agent", "1/2 medium onion, finely chopped", "3–4 tbsp fresh cilantro, finely chopped", "1.5 tbsp ground cumin", "1.5 tbsp chaat masala (highly recommended for an authentic, tangy flavor)", "1 tsp chili powder", "Salt to taste", "1–2 tsp cooking oil (for pan-searing)"], "ing_te": ["84g ఎక్స్ట్రా-ఫర్మ్ టోఫు (నొక్కి నీరు తీసినది)", "3/4 cup క్యాన్ చేసిన కిడ్నీ బీన్స్ (కడిగి నీరు తీసినవి) లేదా 1/4 cup పొడి కిడ్నీ బీన్స్ (ఉడికించి నీరు తీసినవి)", "15g శనగపిండి (బెసన్) – బైండింగ్ ఏజెంట్‌గా వాడతారు", "1/2 మీడియం ఉల్లిపాయ, సన్నగా తరిగినది", "3–4 tbsp తాజా కొత్తిమీర, సన్నగా తరిగినది", "1.5 tbsp నలిపిన జీలకర్ర", "1.5 tbsp చాట్ మసాలా (నిజమైన, ఘాటైన రుచి కోసం ఎంతో సిఫార్సు చేయబడింది)", "1 tsp మిరప పొడి", "రుచికి తగినంత ఉప్పు", "1–2 tsp వండే నూనె (పాన్‌లో వేయించడానికి)"], "steps": ["Prep the Base: In a medium bowl, mash the extra-firm tofu and the drained kidney beans together using a fork or a potato masher. Leave a little bit of texture; do not blend into a smooth paste.", "Add Aromatics & Spices: Fold in the chopped onion, fresh cilantro, cumin, chaat masala, chili powder, and salt. Mix thoroughly to distribute the spices.", "Bind: Sprinkle the chickpea flour over the mixture and incorporate well. The flour will absorb excess moisture and help the patties hold together.", "Shape: Divide the mixture into 4 equal portions and gently shape them into thin, even patties.", "Cook: Heat a non-stick skillet or frying pan over medium heat with a light brush of oil. Place the patties in the pan and cook for 4–5 minutes on each side, or until they develop a crisp, golden-brown crust.", "Serving Suggestion: Serve hot with a side of green chutney, mint yogurt, or slide them into a bun for a high-protein veggie burger!"], "steps_te": ["బేస్ సిద్ధం చేయండి: మీడియం గిన్నెలో ఎక్స్ట్రా-ఫర్మ్ టోఫు మరియు నీరు తీసిన కిడ్నీ బీన్స్‌ను ఫోర్క్ లేదా పొటాటో మాషర్‌తో కలిపి మెదపండి. కొంచెం ఆకృతి ఉండనివ్వండి; మృదువైన పేస్ట్‌గా బ్లెండ్ చేయకండి.", "సువాసనలు & మసాలాలు వేయండి: తరిగిన ఉల్లిపాయ, తాజా కొత్తిమీర, జీలకర్ర, చాట్ మసాలా, మిరప పొడి మరియు ఉప్పు కలపండి. మసాలాలు పంపిణీ అయ్యేలా బాగా కలపండి.", "బైండ్ చేయండి: మిశ్రమంపై శనగపిండి చల్లి బాగా కలపండి. పిండి అదనపు తేమను పీల్చుకుని ప్యాటీలు కలిసి ఉండటానికి సహాయపడుతుంది.", "ఆకారం ఇవ్వండి: మిశ్రమాన్ని 4 సమాన భాగాలుగా విభజించి, మెల్లగా సన్నని, సమానమైన ప్యాటీలుగా ఆకారం ఇవ్వండి.", "వండండి: నాన్-స్టిక్ స్కిల్లెట్ లేదా ఫ్రైయింగ్ పాన్‌ను మీడియం వేడిపై నూనె తేలికగా రాసి వేడి చేయండి. ప్యాటీలను పాన్‌లో ఉంచి, ప్రతి వైపు 4–5 minutes పాటు, లేదా క్రిస్పీ, బంగారు-గోధుమ రంగు క్రస్ట్ వచ్చేవరకు వండండి.", "వడ్డించే సూచన: గ్రీన్ చట్నీ, పుదీనా పెరుగు పక్కన వేడిగా వడ్డించండి, లేదా అధిక ప్రోటీన్ వెజ్జీ బర్గర్ కోసం బన్‌లో పెట్టండి!"], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:46.085Z"}, {"n": 102, "title": "Savory Vegetable & Paneer Sooji Upma", "title_te": "రుచికరమైన వెజిటబుల్ & పనీర్ సూజి ఉప్మా", "cat": "Kid & Toddler", "section": "kid", "emoji": "🧀", "image": "https://thehungrygoddess.com/wp-content/uploads/2025/06/Sooji-Upma.jpg", "prep": "10 minutes", "cook": "15 minutes", "yield": "3–4 toddler servings", "desc": "A comforting, easily digestible traditional Indian warm bowl meal adapted for toddlers. Roasted semolina (sooji/rava) is simmered with ghee, mild aromatics, finely grated vegetables, and soft crumbled paneer for a hearty dose of calcium and dairy protein.", "desc_te": "పసిపిల్లల కోసం మార్చిన, సులభంగా జీర్ణమయ్యే సాంప్రదాయ భారతీయ వెచ్చని గిన్నె భోజనం. వేయించిన సెమోలినా (సూజి/రవ్వ)ను నెయ్యి, మైల్డ్ సుగంధ ద్రవ్యాలు, సన్నగా తురిమిన కూరగాయలు, మెత్తని నలిపిన పనీర్‌తో ఉడికించి కాల్షియం, డైరీ ప్రోటీన్ పుష్కలంగా ఇస్తుంది.", "tags": [], "ing": ["1/2 cup fine semolina (sooji/rava) or coarse rolled oats", "1/2 cup fresh paneer, finely crumbled or grated", "1/3 cup finely grated carrots", "1/4 cup sweet green peas (steamed and lightly mashed)", "1 tbsp ghee (clarified butter)", "1/2 tsp cumin seeds (jeera)", "1/4 tsp ginger paste (mild)", "1/8 tsp turmeric powder", "1.25 cups water", "Pinch of salt (optional, for toddlers over 12 months)", "1 tsp fresh lemon juice (optional, for bright flavor)"], "ing_te": ["1/2 cup సన్నని సెమోలినా (సూజి/రవ్వ) లేదా ముతక రోల్డ్ ఓట్స్", "1/2 cup తాజా పనీర్, సన్నగా నలిపినది లేదా తురిమినది", "1/3 cup సన్నగా తురిమిన క్యారెట్లు", "1/4 cup తీపి పచ్చి బఠానీలు (ఆవిరిపై ఉడికించి తేలికగా మెదిపినవి)", "1 tbsp నెయ్యి (క్లారిఫైడ్ బటర్)", "1/2 tsp జీలకర్ర గింజలు (జీరా)", "1/4 tsp అల్లం పేస్ట్ (మైల్డ్)", "1/8 tsp పసుపు పొడి", "1.25 cups నీరు", "చిటికెడు ఉప్పు (ఐచ్ఛికం, 12 months పైబడిన పసిపిల్లల కోసం)", "1 tsp తాజా నిమ్మరసం (ఐచ్ఛికం, తాజా రుచి కోసం)"], "steps": ["Roast the Sooji: In a dry pan over low heat, gently roast the semolina for 3–4 minutes until warm, fragrant, and slightly sandy. Do not let it brown. Transfer to a bowl.", "Temper & Sauté: In the same pan, heat ghee over medium-low heat. Add cumin seeds and let them sizzle for 20 seconds. Add ginger paste, grated carrots, and sweet peas. Sauté for 2 minutes until carrots are tender.", "Add Paneer & Turmeric: Add the crumbled paneer and turmeric powder. Sauté gently for 1 minute until fragrant.", "Boil Water: Pour in the 1.25 cups of water (and optional pinch of salt). Bring to a rolling boil over medium heat.", "Cook Upma: Lower the heat to low. Gradually pour in the roasted semolina with one hand while continuously whisking/stirring with the other hand to prevent lumps.", "Simmer: Cover the pan with a lid and let cook on low heat for 2–3 minutes until all water is absorbed and the upma is soft and fluffy.", "Finish: Turn off heat, stir in lemon juice if desired, and let rest covered for 2 minutes. Fluff with a fork and serve warm."], "steps_te": ["సూజి వేయించండి: తక్కువ మంటపై పొడి పాన్‌లో సెమోలినాను వెచ్చగా, సువాసనగా, కొద్దిగా ఇసుకలా అయ్యేవరకు 3–4 minutes పాటు మెల్లగా వేయించండి. బ్రౌన్ కాకుండా చూడండి. గిన్నెలోకి తీసుకోండి.", "తాలింపు & వేయించండి: అదే పాన్‌లో మీడియం-తక్కువ మంటపై నెయ్యి వేడి చేయండి. జీలకర్ర గింజలు వేసి 20 seconds పాటు చిటపటలాడనివ్వండి. అల్లం పేస్ట్, తురిమిన క్యారెట్లు, తీపి బఠానీలు వేయండి. క్యారెట్లు మెత్తబడేవరకు 2 minutes పాటు వేయించండి.", "పనీర్ & పసుపు వేయండి: నలిపిన పనీర్, పసుపు పొడి వేయండి. సువాసన వచ్చేవరకు 1 minute పాటు మెల్లగా వేయించండి.", "నీరు మరిగించండి: 1.25 cups నీరు (మరియు ఐచ్ఛిక చిటికెడు ఉప్పు) పోయండి. మీడియం మంటపై బాగా మరిగించండి.", "ఉప్మా ఉడికించండి: మంటను తక్కువకు తగ్గించండి. ఒక చేత్తో వేయించిన సెమోలినాను క్రమంగా పోస్తూ మరో చేత్తో నిరంతరం గిలకొడుతూ/కలుపుతూ ముద్దలు రాకుండా చూడండి.", "సిమ్మర్ చేయండి: పాన్‌పై మూత పెట్టి తక్కువ మంటపై 2–3 minutes పాటు ఉడికించండి, నీరు పూర్తిగా పీల్చుకుని ఉప్మా మెత్తగా, పొడిపొడిగా అయ్యేవరకు.", "ముగించండి: మంట ఆపి, కావాలంటే నిమ్మరసం కలిపి, మూత పెట్టి 2 minutes పాటు ఉంచండి. ఫోర్క్‌తో పొడిపొడిగా చేసి వెచ్చగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:56.390Z"}, {"n": 44, "title": "Snickers Crunch Cups", "title_te": "స్నికర

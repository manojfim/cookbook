<script>
const RECIPES = [{"n": 43, "title": "3-Ingredient Cottage Cheese Bagels", "title_te": "3-పదార్థాల కాటేజ్ చీజ్ బేగెల్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🥯", "image": "https://joyinbites.com/wp-content/uploads/2026/05/ChatGPT-Image-May-15-2026-09_04_55-PM-1024x819.png", "prep": "—", "cook": "20 minutes at 375F plus 5-7 minutes at 400F", "yield": "—", "desc": "Easy high-protein cottage cheese bagels, pitched as a quick busy-morning breakfast.", "desc_te": "తేలికైన, అధిక ప్రోటీన్ కలిగిన కాటేజ్ చీజ్ బేగెల్స్, బిజీగా ఉండే ఉదయాలకు త్వరిత అల్పాహారంగా సూచించబడ్డాయి.", "tags": ["vegetarian", "contains dairy", "breakfast"], "ing": ["1 cup flour", "1 cup cottage cheese", "2 tsp baking powder", "Pinch of salt", "Egg wash, for brushing", "Everything bagel seasoning (for one version)", "Shredded cheddar cheese and sliced jalapenos (for the other version)"], "ing_te": ["1 cup పిండి", "1 cup కాటేజ్ చీజ్", "2 tsp బేకింగ్ పౌడర్", "చిటికెడు ఉప్పు", "గుడ్డు వాష్, పైన రాయడానికి", "ఎవ్రీథింగ్ బేగెల్ సీజనింగ్ (ఒక రకం కోసం)", "తురిమిన చెడార్ చీజ్ మరియు సన్నగా కోసిన జలపెనోలు (మరో రకం కోసం)"], "steps": ["Mix the flour, cottage cheese, baking powder and a pinch of salt in a bowl and blend until smooth.", "Shape the dough into rings and place on a parchment-lined tray.", "Brush with egg wash.", "Make two versions: one topped with everything bagel seasoning, the other with shredded cheddar cheese and sliced jalapenos.", "Bake at 375F for 20 minutes, then at 400F for 5-7 minutes until golden and fluffy.", "Slice and serve."], "steps_te": ["ఒక గిన్నెలో పిండి, కాటేజ్ చీజ్, బేకింగ్ పౌడర్ మరియు చిటికెడు ఉప్పు కలిపి, మెత్తగా అయ్యే వరకు బ్లెండ్ చేయండి.", "పిండిని రింగుల ఆకారంలో చేసి, పార్చ్‌మెంట్ పేపర్ వేసిన ట్రేలో ఉంచండి.", "గుడ్డు వాష్‌తో పైన రాయండి.", "రెండు రకాలు చేయండి: ఒకదానిపై ఎవ్రీథింగ్ బేగెల్ సీజనింగ్, మరోదానిపై తురిమిన చెడార్ చీజ్ మరియు సన్నగా కోసిన జలపెనోలు వేయండి.", "375F వద్ద 20 minutes, తర్వాత 400F వద్ద 5-7 minutes బంగారు రంగు వచ్చి, మెత్తగా పొంగే వరకు కాల్చండి.", "ము 0 minutes.", "Crush the cornflakes with the salt, pepper, paprika, onion powder, mixed herbs and garlic granules.", "Slice the chicken breast, dip in milk, then coat in the cornflake crumbs.", "Air fry the chicken for 10-15 minutes.", "Mix the grated carrot and red cabbage with Greek yogurt, light mayo, apple cider vinegar and Dijon mustard for the slaw.", "Serve the chicken and chips with the slaw and 50 ml chicken gravy."], "steps_te": ["బంగాళాదుంపలను చిప్స్‌లా కత్తిరించి ఉప్పు, మిరియాలు, థైమ్‌తో రుచి చేసి 200C వద్ద 30 minutes బేక్ చేయండి.", "కార్న్‌ఫ్లేక్స్‌ను ఉప్పు, మిరియాలు, పప్రికా, ఉల్లిపాయ పొడి, మిక్స్డ్ హెర్బ్స్, వెల్లుల్లి గ్రాన్యూల్స్‌తో కలిపి నలపండి.", "చికెన్ బ్రెస్ట్‌ను ముక్కలుగా కత్తిరించి పాలలో ముంచి, తర్వాత కార్న్‌ఫ్లేక్ ముక్కలతో పూత పూయండి.", "చికెన్‌ను 10-15 minutes ఎయిర్ ఫ్రై చేయండి.", "తురిమిన క్యారెట్, ఎర్ర క్యాబేజీని గ్రీక్ పెరుగు, లైట్ మయో, ఆపిల్ సైడర్ వెనిగర్, డిజాన్ మస్టర్డ్‌తో కలిపి స్లా చేయండి.", "చికెన్, చిప్స్‌ను స్లా, 50 ml చికెన్ గ్రేవీతో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:02:50.550Z"}, {"n": 15, "title": "Amritsari Paneer Bhurji", "title_te": "అమృత్‌సరి పనీర్ భుర్జీ", "cat": "Adult", "section": "adult", "emoji": "🧀", "image": "https://www.ohmyveg.co.uk/wp-content/uploads/2025/09/Amritsari-Paneer-Bhurji-1-2-1-900x1200.webp", "prep": "—", "cook": "about 15 minutes", "yield": "not stated (whole dish)", "desc": "Creamy Amritsari-style paneer bhurji built on a roasted besan and yogurt base; whole dish about 656 kcal and 51g protein.", "desc_te": "వేయించిన శనగపిండి మరియు పెరుగు బేస్‌పై తయారైన క్రీమీ అమృత్‌సరి శైలి పనీర్ భుర్జీ; whole dish about 656 kcal and 51g protein.", "tags": ["vegetarian", "contains dairy", "dinner", "lunch", "breakfast"], "ing": ["1.5 tbsp besan flour", "230 g Greek yogurt (1 cup)", "1/2 tsp chilli powder", "1 tsp amchur powder", "1 tsp coriander powder", "1/2 tsp coriander powder (as listed)", "1 tbsp ghee", "1 tbsp cumin seeds", "10 g thinly sliced ginger", "1 chopped onion (80 g  paste.", "Toast the washed raw basmati rice.", "Add 300 ml water (1.5 times the rice), close the lid and cook.", "Serve the butter chicken with the flavoured rice."], "steps_te": ["చికెన్ ముక్కలను చిల్లీ పౌడర్, ఉప్పు, అల్లం వెల్లుల్లి పేస్ట్, జీరా పొడి, గరం మసాలా మరియు పెరుగుతో కలిపి కేవలం 5 ml నూనెలో వేయించండి.", "గ్రేవీ కోసం, పాన్‌లో 10 g వెన్న కరిగించి సన్నగా తరిగిన వెల్లుల్లి, తరిగిన ఉల్లిపాయ మరియు అల్లం వెల్లుల్లి పేస్ట్‌ను బాగా వేయించండి.", "తరిగిన టమాటాలు, చిల్లీ పౌడర్, పసుపు, జీరా, గరం మసాలా మరియు ఉప్పు వేసి బాగా వేయించండి.", "చల్లారనిచ్చి, తర్వాత 3 tbsp పెరుగుతో కలిపి బ్లెండ్ చేయండి.", "తిరిగి పాన్‌లో పోసి, 5 g వెన్న మరియు ఉడికించిన చికెన్ వేసి కొత్తిమీరతో అలంకరించండి.", "ఫ్లేవర్ గల అన్నం కోసం, పాన్‌లో 5 g వెన్న కరిగించి సన్నగా తరిగిన వెల్లుల్లి, చిల్లీ పౌడర్, పసుపు, ఒరెగానో, ఉప్పు మరియు అల్లం వెల్లుల్లి పేస్ట్ వేయండి.", "కడిగిన పచ్చి బాస్మతి బియ్యాన్ని వేయించండి.", "300 ml నీరు (బియ్యానికి 1.5 రెట్లు) వేసి మూత పెట్టి ఉడికించండి.", "బటర్ చికెన్‌ను ఫ్లేవర్ గల అన్నంతో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:56.088Z"}, {"n": 31, "title": "Cauliflower Paneer Gravy", "title_te": "కాలీఫ్లవర్ పనీర్ గ్రేవీ", "cat": "Adult", "section": "adult", "emoji": "🧀", "image": "https://www.happyveggiekitchen.com/wp-content/uploads/2024/12/Cauliflower-Paneer-Curry-7.jpg", "prep": "10 minutes (chilli soak)", "cook": "about 20 minutes", "yield": "—", "desc": "Creamy cauliflower paneer gravy with a tomato-Kashmiri chilli puree and whole spices; 480 kcal and 20g protein.", "desc_te": "టమాటా-కాశ్మీరీ మిర్చి ప్యూరీ మరియు మొత్తం మసాలాలతో చేసిన క్రీమీ కాలీఫ్లవర్ పనీర్ గ్రేవీ; 480 kcal మరియు 20g ప్రోటీన్.", "tags": ["vegetarian", "contains dairy", "dinner", "lunch"], "ing": ["200 g cauliflower", "100 g paneer", "2 big tomatoes", "1 big onion, chopped", "15 ml olive oil", "4 cardamom", "3 cloves", "2 cinnamon sticks", "1 bay leaf", "1 tsp jeera", "1 tbsp ginger garlic paste", "1/2 tsp turmeric powder", "1 tsp Kashmiri red chilli powder", "1 tsp coriander powder", "1 tsp garam masala", "1 tbsp kasuri methi", "1/2 tsp sugar", "3 Kashmiri chillies", "Coriander leaf", "Water", "Salt"], "ing_te": ["200 g కాలీఫ్లవర్", "100 g పనీర్", "2 పెద్ద టమాటాలు", "1 పెద్ద ఉల్లిపాయ, తరిగినది", "15 ml ఆలివ్ ఆయిల్", "4 యాలకులు", "3 లవంగాలు", "2 దాల్చిన చెక్క ముక్కలు", "1 బిర్యానీ ఆకు", "1 tsp జీరా", "1 tbsp అల్లం వెల్లుల్లి పేస్ట్", "1/2 tsp పసుపు పొడి", "1 tsp కాశ్మీరీ ఎర్ర మిర్చి పొడి", "1 tsp ధనియాల పొడి", "1 tsp గరం మసాలా", "1 tbsp కసూరి మేథి", "1/2 tsp చక్కెర", "3 కాశ్మీరీ మిర్చి", "కొత్తిమీర ఆకు", "నీరు", "ఉప్పు"], "steps": ["Cut the cauliflower into small florets, wash well and steam 5 minutes; set aside.", "Soak the Kashmiri chillies in hot water 10 minutes, then blend with the tomato into a puree; set aside.", "Heat the oil in a kadai.", "Add the jeera, cardamom, cinnamon sticks, bay leaf, cloves and onion; saute 3-4 minutes on high flame.", "Add the ginger garlic paste and saute 2 minutes on medium-high flame.", "When the colour starts to change, add the tomato puree, turmeric, Kashmiri red chilli powder, coriander powder and salt; mix 5-6 minutes on high flame.", "Blend the paneer with water into a paste, keep the flame low and add to the kadai; mix 3 minutes on medium-high flame.", "Add the steamed cauliflower and mix 2 minutes on high flame.", "Check the salt and switch off the flame.", "Add the garam masala, kasuri methi and coriander leaf, mix gently and serve."], "steps_te": ["కాలీఫ్లవర్‌ను చిన్న ముక్కలుగా కోసి, బాగా కడిగి 5 నిమిషాలు ఆవిరిలో ఉడికించి పక్కన పెట్టండి.", "కాశ్మీరీ మిర్చిని వేడి నీటిలో 10 నిమిషాలు నానబెట్టి, తర్వాత టమాటాతో కలిపి ప్యూరీగా బ్లెండ్ చేసి పక్కన పెట్టండి.", "కడాయిలో నూనె వేడి చేయండి.", "జీరా, యాలకులు, దాల్చిన చెక్క ముక్కలు, బిర్యానీ ఆకు, లవంగాలు మరియు ఉల్లిపాయ వేసి అధిక మంటపై 3-4 నిమిషాలు వేయించండి.", "అల్లం వెల్లుల్లి పేస్ట్ వేసి మధ్యస్థ-అధిక మంటపై 2 నిమిషాలు వేయించండి.", "రంగు మారడం మొదలైనప్పుడు టమాటా ప్యూరీ, పసుపు, కాశ్మీరీ ఎర్ర మిర్చి పొడి, ధనియాల పొడి మరియు ఉప్పు వేసి అధిక మంటపై 5-6 నిమిషా , garam masala, kasuri methi and salt; mix well and cook 2-3 minutes until the masala is rich.", "Add the cottage cheese and mix gently so it does not break too much.", "Cook 1-2 more minutes so the cottage cheese absorbs the flavors.", "Garnish with fresh cilantro and serve hot with roti or rice."], "steps_te": ["పాన్‌లో మధ్యస్థ మంటపై నూనె వేడి చేయండి.", "ఆవాలు వేసి చిటపటలాడనివ్వండి.", "జీలకర్ర మరియు చిటికెడు ఇంగువ వేయండి.", "పచ్చి మిరపకాయ, వెల్లుల్లి మరియు ఉల్లిపాయ వేసి ఉల్లిపాయలు మెత్తగా, తేలికగా బంగారు రంగులోకి వచ్చేవరకు వేయించండి.", "టమోటా వేసి మెత్తగా, గుజ్జులా అయ్యేవరకు ఉడికించండి.", "ఎర్ర కారం పొడి, పసుపు, జీలకర్ర ధనియాల పొడి, గరం మసాలా, కసూరి మేథీ మరియు ఉప్పు వేసి బాగా కలిపి మసాలా గొప్పగా అయ్యేవరకు 2-3 minutes ఉడికించండి.", "కాటేజ్ చీజ్ వేసి ఎక్కువగా విరిగిపోకుండా మెల్లగా కలపండి.", "కాటేజ్ చీజ్ రుచులను పీల్చుకునేలా మరో 1-2 minutes ఉడికించండి.", "తాజా కొత్తిమీరతో అలంకరించి రోటీ లేదా అన్నంతో వేడిగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:00.779Z"}, {"n": 11, "title": "Cottage Cheese Bread", "title_te": "కాటేజ్ చీజ్ బ్రెడ్", "cat": "Adult", "section": "adult", "emoji": "🧀", "image": "https://yummywithlilia.com/wp-content/uploads/2026/01/cottage-cheese-bread-1024x847.webp", "prep": "—", "cook": "20 minutes (air fryer) or 35 minutes (oven)", "yield": "1", "desc": "Two-ingredient high-protein bread roll made from cottage cheese and flour, air-fried or baked.", "desc_te": "కాటేజ్ చీజ్ మరియు పిండితో చేసిన రెండు పదార్థాల అధిక ప్రోటీన్ బ్రెడ్ రోల్, ఎయిర్ ఫ్రైయర్‌లో లేదా ఓవెన్‌లో కాల్చవచ్చు.", "tags": ["vegetarian", "contains dairy", "breakfast", "snack"], "ing": ["3 heaped tbsp (60 g) self-raising flour (or plain/all-purpose flour plus 1/2 tsp baking powder)", "2 tbsp (50 g) cottage cheese", "Big pinch of salt"], "ing_te": ["3 heaped tbsp (60 g) సెల్ఫ్-రైజింగ్ పిండి (లేదా సాదా/ఆల్-పర్పస్ పిండి ప్లస్ 1/2 tsp బేకింగ్ పౌడర్)", "2 tbsp (50 g) కాటేజ్ చీజ్", "పెద్ద చిటికెడు ఉప్పు"], "steps": ["Mix the flour, cottage cheese and salt in a bowl until it clumps together.", "Use your hands to squeeze the dough into a boule shape; it should not be soft or sticky, adding more flour if needed.", "Score the top with a sharp knife.", "Air fry at 180C for 20 minutes, or oven bake at 180C for 35 minutes.", "If the middle is not cooked, turn it over and cook 3-5 more minutes without baking paper underneath."], "steps_te": ["పిండి, కాటేజ్ చీజ్ మరియు ఉప్పును ఒక గిన్నెలో కలిపి ముద్దగా అయ్యేవరకు కలపండి.", "చేతులతో పిండిని గుండ్రని బౌల్ ఆకారంలో పిసకండి; అది మెత్తగా లేదా జిగురుగా ఉండకూడదు, అవసరమైతే మరికొంత పిండి కలపండి.", "పదునైన కత్తితో పైన గీతలు గీయండి.", "180C వద్ద 20 minutes ఎయిర్ ఫ్రై చేయండి, లేదా 180C వద్ద 35 minutes ఓవెన్‌లో కాల్చండి.", "మధ్య భాగం ఉడకకపోతే, దాన్ని తిప్పి, కింద బేకింగ్ పేపర్ లేకుండా మరో 3-5 minutes ఉడికించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:02:50.582Z"}, {"n": 36, "title": "Cottage Cheese Dip (Bougie Dip)", "title_te": "కాటేజ్ చీజ్ డిప్ (బూజీ డిప్)", "cat": "Adult", "section": "adult", "emoji": "🧀", "image": "https://www.recipesmolly.com/wp-content/uploads/2025/09/Cottage-Cheese-Dip-3.jpg", "prep": "5 minutes", "cook": "none", "yield": "not stated (full batch)", "desc": "Five-minute creamy high-protein cottage cheese dip with cilantro, jalapeno and lime; 28g protein in the full batch, no mayo or protein powder.", "desc_te": "ఐదు నిమిషాల్లో తయారయ్యే క్రీమీ, అధిక ప్రోటీన్ గల కాటేజ్ చీజ్ డిప్, కొత్తిమీర, జలపెనో మరియు నిమ్మతో; మొత్తం బ్యాచ్‌లో 28g ప్రోటీన్, మయోనైస్ లేదా ప్రోటీన్ పౌడర్ లేకుండా.", "tags": ["vegetarian", "contains dairy", "snack", "quick"], "ing": ["1 cup cottage cheese", "Handful of cilantro", "1 jalapeno", "Green garlic powder", "Salt", "Squeeze of fresh lime", "Finely chopped onion, to mix in", "Bell pepper, finely chopped, to mix in"], "ing_te": ["1 cup కాటేజ్ చీజ్", "గుప్పెడు కొత్తిమీర", "1 జలపెనో", "గ్రీన్ గార్లిక్ పౌడర్", "ఉప్పు", "తాజా నిమ్మరసం పిండినది", "సన్నగా తరిగిన ఉల్లిపాయ, కలపడానికి", "బెల్ పెప్పర్, సన్నగా తరిగినది, కలపడానికి"], "steps": ["Blend the cottage cheese, cilantro, jalapeno, green garlic powder, salt and lime until smooth and creamy.", "When ready to eat, mix in the finely chopped onion and bell pepper for crunch.", "Serve spread on sourdough toast, as a veggie dip, or in wraps and sandwiches.", "Meal-prep tip: keep the blended dip refrigerated in an airtight container and add the onion and bell pepper fresh when serving."], "steps_te": ["కాటేజ్ చీజ్, కొత్తిమీర, జలపెనో, గ్రీన్ గార్లిక్ పౌడర్, ఉప్పు మరియు నిమ్మరసాన్ని మృదువుగా, క్రీమీగా అయ్యే వరకు బ్లెండ్ చేయండి.", "తినడానికి సిద్ధంగా ఉన్నప్పుడు, కరకర కోసం సన్నగా తరిగిన ఉల్లిపాయ మరియు బెల్ పెప్పర్ కలపండి.", "సోర్‌డో టోస్ట్‌పై రాసి, వెజిటబుల్ డిప్‌గా, లేదా ర్యాప్స్ మరియు శాండ్‌విచ్‌లలో వడ్డించండి.", "మీల్-ప్రెప్ చిట్కా: బ్లెండ్ చేసిన డిప్‌ను గాలి చొరబడని డబ్బాలో ఫ్రిజ్‌లో ఉంచండి మరియు వడ్డించేటప్పుడు ఉల్లిపాయ మరియు బెల్ పెప్పర్‌ను తాజాగా వేయండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:56.068Z"}, {"n": 1, "title": "Cottage Cheese Everything Bagels", "title_te": "కాటేజ్ చీజ్ ఎవ్రీథింగ్ బేగెల్స్", "cat": "Adult", "section": "adult", "emoji": "🥯", "image": "https://recipesbylina.com/wp-content/uploads/2025/03/Image_3-119.webp", "prep": "not stated", "cook": "20-25 minutes at 375F", "yield": "4 bagels", "desc": "The easiest, fluffiest cottage cheese everything bagels, no yeast. About 174 calories and 10g protein each.", "desc_te": "అత్యంత సులభమైన, అత్యంత మెత్తని కాటేజ్ చీజ్ ఎవ్రీథింగ్ బేగెల్స్, ఈస్ట్ లేకుండా. ఒక్కోదానిలో సుమారు 174 calories మరియు 10g protein ఉంటాయి.", "tags": ["vegetarian", "contains dairy", "breakfast", "snack"], "ing": ["1 cup (240g) blended cottage cheese", "1 cup (150g) all-purpose flour", "1 tsp baking powder", "1/2 tsp salt", "1 egg, whisked (for egg wash)", "everything but the bagel seasoning"], "ing_te": ["1 cup (240g) బ్లెండ్ చేసిన కాటేజ్ చీజ్", "1 cup (150g) మైదా పిండి", "1 tsp బేకింగ్ పౌడర్", "1/2 tsp ఉప్పు", "1 గుడ్డు, గిలకొట్టినది (egg wash కోసం)", "everything but the bagel seasoning"], "steps": ["Mix blended cottage cheese, flour, baking powder, and salt in a bowl until a thick dough forms.", "Flour surface and cut dough into 4 equal parts.", "Shape into bagels and lay on a parchment-lined baking sheet.", "Coat with egg wash and top with everything but the bagel seasoning.", "Bake in the oven at 375F for 20-25 minutes, and enjoy!"], "steps_te": ["బ్లెండ్ చేసిన కాటేజ్ చీజ్, మైదా, బేకింగ్ పౌడర్, ఉప్పును ఒక గిన్నెలో మందపాటి పిండి అయ్యేవరకు కలపండి.", "పిండి పరచిన ఉపరితలంపై పిండిని 4 సమాన భాగాలుగా కత్తిరించండి.", "బేగెల్స్ ఆకారంలో చేసి పార్చ్మెంట్ పరచిన బేకింగ్ షీట్‌పై ఉంచండి.", "egg wash పూసి పైన everything but the bagel seasoning చల్లండి.", "375F వద్ద ఓవెన్‌లో 20-25 minutes బేక్ చేసి, ఆనందించండి!"], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:01:28.239Z"}, {"n": 9, "title": "Cottage Cheese Protein Waffles", "title_te": "కాటేజ్ చీజ్ ప్రోటీన్ వాఫిల్స్", "cat": "Adult", "section": "adult", "emoji": "🧀", "image": "https://www.heynutritionlady.com/wp-content/uploads/2025/12/Cottage-Cheese-Waffles-SQ.jpg", "prep": "—", "cook": "about 5 minutes", "yield": "2", "desc": "Gluten-free blender waffles made with cottage cheese, oats and whey protein; 893 kcal and 77g protein for the whole recipe.", "desc_te": "కాటేజ్ చీజ్, ఓట్స్, వే ప్రోటీన్‌తో చేసిన గ్లూటెన్ లేని బ్లెండర్ వాఫిల్స్; మొత్తం రెసిపీకి 893 kcal, 77g ప్రోటీన్.", "tags": ["vegetarian", "contains dairy", "breakfast", "quick"], "ing": ["1 cup quick oats (certified gluten-free if needed)", "1 cup low-fat cottage cheese", "2 large eggs", "1 scoop vanilla or chocolate whey protein", "30 g pure maple syrup", "1 tbsp baking powder", "2-3 tbsp vanilla extract", "A couple of pinches of salt"], "ing_te": ["1 cup క్విక్ ఓట్స్ (అవసరమైతే సర్టిఫైడ్ గ్లూటెన్-ఫ్రీ)", "1 cup తక్కువ కొవ్వు కాటేజ్ చీజ్", "2 పెద్ద గుడ్లు", "1 స్కూప్ వనిల్లా లేదా చాక్లెట్ వే ప్రోటీన్", "30 g స్వచ్ఛమైన మేపుల్ సిరప్", "1 tbsp బేకింగ్ పౌడర్", "2-3 tbsp వనిల్లా ఎక్స్‌ట్రాక్ట్", "కొన్ని చిటికెళ్ల ఉప్పు"], "steps": ["Add all ingredients to a blender and blend until smooth.", "Shake the blender to knock oats off the sides and blend once more.", "Preheat the waffle iron and lightly spray with extra-virgin olive oil spray.", "Pour in the batter and cook about 5 minutes until golden brown and crisp.", "Serve immediately or refrigerate or freeze for later."], "steps_te": ["అన్ని పదార్థాలను బ్లెండర్‌లో వేసి మృదువుగా అయ్యేవరకు బ్లెండ్ చేయండి.", "బ్లెండర్‌ను కదిలించి పక్కలకు అంటుకున్న ఓట్స్‌ను కిందికి రప్పించి మరోసారి బ్లెండ్ చేయండి.", "వాఫిల్ ఐరన్‌ను వేడి చేసి ఎక్స్‌ట్రా-వర్జిన్ ఆలివ్ ఆయిల్ స్ప్రేతో తేలికగా స్ప్రే చేయండి.", "బ్యాటర్ పోసి బంగారు రంగు, కరకరలాడే వరకు సుమారు 5 minutes ఉడికించండి.", "వెంటనే వడ్డించండి లేదా ఫ్రిజ్‌లో ఉంచండి లేదా తర్వాత కోసం ఫ్రీజ్ చేయండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:02:50.504Z"}, {"n": 40, "title": "Creamy Dal Pasta", "title_te": "క్రీమీ దాల్ పాస్తా", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍲", "image": "https://i.ytimg.com/vi/z7eSinxQmCI/maxresdefault.jpg", "prep": "—", "cook": "not stated (2-3 whistles plus 2-3 minutes)", "yield": "—", "desc": "Toddler pasta coated in a smooth blended masoor dal, carrot, tomato and cashew sauce.", "desc_te": "మృదువుగా బ్లెండ్ చేసిన మసూర్ దాల్, క్యారెట్, టమాటా మరియు జీడిపప్పు సాస్‌తో పూసిన చిన్నపిల్లల పాస్తా.", "tags": ["vegetarian", "contains dairy", "lunch", "dinner"], "ing": ["1/2 cup masoor dal, washed", "1 carrot, chopped", "1 tomato, chopped", "1/4 onion (optional)", "2-3 garlic cloves (optional)", "5-6 cashews", "1-2 tsp ghee or oil", "1-1.5 cups boiled pasta", "Salt (only if baby is above 1 year)", "A pinch of black pepper", "Italian seasoning"], "ing_te": ["1/2 cup మసూర్ దాల్, కడిగినది", "1 క్యారెట్, తరిగినది", "1 టమాటా, తరిగినది", "1/4 ఉల్లిపాయ (ఐచ్ఛికం)", "2-3 వెల్లుల్లి రెబ్బలు (ఐచ్ఛికం)", "5-6 జీడిపప్పులు", "1-2 tsp నెయ్యి లేదా నూనె", "1-1.5 cups ఉడికించిన పాస్తా", "ఉప్పు (బిడ్డ 1 సంవత్సరం పైబడి ఉంటే మాత్రమే)", "చిటికెడు నల్ల మిరియాలు", "ఇటాలియన్ సీజనింగ్"], "steps": ["Heat ghee or oil in a pressure cooker.", "Add the garlic and onion if using, followed by the carrot, tomatoes, cashews and washed masoor dal.", "Add a little water and pressure cook 2-3 whistles, or until everything is soft.", "Let it cool slightly and blend into a smooth, creamy sauce.", "Heat a little ghee, butter or oil in a pan and add the blended sauce.", "Cook on low flame 2-3 minutes.", "Add salt (1 year+), black pepper and Italian seasoning.", "Add the boiled pasta and mix well until everything comes together."], "steps_te": ["ప్రెషర్ కుక్కర్‌లో నెయ్యి లేదా నూనె వేడి చేయండి.", "వాడితే వెల్లుల్లి మరియు ఉల్లిపాయ వేసి, తర్వాత క్యారెట్, టమాటాలు, జీడిపప్పులు మరియు కడిగిన మసూర్ దాల్ వేయండి.", "కొద్దిగా నీరు వేసి 2-3 విజిల్స్ వచ్చే వరకు లేదా అన్నీ మెత్తబడే వరకు ప్రెషర్ కుక్ చేయండి.", "కొద్దిగా చల్లారనిచ్చి మృదువైన, క్రీమీ సాస్‌గా బ్లెండ్ చేయండి.", "పాన్‌లో కొద్దిగా నెయ్యి, వెన్న లేదా నూనె వేడి చేసి బ్లెండ్ చేసిన సాస్ వేయండి.", "తక్కువ మంటపై 2-3 నిమిషాలు ఉడికించండి.", "ఉప్పు (1 సంవత్సరం పైబడిన పిల్లలకు మాత్రమే), నల్ల మిరియాలు మరియు ఇటాలియన్ సీజనింగ్ వేయండి.", "ఉడికించిన పాస్తా వేసి అన్నీ కలిసే వరకు బాగా కలపండి."], "notes": "Creator's note: add salt only if the baby is above 1 year. Smooth creamy sauce coats small pasta; cashews are tree nuts, check for allergy.", "notes_te": "సృష్టికర్త గమనిక: బిడ్డ 1 సంవత్సరం పైబడి ఉంటే మాత్రమే ఉప్పు వేయండి. మృదువైన క్రీమీ సాస్ చిన్న పాస్తాను పూస్తుంది; జీడిపప్పులు ట్రీ నట్స్, అలెర్జీ ఉందో లేదో చూసుకోండి.", "added_at": "2026-10-22T16:04:06.460Z"}, {"n": 25, "title": "Creamy Hidden Veggie Protein Pasta", "title_te": "క్రీమీ హిడెన్ వెజ్జీ ప్రోటీన్ పాస్తా", "cat": "Adult", "section": "adult", "emoji": "🍳", "image": "https://www.indianveggiedelight.com/wp-content/uploads/2025/11/hidden-veggie-pasta-featured.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "Creamy pasta with a blended sauce of bottle gourd, tofu or paneer, makhana and cashews, no cream or flour.", "desc_te": "సొరకాయ, టోఫు లేదా పనీర్, మఖానా మరియు జీడిపప్పుతో బ్లెండ్ చేసిన సాస్‌తో చేసిన క్రీమీ పాస్తా; క్రీమ్ లేదా మైదా లేకుండా.", "tags": ["vegetarian", "contains dairy", "dinner", "lunch"], "ing": ["2.5 cups raw pasta", "Oil", "2-3 cubes butter", "3-4 garlic cloves", "1 medium onion, chopped", "1 cup bottle gourd (lauki) or any squash", "1/2 cup capsicum", "1/3 cup cashews", "1/2 cup tofu or paneer", "1/2 cup makhana", "Pasta water as needed", "1 tbsp oregano", "Mixed herbs", "Chilli flakes", "1/2 cup cheese", "Salt to taste", "1 tsp dry mango powder (amchur)"], "ing_te": ["2.5 cups పచ్చి పాస్తా", "నూనె", "2-3 ముక్కల వెన్న", "3-4 వెల్లుల్లి రెబ్బలు", "1 మధ్యస్థ ఉల్లిపాయ, తరిగినది", "1 cup సొరకాయ (లౌకీ) లేదా ఏదైనా గుమ్మడికాయ", "1/2 cup క్యాప్సికమ్", "1/3 cup జీడిపప్పు", "1/2 cup టోఫు లేదా పనీర్", "1/2 cup మఖానా", "అవసరమైనంత పాస్తా నీరు", "1 tbsp ఒరెగానో", "మిక్స్‌డ్ హెర్బ్స్", "చిల్లీ ఫ్లేక్స్", "1/2 cup చీజ్", "రుచికి తగినంత ఉప్పు", "1 tsp ఎండిన మామిడి పొడి (ఆమ్చూర్)"], "steps": ["Boil the pasta and keep aside.", "For the sauce, heat oil and butter; add garlic and roast well.", "Add the onions and saute until golden.", "Add the bottle gourd and capsicum, then the cashews, tofu or paneer, and makhana.", "Cover and cook on low flame until everything is soft.", "Switch off the flame, add some ice cubes to cool quickly, then blend into a super smooth creamy sauce.", "In a pan add a little butter, the prepared sauce, pasta water, oregano, herbs, chilli flakes, cheese, salt and amchur.", "Mix in the boiled pasta and serve."], "steps_te": ["పాస్తాను ఉడికించి పక్కన పెట్టండి.", "సాస్ కోసం నూనె మరియు వెన్న వేడి చేసి, వెల్లుల్లి వేసి బాగా వేయించండి.", "ఉల్లిపాయలు వేసి బంగారు రంగు వచ్చే వరకు వేయించండి.", "సొరకాయ మరియు క్యాప్సికమ్ వేసి, ఆ తర్వాత జీడిపప్పు, టోఫు లేదా పనీర్, మరియు మఖానా వేయండి.", "మూత పెట్టి తక్కువ మంటపై అన్నీ మెత్తబడే వరకు ఉడికించండి.", "మంట ఆపి, త్వరగా చల్లబరచడానికి కొన్ని ఐస్ ముక్కలు వేసి, ఆ తర్వాత చాలా మృదువైన క్రీమీ సాస్‌లా బ్లెండ్ చేయండి.", "ఒక పాన్‌లో కొద్దిగా వెన్న, తయారుచేసిన సాస్, పాస్తా నీరు, ఒరెగానో, హెర్బ్స్, చిల్లీ ఫ్లేక్స్, చీజ్, ఉప్పు మరియు ఆమ్చూర్ వేయండి.", "ఉడికించిన పాస్తా కలిపి వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:26.402Z"}, {"n": 30, "title": "Crispy Peri Peri Paneer Tacos with Fresh Salsa", "title_te": "క్రిస్పీ పెరి పెరి పనీర్ టాకోస్ మరియు తాజా సాల్సా", "cat": "Adult", "section": "adult", "emoji": "🌮", "image": "https://tb-static.uber.com/prod/image-proc/processed_images/f9b1ec5341e7137d34458d16a419520f/c67fc65e9b4e16a553eb7574fba090f1.jpeg", "prep": "15 minutes (marinade)", "cook": "about 5-6 minutes (paneer) plus toasting", "yield": "4 tacos", "desc": "Crispy peri peri paneer tacos with melted cheese and a fresh tomato-jalapeno salsa.", "desc_te": "కరిగిన చీజ్ మరియు తాజా టమోటా-జలపెనో సాల్సాతో చేసిన కరకరలాడే పెరి పెరి పనీర్ టాకోస్.", "tags": ["vegetarian", "contains dairy", "dinner", "snack"], "ing": ["300 g paneer cubes", "2 tbsp peri peri spice mix", "2 tbsp curd or Greek yogurt", "1 tsp lemon juice", "1 tbsp ginger-garlic paste", "Salt and pepper", "1 tbsp olive oil (for marinade)", "1/2 tbsp garlic powder", "1/2 tbsp chilli flakes", "1/2 tbsp parsley (optional)", "2 tbsp sriracha sauce", "1 tbsp olive oil (for cooking)", "2 tbsp chopped garlic", "4 taco-size tortillas", "Grated mozzarella or cheddar", "2 medium tomatoes, finely chopped", "1 medium onion, finely chopped", "4 tbsp jalapenos, finely chopped", "1/2 cup coriander leaves, chopped", "1/2 tsp salt (for salsa)", "1 tsp lemon juice (for salsa)", "Drizzle of olive oil (for salsa)"], "ing_te": ["300 g పనీర్ ముక్కలు", "2 tbsp పెరి పెరి స్పైస్ మిక్స్", "2 tbsp పెరుగు లేదా గ్రీక్ పెరుగు", "1 tsp నిమ్మరసం", "1 tbsp అల్లం-వెల్లుల్లి పేస్ట్", "ఉప్పు మరియు మిరియాలు", "1 tbsp ఆలివ్ నూనె (మ్యారినేడ్ కోసం)", "1/2 tbsp వెల్లుల్లి పొడి", "1/2 tbsp చిల్లీ ఫ్లేక్స్", "1/2 tbsp పార్స్లీ (ఐచ్ఛికం)", "2 tbsp శ్రీరాచా సాస్", "1 tbsp ఆలివ్ నూనె (వండటానికి)", "2 tbsp తరిగిన వెల్లుల్లి", "4 టాకో సైజు టార్టిల్లాలు", "తురిమిన మొజ్జారెల్లా లేదా చెడార్", "2 మధ్యస్థ టమోటాలు, సన్నగా తరిగినవి", "1 మధ్యస్థ ఉల్లిపాయ, సన్నగా తరిగినది", "4 tbsp జలపెనోలు, సన్నగా తరిగినవి", "1/2 cup కొత్తిమీర ఆకులు, తరిగినవి", "1/2 tsp ఉప్పు (సాల్సా కోసం)", "1 tsp నిమ్మరసం (సాల్సా కోసం)", "సాల్సా కోసం కొద్దిగా ఆలివ్ నూనె చిలకరించడం"], "steps": ["In a bowl mix the paneer cubes with peri peri spice, curd or yogurt, lemon juice, ginger-garlic paste, salt and pepper, olive oil, garlic powder, chilli flakes, parsley and sriracha; marinate 15 minutes.", "Heat 1 tbsp olive oil in a pan, add the chopped garlic and saute until golden.", "Add the marinated paneer and cook 5-6 minutes until slightly crispy.", "Place the tortillas on a hot tawa, sprinkle grated mozzarella or cheddar and fill with the paneer mixture.", "Fold and toast on the pan until golden and crispy.", "For the salsa, mix the tomatoes, onion, jalapenos, coriander, salt, lemon juice and a drizzle of olive oil.", "Serve the tacos with salsa and a dip of choice."], "steps_te": ["ఒక గిన్నెలో పనీర్ ముక్కలను పెరి పెరి స్పైస్, పెరుగు లేదా యోగర్ట్, నిమ్మరసం, అల్లం-వెల్లుల్లి పేస్ట్, ఉప్పు మరియు మిరియాలు, ఆలివ్ నూనె, వెల్లుల్లి పొడి, చిల్లీ ఫ్లేక్స్, పార్స్లీ మరియు శ్రీరాచాతో కలిపి 15 నిమిషాలు మ్యారినేట్ చేయండి.", "ఒక పాన్‌లో 1 tbsp ఆలివ్ నూనె వేడి చేసి, తరిగిన వెల్లుల్లి వేసి బంగారు రంగు వచ్చే వరకు వేయించండి.", "మ్యారినేట్ చేసిన పనీర్ వేసి కొద్దిగా కరకరలాడే వరకు 5-6 నిమిషాలు ఉడికించండి.", "టార్టిల్లాలను వేడి తవాపై ఉంచి, తురిమిన మొజ్జారెల్లా లేదా చెడార్ చల్లి, పనీర్ మిశ్రమంతో నింపండి.", "మడిచి, బంగారు రంగు వచ్చి కరకరలాడే వరకు పాన్‌లో కాల్చండి.", "సాల్సా కోసం టమోటాలు, ఉల్లిపాయ, జలపెనోలు, కొత్తిమీర, ఉప్పు, నిమ్మరసం మరియు కొద్దిగా ఆలివ్ నూనె కలపండి.", "టాకోస్‌ను సాల్సా మరియు ఇష్టమైన డిప్‌తో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:40.874Z"}, {"n": 42, "title": "Dates Oats Mini Cookies", "title_te": "ఖర్జూర ఓట్స్ మినీ కుకీలు", "cat": "Kid & Toddler", "section": "kid", "emoji": "🥣", "image": "https://ukmindonesia.id/uploads/cms/2026-03-02/ChatGPT-Image-Mar-2-2026-11_52_26-AM.png", "prep": "10 minutes (date soak)", "cook": "12-15 minutes at 170C (oven) or 8-10 minutes at 160C (air fryer)", "yield": "—", "desc": "Eggless mini cookies naturally sweetened with dates, soft and chewy inside and crisp outside.", "desc_te": "ఖర్జూరాలతో సహజంగా తీపి చేసిన, గుడ్లు లేని మినీ కుకీలు, లోపల మెత్తగా, నమిలేలా ఉండి బయట కరకరలాడుతాయి.", "tags": ["vegetarian", "snack"], "ing": ["1 cup (90 g) rolled oats", "1/2 cup (50 g) almond flour (or oat flour)", "10-12 soft dates (120 g), deseeded", "2 tbsp (32 g) peanut butter (optional)", "1/2 tsp baking powder", "1 tsp vanilla extract", "2-3 tbsp milk, if needed", "1-2 tbsp maple syrup or honey (optional, for extra sweetness)", "Chopped pistachios or other nuts, to top"], "ing_te": ["1 cup (90 g) రోల్డ్ ఓట్స్", "1/2 cup (50 g) బాదం పిండి (లేదా ఓట్ పిండి)", "10-12 మెత్తని ఖర్జూరాలు (120 g), గింజలు తీసినవి", "2 tbsp (32 g) వేరుశనగ వెన్న (ఐచ్ఛికం)", "1/2 tsp బేకింగ్ పౌడర్", "1 tsp వెనిల్లా ఎసెన్స్", "2-3 tbsp పాలు, అవసరమైతే", "1-2 tbsp మేపుల్ సిరప్ లేదా తేనె (ఐచ్ఛికం, మరింత తీపి కోసం)", "పైన వేయడానికి తరిగిన పిస్తాలు లేదా ఇతర గింజలు"], "steps": ["Soak the dates in warm water 10 minutes and blend into a smooth paste.", "Add the rolled oats, almond flour, baking powder, date paste, peanut butter and vanilla to a bowl; add maple syrup if using.", "Mix well; add milk only if needed.", "Shape into mini cookies and top with chopped pistachios.", "Oven: preheat to 170C for 10 minutes, then bake at 170C for 12-15 minutes until lightly golden.", "Air fryer: preheat to 170C for 3 minutes, then air fry at 160C for 8-10 minutes."], "steps_te": ["ఖర్జూరాలను గోరువెచ్చని నీటిలో 10 minutes నానబెట్టి, మెత్తని పేస్ట్‌లా బ్లెండ్ చేయండి.", "ఒక గిన్నెలో రోల్డ్ ఓట్స్, బాదం పిండి, బేకింగ్ పౌడర్, ఖర్జూర పేస్ట్, వేరుశనగ వెన్న మరియు వెనిల్లా వేయండి; వాడుతుంటే మేపుల్ సిరప్ వేయండి.", "బాగా కలపండి; అవసరమైతే మాత్రమే పాలు వేయండి.", "మినీ కుకీలుగా ఆకారం ఇచ్చి, పైన తరిగిన పిస్తాలు వేయండి.", "ఓవెన్: 170C కు 10 minutes ముందుగా వేడి చేసి, తర్వాత 170C వద్ద 12-15 minutes తేలికగా బంగారు రంగు వచ్చే వరకు కాల్చండి.", "ఎయిర్ ఫ్రైయర్: 170C కు 3 minutes ముందుగా వేడి చేసి, తర్వాత 160C వద్ద 8-10 minutes ఎయిర్ ఫ్రై చేయండి."], "notes": "Soft, chewy center suits toddlers; skip whole nut toppings (pistachios) for a toddler and use oat flour if nut-free is needed. Peanut butter is a common allergen: check for allergy.", "notes_te": "మెత్తని, నమిలే మధ్యభాగం పసిపిల్లలకు అనుకూలం; పసిపిల్లల కోసం మొత్తం గింజల టాపింగ్‌లను (పిస్తాలు) వదిలేయండి మరియు గింజలు లేకుండా కావాలంటే ఓట్ పిండి వాడండి. వేరుశనగ వెన్న సాధారణ అలర్జీ కారకం: అలర్జీ ఉందో లేదో చూసుకోండి.", "added_at": "2026-10-22T16:04:06.540Z"}, {"n": 13, "title": "Easy Chicken Fry", "title_te": "సులభమైన చికెన్ ఫ్రై", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://www.sharmispassions.com/wp-content/uploads/2024/01/chicken-fry3.jpg", "prep": "—", "cook": "about 15-20 minutes", "yield": "—", "desc": "Simple spicy pan-fried chicken thighs with Kashmiri chilli and garam masala; about 740 kcal and 68g protein.", "desc_te": "కాశ్మీరీ కారం మరియు గరం మసాలాతో చేసిన సాధారణ కారంగా వేయించిన చికెన్ తొడలు; about 740 kcal and 68g protein.", "tags": ["non-vegetarian", "contains dairy", "dinner", "lunch"], "ing": ["1 tbsp ghee", "500 g bone-in chopped chicken thighs", "1 tbsp Kashmiri chilli powder", "1.5 tbsp coriander powder", "1 tbsp garam masala", "1/2 tsp cumin powder", "1/2 tsp pepper powder", "1 tsp salt", "1 tbsp ginger garlic paste", "Chopped coriander leaves"], "ing_te": ["1 tbsp నెయ్యి", "500 g ఎముకతో ఉన్న ముక్కలు చేసిన చికెన్ తొడలు", "1 tbsp కాశ్మీరీ కారం పొడి", "1.5 tbsp ధనియాల పొడి", "1 tbsp గరం మసాలా", "1/2 tsp జీలకర్ర పొడి", "1/2 tsp మిరియాల పొడి", "1 tsp ఉప్పు", "1 tbsp అల్లం వెల్లుల్లి పేస్ట్", "తరిగిన కొత్తిమీర ఆకులు"], "steps": ["Heat the ghee in a pan on medium heat and add the chicken thighs; saute for 2 minutes.", "Add the Kashmiri chilli powder, coriander powder, garam masala, cumin powder, pepper powder and salt; mix well and cook 3 more minutes.", "Add the ginger garlic paste and cook on medium heat 10-15 minutes until the chicken is cooked.", "Finish with chopped coriander leaves and serve."], "steps_te": ["పాన్‌లో మధ్యస్థ మంటపై నెయ్యిని వేడి చేసి చికెన్ తొడలు వేసి 2 minutes వేయించండి.", "కాశ్మీరీ కారం పొడి, ధనియాల పొడి, గరం మసాలా, జీలకర్ర పొడి, మిరియాల పొడి మరియు ఉప్పు వేసి బాగా కలిపి మరో 3 minutes ఉడికించండి.", "అల్లం వెల్లుల్లి పేస్ట్ వేసి చికెన్ ఉడికేవరకు మధ్యస్థ మంటపై 10-15 minutes ఉడికించండి.", "తరిగిన కొత్తిమీర ఆకులతో ముగించి వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:02:50.665Z"}, {"n": 8, "title": "Garlic Butter Eggs with Rice", "title_te": "వెల్లుల్లి వెన్న గుడ్లతో అన్నం", "cat": "Adult", "section": "adult", "emoji": "🍳", "image": "https://dailyricerecipes.com/wp-content/uploads/2025/09/garlic-butter-fried-rice.webp", "prep": "—", "cook": "—", "yield": "—", "desc": "Creamy scrambled eggs folded through a garlic butter milk sauce, served over rice.", "desc_te": "వెల్లుల్లి వెన్న పాల సాస్‌లో కలిపిన క్రీమీ గిలకొట్టిన గుడ్లు, అన్నం మీద వడ్డించినవి.", "tags": ["vegetarian", "contains dairy", "dinner", "breakfast"], "ing": ["3 eggs", "1 tbsp butter (for eggs)", "1/4 tsp salt", "1/4 tsp Maggi Cukup Rasa seasoning", "1/2 cup chopped Chinese parsley", "2 tbsp butter (for sauce)", "100 ml milk", "5 cloves garlic, minced", "1 tsp corn starch", "1 tsp chilli flakes, plus a pinch for garnish", "1/2 tsp white pepper", "1/2 tsp oregano", "Cooked white rice, to serve"], "ing_te": ["3 గుడ్లు", "1 tbsp వెన్న (గుడ్ల కోసం)", "1/4 tsp ఉప్పు", "1/4 tsp మ్యాగీ చుకుప్ రసా సీజనింగ్", "1/2 cup తరిగిన చైనీస్ పార్స్లీ (కొత్తిమీర)", "2 tbsp వెన్న (సాస్ కోసం)", "100 ml పాలు", "5 వెల్లుల్లి రెబ్బలు, తరిగినవి", "1 tsp కార్న్ స్టార్చ్", "1 tsp చిల్లీ ఫ్లేక్స్, అలంకరణకు చిటికెడు అదనంగా", "1/2 tsp తెల్ల మిరియాలు", "1/2 tsp ఒరెగానో", "వడ్డించడానికి ఉడికిన తెల్ల అన్నం"], "steps": ["Crack the eggs into a bowl, add salt and Maggi seasoning and whisk.", "Pour into a hot pan, scramble lightly, then remove and set aside.", "In the same pan melt the butter, add the minced garlic, oregano, chilli flakes, milk and corn starch and stir into a creamy sauce.", "Return the eggs to the pan and mix into the sauce.", "Add the chopped Chinese parsley.", "Spoon over white rice and top with extra chilli flakes."], "steps_te": ["గుడ్లను గిన్నెలో పగలగొట్టి ఉప్పు, మ్యాగీ సీజనింగ్ వేసి గిలకొట్టండి.", "వేడి పాన్‌లో పోసి, తేలికగా గిలకొట్టి, తీసి పక్కన పెట్టండి.", "అదే పాన్‌లో వెన్న కరిగించి, తరిగిన వెల్లుల్లి, ఒరెగానో, చిల్లీ ఫ్లేక్స్, పాలు, కార్న్ స్టార్చ్ వేసి క్రీమీ సాస్‌లా కలపండి.", "గుడ్లను తిరిగి పాన్‌లో వేసి సాస్‌లో కలపండి.", "తరిగిన చైనీస్ పార్స్లీ వేయండి.", "తెల్ల అన్నం మీద వేసి పైన అదనపు చిల్లీ ఫ్లేక్స్‌తో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:02:39.442Z"}, {"n": 49, "title": "Healthy Crispy Quinoa Cookies", "title_te": "ఆరోగ్యకరమైన కరకరలాడే క్వినోవా కుకీలు", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍪", "image": "https://www.barrierfreecooking.com/wp-content/uploads/2026/01/a80o2m4pn0m8byyd8zrw.webp", "prep": "—", "cook": "18-20 minutes at 170C", "yield": "—", "desc": "Crispy thin quinoa and oat cookies sweetened with jaggery or dates, pitched for toddlers.", "desc_te": "బెల్లం లేదా ఖర్జూరాలతో తీపి చేసిన, పలుచని, కరకరలాడే క్వినోవా మరియు ఓట్ కుకీలు, పిల్లల కోసం సూచించబడ్డాయి.", "tags": ["vegetarian", "contains dairy", "snack"], "ing": ["1/2 cup cooked quinoa", "1 cup oats powder", "2 tbsp wheat/millet flour", "2 tbsp nut powder (almond/cashew)", "2.5-3 tbsp jaggery powder or 2 tbsp date paste or date syrup", "2 tbsp ghee", "1/4 tsp baking powder", "1/4 tsp cinnamon (optional)", "1/4 tsp elaichi powder", "Little milk as needed", "Finely chopped nuts"], "ing_te": ["1/2 cup వండిన క్వినోవా", "1 cup ఓట్స్ పౌడర్", "2 tbsp గోధుమ/సజ్జ పిండి", "2 tbsp గింజల పొడి (బాదం/జీడిపప్పు)", "2.5-3 tbsp బెల్లం పొడి లేదా 2 tbsp ఖర్జూర పేస్ట్ లేదా ఖర్జూర సిరప్", "2 tbsp నెయ్యి", "1/4 tsp బేకింగ్ పౌడర్", "1/4 tsp దాల్చినచెక్క (ఐచ్ఛికం)", "1/4 tsp యాలకుల పొడి", "అవసరమైనంత కొద్దిగా పాలు", "సన్నగా తరిగిన గింజలు"], "steps": ["Mix everything into a soft dough.", "Make small balls and gently press into thin round cookie shapes.", "Score the tops.", "Bake at 170C for 18-20 minutes, using convection mode for the last 10 minutes for a crispier version.", "Serve."], "steps_te": ["అన్నింటినీ కలిపి మెత్తని పిండిలా చేయండి.", "చిన్న ఉండలు చేసి, మెల్లగా ఒత్తి పలుచని గుండ్రని కుకీ ఆకారాలు చేయండి.", "పైన గీతలు గీయండి.", "170C వద్ద 18-20 minutes కాల్చండి, మరింత కరకరలాడే రకం కోసం చివరి 10 minutes కన్వెక్షన్ మోడ్ వాడండి.", "వడ్డించండి."], "notes": "Thin round cookie format; nut powder and chopped nuts are tree nuts, check for allergy and skip loose nut toppings for a toddler.", "notes_te": "పలుచని గుండ్రని కుకీ రూపం; గింజల పొడి మరియు తరిగిన గింజలు ట్రీ నట్స్, అలర్జీ ఉందో లేదో చూసుకోండి మరియు పసిపిల్లల కోసం పైన వేసే గింజలను వదిలేయండి.", "added_at": "2026-10-22T16:04:22.370Z"}, {"n": 4, "title": "Homemade Protein Yogurt Drinks (Chobani-style)", "title_te": "ఇంట్లో తయారు చేసిన ప్రోటీన్ పెరుగు పానీయాలు (చోబానీ తరహా)", "cat": "Adult", "section": "adult", "emoji": "🍿", "image": "https://unhurriedhomemaker.com/wp-content/uploads/2023/03/6228001C-ED1C-4BAA-94F9-88CC54D32CCD-768x768.jpeg", "prep": "—", "cook": "—", "yield": "about 2 jars (amounts make 4 small bottles in the video)", "desc": "Blended berry Greek-yogurt drink bottled for grab-and-go high-protein breakfasts, made to replace pricey store versions.", "desc_te": "ఖరీదైన స్టోర్ పానీయాలకు బదులుగా తయారు చేసిన, సీసాల్లో నింపి ఎక్కడికైనా తీసుకెళ్లగలిగే, బెర్రీ గ్రీక్ పెరుగు పానీయం; అధిక ప్రోటీన్ అల్పాహారం కోసం.", "tags": ["vegetarian", "contains dairy", "breakfast", "snack", "quick"], "ing": ["3/4 cup plain nonfat Greek yogurt", "Just over 1/2 cup milk (fat-free; higher-fat milk adds protein)", "2 tsp monk fruit sweetener", "1 tsp chia seeds", "1/4 tsp vanilla extract", "1 tsp lemon juice", "3/4 cup frozen berry medley"], "ing_te": ["3/4 cup సాదా నాన్‌ఫ్యాట్ గ్రీక్ పెరుగు", "1/2 cup కంటే కొంచెం ఎక్కువ పాలు (ఫ్యాట్ లేనివి; ఎక్కువ ఫ్యాట్ ఉన్న పాలు ప్రోటీన్‌ను పెంచుతాయి)", "2 tsp మాంక్ ఫ్రూట్ స్వీటెనర్", "1 tsp చియా గింజలు", "1/4 tsp వనిల్లా ఎక్స్‌ట్రాక్ట్", "1 tsp నిమ్మరసం", "3/4 cup ఫ్రోజెన్ బెర్రీ మెడ్లీ"], "steps": ["Add the yogurt, milk, sweetener, chia seeds, vanilla and lemon juice to a blender.", "Add the frozen berries and blend until smooth and pink-purple.", "Pour through a funnel into small bottles, seal and refrigerate.", "Optional tweaks from the creator: add a banana for sweetness, a handful of spinach, or a scoop of vanilla protein powder; thin with more milk or water plus fresh fruit for a drinkable consistency."], "steps_te": ["పెరుగు, పాలు, స్వీటెనర్, చియా గింజలు, వనిల్లా, నిమ్మరసాన్ని బ్లెండర్‌లో వేయండి.", "ఫ్రోజెన్ బెర్రీలు వేసి మృదువుగా, పింక్-పర్పుల్ రంగు వచ్చేవరకు బ్లెండ్ చేయండి.", "గరాటు ద్వారా చిన్న సీసాల్లో పోసి, మూసి, ఫ్రిజ్‌లో ఉంచండి.", "తయారీదారు సూచించిన ఐచ్ఛిక మార్పులు: తీపి కోసం అరటిపండు, గుప్పెడు పాలకూర, లేదా ఒక స్కూప్ వనిల్లా ప్రోటీన్ పౌడర్ కలపండి; తాగడానికి వీలుగా మరికొంత పాలు లేదా నీరు, తాజా పండ్లు కలిపి పలచబరచండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:02:39.203Z"}, {"n": 21, "title": "Iffa Chicken", "title_te": "ఇఫ్ఫా చికెన్", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://www.foodvlove.com/wp-content/uploads/2025/12/Pic-10-1.jpg", "prep": "not stated (marinade while sauce is made)", "cook": "about 13-15 minutes", "yield": "not stated (whole dish)", "desc": "Yogurt-marinated chicken thighs finished with a creamy blended egg-white, garlic and cheese sauce; whole dish about 835 kcal and 123g protein.", "desc_te": "పెరుగులో మ్యారినేట్ చేసిన చికెన్ తొడలపై క్రీమీగా బ్లెండ్ చేసిన గుడ్డు తెల్లసొన, వెల్లుల్లి మరియు చీజ్ సాస్ వేసి వడ్డించే వంటకం; మొత్తం వంటకంలో సుమారు 835 kcal మరియు 123g ప్రోటీన్ ఉంటుంది.", "tags": ["non-vegetarian", "contains dairy", "dinner", "lunch"], "ing": ["125 g Greek yogurt", "1 tbsp ginger garlic paste", "1 tsp Kashmiri chilli powder", "1/4 tsp turmeric powder", "1 tsp coriander powder", "1/2 tsp pepper powder", "1/2 tsp garam masala", "1 tsp salt", "1 tsp vinegar", "500 g boneless skinless chicken thighs", "2 boiled egg whites", "2 garlic cloves", "1 cheese slice (25 g)", "1 tsp vinegar (for sauce)", "80 ml skim milk", "1/4 tsp salt (for sauce)", "1/2 tsp sugar", "1 tsp oil", "Chopped coriander leaves"], "ing_te": ["125 g గ్రీక్ పెరుగు", "1 tbsp అల్లం వెల్లుల్లి పేస్ట్", "1 tsp కాశ్మీరీ కారం పొడి", "1/4 tsp పసుపు పొడి", "1 tsp ధనియాల పొడి", "1/2 tsp మిరియాల పొడి", "1/2 tsp గరం మసాలా", "1 tsp ఉప్పు", "1 tsp వెనిగర్", "500 g ఎముకలు లేని, చర్మం లేని చికెన్ తొడలు", "2 ఉడికించిన గుడ్డు తెల్లసొనలు", "2 వెల్లుల్లి రెబ్బలు", "1 చీజ్ స్లైస్ (25 g)", "1 tsp వెనిగర్ (సాస్ కోసం)", "80 ml స్కిమ్ పాలు", "1/4 tsp ఉప్పు (సాస్ కోసం)", "1/2 tsp చక్కెర", "1 tsp నూనె", "తరిగిన కొత్తిమీర ఆకులు"], "steps": ["Mix the Greek yogurt, ginger garlic paste, Kashmiri chilli powder, turmeric, coriander powder, pepper powder, garam masala, salt and vinegar in a bowl.", "Add the chicken thighs, mix well and let marinate while the sauce is made.", "Blend the boiled egg whites, garlic, cheese slice, vinegar, skim milk, salt and sugar and set aside.", "Heat 1 tsp oil in a pan on high heat and cook the marinated chicken about 4-5 minutes on each side, then a bit longer till the gravy thickens (3-5 more minutes).", "Drizzle the creamy sauce all over, bring the flame to low, cover and cook about 3 minutes.", "Sprinkle chopped coriander leaves and serve."], "steps_te": ["ఒక గిన్నెలో గ్రీక్ పెరుగు, అల్లం వెల్లుల్లి పేస్ట్, కాశ్మీరీ కారం పొడి, పసుపు, ధనియాల పొడి, మిరియాల పొడి, గరం మసాలా, ఉప్పు మరియు వెనిగర్ కలపండి.", "చికెన్ తొడలు వేసి బాగా కలిపి, సాస్ తయారుచేసేంత వరకు మ్యారినేట్ అవనివ్వండి.", "ఉడికించిన గుడ్డు తెల్లసొనలు, వెల్లుల్లి, చీజ్ స్లైస్, వెనిగర్, స్కిమ్ పాలు, ఉప్పు మరియు చక్కెరను బ్లెండ్ చేసి పక్కన పెట్టండి.", "ఒక పాన్‌లో 1 tsp నూనెను అధిక మంటపై వేడి చేసి, మ్యారినేట్ చేసిన చికెన్‌ను ప్రతి వైపు సుమారు 4-5 నిమిషాలు, ఆ తర్వాత గ్రేవీ చిక్కబడే వరకు మరో 3-5 నిమిషాలు ఉడికించండి.", "క్రీమీ సాస్‌ను పైన చల్లి, మంటను తగ్గించి, మూత పెట్టి సుమారు 3 నిమిషాలు ఉడికించండి.", "తరిగిన కొత్తిమీర ఆకులు చల్లి వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:15.532Z"}, {"n": 20, "title": "Kadai Chicken (Dhaba-style)", "title_te": "కడాయ్ చికెన్ (ధాబా శైలి)", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://d3sftlgbtusmnv.cloudfront.net/blog/wp-content/uploads/2024/08/Chicken-Kadai.jpg", "prep": "30 minutes to 1 hour (marinade; overnight ideal)", "cook": "—", "yield": "6 (about 300 g each)", "desc": "Homemade dhaba-style kadai chicken with a freshly roasted kadai masala; 6 servings, about 270 kcal and 26g protein per serving.", "desc_te": "తాజాగా వేయించిన కడాయ్ మసాలాతో చేసిన ఇంట్లో తయారుచేసిన ధాబా శైలి కడాయ్ చికెన్; 6 servings, about 270 kcal and 26g protein per serving.", "tags": ["non-vegetarian", "contains dairy", "dinner", "lunch"], "ing": ["1 kg bone-in chicken", "100 g curd", "2 tbsp ginger-garlic paste", "2 tsp Kashmiri chilli powder", "1 tsp turmeric", "1 tsp coriander powder", "1 tsp garam masala", "2 tsp lemon juice", "Salt to taste", "1 tsp mustard oil", "2 tbsp coriander seeds", "1 tsp cumin seeds", "1 tsp fennel seeds", "1 tsp peppercorns", "5-6 dried red chillies", "1 tbsp ghee", "1 bay leaf", "1 inch cinnamon", "1 black cardamom", "2 green cardamom", "2 medium onions, chopped", "1 tbsp garlic paste", "250 g tomato puree", "Hot water as needed", "1 tsp ghee (to finish)", "1 large onion, cubed", "1 capsicum, cubed", "Salt", "50 ml cream (diluted with water) or half-and-half", "1 tsp kasuri methi", "4-5 slit green chillies", "1/2 inch ginger julienne", "1 tbsp chopped coriander leaves"], "ing_te": ["1 kg ఎముకతో ఉన్న చికెన్", "100 g పెరుగు", "2 tbsp అల్లం-వెల్లుల్లి పేస్ట్", "2 tsp కాశ్మీరీ కారం పొడి", "1 tsp పసుపు", "1 tsp ధనియాల పొడి", "1 tsp గరం మసాలా", "2 tsp నిమ్మరసం", "రుచికి తగినంత ఉప్పు", "1 tsp ఆవ నూనె", "2 tbsp ధనియాలు", "1 tsp జీలకర్ర", "1 tsp సోంపు గింజలు", "1 tsp మిరియాలు", "5-6 ఎండబెట్టిన ఎర్ర మిరపకాయలు", "1 tbsp నెయ్యి", "1 బిర్యానీ ఆకు (బే లీఫ్)", "1 inch దాల్చినచెక్క", "1 నల్ల ఏలకు", "2 పచ్చ ఏలకులు", "2 మధ్యస్థ ఉల్లిపాయలు, తరిగినవి", "1 tbsp వెల్లుల్లి పేస్ట్", "250 g టమోటా ప్యూరీ", "అవసరమైనంత వేడి నీరు", "1 tsp నెయ్యి (ముగింపుకు)", "1 పెద్ద ఉల్లిపాయ, చతురస్ర ముక్కలుగా చేసినది", "1 క్యాప్సికమ్, చతురస్ర ముక్కలుగా చేసినది", "ఉప్పు", "50 ml క్రీమ్ (నీటితో పలచగా చేసినది) లేదా హాఫ్-అండ్-హాఫ్", "1 tsp కసూరి మేథీ", "4-5 చీల్చిన పచ్చి మిరపకాయలు", "1/2 inch అల్లం, సన్నని పొడవాటి ముక్కలు (జూలియన్)", "1 tbsp తరిగిన కొత్తిమీర ఆకులు"], "steps": ["Marinate the chicken with curd, ginger-garlic paste, Kashmiri chilli powder, turmeric, coriander powder, garam masala, lemon juice, salt and mustard oil; rest at least 30 minutes to 1 hour, overnight ideal.", "Dry roast the coriander seeds, cumin, fennel, peppercorns and dried red chillies; crush to a coarse powder and set aside.", "Heat 1 tbsp ghee, add the bay leaf, cinnamon, black and green cardamom.", "Add the chopped onions and garlic paste and cook till golden brown.", "Add the kadai masala, then the tomato puree; cook till the raw smell goes.", "Add the marinated chicken and a little hot water; cover and cook till the chicken is done and the gravy thickens.", "Separately, on high heat with very little ghee, stir-fry the onion and capsicum cubes with a pinch of salt till just charred; fold into the gravy.", "Finish with cream, kasuri methi, slit green chillies, ginger julienne and coriander; serve hot."], "steps_te": ["చికెన్‌ను పెరుగు, అల్లం-వెల్లుల్లి పేస్ట్, కాశ్మీరీ కారం పొడి, పసుపు, ధనియాల పొడి, గరం మసాలా, నిమ్మరసం, ఉప్పు మరియు ఆవ నూనెతో మెరినేట్ చేయండి; కనీసం 30 minutes నుండి 1 hour వరకు, రాత్రంతా ఉంచడం ఉత్తమం.", "ధనియాలు, జీలకర్ర, సోంపు, మిరియాలు మరియు ఎండబెట్టిన ఎర్ర మిరపకాయలను పొడిగా వేయించి, ముతక పొడిగా నలిపి పక్కన పెట్టండి.", "1 tbsp నెయ్యిని వేడి చేసి బిర్యానీ ఆకు, దాల్చినచెక్క, నల్ల మరియు పచ్చ ఏలకులు వేయండి.", "తరిగిన ఉల్లిపాయలు మరియు వెల్లుల్లి పేస్ట్ వేసి బంగారు రంగులోకి వచ్చేవరకు ఉడికించండి.", "కడాయ్ మసాలా వేసి, ఆ తర్వాత టమోటా ప్యూరీ వేసి, పచ్చి వాసన పోయేవరకు ఉడికించండి.", "మెరినేట్ చేసిన చికెన్ మరియు కొద్దిగా వేడి నీరు వేసి, మూత పెట్టి చికెన్ ఉడికి, గ్రేవీ చిక్కబడేవరకు ఉడికించండి.", "విడిగా, అధిక మంటపై చాలా తక్కువ నెయ్యితో ఉల్లిపాయ మరియు క్యాప్సికమ్ ముక్కలను చిటికెడు ఉప్పుతో కొద్దిగా కాలినట్లు అయ్యేవరకు వేయించి, గ్రేవీలో కలపండి.", "క్రీమ్, కసూరి మేథీ, చీల్చిన పచ్చి మిరపకాయలు, అల్లం జూలియన్ మరియు కొత్తిమీరతో ముగించి వేడిగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:15.492Z"}, {"n": 2, "title": "Khatta Mug", "title_te": "ఖట్టా మూగ్", "cat": "Adult", "section": "adult", "emoji": "🍲", "image": "https://purvanchaltadka.com/wp-content/uploads/2019/03/20190312_210212.png", "prep": "not stated", "cook": "Instant Pot 10 minutes on High Pressure plus natural release, then simmer 10-15 minutes", "yield": "not stated", "desc": "A savory and sour Gujarati dal made with yogurt. Comforting, hearty and simple.", "desc_te": "పెరుగుతో చేసిన రుచికరమైన, పుల్లని గుజరాతీ పప్పు. ఓదార్పునిచ్చే, కడుపు నిండే, సులభమైన వంటకం.", "tags": ["vegetarian", "contains dairy", "lunch", "dinner"], "ing": ["1 cup rinsed whole green moong dal", "1 tsp salt", "2.5 cups water", "1/8 tsp turmeric powder", "1/2 cup Greek or regular yogurt", "1/2 cup water", "2 tbsp besan", "1.5 tbsp ghee", "1 tsp mustard seeds", "2 tsp cumin seeds", "2 finely chopped green chilis", "6 curry leaves", "1/4 tsp turmeric powder", "1/2 tsp red chili powder", "1 tsp finely grated ginger", "1 tbsp chopped garlic", "1/2 tsp salt", "1/2 tsp coriander powder", "1/4 tsp garam masala"], "ing_te": ["1 cup కడిగిన పచ్చి పెసర పప్పు (whole green moong dal)", "1 tsp ఉప్పు", "2.5 cups నీరు", "1/8 tsp పసుపు పొడి", "1/2 cup గ్రీక్ లేదా సాధారణ పెరుగు", "1/2 cup నీరు", "2 tbsp శనగ పిండి (besan)", "1.5 tbsp నెయ్యి", "1 tsp ఆవాలు", "2 tsp జీలకర్ర", "2 సన్నగా తరిగిన పచ్చి మిరపకాయలు", "6 కరివేపాకు ఆకులు", "1/4 tsp పసుపు పొడి", "1/2 tsp కారం పొడి", "1 tsp సన్నగా తురిమిన అల్లం", "1 tbsp తరిగిన వెల్లుల్లి", "1/2 tsp ఉప్పు", "1/2 tsp ధనియాల పొడి", "1/4 tsp గరం మసాలా"], "steps": ["In an Instant Pot combine rinsed moong dal with 1 tsp salt, 2.5 cups water and 1/8 tsp turmeric; set for 10 minutes on High Pressure and let it naturally release.", "In a mixing bowl whisk together yogurt, 1/2 cup water and besan.", "Heat ghee in a large pot over medium heat; once hot, add mustard seeds; when they pop add cumin seeds, green chilis, curry leaves, turmeric powder and red chili powder; swirl so it does not brown.", "Add ginger and garlic and cook for a couple minutes, then add the yogurt-besan mixture and cook over a low flame for about 5 minutes while stirring.", "Once slightly thickened, add the cooked moong dal along with salt, coriander powder and garam masala; simmer gently for about 10-15 minutes on low heat.", "Remove from heat, taste and adjust salt or spice as needed; serve with roti and raw onion salad, or with rice, extra ghee and papad."], "steps_te": ["Instant Pot లో కడిగిన పెసర పప్పును 1 tsp ఉప్పు, 2.5 cups నీరు, 1/8 tsp పసుపుతో కలపండి; High Pressure పై 10 minutes పెట్టి, సహజంగా విడుదల కానివ్వండి.", "ఒక మిక్సింగ్ గిన్నెలో పెరుగు, 1/2 cup నీరు, శనగ పిండిని గిలకొట్టండి.", "పెద్ద పాత్రలో మీడియం మంటపై నెయ్యి వేడి చేయండి; వేడెక్కిన తర్వాత ఆవాలు వేయండి; అవి చిటపటలాడినప్పుడు జీలకర్ర, పచ్చి మిరపకాయలు, కరివేపాకు, పసుపు పొడి, కారం పొడి వేయండి; గోధుమ రంగులోకి మారకుండా తిప్పండి.", "అల్లం, వెల్లుల్లి వేసి రెండు నిమిషాలు వేయించండి, తర్వాత పెరుగు-శనగ పిండి మిశ్రమం వేసి తక్కువ మంటపై కలుపుతూ సుమారు 5 minutes ఉడికించండి.", "కొద్దిగా చిక్కబడిన తర్వాత ఉడికిన పెసర పప్పుతో పాటు ఉప్పు, ధనియాల పొడి, గరం మసాలా వేసి తక్కువ మంటపై సుమారు 10-15 minutes మెల్లగా మరిగించండి.", "మంట నుండి తీసి, రుచి చూసి అవసరమైతే ఉప్పు లేదా కారం సర్దండి; రోటీ, పచ్చి ఉల్లిపాయ సలాడ్‌తో లేదా అన్నంతో, అదనపు నెయ్యి, పాపడ్‌తో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:01:28.276Z"}, {"n": 7, "title": "Marry Me Tofu", "title_te": "మ్యారీ మీ టోఫు", "cat": "Adult", "section": "adult", "emoji": "🍢", "image": "https://fullofplants.com/wp-content/uploads/2025/09/tasty-marry-me-tofu-vegan-dish-with-cashew-cream-15.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "Crispy air-fried tofu in a creamy, garlicky tomato sauce with melted mozzarella, about 43g protein per serving.", "desc_te": "కరకరలాడే ఎయిర్ ఫ్రైడ్ టోఫు, క్రీమీ, వెల్లుల్లి టమోటా సాస్‌లో కరిగిన మోజరెల్లాతో; ఒక్కో సర్వింగ్‌లో సుమారు 43g ప్రోటీన్.", "tags": ["vegetarian", "contains dairy", "dinner"], "ing": ["200g firm/extra-firm tofu", "2 tsp cornflour", "1/2 tsp Kashmiri chilli powder", "1/2 tsp Italian seasoning", "1 tsp soy sauce", "1 tsp oil", "Salt and black pepper", "1 tsp oil (for sauce)", "1/2 small onion, finely chopped", "1 tbsp minced garlic", "1 medium tomato, finely chopped", "1-1.5 tbsp tomato ketchup", "1/2 tsp Kashmiri chilli powder (sauce)", "1/2 tsp Italian seasoning (sauce)", "1/2-1 tsp chilli flakes", "120g Greek yogurt", "20g grated mozzarella (about 2.5 tbsp)", "Chilli flakes, to finish", "Fresh coriander/parsley"], "ing_te": ["200g గట్టి/ఎక్స్‌ట్రా-గట్టి టోఫు", "2 tsp కార్న్‌ఫ్లోర్", "1/2 tsp కాశ్మీరీ కారం పొడి", "1/2 tsp ఇటాలియన్ సీజనింగ్", "1 tsp సోయా సాస్", "1 tsp నూనె", "ఉప్పు, నల్ల మిరియాలు", "1 tsp నూనె (సాస్ కోసం)", "1/2 చిన్న ఉల్లిపాయ, సన్నగా తరిగినది", "1 tbsp తరిగిన వెల్లుల్లి", "1 మీడియం టమోటా, సన్నగా తరిగినది", "1-1.5 tbsp టమోటా కెచప్", "1/2 tsp కాశ్మీరీ కారం పొడి (సాస్)", "1/2 tsp ఇటాలియన్ సీజనింగ్ (సాస్)", "1/2-1 tsp చిల్లీ ఫ్లేక్స్", "120g గ్రీక్ పెరుగు", "20g తురిమిన మోజరెల్లా (సుమారు 2.5 tbsp)", "చిల్లీ ఫ్లేక్స్, పైన వేయడానికి", "తాజా కొత్తిమీర/పార్స్లీ"], "steps": ["Tear the tofu into bite-sized pieces and toss with cornflour, Kashmiri chilli powder, Italian seasoning, soy sauce, salt, pepper and 1 tsp oil.", "Air fry at 200C for 12-15 minutes, shaking halfway, until golden and crispy.", "Heat 1 tsp oil and saute the onion and garlic.", "Add the tomato, ketchup, spices, salt and pepper and cook until jammy.", "Turn the heat off completely, stir in the Greek yogurt until creamy, then add the crispy tofu and coat in the sauce.", "Top with mozzarella, cover and let it melt, then finish with chilli flakes and fresh coriander/parsley."], "steps_te": ["టోఫును చిన్న ముక్కలుగా చింపి కార్న్‌ఫ్లోర్, కాశ్మీరీ కారం పొడి, ఇటాలియన్ సీజనింగ్, సోయా సాస్, ఉప్పు, మిరియాలు, 1 tsp నూనెతో కలపండి.", "200C వద్ద 12-15 minutes ఎయిర్ ఫ్రై చేయండి, మధ్యలో కదిలిస్తూ, బంగారు రంగు, కరకరలాడే వరకు.", "1 tsp నూనె వేడి చేసి ఉల్లిపాయ, వెల్లుల్లి వేయించండి.", "టమోటా, కెచప్, మసాలాలు, ఉప్పు, మిరియాలు వేసి జామ్‌లా అయ్యేవరకు ఉడికించండి.", "మంటను పూర్తిగా ఆపి, గ్రీక్ పెరుగు కలిపి క్రీమీగా చేసి, తర్వాత కరకరలాడే టోఫు వేసి సాస్‌లో పూర్తిగా కలపండి.", "పైన మోజరెల్లా వేసి, మూత పెట్టి కరిగనివ్వండి, తర్వాత చిల్లీ ఫ్లేక్స్, తాజా కొత్తిమీర/పార్స్లీతో ముగించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:02:39.380Z"}, {"n": 18, "title": "Oatmeal Nuts and Seeds Energy Bars (Orange)", "title_te": "ఓట్‌మీల్ నట్స్ మరియు సీడ్స్ ఎనర్జీ బార్స్ (ఆరెంజ్)", "cat": "Adult", "section": "adult", "emoji": "🥣", "image": "https://theforkedspoon.com/wp-content/uploads/2017/04/img-23.jpg", "prep": "10 minutes (flax rest)", "cook": "15 minutes", "yield": "about 10 bars", "desc": "No-refined-sugar baked bars of oats, nuts, seeds and raisins with orange juice and zest.", "desc_te": "ఆరెంజ్ రసం మరియు తొక్కతో చేసిన, శుద్ధి చేసిన చక్కెర లేని, ఓట్స్, గింజలు, విత్తనాలు మరియు ఎండుద్రాక్షతో కాల్చిన బార్స్.", "tags": ["vegetarian", "breakfast", "snack"], "ing": ["1.25 cups oats", "1/4 cup almonds", "1/4 cup pumpkin seeds", "1/4 cup peanuts", "1/4 cup walnuts", "1/4 cup sunflower seeds", "1/4 cup raisins", "1 tbsp flaxseed powder", "3 tbsp water", "1/3 cup honey", "3 tbsp peanut butter", "2 tbsp orange juice", "2 tsp orange zest (optional)", "1/4 tsp salt"], "ing_te": ["1.25 cups ఓట్స్", "1/4 cup బాదం", "1/4 cup గుమ్మడి గింజలు", "1/4 cup వేరుశనగ", "1/4 cup వాల్‌నట్స్", "1/4 cup పొద్దుతిరుగుడు గింజలు", "1/4 cup ఎండుద్రాక్ష", "1 tbsp అవిసె గింజల పొడి", "3 tbsp నీరు", "1/3 cup తేనె", "3 tbsp వేరుశనగ వెన్న", "2 tbsp ఆరెంజ్ రసం", "2 tsp ఆరెంజ్ తొక్క (ఐచ్ఛికం)", "1/4 tsp ఉప్పు"], "steps": ["Roast the oats, nuts and seeds separately, then chop into small pieces.", "In a bowl combine the oats, almonds, walnuts, peanuts, pumpkin seeds, sunflower seeds and raisins.", "Mix the flaxseed powder with water and rest 10 minutes until gelatinous.", "Add the flax gel, peanut butter, honey, orange juice and salt to the bowl and mix well.", "Transfer to a lined tray and shape into a rectangle.", "Bake at 350F for 15 minutes.", "Cool completely, slice into bars and enjoy."], "steps_te": ["ఓట్స్, గింజలు మరియు విత్తనాలను విడివిడిగా వేయించి, ఆ తర్వాత చిన్న ముక్కలుగా కత్తిరించండి.", "ఒక గిన్నెలో ఓట్స్, బాదం, వాల్‌నట్స్, వేరుశనగ, గుమ్మడి గింజలు, పొద్దుతిరుగుడు గింజలు మరియు ఎండుద్రాక్ష కలపండి.", "అవిసె గింజల పొడిని నీటితో కలిపి జెల్లీలా అయ్యేవరకు 10 minutes విశ్రాంతి ఇవ్వండి.", "అవిసె జెల్, వేరుశనగ వెన్న, తేనె, ఆరెంజ్ రసం మరియు ఉప్పును గిన్నెలో వేసి బాగా కలపండి.", "పేపర్ పరచిన ట్రేలోకి మార్చి దీర్ఘచతురస్రాకారంలో ఆకారం ఇవ్వండి.", "350F వద్ద 15 minutes కాల్చండి.", "పూర్తిగా చల్లారనివ్వండి, బార్స్‌లా కత్తిరించి ఆస్వాదించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:00.836Z"}, {"n": 12, "title": "One-Pot Ghee Chicken Rice", "title_te": "వన్-పాట్ నెయ్యి చికెన్ రైస్", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://theartisticcook.com/wp-content/uploads/2025/07/chicken-rice-one-pot-1200x2139.jpg", "prep": "15-20 minutes (rice soak)", "cook": "12-15 minutes (plus 5-6 minutes rest)", "yield": "2-3", "desc": "Cozy one-pot chicken rice with whole spices and biryani masala, somewhere between yakhni pulao and biryani.", "desc_te": "మొత్తం మసాలాలు మరియు బిర్యానీ మసాలాతో చేసిన హాయిగా ఉండే వన్-పాట్ చికెన్ రైస్, యఖ్ని పులావ్ మరియు బిర్యానీ మధ్యలో ఉండే వంటకం.", "tags": ["non-vegetarian", "contains dairy", "dinner", "lunch"], "ing": ["1-2 tbsp ghee", "1 tsp jeera (cumin seeds)", "2 elaichi (cardamom)", "2 cloves", "2-3 peppercorns", "1 medium sliced onion", "4-5 garlic cloves, minced", "2 Thai red chilli or green chilli", "350 g bite-sized chicken thigh pieces", "Salt", "1/4 tsp black pepper (or more to taste)", "1.5 tsp biryani masala", "220 g soaked rice (soaked 15-20 minutes)", "400 ml hot water", "Fresh coriander", "Lemon, for squeezing", "Raita, optional, to serve"], "ing_te": ["1-2 tbsp నెయ్యి", "1 tsp జీలకర్ర (జీరా)", "2 ఏలకులు (ఏలకులు)", "2 లవంగాలు", "2-3 మిరియాలు", "1 మధ్యస్థ ఉల్లిపాయ, సన్నగా తరిగినది", "4-5 వెల్లుల్లి రెబ్బలు, సన్నగా తరిగినవి", "2 థాయ్ ఎర్ర మిరపకాయలు లేదా పచ్చి మిరపకాయలు", "350 g చిన్న ముక్కలుగా చేసిన చికెన్ తొడలు", "ఉప్పు", "1/4 tsp నల్ల మిరియాల పొడి (లేదా రుచికి తగినంత ఎక్కువ)", "1.5 tsp బిర్యానీ మసాలా", "220 g నానబెట్టిన బియ్యం (15-20 minutes నానబెట్టినవి)", "400 ml వేడి నీరు", "తాజా కొత్తిమీర", "నిమ్మకాయ, పిండడానికి", "రైతా, ఐచ్ఛికం, వడ్డించడానికి"], "steps": ["Heat the ghee and add the jeera, elaichi, cloves and peppercorns.", "Add the sliced onion, minced garlic and chilli; cook until the onions are browned.", "Add the chicken, salt, black pepper and biryani masala; cook 5 minutes.", "Add the soaked rice and roast 5 minutes.", "Pour in the hot water, cover and cook on low-medium 12-15 minutes.", "Rest 5-6 minutes, then finish with fresh coriander and a squeeze of lemon.", "Serve as is or with raita."], "steps_te": ["నెయ్యిని వేడి చేసి జీలకర్ర, ఏలకులు, లవంగాలు మరియు మిరియాలు వేయండి.", "సన్నగా తరిగిన ఉల్లిపాయ, సన్నగా తరిగిన వెల్లుల్లి మరియు మిరపకాయ వేసి ఉల్లిపాయలు గోధుమ రంగులోకి వచ్చేవరకు ఉడికించండి.", "చికెన్, ఉప్పు, నల్ల మిరియాలు మరియు బిర్యానీ మసాలా వేసి 5 minutes ఉడికించండి.", "నానబెట్టిన బియ్యం వేసి 5 minutes వేయించండి.", "వేడి నీరు పోసి, మూత పెట్టి, తక్కువ-మధ్యస్థ మంటపై 12-15 minutes ఉడికించండి.", "5-6 minutes విశ్రాంతి ఇచ్చి, ఆ తర్వాత తాజా కొత్తిమీర మరియు నిమ్మరసం పిండి ముగించండి.", "అలాగే వడ్డించండి లేదా రైతాతో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:02:50.614Z"}, {"n": 27, "title": "Palak Paneer (Paneer-Puree Style)", "title_te": "పాలక్ పనీర్ (పనీర్-ప్యూరీ శైలి)", "cat": "Adult", "section": "adult", "emoji": "🧀", "image": "https://track2training.com/wp-content/uploads/2021/08/palak-paneer-5-500x500-1.jpg", "prep": "—", "cook": "about 8-10 minutes", "yield": "3", "desc": "High-protein palak paneer made by blending paneer into the spinach gravy, finished with a garlic-chilli tadka; 270 kcal and 20g protein per serving.", "desc_te": "పాలకూర గ్రేవీలో పనీర్‌ను బ్లెండ్ చేసి చేసిన అధిక ప్రోటీన్ పాలక్ పనీర్; చివరలో వెల్లుల్లి-కారం తడక వేయబడుతుంది; ఒక్కో భాగంలో 270 kcal మరియు 20g ప్రోటీన్ ఉంటుంది.", "tags": ["vegetarian", "contains dairy", "dinner", "lunch"], "ing": ["1 tsp oil", "1 large onion (about 120 g), thinly sliced", "1 tsp ginger garlic paste", "1/4 tsp turmeric", "1/2 tsp chilli powder", "1 tsp coriander powder", "1/2 tsp garam masala", "120 g tomato puree", "1/2 tsp salt", "250 g chopped palak (spinach)", "200 g soft paneer", "1/3 cup hot water (for blending)", "1 tbsp oil (for tadka)", "3/4 tsp cumin seeds", "1 tsp Kashmiri chilli powder", "3 garlic cloves, finely chopped", "Handful of chopped coriander"], "ing_te": ["1 tsp నూనె", "1 పెద్ద ఉల్లిపాయ (సుమారు 120 g), సన్నగా ముక్కలు చేసినది", "1 tsp అల్లం వెల్లుల్లి పేస్ట్", "1/4 tsp పసుపు", "1/2 tsp కారం పొడి", "1 tsp ధనియాల పొడి", "1/2 tsp గరం మసాలా", "120 g టమోటా ప్యూరీ", "1/2 tsp ఉప్పు", "250 g తరిగిన పాలకూర (పాలక్)", "200 g మెత్తని పనీర్", "1/3 cup వేడి నీరు (బ్లెండింగ్ కోసం)", "1 tbsp నూనె (తడక కోసం)", "3/4 tsp జీలకర్ర గింజలు", "1 tsp కాశ్మీరీ కారం పొడి", "3 వెల్లుల్లి రెబ్బలు, సన్నగా తరిగినవి", "గుప్పెడు తరిగిన కొత్తిమీర"], "steps": ["Heat 1 tsp oil in a pan on medium heat; add the onion and ginger garlic paste and cook till golden brown.", "Add the turmeric, chilli powder, coriander powder and garam masala; mix well and cook a minute.", "Add the tomato puree and salt; mix well and cook 2 minutes until thick and glossy.", "Add the chopped palak and mix well on low flame; cook 3 minutes.", "Blend the soft paneer with 1/3 cup hot water into a puree and add to the cooking spinach; mix well and simmer only 1-2 minutes.", "Make a tadka: heat 1 tbsp oil, add cumin seeds, Kashmiri chilli powder and finely chopped garlic.", "Mix in the tadka, switch off the flame, garnish with chopped coriander and serve."], "steps_te": ["ఒక పాన్‌లో మధ్యస్థ మంటపై 1 tsp నూనె వేడి చేసి, ఉల్లిపాయ మరియు అల్లం వెల్లుల్లి పేస్ట్ వేసి బంగారు రంగు వచ్చే వరకు ఉడికించండి.", "పసుపు, కారం పొడి, ధనియాల పొడి మరియు గరం మసాలా వేసి బాగా కలిపి ఒక నిమిషం ఉడికించండి.", "టమోటా ప్యూరీ మరియు ఉప్పు వేసి బాగా కలిపి, చిక్కగా మరియు మెరిసేలా అయ్యే వరకు 2 నిమిషాలు ఉడికించండి.", "తరిగిన పాలకూర వేసి తక్కువ మంటపై బాగా కలిపి 3 నిమిషాలు ఉడికించండి.", "మెత్తని పనీర్‌ను 1/3 cup వేడి నీటితో ప్యూరీలా బ్లెండ్ చేసి, ఉడుకుతున్న పాలకూరలో వేసి బాగా కలిపి కేవలం 1-2 నిమిషాలు మాత్రమే సిమ్మర్ చేయండి.", "తడక చేయండి: 1 tbsp నూనె వేడి చేసి, జీలకర్ర గింజలు, కాశ్మీరీ కారం పొడి మరియు సన్నగా తరిగిన వెల్లుల్లి వేయండి.", "తడక కలిపి, మంట ఆపి, తరిగిన కొత్తిమీరతో అలంకరించి వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:26.449Z"}, {"n": 28, "title": "Paneer Egg Idli", "title_te": "పనీర్ ఎగ్ ఇడ్లీ", "cat": "Adult", "section": "adult", "emoji": "🍳", "image": "https://piwebsiteimages.s3.ap-south-2.amazonaws.com/images/newsletter/june2026-reciepe.png", "prep": "—", "cook": "15 minutes (steaming)", "yield": "—", "desc": "Flour-free steamed idlis from eggs, paneer and coconut, pitched as a 15-minute protein breakfast.", "desc_te": "గుడ్లు, పనీర్ మరియు కొబ్బరితో చేసిన పిండి లేని ఆవిరిలో ఉడికించిన ఇడ్లీలు; 15 నిమిషాల ప్రోటీన్ బ్రేక్‌ఫాస్ట్‌గా చెప్పబడింది.", "tags": ["vegetarian", "contains dairy", "breakfast", "snack"], "ing": ["3 eggs", "1 cup paneer", "1 cup fresh coconut (optional, recommended for juicy texture)", "1/2 green chilli", "Little salt", "Little baking soda (optional)", "3-4 tbsp water", "Ghee or oil, for greasing"], "ing_te": ["3 గుడ్లు", "1 cup పనీర్", "1 cup తాజా కొబ్బరి (ఐచ్ఛికం, జ్యూసీగా ఉండటానికి సిఫార్సు చేయబడింది)", "1/2 పచ్చిమిర్చి", "కొద్దిగా ఉప్పు", "కొద్దిగా బేకింగ్ సోడా (ఐచ్ఛికం)", "3-4 tbsp నీరు", "గ్రీజింగ్ కోసం నెయ్యి లేదా నూనె"], "steps": ["Grate or blend the paneer and fresh coconut separately.", "Add the mixture to the eggs with the finely chopped green chilli.", "Add a little salt, a little baking soda and 3-4 tbsp water.", "Mix well with a spoon or spatula.", "Grease idli plates with ghee or oil.", "Pour the mixture into idli moulds.", "Steam like normal idli for 15 minutes.", "Serve hot with karam podi, chutney, sambar or any seed powder."], "steps_te": ["పనీర్ మరియు తాజా కొబ్బరిని విడివిడిగా తురమండి లేదా బ్లెండ్ చేయండి.", "ఆ మిశ్రమాన్ని గుడ్లలో సన్నగా తరిగిన పచ్చిమిర్చితో కలపండి.", "కొద్దిగా ఉప్పు, కొద్దిగా బేకింగ్ సోడా మరియు 3-4 tbsp నీరు వేయండి.", "చెంచా లేదా స్పాచులాతో బాగా కలపండి.", "ఇడ్లీ ప్లేట్లకు నెయ్యి లేదా నూనె రాయండి.", "మిశ్రమాన్ని ఇడ్లీ మూసలలో పోయండి.", "సాధారణ ఇడ్లీలాగా 15 నిమిషాలు ఆవిరిలో ఉడికించండి.", "కారం పొడి, చట్నీ, సాంబార్ లేదా ఏదైనా గింజల పొడితో వేడిగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:26.474Z"}, {"n": 35, "title": "Peri Peri Paneer Sourdough Toast", "title_te": "పెరి పెరి పనీర్ సోర్‌డో టోస్ట్", "cat": "Adult", "section": "adult", "emoji": "🧀", "image": "https://someindiangirl.com/wp-content/uploads/2022/03/Paneer-Bhurji-Toast-8-of-8-1024x1536.jpg", "prep": "—", "cook": "—", "yield": "2 slices", "desc": "Toasted sourdough topped with a creamy peri peri paneer, capsicum and cheese mixture.", "desc_te": "క్రీమీ పెరి పెరి పనీర్, క్యాప్సికమ్ మరియు చీజ్ మిశ్రమంతో పైన వేసిన టోస్ట్ చేసిన సోర్‌డో బ్రెడ్.", "tags": ["vegetarian", "contains dairy", "breakfast", "snack"], "ing": ["2 tbsp hung curd", "1 tsp mayonnaise", "1 tsp tomato ketchup", "1/2 tsp salt", "1 tsp peri peri masala", "1/2 tsp oregano", "1 tsp chilli flakes", "2 tbsp finely chopped onion", "2 tsp red capsicum, finely chopped", "2 tsp green capsicum, finely chopped", "30 g diced paneer", "30 g diced cheese", "2 slices sourdough bread", "Additional diced cheese, to top", "Butter, for greasing the griddle"], "ing_te": ["2 tbsp హంగ్ కర్డ్", "1 tsp మయోనైస్", "1 tsp టమాటా కెచప్", "1/2 tsp ఉప్పు", "1 tsp పెరి పెరి మసాలా", "1/2 tsp ఒరెగానో", "1 tsp చిల్లీ ఫ్లేక్స్", "2 tbsp సన్నగా తరిగిన ఉల్లిపాయ", "2 tsp ఎర్ర క్యాప్సికమ్, సన్నగా తరిగినది", "2 tsp పచ్చ క్యాప్సికమ్, సన్నగా తరిగినది", "30 g ముక్కలుగా కోసిన పనీర్", "30 g ముక్కలుగా కోసిన చీజ్", "2 ముక్కలు సోర్‌డో బ్రెడ్", "పైన వేయడానికి అదనంగా ముక్కలుగా కోసిన చీజ్", "గ్రిడిల్‌కు రాయడానికి వెన్న"], "steps": ["Mix the hung curd, mayonnaise and tomato ketchup in a bowl.", "Add the salt, peri peri masala, oregano and chilli flakes and stir into a sauce.", "Fold in the onion, red and green capsicum, diced paneer and diced cheese.", "Spoon generously onto two slices of sourdough bread and top with additional diced cheese.", "Cook on a hot butter-greased griddle or pan until the cheese melts and the bread is toasted."], "steps_te": ["హంగ్ కర్డ్, మయోనైస్ మరియు టమాటా కెచప్‌ను ఒక గిన్నెలో కలపండి.", "ఉప్పు, పెరి పెరి మసాలా, ఒరెగానో మరియు చిల్లీ ఫ్లేక్స్ వేసి సాస్‌గా కలపండి.", "ఉల్లిపాయ, ఎర్ర మరియు పచ్చ క్యాప్సికమ్, ముక్కలుగా కోసిన పనీర్ మరియు ముక్కలుగా కోసిన చీజ్‌ను మెల్లగా కలపండి.", "రెండు సోర్‌డో బ్రెడ్ ముక్కలపై దీనిని ఉదారంగా వేసి పైన అదనంగా ముక్కలుగా కోసిన చీజ్ వేయండి.", "వెన్న రాసిన వేడి గ్రిడిల్ లేదా పాన్‌పై చీజ్ కరిగి, బ్రెడ్ టోస్ట్ అయ్యే వరకు ఉడికించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:56.047Z"}, {"n": 23, "title": "Protein Breakfast Bowl (Cottage Cheese, Egg and Avocado)", "title_te": "ప్రోటీన్ బ్రేక్‌ఫాస్ట్ బౌల్ (కాటేజ్ చీజ్, గుడ్డు మరియు అవకాడో)", "cat": "Adult", "section": "adult", "emoji": "🍳", "image": "https://mybudgetrecipes.com/wp-content/uploads/2026/01/v2-17bvrh-o279a.jpg", "prep": "—", "cook": "about 1-2 minutes (tomato saute)", "yield": "1", "desc": "Layered breakfast bowl of runny eggs, cottage cheese, tomato, avocado and jalapeno; 406 kcal, 26g protein.", "desc_te": "జారుడు గుడ్లు, కాటేజ్ చీజ్, టమోటా, అవకాడో మరియు జలపెనోలతో పొరలుగా చేసిన బ్రేక్‌ఫాస్ట్ బౌల్; 406 kcal, 26g ప్రోటీన్.", "tags": ["vegetarian", "contains dairy", "breakfast", "quick"], "ing": ["1/2 cup cottage cheese", "2 large eggs", "1 medium tomato, diced", "2 tbsp onion, finely chopped", "1/4 avocado, sliced", "1 tbsp jalapeno, chopped", "2 tsp olive oil", "1 tsp everything bagel seasoning", "Pinch of salt"], "ing_te": ["1/2 cup కాటేజ్ చీజ్", "2 పెద్ద గుడ్లు", "1 మధ్యస్థ టమోటా, ముక్కలు చేసినది", "2 tbsp ఉల్లిపాయ, సన్నగా తరిగినది", "1/4 అవకాడో, ముక్కలు చేసినది", "1 tbsp జలపెనో, తరిగినది", "2 tsp ఆలివ్ నూనె", "1 tsp ఎవ్రీథింగ్ బేగెల్ సీజనింగ్", "చిటికెడు ఉప్పు"], "steps": ["Saute the tomato in 1 tsp olive oil with salt for 1-2 minutes.", "Add the eggs and stir gently, keeping them runny.", "Layer the cottage cheese, then the eggs.", "Top with onion, avocado, jalapeno, 1 tsp olive oil and everything bagel seasoning."], "steps_te": ["1 tsp ఆలివ్ నూనెలో ఉప్పుతో టమోటాను 1-2 నిమిషాలు వేయించండి.", "గుడ్లు వేసి మెల్లగా కలపండి, అవి జారుడుగా ఉండేలా చూసుకోండి.", "ముందు కాటేజ్ చీజ్, ఆ తర్వాత గుడ్లు పొరలుగా వేయండి.", "పైన ఉల్లిపాయ, అవకాడో, జలపెనో, 1 tsp ఆలివ్ నూనె మరియు ఎవ్రీథింగ్ బేగెల్ సీజనింగ్ వేయండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:15.612Z"}, {"n": 14, "title": "Protein Roti", "title_te": "ప్రోటీన్ రోటీ", "cat": "Adult", "section": "adult", "emoji": "🥗", "image": "https://snapcalorie-webflow-website.s3.us-east-2.amazonaws.com/media/recipe_pics_v2/medium/tandoori_roti.jpg", "prep": "10 minutes (rest)", "cook": "—", "yield": "2-3 rotis", "desc": "Soft, puffy roti enriched with tofu and Greek yogurt, no protein powder; about 22g protein per serving of 2-3 rotis.", "desc_te": "టోఫు మరియు గ్రీక్ యోగర్ట్‌తో సమృద్ధి చేసిన మెత్తని, ఉబ్బిన రోటీ, ప్రోటీన్ పౌడర్ లేకుండా; 2-3 rotis సర్వింగ్‌కు about 22g protein.", "tags": ["vegetarian", "contains dairy", "lunch", "dinner", "breakfast"], "ing": ["2 cups whole wheat flour", "1/4 cup Greek yogurt", "125 g tofu", "Paneer whey (or water), to blend the tofu"], "ing_te": ["2 cups గోధుమ పిండి", "1/4 cup గ్రీక్ యోగర్ట్", "125 g టోఫు", "టోఫును బ్లెండ్ చేయడానికి పనీర్ పాలు   const cb = document.getElementById('modalClose'); if(cb) cb.focus();
  document.getElementById('overlay').dataset.open = n;
  if(!keepOpen) document.getElementById('overlay').scrollTop = 0;
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); document.body.style.overflow = ''; delete document.getElementById('overlay').dataset.open; if(lastFocused && lastFocused.focus) lastFocused.focus(); }
document.addEventListener('keydown', e=>{ if(e.key!=='Tab' || !document.getElementById('overlay').classList.contains('open')) return; const els=[...document.querySelectorAll('#overlay button, #overlay a, #overlay input, #overlay select')].filter(el=>el.offsetParent!==null); if(!els.length) return; const first=els[0], last=els[els.length-1]; if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); } else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); } });
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
document.getElementById('search').addEventListener('input', e=>{ q=e.target.value; render(); });
document.getElementById('sectionFilter').addEventListener('change', e=>{ section=e.target.value; render(); });
document.getElementById('sortSel').addEventListener('change', e=>{ sort=e.target.value; render(); });
document.getElementById('langEnTop').onclick=()=>setLang('en');
document.getElementById('langTeTop').onclick=()=>setLang('te');
if(window.innerWidth>820) document.getElementById('sidebar').classList.add('open');
render();
</script></body></html>

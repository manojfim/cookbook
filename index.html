<script>
const RECIPES = [{"n": 54, "title": "3-Ingredient Almond Flour & Medjool Date Cookies", "title_te": "3 పదార్థాల బాదం పిండి & మెడ్జూల్ ఖర్జూర కుకీలు", "cat": "Adult", "section": "adult", "emoji": "🍪", "image": "https://www.mygingergarlickitchen.com/wp-content/uploads/2021/06/almond-flour-cookies-1.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "Vegan | Gluten-free", "desc_te": "వీగన్ | గ్లూటెన్ లేనివి", "tags": [], "ing": ["10–12 Medjool dates, pitted", "1 cup almond flour", "1/2 cup dark chocolate (for the base or drizzling)"], "ing_te": ["10–12 మెడ్జూల్ ఖర్జూరాలు, గింజలు తీసినవి", "1 cup బాదం పిండి", "1/2 cup డార్క్ చాక్లెట్ (బేస్ కోసం లేదా పైన చిలకరించడానికి)"], "steps": ["Prep Your Station Preheat your oven to 350°F / 175°C. Line a standard baking sheet with a sheet of parchment paper.", "Pro-Tip for Dry Dates: If your Medjool dates feel a bit firm or dry, soak them in warm water for 10 minutes to soften, then drain and pat them dry thoroughly before starting.", "Make the Dough Place the pitted dates into a food processor. Blend continuously until they break down and form a single, sticky paste ball. Add the 1 cup of almond flour and pulse in short bursts until a thick, uniform cookie dough forms.", "Shape the Cookies Scoop the dough and roll it into 1-inch balls using your hands. Place them on the prepared baking sheet and flatten them slightly into uniform cookie discs.", "Bake Bake for 10 to 12 minutes just until the edges turn a very light golden brown. The cookies will still be quite soft to the touch when they come out of the oven.", "The Cool Down Let the cookies rest undisturbed on the hot baking tray for 10 minutes. This cooling period is essential to help them firm up structurally.", "Add the Chocolate Base Melt the dark chocolate in a microwave-safe bowl in short 20-second bursts, or using a double boiler. Gently dip the bottom of each cooled cookie into the smooth chocolate, or simply use a spoon to drizzle it across the tops. Place the cookies back onto the parchment paper until the chocolate sets completely."], "steps_te": ["మీ స్థలం సిద్ధం చేయండి: మీ ఓవెన్‌ను 350°F / 175°C వద్ద వేడి చేయండి. సాధారణ బేకింగ్ షీట్‌పై పార్చ్మెంట్ పేపర్ పరచండి.", "పొడి ఖర్జూరాల కోసం చిట్కా: మీ మెడ్జూల్ ఖర్జూరాలు కొంచెం గట్టిగా లేదా పొడిగా అనిపిస్తే, మెత్తబడటానికి 10 minutes పాటు గోరువెచ్చని నీటిలో నానబెట్టి, తర్వాత నీరు వంపి బాగా పొడిగా తుడిచిన తర్వాత మొదలుపెట్టండి.", "పిండి చేయండి: గింజలు తీసిన ఖర్జూరాలను ఫుడ్ ప్రాసెసర్‌లో వేయండి. అవి విరిగి ఒకే, జిగురు పేస్ట్ బాల్‌గా అయ్యేవరకు నిరంతరం బ్లెండ్ చేయండి. 1 cup బాదం పిండి వేసి, మందపాటి, సమానమైన కుకీ పిండి అయ్యేవరకు చిన్న చిన్న పల్స్‌లో బ్లెండ్ చేయండి.", "కుకీల ఆకారం ఇవ్వండి: పిండిని తీసి చేతులతో 1-inch ఉండలుగా చేయండి. సిద్ధం చేసిన బేకింగ్ షీట్‌పై ఉంచి కొంచెం చదును చేసి సమానమైన కుకీ డిస్క్‌లుగా చేయండి.", "బేక్ చేయండి: అంచులు చాలా తేలికగా బంగారు రంగులోకి వచ్చేవరకు 10 to 12 minutes పాటు బేక్ చేయండి. ఓవెన్ నుంచి తీసినప్పుడు కుకీలు ఇంకా చాలా మృదువుగా ఉంటాయి.", "చల్లారనివ్వండి: కుకీలను వేడి బేకింగ్ ట్రేపైనే 10 minutes పాటు కదలకుండా ఉంచండి. ఈ చల్లారే సమయం వాటిని నిర్మాణాత్మకంగా గట్టిపడటానికి చాలా అవసరం.", "చాక్లెట్ బేస్ వేయండి: డార్క్ చాక్లెట్‌ను మైక్రోవేవ్‌లో పెట్టగల గిన్నెలో చిన్న 20-second బర్స్ట్‌లలో, లేదా డబుల్ బాయిలర్ ఉపయోగించి కరిగించండి. చల్లారిన ప్రతి కుకీ అడుగు భాగాన్ని మృదువైన చాక్లెట్‌లో మెల్లగా ముంచండి, లేదా చెంచాతో పైన చిలకరించండి. చాక్లెట్ పూర్తిగా గట్టిపడేవరకు కుకీలను తిరిగి పార్చ్మెంట్ పేపర్‌పై ఉంచండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:25.583Z"}, {"n": 43, "title": "3-Ingredient Cottage Cheese Bagels", "title_te": "3-పదార్థాల కాటేజ్ చీజ్ బేగెల్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🥯", "image": "https://joyinbites.com/wp-content/uploads/2026/05/ChatGPT-Image-May-15-2026-09_04_55-PM-1024x819.png", "prep": "—", "cook": "20 minutes at 375F plus 5-7 minutes at 400F", "yield": "—", "desc": "Easy high-protein cottage cheese bagels, pitched as a quick busy-morning breakfast.", "desc_te": "తేలికైన, అధిక ప్రోటీన్ కలిగిన కాటేజ్ చీజ్ బేగెల్స్, బిజీగా ఉండే ఉదయాలకు త్వరిత అల్పాహారంగా సూచించబడ్డాయి.", "tags": ["vegetarian", "contains dairy", "breakfast"], "ing": ["1 cup flour", "1 cup cottage cheese", "2 tsp baking powder", "Pinch of salt", "Egg wash, for brushing", "Everything bagel seasoning (for one version)", "Shredded cheddar cheese and sliced jalapenos (for the other version)"], "ing_te": ["1 cup పిండి", "1 cup కాటేజ్ చీజ్", "2 tsp బేకింగ్ పౌడర్", "చిటికెడు ఉప్పు", "గుడ్డు వాష్, పైన రాయడానికి", "ఎవ్రీథింగ్ బేగెల్ సీజనింగ్ (ఒక రకం కోసం)", "తురిమిన చెడార్ చీజ్ మరియు సన్నగా కోసిన జలపెనోలు (మరో రకం కోసం)"], "steps": ["Mix the flour, cottage cheese, baking powder and a pinch of salt in a bowl and blend until smooth.", "Shape the dough into rings and place on a parchment-lined tray.", "Brush with egg wash.", "Make two versions: one topped with everything bagel seasoning, the other with shredded cheddar cheese and sliced jalapenos.", "Bake at 375F for 20 minutes, then at 400F for 5-7 minutes until golden and fluffy.", "Slice and serve."], "steps_te": ["ఒక గిన్నెలో పిండి, కాటేజ్ చీజ్, బేకింగ్ పౌడర్ మరియు చిటికెడు ఉప్పు కలిపి, మెత్తగా అయ్యే వరకు బ్లెండ్ చేయండి.", "పిండిని రింగుల ఆకారంలో చేసి, పార్చ్‌మెంట్ పేపర్ వేసిన ట్రేలో ఉంచండి.", "గుడ్డు వాష్‌తో పైన రాయండి.", "రెండు రకాలు చేయండి: ఒకదానిపై ఎవ్రీథింగ్ బేగెల్ సీజనింగ్, మరోదానిపై తురిమిన చెడార్ చీజ్ మరియు సన్నగా కోసిన జలపెనోలు వేయండి.", "375F వద్ద 20 minutes, తర్వాత 400F వద్ద 5-7 minutes బంగారు రంగు వచ్చి, మెత్తగా పొంగే వరకు కాల్చండి.", "ముక్కలుగా కోసి వడ్డించండి."], "notes": "Chewy bagel texture; cut into small pieces for a toddler and skip the jalapeno version for young children.", "notes_te": "నమిలే బేగెల్ ఆకృతి; పసిపిల్లల కోసం చిన్న ముక్కలుగా కోసి, చిన్న పిల్లల కోసం జలపెనో రకాన్ని వదిలేయండి.", "added_at": "2026-10-22T16:04:16.094Z"}, {"n": 78, "title": "3-Ingredient Date & Walnut Energy Bites", "title_te": "3-పదార్థాల ఖర్జూర & వాల్‌నట్ ఎనర్జీ బైట్స్", "cat": "Adult", "section": "adult", "emoji": "🥘", "image": "https://coachellasbestdates.com/cdn/shop/articles/Walnut_Date_Energy_Bites.png?v=1767732791&width=720", "prep": "10 mins", "cook": "30 mins chill", "yield": "12 balls", "desc": "A fast, clean-eating snack rich in omega-3 healthy fats.", "desc_te": "ఒమేగా-3 ఆరోగ్యకరమైన కొవ్వులు అధికంగా ఉండే వేగవంతమైన, క్లీన్-ఈటింగ్ స్నాక్.", "tags": [], "ing": ["10–12 Medjool dates (pitted)", "1 cup raw walnut halves", "1/4 cup unsweetened shredded coconut"], "ing_te": ["10–12 మెడ్జూల్ ఖర్జూరాలు (గింజలు తీసినవి)", "1 cup పచ్చి వాల్‌నట్ సగాలు", "1/4 cup తీపి లేని తురిమిన కొబ్బరి"], "steps": ["Pulse pitted dates and walnuts until a thick sticky dough forms.", "Form the dough into small 1-inch balls.", "Roll each ball through shredded coconut.", "Chill in the fridge for 30 minutes to firm up."], "steps_te": ["గింజలు తీసిన ఖర్జూరాలు మరియు వాల్‌నట్స్‌ను మందపాటి జిగురు ముద్ద అయ్యేవరకు పల్స్ చేయండి.", "ముద్దను చిన్న 1-inch బంతులుగా చేయండి.", "ప్రతి బంతిని తురిమిన కొబ్బరిలో దొర్లించండి.", "గట్టిపడేందుకు ఫ్రిజ్‌లో 30 minutes చల్లబరచండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:06:17.567Z"}, {"n": 134, "title": "3-Ingredient No-Bake Date & Walnut Energy Bites", "title_te": "3-పదార్థాల నో-బేక్ ఖర్జూరం & వాల్‌నట్ ఎనర్జీ బైట్స్", "cat": "Adult", "section": "adult", "emoji": "🍲", "image": "https://coachellasbestdates.com/cdn/shop/articles/Walnut_Date_Energy_Bites.png?v=1767732791&width=720", "prep": "—", "cook": "—", "yield": "—", "desc": "Ingredients", "desc_te": "పదార్థాలు", "tags": [], "ing": ["10–12 large Medjool dates (pitted)", "1 cup raw walnut halves", "1/4 cup unsweetened shredded coconut (for rolling)", "Optional Improvisation: Add a pinch of sea salt or 1/2 tsp of vanilla extract to the food processor for enhanced flavor."], "ing_te": ["10–12 పెద్ద మెడ్జూల్ ఖర్జూరాలు (గింజలు తీసినవి)", "1 cup పచ్చి వాల్‌నట్ సగాలు", "1/4 cup తీపి లేని తురిమిన కొబ్బరి (దొర్లించడానికి)", "ఐచ్ఛిక మెరుగుదల: మరింత రుచి కోసం ఫుడ్ ప్రాసెసర్‌లో చిటికెడు సముద్రపు ఉప్పు లేదా 1/2 tsp వెనిల్లా ఎక్స్‌ట్రాక్ట్ వేయండి."], "steps": ["Prep the Dates: Slice open the Medjool dates and remove the pits. Ensure they are soft and sticky. (Tip: If your dates feel a bit dry or stiff, soak them in warm water for 5-10 minutes, then drain completely before using).", "Process: Place the pitted dates and walnut halves into a food processor. Pulse and blend continuously until the ingredients break down and clump together into a thick, uniform dough paste.", "Portion & Roll: Use a small cookie scoop or tablespoon to portion out the mixture. Roll the dough firmly between your palms to shape them into smooth, bite-sized balls.", "Coconut Coating: Spread the shredded coconut onto a shallow plate or bowl. Roll each energy ball through the coconut, pressing gently so the flakes adhere to the surface.", "Chill & Serve: Place the finished energy bites on a plate or tray. While they can be eaten immediately, chilling them in the fridge for 30 minutes firms them up nicely. Store in an airtight container in the fridge for up to two weeks."], "steps_te": ["ఖర్జూరాలను సిద్ధం చేయండి: మెడ్జూల్ ఖర్జూరాలను చీల్చి గింజలు తీసేయండి. అవి మెత్తగా, జిగురుగా ఉన్నాయని చూసుకోండి. (చిట్కా: ఖర్జూరాలు కొంచెం పొడిగా లేదా గట్టిగా అనిపిస్తే, వాడే ముందు 5-10 minutes గోరువెచ్చని నీటిలో నానబెట్టి పూర్తిగా వడకట్టండి).", "ప్రాసెస్ చేయండి: గింజలు తీసిన ఖర్జూరాలు, వాల్‌నట్ సగాలను ఫుడ్ ప్రాసెసర్‌లో వేయండి. పదార్థాలు విరిగి మందపాటి, ఏకరీతి పిండి ముద్దగా కలిసేవరకు పల్స్ చేసి నిరంతరం బ్లెండ్ చేయండి.", "భాగాలుగా చేసి చుట్టండి: మిశ్రమాన్ని భాగాలుగా తీయడానికి చిన్న కుకీ స్కూప్ లేదా టేబుల్‌స్పూన్ వాడండి. పిండిని అరచేతుల మధ్య గట్టిగా చుట్టి మృదువైన, చిన్న బంతులుగా ఆకారం ఇవ్వండి.", "కొబ్బరి పూత: తురిమిన కొబ్బరిని లోతులేని ప్లేట్ లేదా గిన్నెలో పరచండి. ప్రతి ఎనర్జీ బాల్‌ను కొబ్బరిలో దొర్లించి, రేకులు ఉపరితలానికి అంటుకునేలా మెల్లగా నొక్కండి.", "చల్లబరచి వడ్డించండి: తయారైన ఎనర్జీ బైట్స్‌ను ప్లేట్ లేదా ట్రేలో ఉంచండి. వెంటనే తినవచ్చు, కానీ ఫ్రిజ్‌లో 30 minutes చల్లబరిస్తే అవి బాగా గట్టిపడతాయి. గాలి చొరబడని డబ్బాలో ఫ్రిజ్‌లో two weeks వరకు నిల్వ చేయండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.217Z"}, {"n": 52, "title": "5-Ingredient Flourless Chocolate Banana Muffins", "title_te": "5 పదార్థాలతో పిండి లేని చాక్లెట్ అరటి మఫిన్స్", "cat": "Adult", "section": "adult", "emoji": "🍌", "image": "https://hungryhappens.net/wp-content/uploads/2026/01/IMG_3970-728x971.jpeg", "prep": "—", "cook": "—", "yield": "8–10 Muffins", "desc": "No Refined Flour | No Refined Sugar | Yield: 8–10 Muffins", "desc_te": "శుద్ధి చేసిన పిండి లేదు | శుద్ధి చేసిన చక్కెర లేదు | 8–10 మఫిన్స్ అవుతాయి", "tags": [], "ing": ["Base Dough", "3 ripe bananas, mashed", "2 cups almond flour", "3/4 cup peanut butter", "2 large eggs", "2 teaspoons baking powder", "Optional Add-Ins & Toppings", "Chocolate chips or dark chocolate chunks (for mixing in and topping)"], "ing_te": ["బేస్ డౌ", "3 పండిన అరటిపండ్లు, మెదిపినవి", "2 cups బాదం పిండి", "3/4 cup వేరుశెనగ వెన్న", "2 పెద్ద గుడ్లు", "2 teaspoons బేకింగ్ పౌడర్", "ఐచ్ఛిక అదనపు పదార్థాలు & టాపింగ్స్", "చాక్లెట్ చిప్స్ లేదా డార్క్ చాక్లెట్ ముక్కలు (కలపడానికి మరియు పైన వేయడానికి)"], "steps": ["Prep Your Station Preheat your oven to 180°C / 350°F. Line a standard muffin tin with paper liners or grease it thoroughly with a little oil or ghee.", "Mix the Batter In a large mixing bowl, mash the 3 ripe bananas with a fork until mostly smooth (a few small lumps are completely fine). Add the 2 cups of almond flour, 3/4 cup peanut butter, 2 eggs, and 2 teaspoons of baking powder. Stir everything together using a spatula until a thick, uniform batter forms. Fold in a handful of chocolate chips if using.", "Fill the Muffin Tin Scoop the batter evenly into the lined muffin cups, filling each cup about 3/4 full. Sprinkle a few extra chocolate chips or dark chocolate chunks on top of each muffin if desired.", "Bake to Perfection Bake at 180°C / 350°F for 15 to 17 minutes, or until the tops are golden brown and a toothpick inserted into the center of a muffin comes out clean (or with just a few moist crumbs).", "Cool and Firm Up Let the muffins rest in the hot tin for 5 minutes after removing from the oven. Transfer them to a wire cooling rack to cool completely. They will firm up and set as they cool down."], "steps_te": ["మీ స్థలం సిద్ధం చేయండి: మీ ఓవెన్‌ను 180°C / 350°F వద్ద వేడి చేయండి. సాధారణ మఫిన్ టిన్‌లో పేపర్ లైనర్లు వేయండి లేదా కొంచెం నూనె లేదా నెయ్యితో బాగా గ్రీజ్ చేయండి.", "బ్యాటర్ కలపండి: పెద్ద మిక్సింగ్ బౌల్‌లో 3 పండిన అరటిపండ్లను ఫోర్క్‌తో ఎక్కువగా మృదువుగా అయ్యేవరకు మెదపండి (కొన్ని చిన్న ముద్దలు ఉంటే పర్లేదు). 2 cups బాదం పిండి, 3/4 cup వేరుశెనగ వెన్న, 2 గుడ్లు మరియు 2 teaspoons బేకింగ్ పౌడర్ వేయండి. స్పాచులాతో అన్నీ కలిపి మందపాటి, సమానమైన బ్యాటర్ అయ్యేవరకు కలపండి. వాడుతుంటే కొన్ని చాక్లెట్ చిప్స్ కలపండి.", "మఫిన్ టిన్ నింపండి: బ్యాటర్‌ను లైనింగ్ వేసిన మఫిన్ కప్పుల్లో సమానంగా పోసి, ప్రతి కప్పును సుమారు 3/4 వరకు నింపండి. కావాలంటే ప్రతి మఫిన్‌పై కొన్ని చాక్లెట్ చిప్స్ లేదా డార్క్ చాక్లెట్ ముక్కలు చల్లండి.", "పూర్తిగా బేక్ చేయండి: 180°C / 350°F వద్ద 15 to 17 minutes పాటు, పైభాగం బంగారు రంగులోకి వచ్చి, మఫిన్ మధ్యలో గుచ్చిన టూత్‌పిక్ శుభ్రంగా (లేదా కొన్ని తడి ముక్కలతో) వచ్చేవరకు బేక్ చేయండి.", "చల్లార్చి గట్టిపడనివ్వండి: ఓవెన్ నుంచి తీసిన తర్వాత మఫిన్‌లను వేడి టిన్‌లోనే 5 minutes పాటు ఉంచండి. తర్వాత వైర్ కూలింగ్ ర్యాక్‌పైకి తీసి పూర్తిగా చల్లారనివ్వండి. చల్లారేకొద్దీ అవి గట్టిపడి స్థిరపడతాయి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:25.530Z"}, {"n": 10, "title": "AFC - Abi Fried Chicken with Chips, Slaw and Gravy", "title_te": "AFC - ఆబీ ఫ్రైడ్ చికెన్, చిప్స్, స్లా, గ్రేవీతో", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://palatesdesire.com/wp-content/uploads/2022/04/crispy-fried-chicken-recipe@palates-desire.jpg", "prep": "—", "cook": "30 minutes (chips); 10-15 minutes (chicken)", "yield": "1", "desc": "Healthier homemade take on a fried-chicken meal: cornflake-crusted chicken, baked potato chips and yogurt slaw, 536 kcal and 71g protein per serving.", "desc_te": "ఫ్రైడ్ చికెన్ భోజనానికి ఆరోగ్యకరమైన ఇంటి వెర్షన్: కార్న్‌ఫ్లేక్ ి స్లా చేయండి.", "చికెన్, చిప్స్‌ను స్లా, 50 ml చికెన్ గ్రేవీతో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:02:50.550Z"}, {"n": 58, "title": "Air Fried Chicken Malai Tikka", "title_te": "ఎయిర్ ఫ్రైడ్ చికెన్ మలై టిక్కా", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://myfoodstory.com/wp-content/uploads/2026/08/Malai-Chicken-Tikka-3.jpg", "prep": "—", "cook": "—", "yield": "2-3", "desc": "Zero-oil | High-protein | Low-calorie | Serves 2-3", "desc_te": "నూనె లేదు | అధిక ప్రోటీన్ | తక్కువ కేలరీలు | 2-3 మందికి సరిపోతుంది", "tags": [], "ing": ["Protein", "500g boneless chicken thigh, cubed and scored", "Marinade", "5 tbsp Greek yogurt", "50g low-calorie cheese, shredded", "1 tsp ginger-garlic paste", "⅓ cup fresh coriander leaves, chopped", "Salt and black pepper to taste", "Squeeze of lemon juice", "For Serving", "Sliced red onions", "Green chutney"], "ing_te": ["ప్రోటీన్", "500g ఎముకలు లేని చికెన్ తొడ, ముక్కలుగా చేసి గీతలు పెట్టినది", "మెరినేడ్", "5 tbsp గ్రీక్ పెరుగు", "50g తక్కువ కేలరీల చీజ్, తురిమినది", "1 tsp అల్లం-వెల్లుల్లి పేస్ట్", "⅓ cup తాజా కొత్తిమీర ఆకులు, తరిగినవి", "రుచికి తగినంత ఉప్పు మరియు నల్ల మిరియాలు", "కొంచెం నిమ్మరసం", "వడ్డించడానికి", "సన్నగా తరిగిన ఎర్ర ఉల్లిపాయలు", "గ్రీన్ చట్నీ"], "steps": ["Prep the chicken: Pat chicken thighs dry, then cube them and score lightly with a knife so the marinade penetrates better.", "Make the marinade: In a bowl, combine Greek yogurt, shredded low-calorie cheese, ginger-garlic paste, chopped coriander, salt, pepper, and a squeeze of lemon juice. Mix until smooth.", "Marinate: Add the chicken cubes to the bowl and coat evenly with the marinade. Cover and refrigerate for at least 1 hour, or up to 2 days for deeper flavor.", "Air fry: Preheat air fryer to 195°C / 385°F. Place marinated chicken in a single layer in the air fryer basket without overcrowding. Cook for 15 minutes, flipping halfway through, until golden brown and slightly charred at the edges.", "Serve: Plate the hot tikka with sliced red onions and a side of green chutney. Serve immediately for the best texture. Notes Chicken thigh keeps the tikka juicy and tender without oil, but you can use breast for even lower calories — just watch cooking time to avoid drying out. The low-cal cheese and yogurt create the signature creamy \"malai\" texture without heavy cream. For extra creaminess, add 1 tbsp milk powder to the marinade. For meal prep, store in an airtight container for 3-4 days. Reheat in the air fryer for 3-4 minutes to crisp it back up."], "steps_te": ["చికెన్ సిద్ధం చేయండి: చికెన్ తొడలను పొడిగా తుడిచి, ముక్కలుగా చేసి, మెరినేడ్ బాగా పట్టడానికి కత్తితో తేలికగా గీతలు పెట్టండి.", "మెరినేడ్ చేయండి: గిన్నెలో గ్రీక్ పెరుగు, తురిమిన తక్కువ కేలరీల చీజ్, అల్లం-వెల్లుల్లి పేస్ట్, తరిగిన కొత్తిమీర, ఉప్పు, మిరియాలు మరియు కొంచెం నిమ్మరసం కలపండి. మృదువుగా అయ్యేవరకు కలపండి.", "మెరినేట్ చేయండి: చికెన్ ముక్కలను గిన్నెలో వేసి మెరినేడ్‌తో సమానంగా పూయండి. మూత పెట్టి కనీసం 1 hour, లేదా ఎక్కువ రుచి కోసం 2 days వరకు ఫ్రిజ్‌లో ఉంచండి.", "ఎయిర్ ఫ్రై చేయండి: ఎయిర్ ఫ్రైయర్‌ను 195°C / 385°F వరకు వేడి చేయండి. మెరినేట్ చేసిన చికెన్‌ను బాస్కెట్‌లో ఒకే పొరగా, రద్దీ లేకుండా ఉంచండి. మధ్యలో తిప్పుతూ 15 minutes పాటు, బంగారు రంగులోకి వచ్చి అంచులు కొంచెం కాలేవరకు వండండి.", "వడ్డించండి: వేడి టిక్కాను సన్నగా తరిగిన ఎర్ర ఉల్లిపాయలు మరియు గ్రీన్ చట్నీతో ప్లేట్‌లో వడ్డించండి. మంచి ఆకృతి కోసం వెంటనే వడ్డించండి. గమనికలు: చికెన్ తొడ నూనె లేకుండానే టిక్కాను జ్యూసీగా, మృదువుగా ఉంచుతుంది, కానీ మరింత తక్కువ కేలరీల కోసం బ్రెస్ట్ వాడవచ్చు — ఎండిపోకుండా వండే సమయం గమనించండి. తక్కువ కేలరీల చీజ్ మరియు పెరుగు భారీ క్రీమ్ లేకుండానే ప్రత్యేకమైన క్రీమీ \"మలై\" ఆకృతిని ఇస్తాయి. ఎక్కువ క్రీమీగా కావాలంటే మెరినేడ్‌లో 1 tbsp పాలపొడి వేయండి. మీల్ ప్రెప్ కోసం, ఎయిర్‌టైట్ కంటైనర్‌లో 3-4 days పాటు నిల్వ చేయండి. తిరిగి క్రిస్పీగా చేయడానికి ఎయిర్ ఫ్రైయర్‌లో 3-4 minutes పాటు వేడి చేయండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:25.704Z"}, {"n": 133, "title": "Air Fryer Low-Calorie Yogurt Marinated Chicken Thighs", "title_te": "ఎయిర్ ఫ్రైయర్ తక్కువ కేలరీల పెరుగు మారినేట్ చేసిన చికెన్ థైస్", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://www.skinnytaste.com/wp-content/uploads/2024/06/Air-Fryer-Chicken-Thighs-6.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "Line Spacing: 1.15", "desc_te": "లైన్ స్పేసింగ్: 1.15", "tags": [], "ing": ["Recipe Overview", "Prep & Marinate Time", "Cook Time", "Cooking Method", "1 hour up to 2 days", "~15 minutes", "Air Fryer at 195°C (flipping halfway)", "Ingredients", "500g chicken thigh, cubed and scored", "5 tbsp yogurt", "50g low-calorie cheese", "1 tsp ginger garlic paste", "1/3 cup coriander leaves, chopped", "Salt & pepper to taste", "Squeeze of lemon"], "ing_te": ["రెసిపీ అవలోకనం", "సిద్ధం & మారినేట్ సమయం", "వండే సమయం", "వండే పద్ధతి", "1 hour నుండి 2 days వరకు", "~15 minutes", "195°C వద్ద ఎయిర్ ఫ్రైయర్ (మధ్యలో తిప్పుతూ)", "పదార్థాలు", "500g చికెన్ థై, ముక్కలుగా చేసి గాట్లు పెట్టినది", "5 tbsp పెరుగు", "50g తక్కువ కేలరీల చీజ్", "1 tsp అల్లం వెల్లుల్లి పేస్ట్", "1/3 cup కొత్తిమీర ఆకులు, తరిగినవి", "రుచికి తగ్గట్టు ఉప్పు & మిరియాలు", "నిమ్మకాయ పిండిన రసం"], "steps": ["Marinate: In a bowl, combine the cubed and scored chicken thighs with the yogurt, low-calorie cheese, ginger garlic paste, chopped coriander leaves, salt, pepper, and a squeeze of lemon. Mix thoroughly to ensure the chicken is well coated. Let it marinate in the refrigerator for at least 1 hour, or up to 2 days for maximum flavor absorption.", "Air Fry: Preheat your air fryer if necessary. Arrange the marinated chicken pieces in a single layer in the air fryer basket.", "Cook: Air fry at 195°C for approximately 15 minutes, flipping the chicken pieces halfway through the cooking time to ensure an even, juicy finish."], "steps_te": ["మారినేట్ చేయండి: గిన్నెలో ముక్కలు చేసి గాట్లు పెట్టిన చికెన్ థైస్‌ను పెరుగు, తక్కువ కేలరీల చీజ్, అల్లం వెల్లుల్లి పేస్ట్, తరిగిన కొత్తిమీర ఆకులు, ఉప్పు, మిరియాలు, నిమ్మకాయ రసంతో కలపండి. చికెన్ బాగా పూత పట్టేలా బాగా కలపండి. కనీసం 1 hour, లేదా గరిష్ఠ రుచి శోషణ కోసం 2 days వరకు ఫ్రిజ్‌లో మారినేట్ చేయనివ్వండి.", "ఎయిర్ ఫ్రై చేయండి: అవసరమైతే మీ ఎయిర్ ఫ్రైయర్‌ను ముందుగా వేడి చేయండి. మారినేట్ చేసిన చికెన్ ముక్కలను ఎయిర్ ఫ్రైయర్ బాస్కెట్‌లో ఒకే పొరలో అమర్చండి.", "వండండి: 195°C వద్ద సుమారు 15 minutes ఎయిర్ ఫ్రై చేయండి, సమానమైన, జ్యూసీ ఫినిష్ కోసం వండే సమయంలో మధ్యలో చికెన్ ముక్కలను తిప్పండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.195Z"}, {"n": 69, "title": "Almond Flour Banana Bread", "title_te": "బాదం పిండి అరటి బ్రెడ్", "cat": "Adult", "section": "adult", "emoji": "🍌", "image": "https://www.sweetashoney.co/wp-content/uploads/Almond-Flour-Banana-Bread-5.jpg", "prep": "10 mins", "cook": "50–60 mins", "yield": "1 loaf", "desc": "Moist, gluten-free, and high-protein, sweetened naturally by ripe bananas.", "desc_te": "తేమగా, గ్లూటెన్ లేకుండా, అధిక ప్రోటీన్‌తో, పండిన అరటిపండ్లతో సహజంగా తియ్యగా ఉంటుంది.", "tags": [], "ing": ["4 medium ripe bananas (mashed)", "3 cups almond flour, 3 eggs, 1/4 cup melted butter/oil", "1 tsp baking soda, 1 tsp cinnamon, 1 tsp vanilla, 1/4 tsp salt, 1 cup chopped walnuts"], "ing_te": ["4 మీడియం పండిన అరటిపండ్లు (మెదిపినవి)", "3 cups బాదం పిండి, 3 గుడ్లు, 1/4 cup కరిగించిన వెన్న/నూనె", "1 tsp బేకింగ్ సోడా, 1 tsp దాల్చినచెక్క, 1 tsp వెనిల్లా, 1/4 tsp ఉప్పు, 1 cup తరిగిన వాల్‌నట్స్"], "steps": ["Mash bananas, then whisk in eggs, melted butter, and vanilla.", "Fold in almond flour, baking soda, cinnamon, salt, and walnuts.", "Pour into a lined loaf pan and bake at 350°F for 50–60 minutes until set.", "Cool completely in the pan before slicing so the almond flour sets."], "steps_te": ["అరటిపండ్లను మెదిపి, తర్వాత గుడ్లు, కరిగించిన వెన్న మరియు వెనిల్లాను గిలకొట్టండి.", "బాదం పిండి, బేకింగ్ సోడా, దాల్చినచెక్క, ఉప్పు మరియు వాల్‌నట్స్ కలపండి.", "లైనింగ్ వేసిన లోఫ్ పాన్‌లో పోసి 350°F వద్ద 50–60 minutes పాటు గట్టిపడేవరకు బేక్ చేయండి.", "బాదం పిండి గట్టిపడటానికి కత్తిరించడానికి ముందు పాన్‌లోనే పూర్తిగా చల్లారనివ్వండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:46.048Z"}, {"n": 15, "title": "Amritsari Paneer Bhurji", "title_te": "అమృత్‌సరి పనీర్ భుర్జీ", "cat": "Adult", "section": "adult", "emoji": "🧀", "image": "https://www.ohmyveg.co.uk/wp-content/uploads/2025/09/Amritsari-Paneer-Bhurji-1-2-1-900x1200.webp", "prep": "—", "cook": "about 15 minutes", "yield": "not stated (whole dish)", "desc": "Creamy Amritsari-style paneer bhurji built on a roasted besan and yogurt base; whole dish about 656 kcal and 51g protein.", "desc_te": "వేయించిన శనగపిండి మరియు పెరుగు బేస్‌పై తయారైన క్రీమీ అమృత్‌సరి శైలి పనీర్ భుర్జీ; whole dish about 656 kcal and 51g protein.", "tags": ["vegetarian", "contains dairy", "dinner", "lunch", "breakfast"], "ing": ["1.5 tbsp besan flour", "230 g Greek yogurt (1 cup)", "1/2 tsp chilli powder", "1 tsp amchur powder", "1 tsp coriander powder", "1/2 tsp coriander powder (as listed)", "1 tbsp ghee", "1 tbsp cumin seeds", "10 g thinly sliced ginger", "1 chopped onion (80 g)", "2 slit green chillies", "1.5 tsp salt", "1 chopped tomato", "200 g low-fat paneer, mashed", "100 ml skimmed milk", "Coriander, for garnish", "1 tsp kasuri methi"], "ing_te": ["1.5 tbsp శనగపిండి (బేసన్)", "230 g గ్రీక్ యోగర్ట్ (1 cup)", "1/2 tsp కారం పొడి", "1 tsp ఆమ్‌చూర్ పొడి", "1 tsp ధనియాల పొడి", "1/2 tsp ధనియాల పొడి (జాబితాలో ఉన్నట్లుగా)", "1 tbsp నెయ్యి", "1 tbsp జీలకర్ర", "10 g సన్నగా తరిగిన అల్లం", "1 తరిగిన ఉల్లిపాయ (80 g)", "2 చీల్చిన పచ్చి మిరపకాయలు", "1.5 tsp ఉప్పు", "1 తరిగిన టమోటా", "200 g తక్కువ కొవ్వు పనీర్, మెత్తగా చేసినది", "100 ml స్కిమ్డ్ పాలు", "అలంకరణకు కొత్తిమీర", "1 tsp కసూరి మేథీ"], "steps": ["Dry-roast the besan flour in a pan on low heat for 5 minutes until nutty; set aside.", "In a bowl mix the Greek yogurt with chilli powder, amchur powder, coriander powder and the roasted besan.", "Heat the ghee on medium heat, add the cumin seeds and sliced ginger.", "Add the chopped onion, green chillies and salt; saute 5 minutes.", "Add the chopped tomato and mix well.", "Add the yogurt mixture and cook 5 minutes.", "Add the mashed paneer and skimmed milk and mix.", "Garnish with coriander and kasuri methi and serve."], "steps_te": ["శనగపిండిని తక్కువ మంటపై పాన్‌లో 5 minutes పొడిగా వేయించి, గింజల వాసన వచ్చేవరకు ఉంచి పక్కన పెట్టండి.", "ఒక గిన్నెలో గ్రీక్ యోగర్ట్‌తో కారం పొడి, ఆమ్‌చూర్ పొడి, ధనియాల పొడి మరియు వేయించిన శనగపిండి కలపండి.", "మధ్యస్థ మంటపై నెయ్యిని వేడి చేసి జీలకర్ర మరియు సన్నగా తరిగిన అల్లం వేయండి.", "తరిగిన ఉల్లిపాయ, పచ్చి మిరపకాయలు మరియు ఉప్పు వేసి 5 minutes వేయించండి.", "తరిగిన టమోటా వేసి బాగా కలపండి.", "పెరుగు మిశ్రమం వేసి 5 minutes ఉడికించండి.", "మెత్తగా చేసిన పనీర్ మరియు స్కిమ్డ్ పాలు వేసి కలపండి.", "కొత్తిమీర మరియు కసూరి మేథీతో అలంకరించి వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:00.748Z"}, {"n": 148, "title": "Authentic Indian Masala Chai for 1", "title_te": "1 వ్యక్తికి అసలైన భారతీయ మసాలా చాయ్", "cat": "Adult", "section": "adult", "emoji": "🍽️", "image": "https://culinaryshades.com/wp-content/uploads/2021/01/masala-chai-rc-640x640.jpeg", "prep": "—", "cook": "—", "yield": "1 Serving", "desc": "Ingredients & Measurements", "desc_te": "పదార్థాలు & కొలతలు", "tags": [], "ing": ["Water: 1/2 cup", "Whole Milk: 1/2 cup", "Black Tea Powder: 1 to 1.5 tsp (strong CTC tea)", "Fresh Ginger: 1/2 inch piece, grated or thoroughly crushed", "Green Cardamom: 2 pods, crushed open", "Cloves (Optional): 1 pod, crushed", "Sugar: 1 tsp, adjust to taste"], "ing_te": ["నీరు: 1/2 cup", "పూర్తి పాలు: 1/2 cup", "నల్ల టీ పొడి: 1 to 1.5 tsp (బలమైన CTC టీ)", "తాజా అల్లం: 1/2 inch ముక్క, తురిమినది లేదా బాగా నలిపినది", "పచ్చ ఏలకులు: 2 కాయలు, పగలగొట్టినవి", "లవంగాలు (ఐచ్ఛికం): 1 కాయ, నలిపినది", "చక్కెర: 1 tsp, రుచికి తగ్గట్టు సర్దుకోండి"], "steps": ["Simmer the Aromatics: Bring 1/2 cup of water to a boil in a small saucepan. Add the crushed ginger, cardamom, and clove. Let it boil for 2-3 minutes until the water becomes fragrant and turns slightly yellowish.", "Add Tea and Sugar: Add the black tea powder and sugar. Simmer on medium-low heat for 1-2 minutes until a deep, rich dark brown color forms.", "Pour the Milk: Pour in 1/2 cup of milk. Increase the heat to medium-high and bring the chai to a boil.", "The Double Boil: As the chai rises to the top of the pan, lower the heat to let it subside. Bring it up to a boil a second time. This helps create a richer flavor and texture.", "Strain and Serve: Turn off the heat. Strain the chai through a fine-mesh sieve directly into your mug and serve hot. Chef's Tip For authentic street-style masala chai, always use CTC (Crush, Tear, Curl) tea granules rather than whole leaf tea. Leaf tea does not infuse strongly or quickly enough to balance the heavy milk and spices."], "steps_te": ["సువాసన పదార్థాలను మరిగించండి: చిన్న సాస్‌పాన్‌లో 1/2 cup నీరు మరిగించండి. నలిపిన అల్లం, ఏలకులు, లవంగం వేయండి. నీరు సువాసన వచ్చి కొంచెం పసుపు రంగు వచ్చేవరకు 2-3 minutes మరిగించండి.", "టీ, చక్కెర వేయండి: నల్ల టీ పొడి, చక్కెర వేయండి. ముదురు, గాఢమైన గోధుమ రంగు వచ్చేవరకు మధ్యస్థ-తక్కువ మంటపై 1-2 minutes ఉడకబెట్టండి.", "పాలు పోయండి: 1/2 cup పాలు పోయండి. మంటను మధ్యస్థ-అధిక స్థాయికి పెంచి చాయ్‌ను మరిగించండి.", "రెండుసార్లు మరిగించడం: చాయ్ బాణలి పైకి లేచినప్పుడు, మంట తగ్గించి అది తగ్గనివ్వండి. రెండోసారి మళ్లీ మరిగించండి. ఇది మరింత గొప్ప రుచి, ఆకృతిని ఇస్తుంది.", "వడపోసి వడ్డించండి: మంట ఆపండి. చాయ్‌ను సన్నని జల్లెడతో నేరుగా మీ మగ్గులోకి వడపోసి వేడిగా వడ్డించండి. చెఫ్ చిట్కా: అసలైన స్ట్రీట్-స్టైల్ మసాలా చాయ్ కోసం ఎల్లప్పుడూ CTC (Crush, Tear, Curl) టీ గ్రాన్యూల్స్ వాడండి, పూర్తి ఆకు టీ కాదు. ఆకు టీ ఎక్కువ పాలు, మసాలాలతో సమతుల్యం కావడానికి తగినంత బలంగా, వేగంగా ఊరదు."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.678Z"}, {"n": 132, "title": "Authentic Indian Masala Chai V2", "title_te": "అసలైన భారతీయ మసాలా చాయ్ V2", "cat": "Adult", "section": "adult", "emoji": "🍽️", "image": "https://cdn.shopify.com/s/files/1/0522/1780/6999/articles/Masala_Chai-01_1000x1000.jpg?v=1620817758", "prep": "—", "cook": "—", "yield": "—", "desc": "Ingredients & Scaling Measurements", "desc_te": "పదార్థాలు & కొలతల స్కేలింగ్", "tags": [], "ing": ["Ingredient", "1 Person", "2 People", "5 People"], "ing_te": ["పదార్థం", "1 వ్యక్తికి", "2 మందికి", "5 మందికి"], "steps": ["Simmer the Aromatics: Bring the water to a boil in a saucepan. Add the crushed ginger, cardamom, and cloves. Let it boil for 2-3 minutes until the water becomes highly fragrant and turns a light yellowish hue.", "Add Tea and Sugar: Stir in the black tea powder and sugar. Simmer on medium-low heat for 1-2 minutes until a deep, rich dark brown infusion forms.", "Pour the Milk: Pour in the whole milk. Increase the heat to medium-high and bring the chai to a rolling boil.", "The Double Boil: As the chai foam rises to the top of the pan, lower the heat slightly to let it subside. Bring it up to a boil a second time. This traditional technique aerates the tea, enhancing both flavor and texture.", "Strain and Serve: Turn off the heat. Strain the masala chai through a fine-mesh sieve directly into the serving mugs and enjoy while hot. Chef's Tip For authentic street-style masala chai, always use CTC (Crush, Tear, Curl) tea granules rather than whole leaf tea. Leaf tea does not infuse strongly or quickly enough to balance the heavy milk and spices when scaled up."], "steps_te": ["సువాసన పదార్థాలను మరిగించండి: సాస్‌పాన్‌లో నీరు మరిగించండి. నలిపిన అల్లం, ఏలకులు, లవంగాలు వేయండి. నీరు బాగా సువాసన వచ్చి, లేత పసుపు రంగు వచ్చేవరకు 2-3 minutes మరిగించండి.", "టీ, చక్కెర వేయండి: నల్ల టీ పొడి, చక్కెర కలపండి. ముదురు, గాఢమైన గోధుమ రంగు కషాయం ఏర్పడేవరకు మధ్యస్థ-తక్కువ మంటపై 1-2 minutes ఉడకబెట్టండి.", "పాలు పోయండి: పూర్తి పాలు పోయండి. మంటను మధ్యస్థ-అధిక స్థాయికి పెంచి చాయ్‌ను బాగా మరిగించండి.", "రెండుసార్లు మరిగించడం: చాయ్ నురుగు బాణలి పైకి లేచినప్పుడు, మంటను కొంచెం తగ్గించి అది తగ్గనివ్వండి. రెండోసారి మళ్లీ మరిగించండి. ఈ సాంప్రదాయ పద్ధతి టీకి గాలి కలిపి రుచి, ఆకృతి రెండింటినీ మెరుగుపరుస్తుంది.", "వడపోసి వడ్డించండి: మంట ఆపండి. మసాలా చాయ్‌ను సన్నని జల్లెడతో నేరుగా సర్వింగ్ మగ్గుల్లోకి వడపోసి వేడిగా ఆస్వాదించండి. చెఫ్ చిట్కా: అసలైన స్ట్రీట్-స్టైల్ మసాలా చాయ్ కోసం ఎల్లప్పుడూ CTC (Crush, Tear, Curl) టీ గ్రాన్యూల్స్ వాడండి, పూర్తి ఆకు టీ కాదు. ఆకు టీ ఎక్కువ పాలు, మసాలాలతో సమతుల్యం కావడానికి తగినంత బలంగా, వేగంగా ఊరదు."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.152Z"}, {"n": 67, "title": "Baked Beetroot & Sattu Snack Sticks", "title_te": "బేక్ చేసిన బీట్‌రూట్ & సత్తు స్నాక్ స్టిక్స్", "cat": "Adult", "section": "adult", "emoji": "🍿", "image": "https://static.toiimg.com/photo/91625545.cms", "prep": "—", "cook": "—", "yield": "—", "desc": "A guilt-free, clean-eating snack option that is baked rather than fried. This nutrient-dense recipe combines the earthy goodness of beetroot with protein-rich sattu and a blend of healthy seeds for a perfect crunch.", "desc_te": "వేయించడానికి బదులు బేక్ చేసిన అపరాధ భావం లేని, శుభ్రమైన ఆహార స్నాక్ ఎంపిక. ఈ పోషకాలు అధికంగా ఉన్న రెసిపీ బీట్‌రూట్ యొక్క మట్టి రుచిని ప్రోటీన్ అధికంగా ఉన్న సత్తు మరియు పూర్తి కరకర కోసం ఆరోగ్యకరమైన విత్తనాల మిశ్రమంతో కలుపుతుంది.", "tags": [], "ing": ["Dry Mix", "1/2 cup whole wheat flour", "2 tablespoons roasted chickpea flour (sattu)", "2 tablespoons corn flour", "1 teaspoon black sesame seeds", "1 teaspoon white sesame seeds", "1/2 teaspoon chia seeds", "2 teaspoons flaxseed powder", "1/2 teaspoon dry ginger powder", "1/2 teaspoon black pepper", "1/2 teaspoon chat masala", "1/4 teaspoon dried mint powder", "1/4 teaspoon red chilli powder", "Salt to taste", "Wet Purée", "1 medium boiled beetroot", "2 garlic cloves", "1 tablespoon oil", "Optional: 1 tablespoon water (if needed for blending)"], "ing_te": ["పొడి మిశ్రమం", "1/2 cup హోల్ వీట్ పిండి", "2 tablespoons వేయించిన శనగపిండి (సత్తు)", "2 tablespoons కార్న్ ఫ్లోర్", "1 teaspoon నల్ల నువ్వులు", "1 teaspoon తెల్ల నువ్వులు", "1/2 teaspoon చియా గింజలు", "2 teaspoons అవిసె గింజల పొడి", "1/2 teaspoon ఎండిన అల్లం పొడి", "1/2 teaspoon నల్ల మిరియాలు", "1/2 teaspoon చాట్ మసాలా", "1/4 teaspoon ఎండిన పుదీనా పొడి", "1/4 teaspoon ఎర్ర మిరప పొడి", "రుచికి తగినంత ఉప్పు", "తడి ప్యూరీ", "1 మీడియం ఉడికించిన బీట్‌రూట్", "2 వెల్లుల్లి రెబ్బలు", "1 tablespoon నూనె", "ఐచ్ఛికం: 1 tablespoon నీరు (బ్లెండ్ చేయడానికి అవసరమైతే)"], "steps": ["Make the Purée In a blender, combine the boiled beetroot, garlic cloves, and oil. Blend until the mixture turns into an absolutely smooth purée. If the mixture is too thick to blend properly, add up to 1 tablespoon of water.", "Combine and Knead In a large mixing bowl, whisk together all the dry ingredients until evenly distributed. Add the fresh beetroot purée into the dry mix and knead thoroughly until you form a firm, cohesive dough.", "Shape Place the dough on a lightly floured surface or between sheets of parchment paper. Roll the dough out thinly and use a sharp knife or pizza cutter to slice it into uniform sticks.", "Bake Preheat your oven to 160°C (320°F). Arrange the snack sticks in a single layer on a lined baking tray. Bake for 16 to 18 minutes, or until the sticks are completely set and crisp.", "Cool and Serve Remove from the oven and let the sticks cool completely on a wire rack. They will become extra crunchy as they cool down to room temperature."], "steps_te": ["ప్యూరీ చేయండి: బ్లెండర్‌లో ఉడికించిన బీట్‌రూట్, వెల్లుల్లి రెబ్బలు మరియు నూనె కలపండి. మిశ్రమం పూర్తిగా మృదువైన ప్యూరీ అయ్యేవరకు బ్లెండ్ చేయండి. మిశ్రమం బ్లెండ్ చేయడానికి చాలా చిక్కగా ఉంటే, 1 tablespoon వరకు నీరు వేయండి.", "కలిపి పిసకండి: పెద్ద మిక్సింగ్ బౌల్‌లో పొడి పదార్థాలన్నింటినీ సమానంగా పంపిణీ అయ్యేవరకు గిలకొట్టండి. తాజా బీట్‌రూట్ ప్యూరీని పొడి మిశ్రమంలో వేసి, గట్టి, కలిసిన పిండి అయ్యేవరకు బాగా పిసకండి.", "ఆకారం ఇవ్వండి: పిండిని తేలికగా పిండి చల్లిన ఉపరితలంపై లేదా పార్చ్మెంట్ పేపర్ షీట్‌ల మధ్య ఉంచండి. పిండిని పలుచగా చుట్టి, పదునైన కత్తి లేదా పిజ్జా కట్టర్‌తో సమానమైన స్టిక్స్‌గా కత్తిరించండి.", "బేక్ చేయండి: మీ ఓవెన్‌ను 160°C (320°F) వద్ద వేడి చేయండి. స్నాక్ స్టిక్స్‌ను లైనింగ్ వేసిన బేకింగ్ ట్రేపై ఒకే పొరగా అమర్చండి. స్టిక్స్ పూర్తిగా గట్టిపడి క్రిస్పీ అయ్యేవరకు 16 to 18 minutes పాటు బేక్ చేయండి.", "చల్లార్చి వడ్డించండి: ఓవెన్ నుంచి తీసి, స్టిక్స్‌ను వైర్ ర్యాక్‌పై పూర్తిగా చల్లారనివ్వండి. గది ఉష్ణోగ్రతకు చల్లారేకొద్దీ అవి మరింత కరకరలాడతాయి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:45.993Z"}, {"n": 99, "title": "Baked Lentil & Veggie \"Meatballs\" with Mild Marinara Dippers", "title_te": "బేక్ చేసిన లెంటిల్ & వెజ్జీ \"మీట్‌బాల్స్\" మైల్డ్ మరినారా డిప్పర్స్‌తో", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍳", "image": "https://www.recipesandplaces.com/wp-content/uploads/2021/11/Plate-with-vegan-meatballs-and-tomato-sauce.jpg", "prep": "15 minutes", "cook": "20 minutes", "yield": "16–18 toddler-sized meatballs", "desc": "Soft, savory, and tender on the inside, these plant-based \"meatballs\" are packed with brown lentils, grated zucchini, carrots, and whole oats. They provide iron and fiber in an easy-to-grasp finger food shape that toddlers can dip into warm marinara sauce or enjoy tossed with pasta.", "desc_te": "లోపల మెత్తగా, రుచికరంగా, మృదువుగా ఉండే ఈ ప్లాంట్-ఆధారిత \"మీట్‌బాల్స్\"లో బ్రౌన్ లెంటిల్స్, తురిమిన గుమ్మడికాయ, క్యారెట్లు, హోల్ ఓట్స్ నిండి ఉంటాయి. పసిపిల్లలు సులభంగా పట్టుకోగల ఫింగర్ ఫుడ్ ఆకారంలో ఐరన్, ఫైబర్ అందిస్తాయి, వెచ్చని మరినారా సాస్‌లో డిప్ చేసి లేదా పాస్తాతో కలిపి తినవచ్చు.", "tags": [], "ing": ["1.5 cups cooked brown or green lentils (rinsed and well-drained if canned)", "1/2 cup finely grated zucchini (excess moisture squeezed out in a clean towel)", "1/2 cup finely grated carrots", "1/2 cup rolled oats (ground into quick oat flour) or breadcrumbs", "1 large egg (or 1 flax egg: 1 tbsp ground flaxseed + 2.5 tbsp water)", "1/4 cup grated parmesan cheese or nutritional yeast", "1/2 tsp dried Italian oregano or mixed herbs", "1/4 tsp garlic powder", "1/4 tsp onion powder", "1 tbsp olive oil (plus extra for brushing)", "For serving: 1/2 cup warm low-sodium mild marinara sauce"], "ing_te": ["1.5 cups వండిన బ్రౌన్ లేదా గ్రీన్ లెంటిల్స్ (క్యాన్‌వి అయితే కడిగి బాగా నీరు వంపేసినవి)", "1/2 cup సన్నగా తురిమిన గుమ్మడికాయ (శుభ్రమైన టవల్‌లో అదనపు తేమ పిండేసినది)", "1/2 cup సన్నగా తురిమిన క్యారెట్లు", "1/2 cup రోల్డ్ ఓట్స్ (త్వరిత ఓట్ పిండిలా పొడి చేసినవి) లేదా బ్రెడ్‌క్రంబ్స్", "1 large గుడ్డు (లేదా 1 ఫ్లాక్స్ గుడ్డు: 1 tbsp పొడి చేసిన అవిసె గింజలు + 2.5 tbsp నీరు)", "1/4 cup తురిమిన పార్మెసాన్ చీజ్ లేదా న్యూట్రిషనల్ ఈస్ట్", "1/2 tsp ఎండిన ఇటాలియన్ ఒరేగానో లేదా మిక్స్డ్ హెర్బ్స్", "1/4 tsp వెల్లుల్లి పొడి", "1/4 tsp ఉల్లిపాయ పొడి", "1 tbsp ఆలివ్ ఆయిల్ (పైన బ్రష్ చేయడానికి అదనంగా)", "వడ్డించడానికి: 1/2 cup వెచ్చని తక్కువ-సోడియం మైల్డ్ మరినారా సాస్"], "steps": ["Preheat & Prep: Preheat oven to 375°F (190°C) and line a large baking sheet with parchment paper.", "Mash the Lentils: In a large bowl, mash the cooked lentils thoroughly with a fork or potato masher until semi-smooth, leaving just a slight texture.", "Combine: Add the squeezed grated zucchini, grated carrots, oat flour, beaten egg, parmesan/nutritional yeast, olive oil, Italian herbs, garlic powder, and onion powder. Mix well until a soft dough forms that easily holds together. If too wet, add 1–2 extra tablespoons of oat flour.", "Shape: Using a tablespoon or small cookie scoop, roll the mixture into 1-inch balls and arrange on the baking sheet.", "Bake: Lightly brush the tops with olive oil. Bake for 18–20 minutes, gently rolling them over halfway through, until the exterior is golden and lightly firm to the touch while remaining soft inside.", "Serve: Allow to cool for 5 minutes. Serve warm with warm marinara sauce for dipping, or crumble gently over whole grain noodles."], "steps_te": ["ప్రీహీట్ & సిద్ధం: ఓవెన్‌ను 375°F (190°C) వద్ద ప్రీహీట్ చేసి, పెద్ద బేకింగ్ షీట్‌పై పార్చ్‌మెంట్ పేపర్ పరచండి.", "లెంటిల్స్ మెదపండి: పెద్ద గిన్నెలో వండిన లెంటిల్స్‌ను ఫోర్క్ లేదా పొటాటో మాషర్‌తో బాగా మెదపండి, కొద్దిగా ఆకృతి ఉండేలా సెమీ-స్మూత్‌గా.", "కలపండి: పిండేసిన తురిమిన గుమ్మడికాయ, తురిమిన క్యారెట్లు, ఓట్ పిండి, కొట్టిన గుడ్డు, పార్మెసాన్/న్యూట్రిషనల్ ఈస్ట్, ఆలివ్ ఆయిల్, ఇటాలియన్ హెర్బ్స్, వెల్లుల్లి పొడి, ఉల్లిపాయ పొడి వేయండి. సులభంగా కలిసిపోయే మెత్తని పిండి అయ్యేవరకు బాగా కలపండి. చాలా తడిగా ఉంటే 1–2 extra tablespoons ఓట్ పిండి కలపండి.", "ఆకారం ఇవ్వండి: టేబుల్‌స్పూన్ లేదా చిన్న కుకీ స్కూప్‌తో మిశ్రమాన్ని 1-inch బంతులుగా చుట్టి బేకింగ్ షీట్‌పై అమర్చండి.", "బేక్ చేయండి: పైన ఆలివ్ ఆయిల్‌ను తేలికగా బ్రష్ చేయండి. 18–20 minutes పాటు బేక్ చేయండి, మధ్యలో మెల్లగా తిప్పుతూ, బయట బంగారు రంగు, తాకితే తేలికగా గట్టిగా, లోపల మెత్తగా ఉండేవరకు.", "వడ్డించండి: 5 minutes చల్లారనివ్వండి. డిప్పింగ్ కోసం వెచ్చని మరినారా సాస్‌తో, లేదా హోల్ గ్రెయిన్ నూడుల్స్‌పై మెల్లగా నలిపి వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:27.018Z"}, {"n": 80, "title": "Baked Mixed Vegetable & Lentil Handvo Muffins", "title_te": "బేక్డ్ మిక్స్‌డ్ వెజిటబుల్ & లెంటిల్ హాండ్వో మఫిన్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍲", "image": "https://www.spiceupthecurry.com/wp-content/uploads/2024/03/handvo-muffins-1.jpg", "prep": "15 minutes", "cook": "22 minutes", "yield": "12 mini savory muffins", "desc": "A creative toddler take on traditional Gujarati Handvo (savory lentil and vegetable cake). Made with a wholesome batter of chickpea flour (besan), semolina/oats, and whole-milk yogurt, then packed with finely grated zucchini (or bottle gourd/lauki) and sweet carrots. Topped with a mild ghee-mustard-sesame seed aroma, these muffins are soft, cake-like, and loaded with plant protein.", "desc_te": "సాంప్రదాయ గుజరాతీ హాండ్వో (రుచికరమైన పప్పు మరియు కూరగాయల కేక్) యొక్క సృజనాత్మక పసిపిల్లల వెర్షన్. శనగపిండి (బేసన్), సెమోలినా/ఓట్స్ మరియు హోల్-మిల్క్ పెరుగుతో చేసిన ఆరోగ్యకరమైన పిండితో, సన్నగా తురిమిన జుకీని (లేదా సొరకాయ/లౌకీ) మరియు తీపి క్యారెట్లతో నింపబడింది. మైల్డ్ నెయ్యి-ఆవాలు-నువ్వుల సువాసనతో పైన వేసి, ఈ మఫిన్స్ మెత్తగా, కేక్‌లాగా ఉండి వృక్ష ప్రోటీన్‌తో నిండి ఉంటాయి.", "tags": [], "ing": ["1/2 cup chickpea flour (besan)", "1/4 cup fine semolina (sooji/rava) or oat flour", "1/2 cup plain whole-milk yogurt (curd)", "1/4 cup water (to adjust batter consistency)", "1/2 cup finely grated zucchini or bottle gourd (lauki), excess water lightly squeezed", "1/3 cup finely grated carrots", "1/4 tsp mild ginger paste", "1/4 tsp turmeric powder", "1/2 tsp baking powder", "1 tbsp ghee or avocado oil", "Mild Toddler Tempering (Tadka):", "1 tsp ghee", "1/2 tsp mustard seeds (rai)", "1 tsp white sesame seeds (til, rich in calcium)", "Pinch of cumin seeds"], "ing_te": ["1/2 cup శనగపిండి (బేసన్)", "1/4 cup సన్నని సెమోలినా (సూజీ/రవా) లేదా ఓట్ పిండి", "1/2 cup సాదా హోల్-మిల్క్ పెరుగు (కర్డ్)", "1/4 cup నీరు (పిండి స్థిరత్వం సర్దుకోవడానికి)", "1/2 cup సన్నగా తురిమిన జుకీని లేదా సొరకాయ (లౌకీ), అదనపు నీరు తేలికగా పిండినది", "1/3 cup సన్నగా తురిమిన క్యారెట్లు", "1/4 tsp మైల్డ్ అల్లం పేస్ట్", "1/4 tsp పసుపు పొడి", "1/2 tsp బేకింగ్ పౌడర్", "1 tbsp నెయ్యి లేదా అవకాడో నూనె", "మైల్డ్ టాడ్లర్ తాలింపు (తడ్కా):", "1 tsp నెయ్యి", "1/2 tsp ఆవాలు (రై)", "1 tsp తెల్ల నువ్వులు (తిల్, కాల్షియం అధికంగా ఉంటుంది)", "చిటికెడు జీలకర్ర"], "steps": ["Preheat & Prep: Preheat oven to 375°F (190°C). Grease a 12-cup mini muffin tin with ghee or line with silicone baking cups.", "Make Batter: In a medium bowl, whisk together chickpea flour, semolina/oat flour, yogurt, turmeric, ginger paste, and water until a smooth, lump-free batter forms (consistency similar to pancake batter). Let rest for 5 minutes.", "Fold Veggies: Stir in the grated zucchini, grated carrots, and baking powder.", "Prepare Tempering: Heat 1 teaspoon of ghee in a small pan over medium-low heat. Add mustard seeds, cumin seeds, and sesame seeds. Let them crackle and toast for 20 seconds, then remove from heat and pour directly into the batter. Stir well.", "Bake: Spoon the batter into the prepared muffin cups, filling about 3/4 full. Bake at 375°F for 20–22 minutes until a toothpick inserted into the center comes out clean and tops are lightly golden.", "Cool & Serve: Allow to cool in the pan for 10 minutes. Serve warm or at room temperature."], "steps_te": ["ప్రీహీట్ & సిద్ధం: ఓవెన్‌ను 375°F (190°C) వద్ద ప్రీహీట్ చేయండి. 12-cup మినీ మఫిన్ టిన్‌కు నెయ్యి రాయండి లేదా సిలికాన్ బేకింగ్ కప్‌లు వేయండి.", "పిండి చేయండి: ఒక మీడియం గిన్నెలో శనగపిండి, సెమోలినా/ఓట్ పిండి, పెరుగు, పసుపు, అల్లం పేస్ట్ మరియు నీటిని మెత్తని, గడ్డలు లేని పిండి అయ్యేవరకు గిలకొట్టండి (పాన్‌కేక్ పిండి లాంటి స్థిరత్వం). 5 minutes విశ్రాంతి ఇవ్వండి.", "కూరగాయలు కలపండి: తురిమిన జుకీని, తురిమిన క్యారెట్లు మరియు బేకింగ్ పౌడర్ కలపండి.", "తాలింపు సిద్ధం చేయండి: ఒక చిన్న పాన్‌లో 1 teaspoon నెయ్యిని మీడియం-తక్కువ మంటపై వేడి చేయండి. ఆవాలు, జీలకర్ర మరియు నువ్వులు వేయండి. 20 seconds చిటపటలాడి వేగేవరకు ఉంచి, మంట నుండి తీసి నేరుగా పిండిలో పోయండి. బాగా కలపండి.", "బేక్ చేయండి: పిండిని సిద్ధం చేసిన మఫిన్ కప్‌లలో చెంచాతో వేయండి, సుమారు 3/4 వరకు నింపండి. 375°F వద్ద 20–22 minutes బేక్ చేయండి, మధ్యలో గుచ్చిన టూత్‌పిక్ శుభ్రంగా వచ్చేవరకు మరియు పైభాగం తేలికగా బంగారు రంగులో అయ్యేవరకు.", "చల్లార్చి వడ్డించండి: పాన్‌లోనే 10 minutes చల్లారనివ్వండి. గోరువెచ్చగా లేదా గది ఉష్ణోగ్రత వద్ద వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:06:17.624Z"}, {"n": 139, "title": "Banana bread", "title_te": "బనానా బ్రెడ్", "cat": "Adult", "section": "adult", "emoji": "🍌", "image": "https://allrecipe.org/wp-content/uploads/2025/11/Moist-Homemade-Banana-Bread-Recipe-1024x683.png", "prep": "—", "cook": "—", "yield": "—", "desc": "🍌 Custom Almond Flour Banana Bread", "desc_te": "🍌 కస్టమ్ ఆల్మండ్ ఫ్లార్ బనానా బ్రెడ్", "tags": [], "ing": ["Item", "For 4 Bananas", "For 2 Bananas", "Ripe Bananas", "4 medium (mashed)", "2 medium (mashed)", "Almond Flour", "3 cups", "1.5 cups", "Eggs", "3 large", "2 large", "Melted Butter/Oil", "1/4 cup", "2 tablespoons", "Baking Soda", "1 teaspoon", "1/2 teaspoon", "Cinnamon & Vanilla", "1 tsp each", "1/2 tsp each", "Salt", "1/4 teaspoon", "A pinch", "Walnuts (chopped)", "1 cup", "1/2 cup"], "ing_te": ["వస్తువు", "4 అరటిపండ్లకు", "2 అరటిపండ్లకు", "పండిన అరటిపండ్లు", "4 medium (మెత్తగా చేసినవి)", "2 medium (మెత్తగా చేసినవి)", "ఆల్మండ్ ఫ్లార్", "3 cups", "1.5 cups", "గుడ్లు", "3 large", "2 large", "కరిగించిన వెన్న/నూనె", "1/4 cup", "2 tablespoons", "బేకింగ్ సోడా", "1 teaspoon", "1/2 teaspoon", "దాల్చిన చెక్క & వెనిల్లా", "1 tsp చొప్పున", "1/2 tsp చొప్పున", "ఉప్పు", "1/4 teaspoon", "చిటికెడు", "వాల్‌నట్స్ (తరిగినవి)", "1 cup", "1/2 cup"], "steps": ["Prep: Preheat oven to 175°C (350°F). Line a loaf pan with parchment paper.", "Wet Mix: In a large bowl, mash the bananas. Whisk in eggs, melted butter, and vanilla.", "Dry Mix: Fold in almond flour, baking soda, cinnamon, salt, and chopped walnuts. Stir until just combined.", "Bake: * Full Loaf (4 bananas): 50–60 minutes.", "Small Loaf (2 bananas): 35–45 minutes.", "Tip: If the top browns too fast, cover loosely with foil at the 40-minute mark.", "The Golden Rule: Let the bread cool completely in the pan before slicing. Almond flour needs to \"set\" or it will crumble."], "steps_te": ["సిద్ధం చేయండి: ఓవెన్‌ను 175°C (350°F) వరకు వేడి చేయండి. లోఫ్ పాన్‌కు పార్చ్మెంట్ పేపర్ పరచండి.", "తడి మిశ్రమం: పెద్ద గిన్నెలో అరటిపండ్లను మెత్తగా చేయండి. గుడ్లు, కరిగించిన వెన్న, వెనిల్లాను గిలకొట్టి కలపండి.", "పొడి మిశ్రమం: ఆల్మండ్ ఫ్లార్, బేకింగ్ సోడా, దాల్చిన చెక్క, ఉప్పు, తరిగిన వాల్‌నట్స్‌ను కలపండి. కేవలం కలిసేవరకు కలపండి.", "బేక్ చేయండి: * పూర్తి లోఫ్ (4 bananas): 50–60 minutes.", "చిన్న లోఫ్ (2 bananas): 35–45 minutes.", "చిట్కా: పైన భాగం చాలా వేగంగా గోధుమ రంగు వస్తే, 40-minute మార్క్ వద్ద ఫాయిల్‌తో వదులుగా కప్పండి.", "బంగారు నియమం: ముక్కలు చేసే ముందు బ్రెడ్‌ను పాన్‌లోనే పూర్తిగా చల్లబరచనివ్వండి. ఆల్మండ్ ఫ్లార్ “సెట్” కావాలి, లేకపోతే అది నలుగుతుంది."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.383Z"}, {"n": 46, "title": "Banana Bread Muffins", "title_te": "బనానా బ్రెడ్ మఫిన్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍌", "image": "https://buildyourbite.com/wp-content/uploads/2023/04/Banana-Bread-Muffins-10.jpg", "prep": "—", "cook": "18-20 minutes at 350F", "yield": "—", "desc": "Soft banana bread muffins with oat flour and yogurt, pitched as a healthy kids snack.", "desc_te": "ఓట్ పిండి మరియు పెరుగుతో చేసిన మెత్తని బనానా బ్రెడ్ మఫిన్స్, పిల్లలకు ఆరోగ్యకరమైన స్నాక్‌గా సూచిం inutes at 350F (175C)", "yield": "6 muffins", "desc": "Soft banana and cottage cheese muffins made in a blender, pitched for toddlers.", "desc_te": "బ్లెండర్‌లో తయారుచేసిన మెత్తని అరటి మరియు కాటేజ్ చీజ్ మఫిన్స్, పిల్లల కోసం సూచించబడ్డాయి.", "tags": ["vegetarian", "contains dairy", "breakfast", "snack"], "ing": ["1 cup (225 g) cottage cheese", "1 large ripe banana or 2 small bananas", "2 eggs", "1 tbsp (15 ml) avocado oil or melted butter", "3/4 cup (95 g) all-purpose flour", "1 tsp (4 g) baking powder", "1/2 tsp cinnamon (optional)"], "ing_te": ["1 cup (225 g) కాటేజ్ చీజ్", "1 పెద్ద పండిన అరటిపండు లేదా 2 చిన్న అరటిపండ్లు", "2 గుడ్లు", "1 tbsp (15 ml) అవకాడో నూనె లేదా కరిగించిన వెన్న", "3/4 cup (95 g) మైదా పిండి", "1 tsp (4 g) బేకింగ్ పౌడర్", "1/2 tsp దాల్చినచెక్క (ఐచ్ఛికం)"], "steps": ["Preheat the oven to 350F (175C) and lightly grease or line a 6-cup muffin pan.", "Add the eggs, cottage cheese, banana and avocado oil or melted butter to a blender; blend until smooth.", "Transfer to a bowl, add the flour and baking powder and gently fold just until combined; do not overmix.", "Divide evenly among the muffin cups, filling each about 3/4 full.", "Bake 22-25 minutes, until the tops are lightly golden and a toothpick comes out clean.", "Cool in the pan 5 minutes, then transfer.", "Note from the creator: if the batter seems too runny, add 1-2 tbsp (8-16 g) more flour. Store airtight in the refrigerator up to 3 days or freeze up to 2 months."], "steps_te": ["ఓవెన్‌ను 350F (175C) కు ముందుగా వేడి చేసి, 6-cup మఫిన్ పాన్‌కు తేలికగా నూనె రాయండి లేదా లైనింగ్ వేయండి.", "గుడ్లు, కాటేజ్ చీజ్, అరటిపండు మరియు అవకాడో నూనె లేదా కరిగించిన వెన్నను బ్లెండర్‌లో వేసి మెత్తగా బ్లెండ్ చేయండి.", "ఒక గిన్నెలోకి మార్చి, పిండి మరియు బేకింగ్ పౌడర్ వేసి, కలిసే వరకు మాత్రమే మెల్లగా కలపండి; ఎక్కువగా కలపవద్దు.", "మఫిన్ కప్పుల్లో సమానంగా పంచండి, ప్రతి కప్పును దాదాపు 3/4 వరకు నింపండి.", "పైన తేలికగా బంగారు రంగు వచ్చి, టూత్‌పిక్ శుభ్రంగా బయటకు వచ్చే వరకు 22-25 minutes కాల్చండి.", "పాన్‌లో 5 minutes చల్లారనిచ్చి, తర్వాత తీయండి.", "తయారీదారు సూచన: పిండి మరీ పల్చగా అనిపిస్తే, మరో 1-2 tbsp (8-16 g) పిండి వేయండి. గాలి చొరబడని డబ్బాలో ఫ్రిజ్‌లో 3 days వరకు ఉంచండి లేదా 2 months వరకు ఫ్రీజ్ చేయండి."], "notes": "Soft muffin texture, good for toddler self-feeding; standard muffin size can be halved for a toddler.", "notes_te": "మెత్తని మఫిన్ ఆకృతి, పసిపిల్లలు స్వయంగా తినడానికి అనుకూలం; సాధారణ మఫిన్ పరిమాణాన్ని పసిపిల్లల కోసం సగం చేయవచ్చు.", "added_at": "2026-10-22T16:04:06.489Z"}, {"n": 101, "title": "Banana, Berry & Greek Yogurt Baked Oatmeal Cups", "title_te": "అరటిపండు, బెర్రీ & గ్రీక్ పెరుగు బేక్ చేసిన ఓట్‌మీల్ కప్పులు", "cat": "Kid & Toddler", "section": "kid", "emoji": "🥣", "image": "https://sweetandsear.com/cdn-cgi/image/fit=contain,width=1024,format=auto/assets/images/1773078490642-kimv48kj.webp", "prep": "10 minutes", "cook": "22 minutes", "yield": "12 mini muffin cups (6 toddler servings)", "desc": "Inspired by The Plant Based School and Iowa Girl Eats", "desc_te": "ది ప్లాంట్ బేస్డ్ స్కూల్ మరియు అయోవా గర్ల్ ఈట్స్ నుండి ప్రేరణ పొందినది", "tags": [], "ing": ["1.5 cups old-fashioned rolled oats", "1/3 cup almond flour (adds protein, vitamin E, and tender texture)", "2 ripe bananas, thoroughly mashed (approx. 3/4 cup)", "1/2 cup plain whole-milk Greek yogurt", "1 large egg (or flax egg: 1 tbsp ground flaxseed + 2.5 tbsp water)", "1/4 cup whole milk (or fortified plant milk)", "1 tbsp ground chia seeds or ground flaxseed", "1 tsp pure vanilla extract", "1 tsp ground cinnamon", "1 tsp baking powder", "1/2 cup fresh blueberries or finely chopped strawberries"], "ing_te": ["1.5 cups ఓల్డ్-ఫ్యాషన్డ్ రోల్డ్ ఓట్స్", "1/3 cup ఆల్మండ్ పిండి (ప్రోటీన్, విటమిన్ E, మెత్తని ఆకృతి ఇస్తుంది)", "2 పండిన అరటిపండ్లు, బాగా మెదిపినవి (సుమారు 3/4 cup)", "1/2 cup ప్లెయిన్ హోల్-మిల్క్ గ్రీక్ పెరుగు", "1 large గుడ్డు (లేదా ఫ్లాక్స్ గుడ్డు: 1 tbsp పొడి చేసిన అవిసె గింజలు + 2.5 tbsp నీరు)", "1/4 cup హోల్ మిల్క్ (లేదా ఫోర్టిఫైడ్ ప్లాంట్ మిల్క్)", "1 tbsp పొడి చేసిన చియా గింజలు లేదా పొడి చేసిన అవిసె గింజలు", "1 tsp స్వచ్ఛమైన వనిల్లా ఎక్స్‌ట్రాక్ట్", "1 tsp దాల్చినచెక్క పొడి", "1 tsp బేకింగ్ పౌడర్", "1/2 cup తాజా బ్లూబెర్రీలు లేదా సన్నగా తరిగిన స్ట్రాబెర్రీలు"], "steps": ["Preheat & Prep: Preheat oven to 375°F (190°C). Grease a 12-cup muffin tin or line with silicone baking cups.", "Mix Wet Ingredients: In a large mixing bowl, mash the ripe bananas thoroughly until smooth. Whisk in the Greek yogurt, egg, milk, and vanilla extract until uniform and creamy.", "Combine Dry Ingredients: Stir in the rolled oats, almond flour, ground chia seeds, ground cinnamon, and baking powder until well incorporated and no dry spots remain.", "Fold Fruit: Gently fold in the blueberries or chopped strawberries.", "Portion & Bake: Divide batter evenly among the 12 muffin cups (about 3/4 full). Bake for 20–22 minutes until tops are lightly golden and set to the touch.", "Cool: Allow to cool in the pan for 15–20 minutes so the oats fully absorb moisture and the cups set firmly without crumbling.", "Serve: Serve warm or at room temperature as mess-free finger food."], "steps_te": ["ప్రీహీట్ & సిద్ధం: ఓవెన్‌ను 375°F (190°C) వద్ద ప్రీహీట్ చేయండి. 12-cup మఫిన్ టిన్‌కు నూనె రాయండి లేదా సిలికాన్ బేకింగ్ కప్పులతో లైన్ చేయండి.", "తడి పదార్థాలు కలపండి: పెద్ద మిక్సింగ్ గిన్నెలో పండిన అరటిపండ్లను మెత్తగా అయ్యేవరకు బాగా మెదపండి. గ్రీక్ పెరుగు, గుడ్డు, పాలు, వనిల్లా ఎక్స్‌ట్రాక్ట్‌ను ఒకేలా, క్రీమీగా అయ్యేవరకు గిలకొట్టండి.", "పొడి పదార్థాలు కలపండి: రోల్డ్ ఓట్స్, ఆల్మండ్ పిండి, పొడి చేసిన చియా గింజలు, దాల్చినచెక్క పొడి, బేకింగ్ పౌడర్‌ను బాగా కలిసి పొడి ప్రదేశాలు లేకుండా అయ్యేవరకు కలపండి.", "పండు కలపండి: బ్లూబెర్రీలు లేదా తరిగిన స్ట్రాబెర్రీలను మెల్లగా మడత పెట్టినట్లు కలపండి.", "భాగాలు వేసి బేక్ చేయండి: బ్యాటర్‌ను 12 మఫిన్ కప్పుల్లో సమానంగా విభజించండి (సుమారు 3/4 నిండుగా). పైన తేలికగా బంగారు రంగు వచ్చి, తాకితే గట్టిగా అనిపించేవరకు 20–22 minutes పాటు బేక్ చేయండి.", "చల్లబరచండి: ఓట్స్ తేమను పూర్తిగా పీల్చుకుని కప్పులు గట్టిగా, విరిగిపోకుండా ఉండేలా పాన్‌లోనే 15–20 minutes పాటు చల్లారనివ్వండి.", "  in the egg, applesauce/yogurt, melted coconut oil, and vanilla extract.", "Add Dry Ingredients: Fold in rolled oats, whole wheat flour, hemp seeds, ground flaxseed, baking powder, and ground cinnamon. Stir just until combined (do not overmix).", "Fill Muffin Cups: Spoon the batter evenly into the mini muffin cups, filling each about 3/4 full.", "Bake: Bake for 14–16 minutes, or until a toothpick inserted into the center comes out clean and the tops spring back lightly.", "Cool & Store: Let cool in the tin for 5 minutes, then transfer to a wire rack to cool completely."], "steps_te": ["ప్రీహీట్ & సిద్ధం: ఓవెన్‌ను 350°F (175°C) వద్ద ప్రీహీట్ చేయండి. 16-cup మినీ మఫిన్ టిన్‌కు గ్రీజ్ చేయండి లేదా సిలికాన్ మినీ మఫిన్ కప్పులతో లైన్ చేయండి.", "మెదపండి & తడి కలపండి: పెద్ద గిన్నెలో అరటిపండ్లను పూర్తిగా మృదువుగా అయ్యేవరకు మెదపండి. గుడ్డు, యాపిల్‌సాస్/యోగర్ట్, కరిగించిన కొబ్బరి నూనె మరియు వెనిల్లా ఎక్స్‌ట్రాక్ట్‌ను గిలకొట్టండి.", "పొడి పదార్థాలు వేయండి: రోల్డ్ ఓట్స్, హోల్ వీట్ పిండి, హెంప్ గింజలు, పొడి చేసిన అవిసె గింజలు, బేకింగ్ పౌడర్ మరియు పొడి చేసిన దాల్చినచెక్కను మడిచి కలపండి. కేవలం కలిసేవరకు కలపండి (ఎక్కువగా కలపవద్దు).", "మఫిన్ కప్పులు నింపండి: బ్యాటర్‌ను మినీ మఫిన్ కప్పులలో సమానంగా స్పూన్ చేసి, ప్రతి దానిని సుమారు 3/4 వరకు నింపండి.", "బేక్ చేయండి: మధ్యలో గుచ్చిన టూత్‌పిక్ శుభ్రంగా వచ్చి పైన తేలికగా స్ప్రింగ్ అయ్యేవరకు 14–16 minutes బేక్ చేయండి.", "చల్లార్చి నిల్వ చేయండి: టిన్‌లో 5 minutes చల్లారనివ్వండి, తర్వాత పూర్తిగా చల్లారడానికి వైర్ ర్యాక్‌కు మార్చండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:18.976Z"}, {"n": 37, "title": "Butter Chicken Rice Bowl (Low Calorie)", "title_te": "బటర్ చికెన్ రైస్ బౌల్ (తక్కువ కేలరీలు)", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://yummyyield.com/wp-content/uploads/2026/01/29854ee3-a1f3-43ef-b2fd-e932039ba6e4bl_gkwfon.webp", "prep": "—", "cook": "—", "yield": "2", "desc": "High-protein, low-calorie butter chicken with flavoured rice; 2 servings, 670 kcal and 54g protein per serving.", "desc_te" sp పసుపు పొడి (అన్నం కోసం)", "ఒరెగానో (అన్నం కోసం)", "ఉప్పు (అన్నం కోసం)", "1/2 tsp అల్లం వెల్లుల్లి పేస్ట్ (అన్నం కోసం)", "200 g కడిగిన పచ్చి బాస్మతి బియ్యం", "300 ml నీరు"], "steps": ["Mix the chicken pieces with chilli powder, salt, ginger garlic paste, cumin powder, garam masala and curd; fry in just 5 ml oil.", "For the gravy, melt 10 g butter in a pan; fry the minced garlic, chopped onion and ginger garlic paste well.", "Add the chopped tomatoes, chilli powder, turmeric, cumin, garam masala and salt; fry nicely.", "Let it cool, then blend with 3 tbsp curd.", "Pour back into a pan, add 5 g butter and the cooked chicken; garnish with cilantro.", "For the flavoured rice, melt 5 g butter in a pan; add the minced garlic, chilli powder, turmeric, oregano, salt and ginger garlic paste.", "Toast the washed raw basmati rice.", "Add 300 ml water (1.5 times the rice), close the lid and cook.", "Serve the butter chicken with the flavoured rice."], "steps_te": ["చికెన్ ముక్కలను చిల్లీ పౌడర్, ఉప్పు, అల్లం వెల్లుల్లి పేస్ట్, జీరా పొడి, గరం మసాలా మరియు పెరుగుతో కలిపి కేవలం 5 ml నూనెలో వేయించండి.", "గ్రేవీ కోసం, పాన్‌లో 10 g వెన్న కరిగించి సన్నగా తరిగిన వెల్లుల్లి, తరిగిన ఉల్లిపాయ మరియు అల్లం వెల్లుల్లి పేస్ట్‌ను బాగా వేయించండి.", "తరిగిన టమాటాలు, చిల్లీ పౌడర్, పసుపు, జీరా, గరం మసాలా మరియు ఉప్పు వేసి బాగా వేయించండి.", "చల్లారనిచ్చి, తర్వాత 3 tbsp పెరుగుతో కలిపి బ్లెండ్ చేయండి.", "తిరిగి పాన్‌లో పోసి, 5 g వెన్న మరియు ఉడికించిన చికెన్ వేసి కొత్తిమీరతో అలంకరించండి.", "ఫ్లేవర్ గల అన్నం కోసం, పాన్‌లో 5 g వెన్న కరిగించి సన్నగా తరిగిన వెల్లుల్లి, చిల్లీ పౌడర్, పసుపు, ఒరెగానో, ఉప్పు మరియు అల్లం వెల్లుల్లి పేస్ట్ వేయండి.", "కడిగిన పచ్చి బాస్మతి బియ్యాన్ని వేయించండి.", "300 ml నీరు (బియ్యానికి 1.5 రెట్లు) వేసి మూత పెట్టి ఉడికించండి.", "బటర్ చికెన్‌ను ఫ్లేవర్ గల అన్నంతో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:56.088Z"}, {"n": 31, "title": "Cauliflower Paneer Gravy", "title_te": "కాలీఫ్లవర్ పనీర్ గ్రేవీ", "cat": "Adult", "section": "adult", "emoji": "🧀", 3 minutes on medium-high flame.", "Add the steamed cauliflower and mix 2 minutes on high flame.", "Check the salt and switch off the flame.", "Add the garam masala, kasuri methi and coriander leaf, mix gently and serve."], "steps_te": ["కాలీఫ్లవర్‌ను చిన్న ముక్కలుగా కోసి, బాగా కడిగి 5 నిమిషాలు ఆవిరిలో ఉడికించి పక్కన పెట్టండి.", "కాశ్మీరీ మిర్చిని వేడి నీటిలో 10 నిమిషాలు నానబెట్టి, తర్వాత టమాటాతో కలిపి ప్యూరీగా బ్లెండ్ చేసి పక్కన పెట్టండి.", "కడాయిలో నూనె వేడి చేయండి.", "జీరా, యాలకులు, దాల్చిన చెక్క ముక్కలు, బిర్యానీ ఆకు, లవంగాలు మరియు ఉల్లిపాయ వేసి అధిక మంటపై 3-4 నిమిషాలు వేయించండి.", "అల్లం వెల్లుల్లి పేస్ట్ వేసి మధ్యస్థ-అధిక మంటపై 2 నిమిషాలు వేయించండి.", "రంగు మారడం మొదలైనప్పుడు టమాటా ప్యూరీ, పసుపు, కాశ్మీరీ ఎర్ర మిర్చి పొడి, ధనియాల పొడి మరియు ఉప్పు వేసి అధిక మంటపై 5-6 నిమిషాలు కలపండి.", "పనీర్‌ను నీటితో కలిపి పేస్ట్‌గా బ్లెండ్ చేసి, మంట తగ్గించి కడాయిలో వేయండి; మధ్యస్థ-అధిక మంటపై 3 నిమిషాలు కలపండి.", "ఆవిరిలో ఉడికించిన కాలీఫ్లవర్ వేసి అధిక మంటపై 2 నిమిషాలు కలపండి.", "ఉప్పు సరిచూసి మంట ఆపండి.", "గరం మసాలా, కసూరి మేథి మరియు కొత్తిమీర ఆకు వేసి మెల్లగా కలిపి వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:40.898Z"}, {"n": 104, "title": "Cheesy Broccoli & White Bean Veggie Tots", "title_te": "చీజీ బ్రోకలీ & వైట్ బీన్ వెజ్జీ టాట్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍳", "image": "https://cooksrealm.net/wp-content/uploads/2025/11/Cheesy-Broccoli-Tots-Recipe-2.jpg", "prep": "15 minutes", "cook": "20 minutes", "yield": "16–18 mini tots", "desc": "These golden, baked veggie nuggets feature finely minced broccoli florets and mashed cannellini (white) beans. Mild cheddar cheese lends savory flavor while white beans provide plant-based protein, iron, and fiber without changing the texture toddlers love.", "desc_te": "సన్నగా తరిగిన బ్రోకలీ ముక్కలు, మెదిపిన కన్నెల్లిని (వైట్) బీన్స్‌తో చేసిన బంగారు రంగు, బేక్ చేసిన వెజ్జీ నగ్గెట్స్ ఇవి. మైల్డ్ చెడార్ చీజ్ రుచినిస్తుంది, వైట్ బీన్స్ పసిపిల్లలు ఇష్టపడే ఆకృతిని మార్చకుండా ప్లాంట్-ఆధారిత ప్రోటీన్, ఐరన్, ఫైబర్ ఇస్తాయి.", "tags": [], "ing": ["1.5 cups fresh broccoli florets, steamed until tender and finely minced", "1 cup cooked cannellini beans (or navy/great northern beans), rinsed, drained, and thoroughly mashed", "1/2 cup shredded mild cheddar cheese (or mozzarella)", "1 large egg, lightly beaten (or 1 flax egg)", "1/3 cup panko breadcrumbs or oat flour", "1/4 tsp garlic powder", "1/4 tsp onion powder", "1 tbsp olive oil or avocado oil spray"], "ing_te": ["1.5 cups తాజా బ్రోకలీ ముక్కలు, మెత్తగా అయ్యేవరకు ఆవిరిపై ఉడికించి సన్నగా తరిగినవి", "1 cup వండిన కన్నెల్లిని బీన్స్ (లేదా నేవీ/గ్రేట్ నార్తర్న్ బీన్స్), కడిగి, నీరు వంపేసి, బాగా మెదిపినవి", "1/2 cup తురిమిన మైల్డ్ చెడార్ చీజ్ (లేదా మొజ్జారెల్లా)", "1 large గుడ్డు, తేలికగా కొట్టినది (లేదా 1 ఫ్లాక్స్ గుడ్డు)", "1/3 cup పాంకో బ్రెడ్‌క్రంబ్స్ లేదా ఓట్ పిండి", "1/4 tsp వెల్లుల్లి పొడి", "1/4 tsp ఉల్లిపాయ పొడి", "1 tbsp ఆలివ్ ఆయిల్ లేదా అవకాడో ఆయిల్ స్ప్రే"], "steps": ["Preheat & Prep: Preheat oven to 400°F (200°C) or preheat your air fryer to 375°F (190°C). Line a large baking sheet with parchment paper.", "Combine Ingredients: In a mixing bowl, combine the mashed white beans, finely minced steamed broccoli, shredded cheese, beaten egg, breadcrumbs/oat flour, garlic powder, and onion powder. Mix well with a spoon or your hands until a cohesive, moldable mixture forms.", "Shape: Scoop 1 heaping tablespoon of mixture and shape with your hands into small tot cylinders or flat nugget shapes.", "Bake / Air Fry: Arrange the tots on the baking sheet with space between them. Lightly spray or brush the tops with olive oil.", "Oven: Bake at 400°F for 18–20 minutes, flipping halfway, until golden and lightly crispy on the edges.", "Air Fryer: Air fry at 375°F for 10–12 minutes, shaking basket at the 6-minute mark.", "Serve: Allow to cool for 5 minutes before serving with a mild yogurt dip or avocado mash."], "steps_te": ["ప్రీహీట్ & సిద్ధం: ఓవెన్‌ను 400°F (200°C) వద్ద ప్రీహీట్ చేయండి లేదా మీ ఎయిర్ ఫ్రైయర్‌ను 375°F (190°C) వద్ద ప్రీహీట్ చేయండి. పెద్ద బేకింగ్ షీట్‌పై పార్చ్‌మెంట్ పేపర్ పరచండి.", "పదార్థాలు కలపండి: మిక్సింగ్ గిన్నెలో మెదిపిన వైట్ బీన్స్, సన్నగా తరిగిన ఆవిరిపై ఉడికించిన బ్రోకలీ, తురిమిన చీజ్, కొట్టిన గుడ్డు, బ్రెడ్‌క్రంబ్స్/ఓట్ పిండి, వెల్లుల్లి పొడి, ఉల్లిపాయ పొడి కలపండి. కలిసిపోయే, ఆకారం ఇవ్వగల మిశ్రమం అయ్యేవరకు చెంచాతో లేదా చేతులతో బాగా కలపండి.", "ఆకారం ఇవ్వండి: 1 heaping tablespoon మిశ్రమం తీసుకుని చేతులతో చిన్న టాట్ సిలిండర్లు లేదా చదునైన నగ్గెట్ ఆకారాలు చేయండి.", "బేక్ / ఎయిర్ ఫ్రై చేయండి: టాట్స్‌ను బేకింగ్ షీట్‌పై ఖాళీ ఉండేలా అమర్చండి. పైన ఆలివ్ ఆయిల్‌ను తేలికగా స్ప్రే చేయండి లేదా బ్రష్ చేయండి.", "ఓవెన్: 400°F వద్ద 18–20 minutes బేక్ చేయండి, మధ్యలో తిప్పుతూ, బంగారు రంగు వచ్చి అంచులు తేలికగా క్రిస్పీగా అయ్యేవరకు.", "ఎయిర్ ఫ్రైయర్: 375°F వద్ద 10–12 minutes ఎయిర్ ఫ్రై చేయండి, 6-minute మార్క్ వద్ద బాస్కెట్ కదిలిస్తూ.", "వడ్డించండి: వడ్డించే ముందు 5 minutes చల్లారనివ్వండి, మైల్డ్ పెరుగు డిప్ లేదా అవకాడో మాష్‌తో."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:56.457Z"}, {"n": 38, "title": "Cheesy Carrot Loaf", "title_te": "చీజీ క్యారెట్ లోఫ్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍿", "image": "https://sweetnessbyella.com/assets/images/1757365726555-c7052cn2.jpg", "prep": "—", "cook": "35-45 minutes at 180C (350F)", "yield": "—", "desc": "Soft, easy-to-hold carrot and cheddar loaf pitched for lunchboxes and toddler meals.", "desc_te": "లంచ్‌బాక్స్‌లు మరియు చిన్నపిల్లల భోజనాల కోసం ఉద్దేశించిన మెత్తని, పట్టుకోవడానికి సులభమైన క్యారెట్ మరియు చెడార్ లోఫ్.", "tags": ["vegetarian", "contains dairy", "lunch", "snack"], "ing": ["2 eggs", "1 grated carrot", "1 cup cheddar cheese, grated", "1 cup self-raising flour", "1/2 cup milk", "Extra cheese, to sprinkle", "Black pepper (optional)"], "ing_te": ["2 గుడ్లు", "1 తురిమిన క్యారెట్", "1 cup చెడార్ చీజ్, తురిమినది", "1 cup సెల్ఫ్-రైజింగ్ పిండి", "1/2 cup పాలు", "పైన చల్లడానికి అదనపు చీజ్", "నల్ల మిరియాలు (ఐచ్ఛికం)"], "steps": ["Grate the carrot and add all ingredients to a lined loaf tin.", with melted mozzarella cheese, finely minced baby spinach, and Italian herbs. They bake into sturdy, mess-free cups that won't crumble in little hands.", "desc_te": "పిజ్జా యొక్క అభిమాన రుచులన్నీ పోషకాలు అధికంగా, పసిపిల్లలు పట్టుకోగలిగే చిన్న బైట్‌లో! మెత్తగా వండిన క్వినోవా సంపూర్ణ వృక్ష ప్రోటీన్ (తొమ్మిది ముఖ్యమైన అమైనో ఆమ్లాలన్నీ) మరియు ఫైబర్‌ను అందిస్తుంది, కరిగిన మొజారెల్లా చీజ్, సన్నగా తరిగిన బేబీ స్పినాచ్ మరియు ఇటాలియన్ మూలికలతో బంధించబడింది. అవి చిన్న చేతుల్లో విరిగిపోని గట్టి, చిందరవందర లేని కప్‌లుగా బేక్ అవుతాయి.", "tags": [], "ing": ["1.5 cups cooked quinoa (cooled to warm room temperature)", "3/4 cup shredded mozzarella cheese (or mild cheddar)", "1/4 cup grated parmesan cheese", "1/2 cup finely chopped baby spinach (or grated zucchini, excess moisture squeezed out)", "1/4 cup unsweetened, low-sodium marinara or pizza sauce (plus extra for dipping)", "1 large egg, lightly beaten (or 1 flax egg: 1 tbsp ground flaxseed + 2.5 tbsp water)", "1/2 tsp dried oregano or Italian seasoning", "1/4 tsp garlic powder", "1/4 tsp onion powder"], "ing_te": ["1.5 cups వండిన క్వినోవా (గది ఉష్ణోగ్రతకు చల్లార్చినది)", "3/4 cup తురిమిన మొజారెల్లా చీజ్ (లేదా మైల్డ్ చెడార్)", "1/4 cup తురిమిన పార్మెసన్ చీజ్", "1/2 cup సన్నగా తరిగిన బేబీ స్పినాచ్ (లేదా తురిమిన జుకీని, అదనపు తేమ పిండినది)", "1/4 cup తీపి లేని, తక్కువ సోడియం మరినారా లేదా పిజ్జా సాస్ (ముంచడానికి అదనంగా)", "1 large గుడ్డు, కొద్దిగా గిలకొట్టినది (లేదా 1 ఫ్లాక్స్ గుడ్డు: 1 tbsp గ్రౌండ్ ఫ్లాక్స్‌సీడ్ + 2.5 tbsp నీరు)", "1/2 tsp ఎండిన ఒరెగానో లేదా ఇటాలియన్ సీజనింగ్", "1/4 tsp వెల్లుల్లి పొడి", "1/4 tsp ఉల్లిపాయ పొడి"], "steps": ["Preheat & Prep: Preheat oven to 375°F (190°C). Generously grease a 12-cup silicone mini muffin pan with olive oil or cooking spray.", "Combine Ingredients: In a medium mixing bowl, combine the cooked quinoa, shredded mozzarella, grated parmesan, chopped spinach, marinara sauce, beaten egg, oregano, garlic powder, and onion powder. Mix well with a spoon until everything is evenly incorporated.", "Fill the Tins: Spoon the quinoa mixture into the 12 mini muffin cups, pressing down firmly with the back of a spoon to pack the quinoa so the bites hold their shape when baked.", "Bake: Bake at 375°F for 18–20 minutes, or until the edges are golden brown, sizzling, and the tops feel set and slightly crisp.", "Cool & Unmold: Allow to cool in the pan for 10 minutes (they firm up as they cool). Gently pop them out.", "Serve: Serve warm with a small side of warm marinara sauce for dipping."], "steps_te": ["ప్రీహీట్ & సిద్ధం: ఓవెన్‌ను 375°F (190°C) వద్ద ప్రీహీట్ చేయండి. 12-cup సిలికాన్ మినీ మఫిన్ పాన్‌కు ఆలివ్ నూనె లేదా కుకింగ్ స్ప్రేతో బాగా నూనె రాయండి.", "పదార్థాలు కలపండి: ఒక మీడియం మిక్సింగ్ బౌల్‌లో వండిన క్వినోవా, తురిమిన మొజారెల్లా, తురిమిన పార్మెసన్, తరిగిన స్పినాచ్, మరినారా సాస్, గిలకొట్టిన గుడ్డు, ఒరెగానో, వెల్లుల్లి పొడి మరియు ఉల్లిపాయ పొడి కలపండి. అన్నీ సమానంగా కలిసేవరకు చెంచాతో బాగా కలపండి.", "టిన్‌లు నింపండి: క్వినోవా మిశ్రమాన్ని 12 మినీ మఫిన్ కప్‌లలో వేసి, బేక్ చేసిన తర్వాత బైట్స్ ఆకారం నిలబడేలా చెంచా వెనుక భాగంతో గట్టిగా నొక్కండి.", "బేక్ చేయండి: 375°F వద్ద 18–20 minutes బేక్ చేయండి, లేదా అంచులు బంగారు గోధుమ రంగులో, చిటపటలాడుతూ, పైభాగం సెట్ అయి కొద్దిగా కరకరలాడేవరకు.", "చల్లార్చి తీయండి: పాన్‌లోనే 10 minutes చల్లారనివ్వండి (చల్లారేకొద్దీ అవి గట్టిపడతాయి). మెల్లగా బయటకు తీయండి.", "వడ్డించండి: ముంచడానికి కొద్దిగా గోరువెచ్చని మరినారా సాస్‌తో వేడిగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:06:17.434Z"}, {"n": 24, "title": "Cheesy Quinoa Veggie Bites", "title_te": "చీజీ క్వినోవా వెజ్జీ బైట్స్", "cat": "Adult", "section": "adult", "emoji": "🍳", "image": "https://dishnora.com/wp-content/uploads/2026/01/Cheesy_Broccoli_Quinoa_Bites_2.webp", "prep": "5-10 minutes (rest)", "cook": "—", "yield": "—", "desc": "Soft-inside, lightly crisp quinoa, paneer and hidden-veggie patties, pitched by the creator for toddler self-feeding and lunchboxes (filed under adult because it came from the Diet Food collection).", "desc_te": "లోపల మెత్తగా, పైన

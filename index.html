yricerecipes.com/wp-content/uploads/2025/09/garlic-butter-fried-rice.webp", "prep": "—", "cook": "—", "yield": "—", "desc": "Creamy scrambled eggs folded through a garlic butter milk sauce, served over rice.", "desc_te": "వెల్లుల్లి వెన్న పాల సాస్‌లో కలిపిన క్రీమీ గిలకొట్టిన గుడ్లు, అన్నం మీద వడ్డించినవి.", "tags": ["vegetarian", "contains dairy", "dinner", "breakfast"], "ing": ["3 eggs", "1 tbsp butter (for eggs)", "1/4 tsp salt", "1/4 tsp Maggi Cukup Rasa seasoning", "1/2 cup chopped Chinese parsley", "2 tbsp butter (for sauce)", "100 ml milk", "5 cloves garlic, minced", "1 tsp corn starch", "1 tsp chilli flakes, plus a pinch for garnish", "1/2 tsp white pepper", "1/2 tsp oregano", "Cooked white rice, to serve"], "ing_te": ["3 గుడ్లు", "1 tbsp వెన్న (గుడ్ల కోసం)", "1/4 tsp ఉప్పు", "1/4 tsp మ్యాగీ చుకుప్ రసా సీజనింగ్", "1/2 cup తరిగిన చైనీస్ పార్స్లీ (కొత్తిమీర)", "2 tbsp వెన్న (సాస్ కోసం)", "100 ml పాలు", "5 వెల్లుల్లి రెబ్బలు, తరిగినవి", "1 tsp కార్న్ స్టార్చ్", "1 tsp చిల్లీ ఫ్లేక్స్, అలంకరణకు చిటికెడు అదనంగా", "1/2 tsp తెల్ల మిరియాలు", "1/2 tsp ఒరెగానో", "వడ్డించడానికి ఉడికిన తెల్ల అన్నం"], "steps": ["Crack the eggs into a bowl, add salt and Maggi seasoning and whisk.", "Pour into a hot pan, scramble lightly, then remove and set aside.", "In the same pan melt the butter, add the minced garlic, oregano, chilli flakes, milk and corn starch and stir into a creamy sauce.", "Return the eggs to the pan and mix into the sauce.", "Add the chopped Chinese parsley.", "Spoon over white rice and top with extra chilli flakes."], "steps_te": ["గుడ్లను గిన్నెలో పగలగొట్టి ఉప్పు, మ్యాగీ సీజనింగ్ వేసి గిలకొట్టండి.", "వేడి పాన్‌లో పోసి, తేలికగా గిలకొట్టి, తీసి పక్కన పెట్టండి.", "అదే పాన్‌లో వెన్న కరిగించి, తరిగిన వెల్లుల్లి, ఒరెగానో, చిల్లీ ఫ్లేక్స్, పాలు, కార్న్ స్టార్చ్ వేసి క్రీమీ సాస్‌లా కలపండి.", "గుడ్లను తిరిగి పాన్‌లో వేసి సాస్‌లో కలపండి.", "తరిగిన చైనీస్ పార్స్లీ వేయండి.", "తెల్ల అన్నం మీద వేసి పైన అదనపు చిల్లీ ఫ్లేక్స్‌తో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:02:39.442Z"}, {"n": 110, "title": "Golden Air-Fryer Tofu \"Fries\" with Creamy Avocado Dip", "title_te": "గోల్డెన్ ఎయిర్-ఫ్రైయర్ టోఫు \"ఫ్రైస్\" క్రీమీ అవకాడో డిప్‌తో", "cat": "Kid & Toddler", "section": "kid", "emoji": "🥑", "image": "https://lifemadesweeter.com/wp-content/uploads/Crispy-Tofu-Fries-recipe-vegan-baked-air-fryer-gluten-free.jpg", "prep": "10 minutes", "cook": "15 minutes", "yield": "2–3 toddler servings", "desc": "A fun, wholesome twist on french fries! Extra-firm tofu is sliced into baton-shaped finger fries, coated in nutritional yeast and cornstarch, and air-fried until golden. Served alongside a creamy dip made of ripe avocado and Greek yogurt.", "desc_te": "ఫ్రెంచ్ ఫ్రైస్‌కు సరదా, ఆరోగ్యకరమైన మార్పు! ఎక్స్‌ట్రా-ఫర్మ్ టోఫును బ్యాటన్ ఆకారంలో వేలు ఫ్రైస్‌లా కోసి, న్యూట్రిషనల్ ఈస్ట్ మరియు కార్న్‌స్టార్చ్‌లో పూసి, బంగారు రంగు వచ్చేవరకు ఎయిర్-ఫ్రై చేస్తారు. పండిన అవకాడో మరియు గ్రీక్ యోగర్ట్‌తో చేసిన క్రీమీ డిప్‌తో వడ్డిస్తారు.", "tags": [], "ing": ["For the Tofu Fries:", "1 block (14 oz) extra-firm organic tofu, drained and pressed with a towel for 10 minutes", "1 tbsp olive oil or avocado oil", "1.5 tbsp cornstarch or arrowroot starch", "1 tbsp nutritional yeast (for a mild cheesy flavor and B-vitamins)", "1/4 tsp mild paprika (optional, for color)", "1/4 tsp garlic powder", "For the Creamy Avocado Dip:", "1/2 ripe avocado, mashed smooth", "2 tbsp plain whole-milk Greek yogurt", "1 tsp fresh lemon or lime juice", "1 tbsp finely chopped fresh cilantro or parsley"], "ing_te": ["టోఫు ఫ్రైస్ కోసం:", "1 block (14 oz) ఎక్స్‌ట్రా-ఫర్మ్ ఆర్గానిక్ టోఫు, నీరు తీసి టవల్‌తో 10 minutes నొక్కినది", "1 tbsp ఆలివ్ నూనె లేదా అవకాడో నూనె", "1.5 tbsp కార్న్‌స్టార్చ్ లేదా ఆరోరూట్ స్టార్చ్", "1 tbsp న్యూట్రిషనల్ ఈస్ట్ (తేలికపాటి చీజీ రుచి మరియు B-విటమిన్ల కోసం)", "1/4 tsp mild పప్రికా (optional, రంగు కోసం)", "1/4 tsp వెల్లుల్లి పొడి", "క్రీమీ అవకాడో డిప్ కోసం:", "1/2 పండిన అవకాడో, మృదువుగా మెదిపినది", "2 tbsp ప్లెయిన్ హోల్-మిల్క్ గ్రీక్ యోగర్ట్", "1 tsp తాజా నిమ్మ లేదా లైమ్ రసం", "1 tbsp సన్నగా తరిగిన తాజా కొత్తిమీర లేదా పార్స్లీ"], "steps": ["Cut the Tofu: Slice the pressed tofu block into finger-sized batons (approx. 1/2 inch thick and 2.5–3 inches long), easy for small hands to grip.", "Season & Coat: In a mixing bowl, toss the tofu sticks gently with olive oil. In a separate shallow bowl, whisk together cornstarch, nutritional yeast, paprika, and garlic powder. Dredge each tofu stick in the coating mixture until evenly covered.", "Air Fry: Arrange the tofu fries in a single layer in the air fryer basket with space between them. Air fry at 375°F (190°C) for 12–15 minutes, shaking the basket halfway through, until lightly crispy on the exterior. (Oven option: Bake at 400°F / 200°C on a parchment-lined baking sheet for 20–22 minutes).", "Make the Dip: While fries are cooking, mash the avocado with Greek yogurt, lemon juice, and cilantro until creamy.", "Serve: Allow the tofu fries to cool to warm. Serve with the avocado dip for fun dipping practice."], "steps_te": ["టోఫు కోయండి: నొక్కిన టోఫు బ్లాక్‌ను వేలు పరిమాణంలో బ్యాటన్‌లుగా కోయండి (approx. 1/2 inch మందం మరియు 2.5–3 inches పొడవు), చిన్న చేతులు పట్టుకోవడానికి సులభంగా ఉంటుంది.", "మసాలా & పూత: ఒక మిక్సింగ్ గిన్నెలో టోఫు స్టిక్‌లను ఆలివ్ నూనెతో మెల్లగా కలపండి. వేరే లోతులేని గిన్నెలో కార్న్‌స్టార్చ్, న్యూట్రిషనల్ ఈస్ట్, పప్రికా మరియు వెల్లుల్లి పొడిని కలపండి. ప్రతి టోఫు స్టిక్‌ను పూత మిశ్రమంలో సమానంగా పూసేవరకు దొర్లించండి.", "ఎయిర్ ఫ్రై చేయండి: టోఫు ఫ్రైస్‌ను ఎయిర్ ఫ్రైయర్ బాస్కెట్‌లో మధ్యలో ఖాళీతో ఒకే పొరలో అమర్చండి. బయట తేలికగా క్రిస్పీ అయ్యేవరకు 375°F (190°C) వద్ద 12–15 minutes ఎయిర్ ఫ్రై చేయండి, మధ్యలో బాస్కెట్‌ను కదిలించండి. (ఓవెన్ ఎంపిక: పార్చ్‌మెంట్ పరచిన బేకింగ్ షీట్‌పై 400°F / 200°C వద్ద 20–22 minutes బేక్ చేయండి).", "డిప్ చేయండి: ఫ్రైస్ వండుతుండగా, అవకాడోను గ్రీక్ యోగర్ట్, నిమ్మరసం మరియు కొత్తిమీరతో క్రీమీగా అయ్యేవరకు మెదపండి.", "వడ్డించండి: టోఫు ఫ్రైస్ వెచ్చగా చల్లారనివ్వండి. డిప్పింగ్ ప్రాక్టీస్ కోసం సరదాగా అవకాడో డిప్‌తో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:56.634Z"}, {"n": 147, "title": "Guilt-Free Chocolate Ice Cream V2", "title_te": "గిల్ట్-ఫ్రీ చాక్లెట్ ఐస్‌క్రీమ్ V2", "cat": "Adult", "section": "adult", "emoji": "🥗", "image": "https://www.piesandtacos.com/wp-content/uploads/2025/07/Chocolate-Ice-Cream-5-scaled.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "A simple, sugar-free, and cream-free chocolate ice cream recipe made with natural ingredients. This version includes makhana (fox nuts) for added texture and nutrients.", "desc_te": "సహజ పదార్థాలతో తయారుచేసిన సులభమైన, చక్కెర లేని, క్రీమ్ లేని చాక్లెట్ ఐస్‌క్రీమ్ రెసిపీ. ఈ వెర్షన్‌లో ఆకృతి, పోషకాల కోసం మఖానా (ఫాక్స్ నట్స్) చేర్చబడింది.", "tags": [], "ing": ["Ingredients", "Ingredient", "Measurement", "Makhana (Fox Nuts)", "1 cup", "Almonds (Badam)", "1/2 cup (approx. 20–25 pieces)", "Dates (Khajur)", "1/2 cup (approx. 10–12 soft dates, pitted)", "Hot Milk (Garam Doodh)", "2 cups", "Cocoa Powder", "3 tablespoons", "Chocolate Chips", "For topping"], "ing_te": ["పదార్థాలు", "పదార్థం", "కొలత", "మఖానా (ఫాక్స్ నట్స్)", "1 cup", "బాదం (బాదం)", "1/2 cup (సుమారు 20–25 ముక్కలు)", "ఖర్జూరాలు (ఖజూర్)", "1/2 cup (సుమారు 10–12 మెత్తని ఖర్జూరాలు, గింజలు తీసినవి)", "వేడి పాలు (గరం దూద్)", "2 cups", "కోకో పౌడర్", "3 tablespoons", "చాక్లెట్ చిప్స్", "టాపింగ్ కోసం"], "steps": ["Soak: Place the makhana, almonds, and pitted dates in a bowl. Pour the hot milk over them and let soak for 20 minutes.", "Prep Almonds: Once the soaking is complete, remove the skins (chilkha) from the almonds.", "Blend: Transfer all the soaked ingredients along with the milk and cocoa powder into a blender. Blend until the mixture forms a completely smooth, creamy paste.", "Prepare for Freezing: Pour the mixture into a freezer-safe container. Sprinkle chocolate chips on top.", "Seal: Press a piece of cling wrap directly onto the surface of the mixture. This prevents ice crystals from forming.", "Freeze: Place the container in the freezer for 10–12 hours until set. Enjoy your healthy, guilt-free chocolate ice cream!"], "steps_te": ["నానబెట్టండి: మఖానా, బాదం, గింజలు తీసిన ఖర్జూరాలను గిన్నెలో ఉంచండి. వాటిపై వేడి పాలు పోసి 20 minutes నాననివ్వండి.", "బాదం సిద్ధం చేయండి: నానబెట్టడం పూర్తయిన తర్వాత, బాదం తొక్కలు (చిల్కా) తీసేయండి.", "బ్లెండ్ చేయండి: నానబెట్టిన పదార్థాలన్నింటినీ పాలు, కోకో పౌడర్‌తో పాటు బ్లెండర్‌లో వేయండి. మిశ్రమం పూర్తిగా మృదువైన, క్రీమీ పేస్ట్ అయ్యేవరకు బ్లెండ్ చేయండి.", "ఫ్రీజ్ చేయడానికి సిద్ధం చేయండి: మిశ్రమాన్ని ఫ్రీజర్-సేఫ్ డబ్బాలో పోయండి. పైన చాక్లెట్ చిప్స్ చల్లండి.", "సీల్ చేయండి: మిశ్రమం ఉపరితలంపై నేరుగా క్లింగ్ ర్యాప్ ముక్కను నొక్కండి. దీనివల్ల మంచు స్ఫటికాలు ఏర్పడకుండా ఉంటాయి.", "ఫ్రీజ్ చేయండి: డబ్బాను ఫ్రీజర్‌లో 10–12 hours ఉంచండి, గట్టిపడేవరకు. మీ ఆరోగ్యకరమైన, గిల్ట్-ఫ్రీ చాక్లెట్ ఐస్‌క్రీమ్‌ను ఆస్వాదించండి!"], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.647Z"}, {"n": 56, "title": "Gut-Friendly Monsoon Khichdi", "title_te": "జీర్ణక్రియకు మంచి మాన్‌సూన్ ఖిచిడి", "cat": "Adult", "section": "adult", "emoji": "🥗", "image": "https://www.awesomecuisine.com/wp-content/uploads/2025/05/moong-dal-khichdi.png", "prep": "—", "cook": "—", "yield": "2", "desc": "Anti-inflammatory | Easy to digest | Serves 2", "desc_te": "వాపు తగ్గించేది | సులభంగా జీర్ణమయ్యేది | 2 మందికి సరిపోతుంది", "tags": [], "ing": ["Base", "¼ cup moong dal, soaked 15-20 min", "¼ cup rice, soaked 15-20 min", "Water as needed", "Vegetables", "1 cup bottle gourd, chopped", "1 small carrot, chopped", "½ cup pumpkin, chopped", "Handful of coriander leaves", "Tempering", "1 tsp ghee", "¼ tsp hing (asafoetida)", "½ tsp cumin seeds", "1 tsp finely chopped ginger", "1 sprig curry leaves", "Spices", "½ tsp turmeric powder", "1 tsp coriander powder", "Salt to taste", "Black pepper to taste", "To Serve", "1 tsp ghee", "Extra sprinkle of black pepper"], "ing_te": ["బేస్", "¼ cup పెసరపప్పు, 15-20 min నానబెట్టినది", "¼ cup బియ్యం, 15-20 min నానబెట్టినవి", "అవసరమైనంత నీరు", "కూరగాయలు", "1 cup సొరకాయ, తరిగినది", "1 చిన్న క్యారెట్, తరిగినది", "½ cup గుమ్మడికాయ, తరిగినది", "గుప్పెడు కొత్తిమీర ఆకులు", "తాలింపు", "1 tsp నెయ్యి", "¼ tsp ఇంగువ", "½ tsp జీలకర్ర", "1 tsp సన్నగా తరిగిన అల్లం", "1 రెమ్మ కరివేపాకు", "మసాలాలు", "½ tsp పసుపు పొడి", "1 tsp ధనియాల పొడి", "రుచికి తగినంత ఉప్పు", "రుచికి తగినంత నల్ల మిరియాలు", "వడ్డించడానికి", "1 tsp నెయ్యి", "పైన కొంచెం నల్ల మిరియాలు"], "steps": ["Prep the vegetables: Add bottle gourd, carrot, pumpkin, and coriander to a food processor and pulse until coarsely ground. Set aside.", "Temper the spices: Heat 1 tsp ghee in a pressure cooker on medium heat. Add hing, curry leaves, ginger, and cumin seeds. Sauté for 20-30 seconds until fragrant.", "Cook the base: Add the ground vegetables along with turmeric powder and coriander powder. Mix well and sauté for 1-2 minutes.", "Add dal and rice: Stir in the soaked moong dal and rice. Season with salt and pepper. Pour in enough water to cover everything by about 1-1.5 inches — adjust for desired consistency.", "Pressure cook: Close the lid and cook for 3-4 whistles, or until the dal and rice are completely soft and mushy. If it's too thick after opening, stir in hot water to loosen.", "Serve: Ladle into a bowl, top with a drizzle of ghee and a light sprinkle of black pepper. Serve warm. Why it's gut-friendly Ghee with turmeric and black pepper boosts curcumin absorption for anti-inflammatory benefits, while ginger, cumin, and hing aid digestion and reduce bloating. The finely ground vegetables break down easily for a light, comforting meal."], "steps_te": ["కూరగాయలు సిద్ధం చేయండి: సొరకాయ, క్యారెట్, గుమ్మడికాయ మరియు కొత్తిమీరను ఫుడ్ ప్రాసెసర్‌లో వేసి ముతకగా అయ్యేవరకు పల్స్ చేయండి. పక్కన ఉంచండి.", "మసాలాలు తాలింపు చేయండి: ప్రెషర్ కుక్కర్‌లో మీడియం వేడిపై 1 tsp నెయ్యి వేడి చేయండి. ఇంగువ, కరివేపాకు, అల్లం మరియు జీలకర్ర వేయండి. సువాసన వచ్చేవరకు 20-30 seconds పాటు వేయించండి.", "బేస్ వండండి: నలిపిన కూరగాయలతో పాటు పసుపు పొడి మరియు ధనియాల పొడి వేయండి. బాగా కలిపి 1-2 minutes పాటు వేయించండి.", "పప్పు మరియు బియ్యం వేయండి: నానబెట్టిన పెసరపప్పు మరియు బియ్యం కలపండి. ఉప్పు, మిరియాలతో రుచి చేయండి. అన్నీ సుమారు 1-1.5 inches వరకు మునిగేలా నీరు పోయండి — కావలసిన స్థిరత్వానికి తగ్గట్టు సర్దండి.", "ప్రెషర్ కుక్ చేయండి: మూత మూసి 3-4 విజిల్స్ వచ్చేవరకు, లేదా పప్పు, బియ్యం పూర్తిగా మెత్తగా, ముద్దగా అయ్యేవరకు వండండి. తెరిచిన తర్వాత చాలా చిక్కగా ఉంటే, వేడి నీరు కలిపి పలచగా చేయండి.", "వడ్డించండి: గిన్నెలో పోసి, పైన కొంచెం నెయ్యి చిలకరించి, తేలికగా నల్ల మిరియాలు చల్లండి. వేడిగా వడ్డించండి. ఇది జీర్ణక్రియకు ఎందుకు మంచిది: పసుపు, నల్ల మిరియాలతో కూడిన నెయ్యి కర్కుమిన్ శోషణను పెంచి వాపు తగ్గించే ప్రయోజనాలను ఇస్తుంది, అల్లం, జీలకర్ర, ఇంగువ జీర్ణక్రియకు సహాయపడి ఉబ్బరాన్ని తగ్గిస్తాయి. సన్నగా నలిపిన కూరగాయలు సులభంగా జీర్ణమై తేలికైన, సౌకర్యవంతమైన భోజనాన్ని ఇస్తాయి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:25.656Z"}, {"n": 66, "title": "Healthy Air Fryer Chicken Fajitas", "title_te": "ఆరోగ్యకరమైన ఎయిర్ ఫ్రైయర్ చికెన్ ఫజిటాస్", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://www.hintofhealthy.com/wp-content/uploads/2021/04/Air-Fryer-Fajitas-7.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "This recipe is a quick, high-protein meal perfect for busy weeknights. It uses lean protein and fresh vegetables, making it a great fit for a healthy, balanced diet.", "desc_te": "బిజీగా ఉండే వారాంతపు రాత్రులకు సరైన త్వరిత, అధిక ప్రోటీన్ భోజనం ఈ రెసిపీ. ఇది లీన్ ప్రోటీన్ మరియు తాజా కూరగాయలను ఉపయోగిస్తుంది, ఆరోగ్యకరమైన, సమతుల్య ఆహారానికి గొప్పగా సరిపోతుంది.", "tags": [], "ing": ["Chicken: 1 lb chicken breast or thighs, thinly sliced (a lean source of high-quality protein).", "Vegetables: 1-2 bell peppers (any color) and 1 medium onion, sliced into strips.", "Healthy Fats: 1 tablespoon olive oil (for heart-healthy fats).", "Seasonings:", "1 tsp salt (or to taste)", "1 tsp garlic powder", "1/2 tsp ginger powder", "1/2 tsp red chilli flakes (adjust to your spice preference)", "1 tsp smoked paprika", "1 tbsp fajita seasoning (check the label to ensure low-sodium)", "For Serving (Optional): Whole-wheat tortillas or lettuce wraps, fresh parsley, and a dollop of Greek yogurt (a great high-protein alternative to sour cream)."], "ing_te": ["చికెన్: 1 lb చికెన్ బ్రెస్ట్ లేదా తొడలు, సన్నగా తరిగినవి (అధిక నాణ్యత ప్రోటీన్‌కు లీన్ మూలం).", "కూరగాయలు: 1-2 బెల్ పెప్పర్లు (ఏ రంగైనా) మరియు 1 మీడియం ఉల్లిపాయ, స్ట్రిప్స్‌గా తరిగినవి.", "ఆరోగ్యకరమైన కొవ్వులు: 1 tablespoon ఆలివ్ ఆయిల్ (గుండెకు ఆరోగ్యకరమైన కొవ్వుల కోసం).", "మసాలాలు:", "1 tsp ఉప్పు (లేదా రుచికి తగ్గట్టు)", "1 tsp వెల్లుల్లి పొడి", "1/2 tsp అల్లం పొడి", "1/2 tsp ఎర్ర మిరప రేకులు (మీ కారానికి తగ్గట్టు సర్దండి)", "1 tsp స్మోక్డ్ పప్రికా", "1 tbsp ఫజిటా సీజనింగ్ (తక్కువ సోడియం అని నిర్ధారించడానికి లేబుల్ చూడండి)", "వడ్డించడానికి (ఐచ్ఛికం): హోల్-వీట్ టోర్టిల్లాలు లేదా లెట్యూస్ ర్యాప్‌లు, తాజా పార్స్లీ మరియు గ్రీక్ పెరుగు డాలప్ (సోర్ క్రీమ్‌కు గొప్ప అధిక ప్రోటీన్ ప్రత్యామ్నాయం)."], "steps": ["Preheat your air fryer if required by your model. Place the sliced chicken, bell peppers, and onions into the air fryer basket. Sprinkle the salt, garlic powder, ginger powder, chilli flakes, smoked paprika, and fajita seasoning evenly over the ingredients. Drizzle with the olive oil and toss everything thoroughly until the chicken and vegetables are well-coated with the oil and spices. Air fry at 200°C (approx. 400°F) for 15 minutes. Ensure you give the basket a good shake halfway through the cooking time to ensure even browning. Serve warm in tortillas or lettuce wraps. Top with fresh parsley and your choice of healthy condiments. Why this fits your meal prep: This recipe is a fantastic addition to your regular high-protein, vegetarian-friendly rotation (you could easily swap the chicken for extra firm tofu or tempeh for a vegetarian version). It's quick, requires minimal cleanup, and delivers excellent nutritional value."], "steps_te": ["మీ మోడల్‌కు అవసరమైతే మీ ఎయిర్ ఫ్రైయర్‌ను వేడి చేయండి. తరిగిన చికెన్, బెల్ పెప్పర్లు మరియు ఉల్లిపాయలను ఎయిర్ ఫ్రైయర్ బాస్కెట్‌లో ఉంచండి. ఉప్పు, వెల్లుల్లి పొడి, అల్లం పొడి, మిరప రేకులు, స్మోక్డ్ పప్రికా మరియు ఫజిటా సీజనింగ్‌ను పదార్థాలపై సమానంగా చల్లండి. ఆలివ్ ఆయిల్ చిలకరించి, చికెన్ మరియు కూరగాయలకు నూనె, మసాలాలు బాగా పట్టేలా అన్నీ బాగా కలపండి. 200°C (సుమారు 400°F) వద్ద 15 minutes పాటు ఎయిర్ ఫ్రై చేయండి. సమానంగా గోధుమ రంగులోకి రావడానికి వండే సమయంలో మధ్యలో బాస్కెట్‌ను బాగా కదిలించండి. టోర్టిల్లాలు లేదా లెట్యూస్ ర్యాప్‌లలో వేడిగా వడ్డించండి. తాజా పార్స్లీ మరియు మీకు నచ్చిన ఆరోగ్యకరమైన కండిమెంట్లతో పైన వేయండి. ఇది మీ మీల్ ప్రెప్‌కు ఎందుకు సరిపోతుంది: ఈ రెసిపీ మీ సాధారణ అధిక ప్రోటీన్, శాఖాహార-స్నేహపూర్వక రొటేషన్‌కు అద్భుతమైన చేర్పు (శాఖాహార వెర్షన్ కోసం చికెన్‌కు బదులుగా ఎక్స్ట్రా ఫర్మ్ టోఫు లేదా టెంపే సులభంగా మార్చుకోవచ్చు). ఇది త్వరితం, కనీస శుభ్రత అవసరం మరియు అద్భుతమైన పోషక విలువను ఇస్తుంది."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:45.965Z"}, {"n": 63, "title": "Healthy Chocolate Ice Cream", "title_te": "ఆరోగ్యకరమైన చాక్లెట్ ఐస్‌క్రీమ్", "cat": "Adult", "section": "adult", "emoji": "🍲", "image": "https://static.vecteezy.com/system/resources/thumbnails/075/414/756/small/delicious-chocolate-ice-cream-scoops-with-spoon-and-photo.jpeg", "prep": "—", "cook": "—", "yield": "—", "desc": "Ingredients", "desc_te": "పదార్థాలు", "tags": [], "ing": ["1/2 cup whole almonds", "1/4 cup raw cashews", "1/2 cup rolled oats", "50g dark chocolate (chopped)", "3 tbsp unsweetened cocoa powder", "8–10 Medjool dates (pitted)", "1 tsp vanilla extract", "1.5 to 2 cups warm milk (Note: Use almond, coconut, or soy milk to keep it completely plant-based)", "For Topping (Optional)", "Sugar-free chocolate syrup", "Dark chocolate chips"], "ing_te": ["1/2 cup హోల్ బాదం", "1/4 cup పచ్చి జీడిపప్పు", "1/2 cup రోల్డ్ ఓట్స్", "50g డార్క్ చాక్లెట్ (తరిగినది)", "3 tbsp తియ్యని కోకో పౌడర్", "8–10 మెడ్జూల్ ఖర్జూరాలు (గింజలు తీసినవి)", "1 tsp వెనిల్లా ఎక్స్‌ట్రాక్ట్", "1.5 to 2 cups గోరువెచ్చని పాలు (గమనిక: పూర్తిగా మొక్కల ఆధారితంగా ఉంచడానికి బాదం, కొబ్బరి లేదా సోయా పాలు వాడండి)", "టాపింగ్ కోసం (ఐచ్ఛికం)", "చక్కెర లేని చాక్లెట్ సిరప్", "డార్క్ చాక్లెట్ చిప్స్"], "steps": ["Combine and Soak: In a large heat-safe bowl, combine the almonds, cashews, oats, chopped dark chocolate, cocoa powder, and pitted dates. Add the vanilla extract, then pour the warm milk over all the ingredients. Let everything sit and soak for 20 to 30 minutes until the nuts and dates soften and the chocolate melts.", "Blend Until Smooth: Transfer the entire soaked mixture (including the liquid) into a high-speed blender jar. Blend continuously until it turns into a completely smooth, velvety chocolate paste with no grainy bits left from the nuts or oats.", "Prep for Freezing: Pour the smooth chocolate base into a glass or freezer-safe container. To prevent ice crystals from forming on the surface, press a sheet of plastic cling wrap directly onto the top layer of the chocolate mixture.", "Freeze Overnight: Secure the container lid tightly and place it in the freezer overnight, or for at least 7 to 8 hours.", "Serve: Remove from the freezer, discard the plastic wrap, and let it sit at room temperature for 2 to 3 minutes to soften slightly. Scoop out the ice cream, drizzle with chocolate syrup, and sprinkle with dark chocolate chips before enjoying."], "steps_te": ["కలిపి నానబెట్టండి: పెద్ద వేడిని తట్టుకునే గిన్నెలో బాదం, జీడిపప్పు, ఓట్స్, తరిగిన డార్క్ చాక్లెట్, కోకో పౌడర్ మరియు గింజలు తీసిన ఖర్జూరాలు కలపండి. వెనిల్లా ఎక్స్‌ట్రాక్ట్ వేసి, తర్వాత అన్ని పదార్థాలపై గోరువెచ్చని పాలు పోయండి. గింజలు, ఖర్జూరాలు మెత్తబడి చాక్లెట్ కరిగేవరకు 20 to 30 minutes పాటు నాననివ్వండి.", "మృదువుగా అయ్యేవరకు బ్లెండ్ చేయండి: నానబెట్టిన మిశ్రమం మొత్తాన్ని (ద్రవంతో సహా) హై-స్పీడ్ బ్లెండర్ జార్‌లోకి తీసుకోండి. గింజలు లేదా ఓట్స్ నుంచి గరుకు ముక్కలు లేకుండా పూర్తిగా మృదువైన, మెత్తని చాక్లెట్ పేస్ట్ అయ్యేవరకు నిరంతరం బ్లెండ్ చేయండి.", "ఫ్రీజ్ చేయడానికి సిద్ధం చేయండి: మృదువైన చాక్లెట్ బేస్‌ను గాజు లేదా ఫ్రీజర్‌లో పెట్టగల కంటైనర్‌లో పోయండి. ఉపరితలంపై మంచు స్ఫటికాలు ఏర్పడకుండా నివారించడానికి, ప్లాస్టిక్ క్లింగ్ ర్యాప్ షీట్‌ను చాక్లెట్ మిశ్రమం పై పొరపై నేరుగా నొక్కండి.", "రాత్రంతా ఫ్రీజ్ చేయండి: కంటైనర్ మూతను గట్టిగా బిగించి ఫ్రీజర్‌లో రాత్రంతా, లేదా కనీసం 7 to 8 hours పాటు ఉంచండి.", "వడ్డించండి: ఫ్రీజర్ నుంచి తీసి, ప్లాస్టిక్ ర్యాప్ తీసేసి, కొంచెం మెత్తబడటానికి గది ఉష్ణోగ్రత వద్ద 2 to 3 minutes పాటు ఉంచండి. ఐస్‌క్రీమ్‌ను స్కూప్ చేసి, చాక్లెట్ సిరప్ చిలకరించి, ఆస్వాదించడానికి ముందు డార్క్ చాక్లెట్ చిప్స్ చల్లండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:45.875Z"}, {"n": 49, "title": "Healthy Crispy Quinoa Cookies", "title_te": "ఆరోగ్యకరమైన కరకరలాడే క్వినోవా కుకీలు", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍪", "image": "https://www.barrierfreecooking.com/wp-content/uploads/2026/01/a80o2m4pn0m8byyd8zrw.webp", "prep": "—", "cook": "18-20 minutes at 170C", "yield": "—", "desc": "Crispy thin quinoa and oat cookies sweetened with jaggery or dates, pitched for toddlers.", "desc_te": "బెల్లం లేదా ఖర్జూరాలతో తీపి చేసిన, పలుచని, కరకరలాడే క్వినోవా మరియు ఓట్ కుకీలు, పిల్లల కోసం సూచించబడ్డాయి.", "tags": ["vegetarian", "contains dairy", "snack"], "ing": ["1/2 cup cooked quinoa", "1 cup oats powder", "2 tbsp wheat/millet flour", "2 tbsp nut powder (almond/cashew)", "2.5-3 tbsp jaggery powder or 2 tbsp date paste or date syrup", "2 tbsp ghee", "1/4 tsp baking powder", "1/4 tsp cinnamon (optional)", "1/4 tsp elaichi powder", "Little milk as needed", "Finely chopped nuts"], "ing_te": ["1/2 cup వండిన క్వినోవా", "1 cup ఓట్స్ పౌడర్", "2 tbsp గోధుమ/సజ్జ పిండి", "2 tbsp గింజల పొడి (బాదం/జీడిపప్పు)", "2.5-3 tbsp బెల్లం పొడి లేదా 2 tbsp ఖర్జూర పేస్ట్ లేదా ఖర్జూర సిరప్", "2 tbsp నెయ్యి", "1/4 tsp బేకింగ్ పౌడర్", "1/4 tsp దాల్చినచెక్క (ఐచ్ఛికం)", "1/4 tsp యాలకుల పొడి", "అవసరమైనంత కొద్దిగా పాలు", "సన్నగా తరిగిన గింజలు"], "steps": ["Mix everything into a soft dough.", "Make small balls and gently press into thin round cookie shapes.", "Score the tops.", "Bake at 170C for 18-20 minutes, using convection mode for the last 10 minutes for a crispier version.", "Serve."], "steps_te": ["అన్నింటినీ కలిపి మెత్తని పిండిలా చేయండి.", "చిన్న ఉండలు చేసి, మెల్లగా ఒత్తి పలుచని గుండ్రని కుకీ ఆకారాలు చేయండి.", "పైన గీతలు గీయండి.", "170C వద్ద 18-20 minutes కాల్చండి, మరింత కరకరలాడే రకం కోసం చివరి 10 minutes కన్వెక్షన్ మోడ్ వాడండి.", "వడ్డించండి."], "notes": "Thin round cookie format; nut powder and chopped nuts are tree nuts, check for allergy and skip loose nut toppings for a toddler.", "notes_te": "పలుచని గుండ్రని కుకీ రూపం; గింజల పొడి మరియు తరిగిన గింజలు ట్రీ నట్స్, అలర్జీ ఉందో లేదో చూసుకోండి మరియు పసిపిల్లల కోసం పైన వేసే గింజలను వదిలేయండి.", "added_at": "2026-10-22T16:04:22.370Z"}, {"n": 73, "title": "Healthy Date & Oat Energy Balls", "title_te": "హెల్దీ ఖర్జూర & ఓట్ ఎనర్జీ బాల్స్", "cat": "Adult", "section": "adult", "emoji": "🥣", "image": "https://www.recipesncooking.com/wp-content/uploads/2025/06/healthy-date-recipes-bites-768x768.png", "prep": "10 mins", "cook": "30 mins chill", "yield": "15 balls", "desc": "No-bake chocolate peanut butter oat balls packed with fiber.", "desc_te": "ఫైబర్ అధికంగా ఉండే నో-బేక్ చాక్లెట్ పీనట్ బటర్ ఓట్ బాల్స్.", "tags": [], "ing": ["1 cup pitted dates, 2 cups rolled oats, 1/2 cup mixed walnuts and almonds", "1/3 cup cocoa powder, 1/2 cup peanut butter"], "ing_te": ["1 cup గింజలు తీసిన ఖర్జూరాలు, 2 cups రోల్డ్ ఓట్స్, 1/2 cup మిక్స్‌డ్ వాల్‌నట్స్ మరియు బాదం", "1/3 cup కోకో పౌడర్, 1/2 cup పీనట్ బటర్"], "steps": ["Blend dates, oats, nuts, cocoa, and peanut butter until sticky.", "Scoop tablespoon portions and roll into round balls.", "Chill in the refrigerator for 30 minutes."], "steps_te": ["ఖర్జూరాలు, ఓట్స్, నట్స్, కోకో మరియు పీనట్ బటర్ జిగురుగా అయ్యేవరకు బ్లెండ్ చేయండి.", "టేబుల్‌స్పూన్ పరిమాణంలో తీసుకుని గుండ్రని బంతులుగా చుట్టండి.", "ఫ్రిజ్‌లో 30 minutes చల్లబరచండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:06:17.401Z"}, {"n": 140, "title": "Healthy Date and Oat Energy Balls", "title_te": "ఆరోగ్యకరమైన ఖర్జూరం, ఓట్ ఎనర్జీ బాల్స్", "cat": "Adult", "section": "adult", "emoji": "🥣", "image": "https://www.recipesncooking.com/wp-content/uploads/2025/06/healthy-date-recipes-bites-768x768.png", "prep": "—", "cook": "—", "yield": "—", "desc": "This recipe provides a simple, no-bake method for creating nutritious snacks using whole ingredients. These energy balls are high in fiber and healthy fats, making them an excellent choice for a quick treat or an on-the-go snack.", "desc_te": "పూర్తి పదార్థాలతో పోషకమైన స్నాక్స్ తయారుచేయడానికి సులభమైన, నో-బేక్ పద్ధతిని ఈ రెసిపీ అందిస్తుంది. ఈ ఎనర్జీ బాల్స్‌లో ఫైబర్, ఆరోగ్యకరమైన కొవ్వులు ఎక్కువగా ఉండటం వల్ల త్వరిత ట్రీట్‌కు లేదా ప్రయాణంలో తినే స్నాక్‌కు అద్భుతమైన ఎంపిక.", "tags": [], "ing": ["Ingredients", "Ingredient", "Quantity", "Dates (pitted)", "1 cup", "Oats", "2 cups", "Walnuts and Almonds (mixed)", "1/2 cup", "Cocoa Powder", "1/3 cup", "Peanut Butter", "1/2 cup", "Seeds/Extra Nuts", "Optional (to taste)"], "ing_te": ["పదార్థాలు", "పదార్థం", "పరిమాణం", "ఖర్జూరాలు (గింజలు తీసినవి)", "1 cup", "ఓట్స్", "2 cups", "వాల్‌నట్స్, బాదం (కలిపినవి)", "1/2 cup", "కోకో పౌడర్", "1/3 cup", "పీనట్ బటర్", "1/2 cup", "గింజలు/అదనపు నట్స్", "ఐచ్ఛికం (రుచికి తగ్గట్టు)"], "steps": ["Prepare the Dates: If the dates are firm, soak them in warm water for about 5-10 minutes to soften, then drain well.", "Blend: Place the dates, oats, walnuts, almonds, cocoa powder, and peanut butter into a food processor or high-powered blender.", "Process: Pulse until the ingredients are well combined and the mixture starts to stick together. If you are adding extra seeds or chopped nuts for texture, fold them in after blending.", "Form Balls: Scoop about a tablespoon of the mixture at a time and roll between your palms to form smooth, round balls.", "Set: Place the energy balls on a parchment-lined tray or in a container.", "Refrigerate: Chill in the refrigerator for at least 30 minutes to help them firm up. Keep them stored in the fridge for freshness. Variations", "Nut-Free: Substitute peanut butter with sunflower seed butter and replace the nuts with seeds like pumpkin or sunflower seeds.", "Added Sweetness: If the dates aren't sweet enough for your preference, a small drizzle of honey or maple syrup can be added during the blending process.", "Flavor Boost: Add a pinch of sea salt or a dash of vanilla extract to enhance the cocoa flavor."], "steps_te": ["ఖర్జూరాలను సిద్ధం చేయండి: ఖర్జూరాలు గట్టిగా ఉంటే, మెత్తబడటానికి సుమారు 5-10 minutes గోరువెచ్చని నీటిలో నానబెట్టి, బాగా వడకట్టండి.", "బ్లెండ్ చేయండి: ఖర్జూరాలు, ఓట్స్, వాల్‌నట్స్, బాదం, కోకో పౌడర్, పీనట్ బటర్‌ను ఫుడ్ ప్రాసెసర్ లేదా హై-పవర్ బ్లెండర్‌లో వేయండి.", "ప్రాసెస్ చేయండి: పదార్థాలు బాగా కలిసి, మిశ్రమం అంటుకోవడం మొదలయ్యేవరకు పల్స్ చేయండి. ఆకృతి కోసం అదనపు గింజలు లేదా తరిగిన నట్స్ వేస్తుంటే, బ్లెండ్ చేసిన తర్వాత వాటిని కలపండి.", "బాల్స్ చేయండి: ఒకసారి tablespoon మిశ్రమాన్ని తీసుకుని అరచేతుల మధ్య చుట్టి మృదువైన, గుండ్రని బాల్స్‌గా చేయండి.", "సెట్ చేయండి: ఎనర్జీ బాల్స్‌ను పార్చ్మెంట్ పరచిన ట్రేపై లేదా డబ్బాలో ఉంచండి.", "ఫ్రిజ్‌లో ఉంచండి: గట్టిపడటానికి ఫ్రిజ్‌లో కనీసం 30 minutes చల్లబరచండి. తాజాదనం కోసం ఫ్రిజ్‌లోనే నిల్వ చేయండి. వైవిధ్యాలు", "నట్-ఫ్రీ: పీనట్ బటర్‌కు బదులుగా సన్‌ఫ్లవర్ సీడ్ బటర్ వాడండి, నట్స్‌కు బదులుగా గుమ్మడి లేదా సన్‌ఫ్లవర్ గింజలు వంటి గింజలు వాడండి.", "అదనపు తీపి: ఖర్జూరాలు మీకు తగినంత తీపిగా లేకపోతే, బ్లెండింగ్ సమయంలో కొంచెం తేనె లేదా మేపుల్ సిరప్ చుక్క వేయవచ్చు.", "రుచి పెంపు: కోకో రుచిని పెంచడానికి చిటికెడు సముద్రపు ఉప్పు లేదా వెనిల్లా ఎక్స్‌ట్రాక్ట్ చుక్క వేయండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.416Z"}, {"n": 84, "title": "Healthy Oatmeal Cocoa Banana Cake", "title_te": "హెల్దీ ఓట్‌మీల్ కోకో బనానా కేక్", "cat": "Adult", "section": "adult", "emoji": "🥣", "image": "https://santmd.com/wp-content/uploads/2025/01/T37.webp", "prep": "—", "cook": "—", "yield": "—", "desc": "This healthy, fiber-rich cake is made without added salt or processed sugar, making it an excellent nutritious treat.", "desc_te": "ఈ ఆరోగ్యకరమైన, ఫైబర్ అధికంగా ఉండే కేక్‌లో ఉప్పు లేదా ప్రాసెస్ చేసిన చక్కెర కలపలేదు, కాబట్టి ఇది అద్భుతమైన పోషకమైన ట్రీట్.", "tags": [], "ing": ["Ingredient", "Quantity", "Rolled Oats", "120 g (1 1/3 cups)", "Warm Milk", "150 ml (2/3 cup)", "Bananas", "2 large (ripe)", "Cocoa Powder", "4 tbsp (45 g)", "Baking Powder", "1 tbsp", "Eggs", "2 large", "Peanuts", "40 g", "Pumpkin Seeds", "20 g"], "ing_te": ["పదార్థం", "పరిమాణం", "రోల్డ్ ఓట్స్", "120 g (1 1/3 cups)", "గోరువెచ్చని పాలు", "150 ml (2/3 cup)", "అరటిపండ్లు", "2 large (పండినవి)", "కోకో పౌడర్", "4 tbsp (45 g)", "బేకింగ్ పౌడర్", "1 tbsp", "గుడ్లు", "2 large", "వేరుశనగలు", "40 g", "గుమ్మడి గింజలు", "20 g"], "steps": ["Prepare the Base: Combine rolled oats and warm milk in a large bowl. Stir and let sit until the milk is absorbed.", "Mash Bananas: Mash the ripe bananas until smooth and stir them into the oat mixture.", "Mix Dry Ingredients: Sift in the cocoa powder and baking powder. Mix thoroughly.", "Add Final Ingredients: Whisk in the eggs, then fold in the peanuts and pumpkin seeds.", "Bake: Pour the batter into a greased baking dish and bake at 180°C (350°F) for approximately 35–45 minutes or until set.", "Cool and Serve: Let the cake cool completely before slicing. For an extra treat, drizzle with a small amount of melted dark chocolate."], "steps_te": ["బేస్ సిద్ధం చేయండి: ఒక పెద్ద గిన్నెలో రోల్డ్ ఓట్స్ మరియు గోరువెచ్చని పాలు కలపండి. కలిపి పాలు పీల్చుకునేవరకు ఉంచండి.", "అరటిపండ్లు మెదపండి: పండిన అరటిపండ్లను మెత్తగా మెదిపి ఓట్ మిశ్రమంలో కలపండి.", "పొడి పదార్థాలు కలపండి: కోకో పౌడర్ మరియు బేకింగ్ పౌడర్ జల్లించి వేయండి. బాగా కలపండి.", "చివరి పదార్థాలు వేయండి: గుడ్లు గిలకొట్టి వేయండి, తర్వాత వేరుశనగలు మరియు గుమ్మడి గింజలు కలపండి.", "బేక్ చేయండి: పిండిని నూనె రాసిన బేకింగ్ డిష్‌లో పోసి 180°C (350°F) వద్ద సుమారు 35–45 minutes లేదా సెట్ అయ్యేవరకు బేక్ చేయండి.", "చల్లార్చి వడ్డించండి: ముక్కలు కోసే ముందు కేక్‌ను పూర్తిగా చల్లారనివ్వండి. అదనపు ట్రీట్ కోసం కొద్దిగా కరిగిన డార్క్ చాక్లెట్ చల్లండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:06:17.765Z"}, {"n": 118, "title": "High-Protein Blueberry Cottage Cheese Blender Pancakes", "title_te": "హై-ప్రోటీన్ బ్లూబెర్రీ కాటేజ్ చీజ్ బ్లెండర్ పాన్‌కేక్‌లు", "cat": "Kid & Toddler", "section": "kid", "emoji": "🥞", "image": "https://urbanfarmie.com/wp-content/uploads/Blueberry-Cottage-Cheese-Pancakes-18.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "Meal Type", "desc_te": "భోజన రకం", "tags": [], "ing": ["1 cup full-fat cottage cheese", "1 cup rolled oats", "2 large eggs", "1 tsp vanilla extract", "1/2 tsp ground cinnamon", "1/2 tsp baking powder", "1/2 cup fresh blueberries", "1 tbsp butter or coconut oil (for cooking)"], "ing_te": ["1 cup ఫుల్-ఫ్యాట్ కాటేజ్ చీజ్", "1 cup రోల్డ్ ఓట్స్", "2 large గుడ్లు", "1 tsp వెనిల్లా ఎక్స్‌ట్రాక్ట్", "1/2 tsp పొడి చేసిన దాల్చినచెక్క", "1/2 tsp బేకింగ్ పౌడర్", "1/2 cup తాజా బ్లూబెర్రీలు", "1 tbsp వెన్న లేదా కొబ్బరి నూనె (వండడానికి)"], "steps": ["Combine cottage cheese, rolled oats, eggs, vanilla extract, cinnamon, and baking powder in a high-speed blender. Blend until smooth. Heat a non-stick skillet over medium-low heat and melt a small amount of butter or coconut oil. Pour small 2-inch circles of batter onto the skillet. Gently press 3–4 blueberries into each pancake. Cook for 2–3 minutes until bubbles form on top and edges look set. Flip carefully and cook for another 1–2 minutes until golden brown. Allow to cool to warm/room temperature before cutting into toddler-friendly strips or bite-sized pieces."], "steps_te": ["హై-స్పీడ్ బ్లెండర్‌లో కాటేజ్ చీజ్, రోల్డ్ ఓట్స్, గుడ్లు, వెనిల్లా ఎక్స్‌ట్రాక్ట్, దాల్చినచెక్క మరియు బేకింగ్ పౌడర్‌ను కలపండి. మృదువుగా అయ్యేవరకు బ్లెండ్ చేయండి. మధ్యస్థ-తక్కువ మంటపై నాన్-స్టిక్ స్కిల్లెట్‌ను వేడి చేసి కొద్దిగా వెన్న లేదా కొబ్బరి నూనెను కరిగించండి. స్కిల్లెట్‌పై చిన్న 2-inch వృత్తాలుగా బ్యాటర్ పోయండి. ప్రతి పాన్‌కేక్‌లో 3–4 బ్లూబెర్రీలను మెల్లగా నొక్కండి. పైన బుడగలు వచ్చి అంచులు సెట్ అయినట్లు కనిపించేవరకు 2–3 minutes వండండి. జాగ్రత్తగా తిప్పి బంగారు గోధుమ రంగు వచ్చేవరకు మరో 1–2 minutes వండండి. పిల్లలకు అనుకూలమైన స్ట్రిప్‌లుగా లేదా చిన్న ముక్కలుగా కోయడానికి ముందు వెచ్చని/గది ఉష్ణోగ్రతకు చల్లారనివ్వండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:18.762Z"}, {"n": 85, "title": "High-Protein Choco Bar", "title_te": "హై-ప్రోటీన్ చాకో బార్", "cat": "Adult", "section": "adult", "emoji": "🥗", "image": "https://buildyourbite.com/wp-content/uploads/2024/01/Chocolate-Protein-Bars-40.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "A healthy, 5-ingredient homemade protein bar using natural sweeteners and protein-rich peanuts.", "desc_te": "సహజ తీపిదనం మరియు ప్రోటీన్ అధికంగా ఉండే వేరుశనగలతో చేసిన ఆరోగ్యకరమైన, 5-పదార్థాల ఇంట్లో తయారుచేసిన ప్రోటీన్ బార్.", "tags": [], "ing": ["Peanuts: 1/2 cup, roasted", "Dates: 3 pieces, pitted", "Cocoa powder: 4 tablespoons", "Jaggery powder: 3 tablespoons", "Ghee (Clarified butter): 3 tablespoons"], "ing_te": ["వేరుశనగలు: 1/2 cup, వేయించినవి", "ఖర్జూరాలు: 3 pieces, గింజలు తీసినవి", "కోకో పౌడర్: 4 tablespoons", "బెల్లం పొడి: 3 tablespoons", "నెయ్యి (క్లారిఫైడ్ బటర్): 3 tablespoons"], "steps": ["Prepare the Base: Place the roasted peanuts and pitted dates in a blender. Pulse until they form a sticky, crumbly dough.", "Make the Dark Chocolate Layer: In a blender, combine cocoa powder, jaggery powder, and ghee. Blend patiently, stopping occasionally to scrape down the sides, until it becomes a smooth, silky chocolate paste.", "Layer the Bars: Line a small tray or mold with parchment paper. Press the peanut-date mixture firmly into the bottom to create an even layer.", "Top with Chocolate: Pour the homemade chocolate paste over the peanut base and smooth it out with a spoon.", "Set and Serve: Place the tray in the freezer for at least 30 minutes. Once set, remove from the mold and slice into bars. Store in the refrigerator."], "steps_te": ["బేస్ సిద్ధం చేయండి: వేయించిన వేరుశనగలు మరియు గింజలు తీసిన ఖర్జూరాలను బ్లెండర్‌లో వేయండి. జిగురుగా, పొడిపొడిగా ఉండే ముద్ద అయ్యేవరకు పల్స్ చేయండి.", "డార్క్ చాక్లెట్ పొర చేయండి: బ్లెండర్‌లో కోకో పౌడర్, బెల్లం పొడి మరియు నెయ్యి కలపండి. మెత్తని, నునుపైన చాక్లెట్ పేస్ట్ అయ్యేవరకు ఓపికగా బ్లెండ్ చేయండి, మధ్యమధ్యలో పక్కలను గీకండి.", "బార్లు పొరలుగా పెట్టండి: ఒక చిన్న ట్రే లేదా మోల్డ్‌కు పార్చ్‌మెంట్ పేపర్ వేయండి. వేరుశనగ-ఖర్జూర మిశ్రమాన్ని అడుగున సమానమైన పొరగా గట్టిగా నొక్కండి.", "చాక్లెట్ పైన వేయండి: ఇంట్లో తయారుచేసిన చాక్లెట్ పేస్ట్‌ను వేరుశనగ బేస్‌పై పోసి చెంచాతో సమానం చేయండి.", "సెట్ చేసి వడ్డించండి: ట్రేను కనీసం 30 minutes ఫ్రీజర్‌లో ఉంచండి. సెట్ అయిన తర్వాత మోల్డ్ నుండి తీసి బార్లుగా కోయండి. ఫ్రిజ్‌లో నిల్వ చేయండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:06:17.793Z"}, {"n": 98, "title": "High-Protein Cottage Cheese & Cinnamon French Toast Sticks", "title_te": "హై-ప్రోటీన్ కాటేజ్ చీజ్ & దాల్చినచెక్క ఫ్రెంచ్ టోస్ట్ స్టిక్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🧀", "image": "https://thatovenfeelin.com/wp-content/uploads/2025/12/Cinnamon-French-Toast-Sticks-3-356x530.png", "prep": "10 minutes", "cook": "12 minutes", "yield": "16 sticks (3–4 toddler servings)", "desc": "A classic toddler favorite transformed into a protein powerhouse. Whole-milk cottage cheese is blended smooth with eggs, milk, cinnamon, and vanilla, creating a rich custard that coats whole-grain bread slices before baking or pan-searing into sturdy, mess-free finger food sticks.", "desc_te": "పసిపిల్లలకు ఇష్టమైన క్లాసిక్ వంటకాన్ని ప్రోటీన్ పవర్‌హౌస్‌గా మార్చారు. హోల్-మిల్క్ కాటేజ్ చీజ్‌ను గుడ్లు, పాలు, దాల్చినచెక్క, వనిల్లాతో మెత్తగా బ్లెండ్ చేసి రిచ్ కస్టర్డ్ తయారుచేస్తారు, ఇది హోల్-గ్రెయిన్ బ్రెడ్ ముక్కలకు పట్టి, బేక్ చేసినా లేదా పాన్‌లో వేయించినా గట్టి, చిందరవందర లేని ఫింగర్ ఫుడ్ స్టిక్స్ అవుతుంది.", "tags": [], "ing": ["6 slices thick whole wheat or sourdough bread", "3 large eggs", "1/2 cup whole-milk cottage cheese", "1/4 cup whole milk (or unsweetened oat milk)", "1 tsp pure vanilla extract", "1 tsp ground cinnamon", "1 tbsp butter or coconut oil (for skillet cooking, or baking sheet)"], "ing_te": ["6 slices మందపాటి హోల్ వీట్ లేదా సోర్‌డో బ్రెడ్", "3 large గుడ్లు", "1/2 cup హోల్-మిల్క్ కాటేజ్ చీజ్", "1/4 cup హోల్ మిల్క్ (లేదా తీపి లేని ఓట్ మిల్క్)", "1 tsp స్వచ్ఛమైన వనిల్లా ఎక్స్‌ట్రాక్ట్", "1 tsp దాల్చినచెక్క పొడి", "1 tbsp వెన్న లేదా కొబ్బరి నూనె (స్కిల్లెట్‌లో ఉడికించడానికి, లేదా బేకింగ్ షీట్ కోసం)"], "steps": ["Slice Bread: Cut each bread slice into 3 or 4 lengthwise finger-sized strips/sticks.", "Blend Custard: In a blender, combine eggs, cottage cheese, milk, vanilla extract, and cinnamon. Blend on high speed for 30 seconds until completely smooth and creamy with no cottage cheese curds visible.", "Dip: Pour custard into a shallow baking dish or wide bowl. Dip each bread stick into the mixture, letting it soak for 5–10 seconds per side so the bread absorbs the egg mixture without becoming overly soggy.", "Cook (Skillet Method): Heat a large skillet over medium-low heat with a little butter. Place the soaked sticks in the pan and cook for 2–3 minutes per side until golden brown and cooked through.", "Oven Alternative: Bake on a greased parchment-lined sheet at 375°F (190°C) for 12–14 minutes, turning halfway.", "Serve: Let cool to warm. Serve plain, or dusted with a light sprinkle of extra cinnamon, with plain Greek yogurt or mashed berries for dipping."], "steps_te": ["బ్రెడ్ కత్తిరించండి: ప్రతి బ్రెడ్ ముక్కను 3 or 4 పొడవైన వేలు పరిమాణ స్ట్రిప్స్/స్టిక్స్‌గా కత్తిరించండి.", "కస్టర్డ్ బ్లెండ్ చేయండి: బ్లెండర్‌లో గుడ్లు, కాటేజ్ చీజ్, పాలు, వనిల్లా ఎక్స్‌ట్రాక్ట్, దాల్చినచెక్క కలపండి. కాటేజ్ చీజ్ ముద్దలు ఏమీ కనిపించకుండా పూర్తిగా మెత్తగా, క్రీమీగా అయ్యేవరకు 30 seconds పాటు హై స్పీడ్‌లో బ్లెండ్ చేయండి.", "డిప్ చేయండి: కస్టర్డ్‌ను లోతులేని బేకింగ్ డిష్ లేదా వెడల్పాటి గిన్నెలో పోయండి. ప్రతి బ్రెడ్ స్టిక్‌ను మిశ్రమంలో ముంచి, ప్రతి వైపు 5–10 seconds పాటు నాననివ్వండి, బ్రెడ్ గుడ్డు మిశ్రమాన్ని పీల్చుకుని ఎక్కువగా తడిగా కాకుండా.", "ఉడికించండి (స్కిల్లెట్ పద్ధతి): పెద్ద స్కిల్లెట్‌ను మీడియం-తక్కువ మంటపై కొద్దిగా వెన్నతో వేడి చేయండి. నానబెట్టిన స్టిక్స్‌ను పాన్‌లో ఉంచి, ప్రతి వైపు 2–3 minutes పాటు బంగారు రంగు వచ్చి, పూర్తిగా ఉడికేవరకు ఉడికించండి.", "ఓవెన్ ప్రత్యామ్నాయం: నూనె రాసిన పార్చ్‌మెంట్ పరచిన షీట్‌పై 375°F (190°C) వద్ద 12–14 minutes బేక్ చేయండి, మధ్యలో తిప్పుతూ.", "వడ్డించండి: గోరువెచ్చగా అయ్యేవరకు చల్లారనివ్వండి. అలాగే, లేదా అదనపు దాల్చినచెక్కను తేలికగా చల్లి, ప్లెయిన్ గ్రీక్ పెరుగు లేదా మెదిపిన బెర్రీలతో డిప్ చేసుకుని వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:26.988Z"}, {"n": 81, "title": "High-Protein Granola Bars", "title_te": "హై-ప్రోటీన్ గ్రానోలా బార్లు", "cat": "Adult", "section": "adult", "emoji": "🍲", "image": "https://www.leanbyplate.com/wp-content/uploads/2026/05/no-bake-high-protein-granola-b-feature-1779495756926-1024x1024.webp", "prep": "—", "cook": "—", "yield": "—", "desc": "Ingredients", "desc_te": "పదార్థాలు", "tags": [], "ing": ["The Nut & Seed Base", "1 cup chopped almonds", "1 cup chopped cashews", "1 cup chopped pistachios", "1 cup chopped walnuts", "1/3 cup sunflower seeds", "1/3 cup chia seeds", "1/3 cup pumpkin seeds", "3 cups whole rolled oats", "The Sweet & Fruity Mix-ins", "1/3 cup dried cranberries", "1/3 cup raisins", "The Wet Binder", "1/2 cup cold-pressed coconut oil", "3/4 cup egg whites (Note: For a vegan alternative, you can substitute with 1/2 cup of aquafaba or an extra 1/4 cup of maple syrup/nut butter)", "1/3 cup pure maple syrup"], "ing_te": ["నట్ & సీడ్ బేస్", "1 cup తరిగిన బాదం", "1 cup తరిగిన జీడిపప్పు", "1 cup తరిగిన పిస్తా", "1 cup తరిగిన వాల్‌నట్స్", "1/3 cup పొద్దుతిరుగుడు గింజలు", "1/3 cup చియా గింజలు", "1/3 cup గుమ్మడి గింజలు", "3 cups హోల్ రోల్డ్ ఓట్స్", "స్వీట్ & ఫ్రూటీ మిక్స్-ఇన్‌లు", "1/3 cup ఎండిన క్రాన్‌బెర్రీలు", "1/3 cup కిస్‌మిస్", "వెట్ బైండర్", "1/2 cup కోల్డ్-ప్రెస్డ్ కొబ్బరి నూనె", "3/4 cup గుడ్డు తెల్లసొన (గమనిక: వీగన్ ప్రత్యామ్నాయం కోసం 1/2 cup ఆక్వాఫాబా లేదా అదనంగా 1/4 cup మేపుల్ సిరప్/నట్ బటర్‌తో భర్తీ చేయవచ్చు)", "1/3 cup స్వచ్ఛమైన మేపుల్ సిరప్"], "steps": ["Preheat & Prepare: Preheat your oven to 350°F (180°C). Line a baking sheet or mold with parchment paper.", "Mix Dry Ingredients: In a large mixing bowl, thoroughly combine all the chopped nuts, seeds, oats, and dried fruit.", "Combine Wet Ingredients: Whisk together the coconut oil, egg whites, and maple syrup in a separate small bowl.", "Mix Quickly: Pour the wet ingredients into the dry mixture. Stir quickly and efficiently—this ensures the oats absorb the liquid evenly without becoming mushy.", "Press Firmly: Transfer the mixture to your prepared baking tray or silicone mold. Press down tightly and evenly with a spatula or the bottom of a flat glass to ensure the bars hold their shape after baking.", "Bake: Lower the oven temperature slightly to 325°F (160°C) and bake for 20 minutes, or until the top is a beautiful light golden brown.", "Cool & Cut: Allow the mixture to cool completely in the tray before attempting to slice into bars or remove from the molds. This prevents them from crumbling."], "steps_te": ["ప్రీహీట్ & సిద్ధం: ఓవెన్‌ను 350°F (180°C) వద్ద ప్రీహీట్ చేయండి. బేకింగ్ షీట్ లేదా మోల్డ్‌కు పార్చ్‌మెంట్ పేపర్ వేయండి.", "పొడి పదార్థాలు కలపండి: ఒక పెద్ద మిక్సింగ్ బౌల్‌లో తరిగిన నట్స్, గింజలు, ఓట్స్ మరియు ఎండిన పండ్లన్నింటినీ బాగా కలపండి.", "తడి పదార్థాలు కలపండి: వేరే చిన్న గిన్నెలో కొబ్బరి నూనె, గుడ్డు తెల్లసొన మరియు మేపుల్ సిరప్‌ను గిలకొట్టి కలపండి.", "త్వరగా కలపండి: తడి పదార్థాలను పొడి మిశ్రమంలో పోయండి. త్వరగా, సమర్థవంతంగా కలపండి — దీనివల్ల ఓట్స్ ద్రవాన్ని సమానంగా పీల్చుకుంటాయి, ముద్దగా కాకుండా.", "గట్టిగా నొక్కండి: మిశ్రమాన్ని సిద్ధం చేసిన బేకింగ్ ట్రే లేదా సిలికాన్ మోల్డ్‌కు మార్చండి. బేక్ చేసిన తర్వాత బార్లు ఆకారం నిలబడేలా స్పాటులా లేదా ఫ్లాట్ గ్లాస్ అడుగుభాగంతో గట్టిగా, సమానంగా నొక్కండి.", "బేక్ చేయండి: ఓవెన్ ఉష్ణోగ్రతను కొద్దిగా తగ్గించి 325°F (160°C) వద్ద 20 minutes బేక్ చేయండి, లేదా పైన అందమైన లేత బంగారు గోధుమ రంగు వచ్చేవరకు.", "చల్లార్చి కోయండి: ముక్కలుగా కోసే లేదా మోల్డ్‌ల నుండి తీసే ముందు మిశ్రమాన్ని ట్రేలోనే పూర్తిగా చల్లారనివ్వండి. దీనివల్ల అవి విరిగిపోవు."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:06:17.668Z"}, {"n": 141, "title": "High-Protein Paneer Pizza (Multi-Serving Chart) V4", "title_te": "హై-ప్రోటీన్ పనీర్ పిజ్జా (మల్టీ-సర్వింగ్ చార్ట్) V4", "cat": "Adult", "section": "adult", "emoji": "🍕", "image": "https://www.cookingcarnival.com/wp-content/uploads/2019/11/Paneer-Pizza.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "Enjoy a delicious, guilt-free pizza that packs a powerful protein punch! This versatile version uses ready-made marinara sauce blended with paneer for a fast, creamy, hidden-protein sauce. Use the handy scaling chart below to easily adjust ingredient quantities depending on whether you are cooking for 2, 3, or 5 people.", "desc_te": "రుచికరమైన, గిల్ట్-ఫ్రీ పిజ్జాను ఆస్వాదించండి, ఇది శక్తివంతమైన ప్రోటీన్ పంచ్ ఇస్తుంది! ఈ బహుముఖ వెర్షన్‌లో వేగవంతమైన, క్రీమీ, దాగిన-ప్రోటీన్ సాస్ కోసం రెడీమేడ్ మరినారా సాస్‌ను పనీర్‌తో కలిపి బ్లెండ్ చేస్తారు. 2, 3, లేదా 5 మందికి వండుతున్నారా అనే దానిపై ఆధారపడి పదార్థాల పరిమాణాలను సులభంగా సర్దుకోవడానికి కింది సులభమైన స్కేలింగ్ చార్ట్ వాడండి.", "tags": [], "ing": ["2 People", "3 People", "5 People", "1. High-Protein Pizza Base", "Oat flour", "1 cup", "1 & 1/2 cups", "2 & 1/2 cups", "Atta (whole wheat)", "1/2 cup", "3/4 cup", "1 & 1/4 cups", "Cornflour (cornstarch)", "2 tbsp", "3 tbsp", "5 tbsp", "Thick Greek yogurt", "150g", "225g", "375g", "Salt & Sugar", "2 pinches each", "3 pinches each", "5 pinches each", "Water", "As needed to bind into a soft dough", "2. Quick Creamy Sauce", "Ready-made Marinara", "1 cup", "1 & 1/2 cups", "2 & 1/2 cups", "Paneer (for blending)", "60g", "90g", "150g", "3. Toppings", "Paneer (cubed for sauteing)", "200g", "300g", "500g", "Capsicum (Bell Pepper)", "1 medium", "1 & 1/2 medium", "2 & 1/2 medium", "Low-fat Mozzarella", "30–40g", "45–60g", "75–100g", "Peri-peri Seasoning", "2 tsp", "3 tsp", "5 tsp"], "ing_te": ["2 మందికి", "3 మందికి", "5 మందికి", "1. హై-ప్రోటీన్ పిజ్జా బేస్", "ఓట్ పిండి", "1 cup", "1 & 1/2 cups", "2 & 1/2 cups", "ఆటా (హోల్ వీట్)", "1/2 cup", "3/4 cup", "1 & 1/4 cups", "కార్న్‌ఫ్లార్ (కార్న్‌స్టార్చ్)", "2 tbsp", "3 tbsp", "5 tbsp", "మందపాటి గ్రీక్ పెరుగు", "150g", "225g", "375g", "ఉప్పు & చక్కెర", "2 pinches చొప్పున", "3 pinches చొప్పున", "5 pinches చొప్పున", "నీరు", "మెత్తని పిండిగా కలిపేందుకు అవసరమైనంత", "2. త్వరిత క్రీమీ సాస్", "రెడీమేడ్ మరినారా", "1 cup", "1 & 1/2 cups", "2 & 1/2 cups", "పనీర్ (బ్లెండింగ్ కోసం)", "60g", "90g", "150g", "3. టాపింగ్స్", "పనీర్ (వేయించడానికి ముక్కలుగా)", "200g", "300g", "500g", "క్యాప్సికమ్ (బెల్ పెప్పర్)", "1 medium", "1 & 1/2 medium", "2 & 1/2 medium", "తక్కువ కొవ్వు మోజారెల్లా", "30–40g", "45–60g", "75–100g", "పెరి-పెరి సీజనింగ్", "2 tsp", "3 tsp", "5 tsp"], "steps": ["Step 1: Prepare & Par-Cook the Bases In a large mixing bowl, combine the required quantities of oat flour, atta, cornflour, salt, and sugar according to your batch size. Add the Greek yogurt and begin kneading. Gradually add water, a little at a time, until a smooth, soft dough forms. Cover the dough and let it rest for 10–15 minutes. Divide the dough into equal portions (2, 3, or 5 depending on batch) and roll or press them out into round pizza bases. Heat a tawa or flat skillet over medium heat. Cook each pizza base for 1–2 minutes on both sides until lightly golden. Remove and set aside.", "Step 2: Make the Quick Protein Sauce Place your ready-made marinara sauce directly into a blender. Add the designated amount of paneer (60g, 90g, or 150g). Blend until the paneer completely incorporates, creating a smooth, creamy, high-protein pizza sauce. No stove cooking required!", "Step 3: Prepare the Toppings In a large pan over medium heat, add the cubed topping paneer and sliced capsicum. Season with salt and the peri-peri seasoning. Sauté for 3–4 minutes until the capsicum is slightly tender and the paneer gets a light golden crust.", "Step 4: Assemble & Bake Preheat your oven to 180°C (350°F). Place your par-cooked bases on baking trays. Spread the quick creamy marinara-paneer sauce evenly across all your bases. Distribute the sautéed peri-peri paneer and capsicum evenly over the sauce on each pizza. Top each with your portioned low-fat mozzarella cheese (~15-20g per pizza). Bake in the preheated oven for about 10 minutes, or until the cheese is melted and bubbling. Slice and enjoy while hot!"], "steps_te": ["దశ 1: బేస్‌లను సిద్ధం చేసి పాక్షికంగా ఉడికించండి పెద్ద మిక్సింగ్ బౌల్‌లో మీ బ్యాచ్ పరిమాణానికి తగ్గట్టు అవసరమైన పరిమాణంలో ఓట్ పిండి, ఆటా, కార్న్‌ఫ్లార్, ఉప్పు, చక్కెర కలపండి. గ్రీక్ పెరుగు వేసి పిండి కలపడం మొదలుపెట్టండి. క్రమంగా కొంచెం కొంచెంగా నీరు వేస్తూ మృదువైన, మెత్తని పిండి అయ్యేవరకు కలపండి. పిండిని కప్పి 10–15 minutes విశ్రాంతినివ్వండి. పిండిని సమాన భాగాలుగా (బ్యాచ్‌ను బట్టి 2, 3, లేదా 5) విభజించి గుండ్రని పిజ్జా బేస్‌లుగా చుట్టండి లేదా నొక్కండి. తవా లేదా ఫ్లాట్ స్కిల్లెట్‌ను మధ్యస్థ మంటపై వేడి చేయండి. ప్రతి పిజ్జా బేస్‌ను రెండు వైపులా 1–2 minutes తేలికగా బంగారు రంగు వచ్చేవరకు ఉడికించండి. తీసి పక్కన పెట్టండి.", "దశ 2: త్వరిత ప్రోటీన్ సాస్ చేయండి మీ రెడీమేడ్ మరినారా సాస్‌ను నేరుగా బ్లెండర్‌లో వేయండి. నిర్దేశించిన పనీర్ మొత్తాన్ని (60g, 90g, లేదా 150g) వేయండి. పనీర్ పూర్తిగా కలిసి మృదువైన, క్రీమీ, హై-ప్రోటీన్ పిజ్జా సాస్ అయ్యేవరకు బ్లెండ్ చేయండి. స్టవ్‌పై వండాల్సిన అవసరం లేదు!", "దశ 3: టాపింగ్స్ సిద్ధం చేయండి మధ్యస్థ మంటపై పెద్ద పాన్‌లో ముక్కలు చేసిన టాపింగ్ పనీర్, స్లైస్ చేసిన క్యాప్సికమ్ వేయండి. ఉప్పు, పెరి-పెరి సీజనింగ్‌తో సీజన్ చేయండి. క్యాప్సికమ్ కొంచెం మెత్తబడి, పనీర్‌కు తేలికపాటి బంగారు పొర వచ్చేవరకు 3–4 minutes వేయించండి.", "దశ 4: అసెంబుల్ చేసి బేక్ చేయండి ఓవెన్‌ను 180°C (350°F) వరకు వేడి చేయండి. పాక్షికంగా ఉడికిన బేస్‌లను బేకింగ్ ట్రేలపై ఉంచండి. త్వరిత క్రీమీ మరినారా-పనీర్ సాస్‌ను అన్ని బేస్‌లపై సమానంగా పరచండి. వేయించిన పెరి-పెరి పనీర్, క్యాప్సికమ్‌ను ప్రతి పిజ్జాపై సాస్ మీద సమానంగా పంపిణీ చేయండి. ప్రతి దానిపై మీ భాగం తక్కువ కొవ్వు మోజారెల్లా చీజ్ (~15-20g ప్రతి పిజ్జాకు) వేయండి. వేడి చేసిన ఓవెన్‌లో సుమారు 10 minutes బేక్ చేయండి, లేదా చీజ్ కరిగి బుడగలు వచ్చేవరకు. వేడిగా ముక్కలు చేసి ఆస్వాదించండి!"], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.467Z"}, {"n": 143, "title": "High-Protein Paneer Pizza (Quick Marinara Version) V3 - 3 Servings", "title_te": "హై-ప్రోటీన్ పనీర్ పిజ్జా (త్వరిత మరినారా వెర్షన్) V3 - 3 సర్వింగ్స్", "cat": "Adult", "section": "adult", "emoji": "🍕", "image": "https://www.cookingcarnival.com/wp-content/uploads/2019/11/Paneer-Pizza.jpg", "prep": "—", "cook": "—", "yield": "3 Servings", "desc": "Enjoy a delicious, guilt-free pizza that packs a powerful protein punch! This scaled-up version yields enough ingredients to make 3 separate pizza bases or one large shared meal, keeping the quick marinara preparation method.", "desc_te": "రుచికరమైన, గిల్ట్-ఫ్రీ పిజ్జాను ఆస్వాదించండి, ఇది శక్తివంతమైన ప్రోటీన్ పంచ్ ఇస్తుంది! ఈ పెంచిన వెర్షన్‌లో 3 వేర్వేరు పిజ్జా బేస్‌లు లేదా ఒక పెద్ద ఉమ్మడి భోజనం చేయడానికి సరిపడా పదార్థాలు ఉంటాయి, త్వరిత మరినారా తయారీ పద్ధతిని కొనసాగిస్తూ.", "tags": [], "ing": ["High-Protein Pizza Base: Oat flour: 1 & 1/2 cups", "Atta (whole wheat flour): 3/4 cup", "Cornflour (cornstarch): 3 tbsp", "Thick Greek yogurt: 225g", "Seasonings: 3 generous pinches of salt and sugar", "Water: as needed to bind into a smooth dough", "Quick Creamy Paneer Pizza Sauce: Ready-made Marinara Sauce: 1 & 1/2 cups", "Paneer (for blending): 90g", "Optional Seasoning Boost: Kashmiri chilli powder, chilli flakes, or oregano to taste", "Toppings & Garnish: Paneer (cubed for topping): 300g", "Capsicum (Bell Pepper): 1 & 1/2 medium, sliced or diced", "Low-fat Mozzarella Cheese: 45-60g, shredded", "Seasoning: 3 tsp peri-peri seasoning, plus salt to taste"], "ing_te": ["హై-ప్రోటీన్ పిజ్జా బేస్: ఓట్ పిండి: 1 & 1/2 cups", "ఆటా (హోల్ వీట్ పిండి): 3/4 cup", "కార్న్‌ఫ్లార్ (కార్న్‌స్టార్చ్): 3 tbsp", "మందపాటి గ్రీక్ పెరుగు: 225g", "సీజనింగ్స్: 3 ఉదారమైన చిటికెలు ఉప్పు, చక్కెర", "నీరు: మృదువైన పిండిగా కలిపేందుకు అవసరమైనంత", "త్వరిత క్రీమీ పనీర్ పిజ్జా సాస్: రెడీమేడ్ మరినారా సాస్: 1 & 1/2 cups", "పనీర్ (బ్లెండింగ్ కోసం): 90g", "ఐచ్ఛిక సీజనింగ్ బూస్ట్: రుచికి తగ్గట్టు కాశ్మీరీ చిల్లీ పౌడర్, చిల్లీ ఫ్లేక్స్, లేదా ఒరెగానో", "టాపింగ్స్ & గార్నిష్: పనీర్ (టాపింగ్ కోసం ముక్కలుగా): 300g", "క్యాప్సికమ్ (బెల్ పెప్పర్): 1 & 1/2 medium, స్లైస్ లేదా డైస్ చేసినది", "తక్కువ కొవ్వు మోజారెల్లా చీజ్: 45-60g, తురిమినది", "సీజనింగ్: 3 tsp పెరి-పెరి సీజనింగ్, ప్లస్ రుచికి తగ్గట్టు ఉప్పు"], "steps": ["Step 1: Prepare & Par-Cook the Bases In a large mixing bowl, combine the oat flour, atta, cornflour, salt, and sugar. Add the Greek yogurt and begin kneading. Gradually add water, a little at a time, until a smooth, soft dough forms. Cover the dough and let it rest for 10–15 minutes. Divide the dough into 3 equal portions and roll or press them out into 3 round pizza bases. Heat a tawa or flat skillet over medium heat. Cook each pizza base for 1–2 minutes on both sides until lightly golden. Remove and set aside.", "Step 2: Make the Quick Protein Sauce Place 1 & 1/2 cups of your ready-made marinara sauce directly into a blender. Add the 90g of paneer. Blend until the paneer completely incorporates, creating a smooth, creamy, high-protein pizza sauce.", "Step 3: Prepare the Toppings In a large pan over medium heat, toss the 300g of cubed paneer and capsicum. Season with salt and the peri-peri seasoning. Sauté for 3–4 minutes until the capsicum is slightly tender and the paneer gets a light golden crust.", "Step 4: Assemble & Bake Preheat your oven to 180°C (350°F). Place your par-cooked bases on baking trays. Spread the quick creamy marinara-paneer sauce evenly across all 3 bases. Distribute the sautéed peri-peri paneer and capsicum evenly over the sauce on each pizza. Top each with the shredded low-fat mozzarella cheese (about 15-20g per pizza). Bake in the preheated oven for about 10 minutes, or until the cheese is melted and bubbling. Slice and enjoy while hot!"], "steps_te": ["దశ 1: బేస్‌లను సిద్ధం చేసి పాక్షికంగా ఉడికించండి పెద్ద మిక్సింగ్ బౌల్‌లో ఓట్ పిండి, ఆటా, కార్న్‌ఫ్లార్, ఉప్పు, చక్కెర కలపండి. గ్రీక్ పెరుగు వేసి పిండి కలపడం మొదలుపెట్టండి. క్రమంగా కొంచెం కొంచెంగా నీరు వేస్తూ మృదువైన, మెత్తని పిండి అయ్యేవరకు కలపండి. పిండిని కప్పి 10–15 minutes విశ్రాంతినివ్వండి. పిండిని 3 సమాన భాగాలుగా విభజించి 3 గుండ్రని పిజ్జా బేస్‌లుగా చుట్టండి లేదా నొక్కండి. తవా లేదా ఫ్లాట్ స్కిల్లెట్‌ను మధ్యస్థ మంటపై వేడి చేయండి. ప్రతి పిజ్జా బేస్‌ను రెండు వైపులా 1–2 minutes తేలికగా బంగారు రంగు వచ్చేవరకు ఉడికించండి. తీసి పక్కన పెట్టండి.", "దశ 2: త్వరిత ప్రోటీన్ సాస్ చేయండి మీ రెడీమేడ్ మరినారా సాస్‌లో 1 & 1/2 cups ను నేరుగా బ్లెండర్‌లో వేయండి. 90g పనీర్ వేయండి. పనీర్ పూర్తిగా కలిసి మృదువైన, క్రీమీ, హై-ప్రోటీన్ పిజ్జా సాస్ అయ్యేవరకు బ్లెండ్ చేయండి.", "దశ 3: టాపింగ్స్ సిద్ధం చేయండి మధ్యస్థ మంటపై పెద్ద పాన్‌లో 300g ముక్కలు చేసిన పనీర్, క్యాప్సికమ్ వేయండి. ఉప్పు, పెరి-పెరి సీజనింగ్‌తో సీజన్ చేయండి. క్యాప్సికమ్ కొంచెం మెత్తబడి, పనీర్‌కు తేలికపాటి బంగారు పొర వచ్చేవరకు 3–4 minutes వేయించండి.", "దశ 4: అసెంబుల్ చేసి బేక్ చేయండి ఓవెన్‌ను 180°C (350°F) వరకు వేడి చేయండి. పాక్షికంగా ఉడికిన బేస్‌లను బేకింగ్ ట్రేలపై ఉంచండి. త్వరిత క్రీమీ మరినారా-పనీర్ సాస్‌ను అన్ని 3 బేస్‌లపై సమానంగా పరచండి. వేయించిన పెరి-పెరి పనీర్, క్యాప్సికమ్‌ను ప్రతి పిజ్జాపై సాస్ మీద సమానంగా పంపిణీ చేయండి. ప్రతి దానిపై తురిమిన తక్కువ కొవ్వు మోజారెల్లా చీజ్ (ప్రతి పిజ్జాకు సుమారు 15-20g) వేయండి. వేడి చేసిన ఓవెన్‌లో సుమారు 10 minutes బేక్ చేయండి, లేదా చీజ్ కరిగి బుడగలు వచ్చేవరకు. వేడిగా ముక్కలు చేసి ఆస్వాదించండి!"], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.521Z"}, {"n": 62, "title": "High-Protein Pizza Panini", "title_te": "అధిక ప్రోటీన్ పిజ్జా పనిని", "cat": "Adult", "section": "adult", "emoji": "🍕", "image": "https://www.cuisinart.com/dw/image/v2/ABAF_PRD/on/demandware.static/-/Sites-us-cuisinart-sfra-Library/default/dw9386fdf5/images/recipe-Images/pizza-panini--recipe.jpg?sw=1200&sh=1200&sm=fit", "prep": "5 minutes", "cook": "4 minutes", "yield": "1 sandwich", "desc": "This recipe transforms creamy cottage cheese into a warm, soft, pizza-like filling tucked inside perfectly crispy, pressed sourdough bread. It mimics the luxurious texture of ricotta while delivering a massive protein boost.", "desc_te": "క్రీమీ కాటేజ్ చీజ్‌ను పూర్తిగా క్రిస్పీగా, నొక్కిన సోర్‌డో బ్రెడ్ లోపల వెచ్చని, మృదువైన, పిజ్జా లాంటి ఫిల్లింగ్‌గా మార్చే రెసిపీ ఇది. ఇది రికోటా యొక్క విలాసవంతమైన ఆకృతిని అనుకరిస్తూ భారీ ప్రోటీన్ పెంపును ఇస్తుంది.", "tags": [], "ing": ["Sourdough Bread: 2 thick slices", "Cottage Cheese: 1/3 cup (strained slightly if very watery)", "Marinara or Pizza Sauce: 2 tablespoons", "Olive Oil or Butter: 1 tablespoon (for the outside of the bread)", "Seasonings: A pinch of garlic powder, dried oregano, salt, and freshly cracked black pepper", "Optional Add-ins: Finely chopped fresh basil, sun-dried tomatoes, or a handful of spinach leaves"], "ing_te": ["సోర్‌డో బ్రెడ్: 2 మందపాటి ముక్కలు", "కాటేజ్ చీజ్: 1/3 cup (చాలా నీరుగా ఉంటే కొంచెం వడకట్టినది)", "మరినారా లేదా పిజ్జా సాస్: 2 tablespoons", "ఆలివ్ ఆయిల్ లేదా వెన్న: 1 tablespoon (బ్రెడ్ బయట కోసం)", "మసాలాలు: చిటికెడు వెల్లుల్లి పొడి, ఎండిన ఒరెగానో, ఉప్పు మరియు తాజాగా పొడి చేసిన నల్ల మిరియాలు", "ఐచ్ఛిక అదనపు పదార్థాలు: సన్నగా తరిగిన తాజా తులసి, సన్-డ్రైడ్ టొమాటోలు లేదా గుప్పెడు పాలకూర ఆకులు"], "steps": ["Season the Cheese: In a small bowl, mix the cottage cheese with the garlic powder, dried oregano, salt, black pepper, and chopped basil or sun-dried tomatoes if using.", "Build the Moisture Barrier: Preheat your panini press. Spread 1 tablespoon of marinara sauce onto the inside of each sourdough slice. The sauce and any optional greens (like spinach) should face inward.", "Assemble: Spoon the seasoned cottage cheese mixture onto the center of one slice of bread. Top with the second slice, keeping the marinara side facing the cheese.", "Grease the Crust: Brush the outside of both sourdough slices evenly with olive oil or spread with a thin layer of butter. This ensures a uniform, golden-shattered crust.", "Press to Perfection: Place the sandwich in the preheated panini press. Close the lid gently—do not crush it down instantly. Let the weight of the lid rest on the sandwich so the cottage cheese warms up without spilling out.", "Serve: Press for 3 to 4 minutes until the sourdough is deeply golden, rigid, and completely crisp. Let it cool for 1 minute before slicing so the cheese settles. Chef's Tip If you want an epic \"cheese pull,\" mix a small handful of shredded mozzarella directly into the cottage cheese before assembling. The mozzarella will stretch beautifully while locking the cottage cheese in place."], "steps_te": ["చీజ్‌కు రుచి చేయండి: చిన్న గిన్నెలో కాటేజ్ చీజ్‌ను వెల్లుల్లి పొడి, ఎండిన ఒరెగానో, ఉప్పు, నల్ల మిరియాలు మరియు వాడుతుంటే తరిగిన తులసి లేదా సన్-డ్రైడ్ టొమాటోలతో కలపండి.", "తేమ అడ్డంకిని నిర్మించండి: మీ పనిని ప్రెస్‌ను వేడి చేయండి. ప్రతి సోర్‌డో ముక్క లోపలి వైపు 1 tablespoon మరినారా సాస్ రాయండి. సాస్ మరియు ఏవైనా ఐచ్ఛిక ఆకుకూరలు (పాలకూర వంటివి) లోపలి వైపు ఉండాలి.", "అసెంబుల్ చేయండి: ఒక బ్రెడ్ ముక్క మధ్యలో రుచి చేసిన కాటేజ్ చీజ్ మిశ్రమాన్ని చెంచాతో వేయండి. రెండవ ముక్కతో పైన మూసి, మరినారా వైపు చీజ్‌కు ఎదురుగా ఉండేలా చూడండి.", "క్రస్ట్‌కు గ్రీజ్ చేయండి: రెండు సోర్‌డో ముక్కల బయట భాగాన్ని ఆలివ్ ఆయిల్‌తో సమానంగా బ్రష్ చేయండి లేదా వెన్న పలుచని పొరగా రాయండి. ఇది సమానమైన, బంగారు-క్రిస్పీ క్రస్ట్‌ను నిర్ధారిస్తుంది.", "పూర్తిగా నొక్కండి: శాండ్‌విచ్‌ను వేడి చేసిన పనిని ప్రెస్‌లో ఉంచండి. మూతను మెల్లగా మూసివేయండి — వెంటనే గట్టిగా నొక్కకండి. కాటేజ్ చీజ్ బయటకు రాకుండా వేడెక్కేలా మూత బరువు శాండ్‌విచ్‌పై ఉండనివ్వండి.", "వడ్డించండి: సోర్‌డో లోతైన బంగారు రంగులోకి వచ్చి, గట్టిగా, పూర్తిగా క్రిస్పీ అయ్యేవరకు 3 to 4 minutes పాటు నొక్కండి. చీజ్ స్థిరపడటానికి కత్తిరించడానికి ముందు 1 minute పాటు చల్లారనివ్వండి. చెఫ్ చిట్కా: అద్భుతమైన \"చీజ్ పుల్\" కావాలంటే, అసెంబుల్ చేయడానికి ముందు కొంచెం తురిమిన మోజారెల్లాను నేరుగా కాటేజ్ చీజ్‌లో కలపండి. మోజారెల్లా అందంగా సాగుతూ కాటేజ్ చీజ్‌ను స్థానంలో ఉంచుతుంది."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:45.839Z"}, {"n": 105, "title": "High-Protein Pumpkin & Cottage Cheese Mini Pancakes", "title_te": "హై-ప్రోటీన్ గుమ్మడికాయ & కాటేజ్ చీజ్ మినీ పాన్‌కేక్‌లు", "cat": "Kid & Toddler", "section": "kid", "emoji": "🥞", "image": "https://theflavorwithlina.com/wp-content/uploads/2025/09/pumpkin-cottage-cheese-pancakes.webp", "prep": "10 minutes", "cook": "10 minutes", "yield": "12–14 mini pancakes", "desc": "A cozy, autumnal breakfast packed with protein from whole-milk cottage cheese and fiber, vitamin A, and potassium from real pumpkin puree. Blending the cottage cheese directly into the batter creates a silky, melt-in-the-mouth crumb that is easy for toddlers to chew.", "desc_te": "హోల్-మిల్క్ కాటేజ్ చీజ్ నుండి ప్రోటీన్, నిజమైన గుమ్మడికాయ ప్యూరీ నుండి ఫైబర్, విటమిన్ A, పొటాషియం నిండిన హాయిగా ఉండే, శరదృతువు అల్పాహారం. కాటేజ్ చీజ్‌ను నేరుగా బ్యాటర్‌లో బ్లెండ్ చేయడం వల్ల పసిపిల్లలు నమలడానికి సులభమైన మెత్తని, నోట్లో కరిగిపోయే ముక్క ఏర్పడుతుంది.", "tags": [], "ing": ["1/2 cup pure pumpkin puree (unsweetened, 100% pure pumpkin)", "1/2 cup whole-milk cottage cheese", "2 large eggs", "3/4 cup rolled oats (or oat flour)", "1/2 tsp ground cinnamon", "1/8 tsp ground nutmeg or pumpkin pie spice", "1 tsp baking powder", "1/2 tsp pure vanilla extract", "1 tbsp butter or coconut oil (for greasing the pan)"], "ing_te": ["1/2 cup స్వచ్ఛమైన గుమ్మడికాయ ప్యూరీ (తీపి లేని, 100% స్వచ్ఛమైన గుమ్మడికాయ)", "1/2 cup హోల్-మిల్క్ కాటేజ్ చీజ్", "2 large గుడ్లు", "3/4 cup రోల్డ్ ఓట్స్ (లేదా ఓట్ పిండి)", "1/2 tsp దాల్చినచెక్క పొడి", "1/8 tsp జాజికాయ పొడి లేదా పంప్‌కిన్ పై స్పైస్", "1 tsp బేకింగ్ పౌడర్", "1/2 tsp స్వచ్ఛమైన వనిల్లా ఎక్స్‌ట్రాక్ట్", "1 tbsp వెన్న లేదా కొబ్బరి నూనె (పాన్‌కు నూనె రాయడానికి)"], "steps": ["Blend the Batter: Add the pumpkin puree, cottage cheese, eggs, rolled oats, cinnamon, nutmeg, baking powder, and vanilla extract into a blender. Blend on high speed for 30–45 seconds until completely smooth and creamy.", "Rest: Let the batter sit for 3–5 minutes so the oats absorb liquid and thicken slightly.", "Cook: Heat a non-stick skillet or griddle over medium-low heat. Melt a little butter or oil to coat the surface.", "Portion: Spoon tablespoons of batter onto the hot pan to form toddler-sized mini pancakes (about 2.5 inches in diameter).", "Flip: Cook for 2–3 minutes until tiny bubbles form on the surface and edges look set. Carefully flip and cook for another 1–2 minutes until golden brown and cooked through.", "Serve: Let cool until warm. Serve plain, or topped with a thin smear of almond butter or plain Greek yogurt."], "steps_te": ["బ్యాటర్ బ్లెండ్ చేయండి: గుమ్మడికాయ ప్యూరీ, కాటేజ్ చీజ్, గుడ్లు, రోల్డ్ ఓట్స్, దాల్చినచెక్క, జాజికాయ, బేకింగ్ పౌడర్, వనిల్లా ఎక్స్‌ట్రాక్ట్‌ను బ్లెండర్‌లో వేయండి. పూర్తిగా మెత్తగా, క్రీమీగా అయ్యేవరకు 30–45 seconds పాటు హై స్పీడ్‌లో బ్లెండ్ చేయండి.", "విశ్రాంతి: ఓట్స్ ద్రవాన్ని పీల్చుకుని కొద్దిగా చిక్కబడటానికి బ్యాటర్‌ను 3–5 minutes పాటు ఉంచండి.", "ఉడికించండి: నాన్-స్టిక్ స్కిల్లెట్ లేదా గ్రిడిల్‌ను మీడియం-తక్కువ మంటపై వేడి చేయండి. ఉపరితలానికి పూత కోసం కొద్దిగా వెన్న లేదా నూనె కరిగించండి.", "భాగాలు వేయండి: వేడి పాన్‌పై టేబుల్‌స్పూన్ల కొద్దీ బ్యాటర్ వేసి పసిపిల్లల పరిమాణ మినీ పాన్‌కేక్‌లు (సుమారు 2.5 inches వ్యాసం) చేయండి.", "తిప్పండి: ఉపరితలంపై చిన్న బుడగలు ఏర్పడి, అంచులు గట్టిగా కనిపించేవరకు 2–3 minutes ఉడికించండి. జాగ్రత్తగా తిప్పి మరో 1–2 minutes పాటు బంగారు రంగు వచ్చి, పూర్తిగా ఉడికేవరకు ఉడికించండి.", "వడ్డించండి: గోరువెచ్చగా అయ్యేవరకు చల్లారనివ్వండి. అలాగే, లేదా ఆల్మండ్ బటర్‌ను పలుచగా పూసి లేదా ప్లెయిన్ గ్రీక్ పెరుగుతో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:56.485Z"}, {"n": 60, "title": "High-Protein Tofu Chapati Rolls", "title_te": "అధిక ప్రోటీన్ టోఫు చపాతీ రోల్స్", "cat": "Adult", "section": "adult", "emoji": "🍢", "image": "https://www.brinleyrecipes.com/wp-content/uploads/2026/01/zigesshnd4fqoclikl6h.webp", "prep": "—", "cook": "—", "yield": "—", "desc": "A healthy, flavorful, and protein-packed recipe featuring crispy spiced tofu and sautéed vegetables wrapped in warm chapatis.", "desc_te": "క్రిస్పీ మసాలా టోఫు మరియు వేయించిన కూరగాయలను వెచ్చని చపాతీలలో చుట్టిన ఆరోగ్యకరమైన, రుచికరమైన, ప్రోటీన్ అధికంగా ఉన్న రెసిపీ.", "tags": [], "ing": ["For the Tofu Filling:", "1 block (14 oz) extra-firm tofu, pressed and cubed", "1/2 tsp turmeric powder", "1 tsp garam masala", "1/2 tsp chaat masala", "1/2 tsp chili powder or paprika (optional)", "1 tbsp oil (for pan-searing or air-frying)", "Salt to taste", "For the Veggie Sauté:", "1 medium onion, thinly sliced", "1 bell pepper (any color), thinly sliced", "1/2 tsp cumin seeds", "1 tbsp oil", "For Assembly:", "4-6 cooked chapatis (or rotis/tortillas)", "Mint-coriander green chutney or seasoned yogurt spread"], "ing_te": ["టోఫు ఫిల్లింగ్ కోసం:", "1 block (14 oz) ఎక్స్ట్రా-ఫర్మ్ టోఫు, నొక్కి ముక్కలుగా చేసినది", "1/2 tsp పసుపు పొడి", "1 tsp గరం మసాలా", "1/2 tsp చాట్ మసాలా", "1/2 tsp మిరప పొడి లేదా పప్రికా (ఐచ్ఛికం)", "1 tbsp నూనె (పాన్‌లో వేయించడానికి లేదా ఎయిర్ ఫ్రై చేయడానికి)", "రుచికి తగినంత ఉప్పు", "వెజ్జీ వేయింపు కోసం:", "1 మీడియం ఉల్లిపాయ, సన్నగా తరిగినది", "1 బెల్ పెప్పర్ (ఏ రంగైనా), సన్నగా తరిగినది", "1/2 tsp జీలకర్ర", "1 tbsp నూనె", "అసెంబ్లీ కోసం:", "4-6 వండిన చపాతీలు (లేదా రోటీలు/టోర్టిల్లాలు)", "పుదీనా-కొత్తిమీర గ్రీన్ చట్నీ లేదా రుచి చేసిన పెరుగు స్ప్రెడ్"], "steps": ["Prepare the Tofu: Ensure the tofu is well-pressed to remove excess moisture. Cut it into small, bite-sized cubes. In a bowl, toss the tofu cubes with turmeric, garam masala, chaat masala, chili powder, salt, and 1 tablespoon of oil until evenly coated. Cook the Tofu:", "Air-Fryer Method: Arrange the tofu in a single layer and air-fry at 400°F (200°C) for 12-15 minutes, shaking halfway through, until crisp.", "Pan-Sear Method: Heat a griddle or skillet over medium-high heat and sear the tofu cubes until golden brown and crispy on all sides.", "Sauté the Vegetables: In a separate skillet, heat 1 tablespoon of oil and add the cumin seeds. Once they splutter, add the sliced onions and bell peppers. Sauté for 3-5 minutes until soft but still holding a slight crunch.", "Assemble the Rolls: Warm the chapatis on a griddle. Spread a thin layer of green chutney or yogurt spread across each chapati. Place a generous helping of the crispy tofu and sautéed veggies in the center.", "Final Crisp (Optional): Roll the chapatis tightly. Place the completed rolls back onto a hot griddle for 1-2 minutes, turning once, to achieve a final crispy finish on the outside. Serve warm."], "steps_te": ["టోఫు సిద్ధం చేయండి: టోఫు బాగా నొక్కి అదనపు తేమ తొలగించారని నిర్ధారించండి. చిన్న, కొరకడానికి వీలైన ముక్కలుగా కత్తిరించండి. గిన్నెలో టోఫు ముక్కలకు పసుపు, గరం మసాలా, చాట్ మసాలా, మిరప పొడి, ఉప్పు మరియు 1 tablespoon నూనె సమానంగా పట్టేలా కలపండి. టోఫు వండండి:", "ఎయిర్ ఫ్రైయర్ పద్ధతి: టోఫును ఒకే పొరగా అమర్చి 400°F (200°C) వద్ద 12-15 minutes పాటు ఎయిర్ ఫ్రై చేయండి, మధ్యలో కదిలిస్తూ, క్రిస్పీ అయ్యేవరకు వండండి.", "పాన్-సియర్ పద్ధతి: గ్రిడిల్ లేదా పాన్‌ను మీడియం-హై వేడిపై వేడి చేసి, టోఫు ముక్కలను అన్ని వైపులా బంగారు రంగులోకి వచ్చి క్రిస్పీ అయ్యేవరకు వేయించండి.", "కూరగాయలు వేయించండి: వేరే పాన్‌లో 1 tablespoon నూనె వేడి చేసి జీలకర్ర వేయండి. అవి చిటపటలాడిన తర్వాత తరిగిన ఉల్లిపాయలు మరియు బెల్ పెప్పర్లు వేయండి. మెత్తబడి, కొంచెం కరకరలాడే ఆకృతి ఉండేలా 3-5 minutes పాటు వేయించండి.", "రోల్స్ అసెంబుల్ చేయండి: చపాతీలను గ్రిడిల్‌పై వేడి చేయండి. ప్రతి చపాతీపై గ్రీన్ చట్నీ లేదా పెరుగు స్ప్రెడ్ పలుచని పొరగా రాయండి. మధ్యలో క్రిస్పీ టోఫు మరియు వేయించిన కూరగాయలను గట్టిగా వేయండి.", "చివరి క్రిస్ప్ (ఐచ్ఛికం): చపాతీలను గట్టిగా చుట్టండి. పూర్తయిన రోల్స్‌ను వేడి గ్రిడిల్‌పై తిరిగి ఉంచి, ఒకసారి తిప్పుతూ 1-2 minutes పాటు ఉంచి బయట చివరి క్రిస్పీ ఫినిష్ సాధించండి. వేడిగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:25.767Z"}, {"n": 55, "title": "High-Protein Vegetarian Tofu Sandwich", "title_te": "అధిక ప్రోటీన్ శాఖాహార టోఫు శాండ్‌విచ్", "cat": "Adult", "section": "adult", "emoji": "🥪", "image": "https://thehiddenveggies.com/wp-content/uploads/2026/04/Tofu-BLT-1.jpg", "prep": "—", "cook": "—", "yield": "1", "desc": "Vegan-adaptable | Serves 1", "desc_te": "వీగన్‌గా మార్చుకోవచ్చు | 1 మందికి సరిపోతుంది", "tags": [], "ing": ["Bread & Base", "2 slices sourdough loaf", "Olive oil (for toasting)", "Protein Core", "4–5 slices firm tofu", "Olive oil, salt, and red chili powder (for the marinade)", "Spreads", "1–2 tablespoons sun-dried tomato pesto", "1–2 tablespoons green chutney mayo (prepared by mixing green chutney with mayonnaise)", "Veggies & Toppings", "2–3 slices cheese (or vegan cheese swap)", "3–4 slices tomato", "4–5 slices jalapeño", "1 handful fresh lettuce", "1/4 red onion, thinly sliced", "Fresh lemon juice, salt, and red chili powder (to season the onions)", "Finishing Seasonings", "Garlic and herb seasoning", "Chili flakes"], "ing_te": ["బ్రెడ్ & బేస్", "2 slices సోర్‌డో లోఫ్", "టోస్ట్ చేయడానికి ఆలివ్ ఆయిల్", "ప్రోటీన్ కోర్", "4–5 slices గట్టి టోఫు", "మెరినేడ్ కోసం ఆలివ్ ఆయిల్, ఉప్పు మరియు ఎర్ర మిరప పొడి", "స్ప్రెడ్‌లు", "1–2 tablespoons సన్-డ్రైడ్ టొమాటో పెస్టో", "1–2 tablespoons గ్రీన్ చట్నీ మయో (గ్రీన్ చట్నీని మయోనైస్‌తో కలిపి తయారు చేస్తారు)", "కూరగాయలు & టాపింగ్స్", "2–3 slices చీజ్ (లేదా వీగన్ చీజ్‌తో మార్చుకోవచ్చు)", "3–4 slices టొమాటో", "4–5 slices జలపెనో", "1 handful తాజా లెట్యూస్", "1/4 ఎర్ర ఉల్లిపాయ, సన్నగా తరిగినది", "ఉల్లిపాయలకు రుచి కోసం తాజా నిమ్మరసం, ఉప్పు మరియు ఎర్ర మిరప పొడి", "చివరి మసాలాలు", "వెల్లుల్లి మరియు హెర్బ్ సీజనింగ్", "చిల్లీ ఫ్లేక్స్"], "steps": ["Prep the Spiced Onion Salad In a small bowl, combine the thinly sliced red onion with a pinch of salt, a pinch of red chili powder, and a generous squeeze of fresh lemon juice. Mix well and set aside to soften and marinate while you cook.", "Marinate and Cook the Tofu Toss the firm tofu slices with a drizzle of olive oil, salt, and red chili powder until evenly coated. Heat a griddle or non-stick skillet over medium-high heat. Add the tofu slices and sear until crisp and golden brown on both sides, then remove from heat.", "Toast the Sourdough Drizzle both slices of sourdough loaf with olive oil. Place them onto the hot griddle and toast until crisp and golden brown.", "Mix the Green Chutney Mayo In a small ramekin, stir together your favorite green chutney and mayonnaise until completely smooth, creamy, and pale green.", "Assemble the Sandwich Lay out the toasted sourdough slices. Spread the sun-dried tomato pesto evenly across one slice. Layer the sandwich toppings in order: cheese slices, warm cooked tofu, tomato slices, jalapeño slices, the marinated spiced onion salad, and a handful of lettuce. Spread the fresh green chutney mayo over the second slice of bread.", "Season and Serve Sprinkle the garlic and herb seasoning along with a dash of chili flakes directly over the fillings. Close the sandwich firmly, slice it diagonally in half, and serve immediately while warm.", "Vegan Adaptation: Simply swap out the standard cheese slices for your favorite plant-based cheese and use a vegan mayonnaise base for the green chutney spread to keep the entire meal fully plant-based."], "steps_te": ["మసాలా ఉల్లిపాయ సలాడ్ సిద్ధం చేయండి: చిన్న గిన్నెలో సన్నగా తరిగిన ఎర్ర ఉల్లిపాయను చిటికెడు ఉప్పు, చిటికెడు ఎర్ర మిరప పొడి మరియు గట్టిగా పిండిన తాజా నిమ్మరసంతో కలపండి. బాగా కలిపి, వండేటప్పుడు మెత్తబడి మెరినేట్ అయ్యేలా పక్కన ఉంచండి.", "టోఫును మెరినేట్ చేసి వండండి: గట్టి టోఫు ముక్కలకు కొంచెం ఆలివ్ ఆయిల్, ఉప్పు మరియు ఎర్ర మిరప పొడి సమానంగా పట్టేలా కలపండి. గ్రిడిల్ లేదా నాన్-స్టిక్ పాన్‌ను మీడియం-హై వేడిపై వేడి చేయండి. టోఫు ముక్కలు వేసి రెండు వైపులా క్రిస్పీగా, బంగారు రంగులోకి వచ్చేవరకు వేయించి, వేడి నుంచి తీసేయండి.", "సోర్‌డో టోస్ట్ చేయండి: సోర్‌డో లోఫ్ రెండు ముక్కలపైనా ఆలివ్ ఆయిల్ చిలకరించండి. వేడి గ్రిడిల్‌పై ఉంచి క్రిస్పీగా, బంగారు రంగులోకి వచ్చేవరకు టోస్ట్ చేయండి.", "గ్రీన్ చట్నీ మయో కలపండి: చిన్న రామెకిన్‌లో మీకు నచ్చిన గ్రీన్ చట్నీ మరియు మయోనైస్‌ను పూర్తిగా మృదువుగా, క్రీమీగా, లేత ఆకుపచ్చ రంగులోకి వచ్చేవరకు కలపండి.", "శాండ్‌విచ్ అసెంబుల్ చేయండి: టోస్ట్ చేసిన సోర్‌డో ముక్కలు పరచండి. ఒక ముక్కపై సన్-డ్రైడ్ టొమాటో పెస్టో సమానంగా రాయండి. ఈ క్రమంలో టాపింగ్స్ పరచండి: చీజ్ ముక్కలు, వేడి వండిన టోఫు, టొమాటో ముక్కలు, జలపెనో ముక్కలు, మెరినేట్ చేసిన మసాలా ఉల్లిపాయ సలాడ్ మరియు గుప్పెడు లెట్యూస్. రెండవ బ్రెడ్ ముక్కపై తాజా గ్రీన్ చట్నీ మయో రాయండి.", "మసాలా వేసి వడ్డించండి: ఫిల్లింగ్స్‌పై నేరుగా వెల్లుల్లి మరియు హెర్బ్ సీజనింగ్‌తో పాటు కొంచెం చిల్లీ ఫ్లేక్స్ చల్లండి. శాండ్‌విచ్‌ను గట్టిగా మూసి, వాలుగా సగానికి కత్తిరించి, వేడిగా ఉన్నప్పుడే వెంటనే వడ్డించండి.", "వీగన్ మార్పు: సాధారణ చీజ్ ముక్కలకు బదులుగా మీకు నచ్చిన మొక్కల ఆధారిత చీజ్ వాడి, గ్రీన్ చట్నీ స్ప్రెడ్ కోసం వీగన్ మయోనైస్ బేస్ వాడితే మొత్తం భోజనం పూర్తిగా మొక్కల ఆధారితంగా ఉంటుంది."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:25.609Z"}, {"n": 145, "title": "High-Protein Veggie Egg Muffins V3", "title_te": "హై-ప్రోటీన్ వెజ్జీ ఎగ్ మఫిన్స్ V3", "cat": "Adult", "section": "adult", "emoji": "🍳", "image": "https://cdn.shopify.com/s/files/1/0655/6414/7950/t/11/assets/vegetable-egg-muffins-featured-1691608350131_600x.jpg?v=1691608350", "prep": "—", "cook": "—", "yield": "—", "desc": "A soft, nutrient-dense, and protein-packed finger food perfectly tailored for a 16-month-old toddler. This version explicitly highlights the dual inclusion of cottage cheese for an incredibly soft, melt-in-the-mouth texture, and mild mozzarella cheese for a delicious flavor boost, while staying free of added salt.", "desc_te": "16 నెలల చిన్నారికి సరిగ్గా సరిపోయే మెత్తని, పోషకాలతో నిండిన, ప్రోటీన్ అధికంగా ఉండే ఫింగర్ ఫుడ్. ఈ వెర్షన్‌లో అద్భుతంగా మెత్తని, నోటిలో కరిగే ఆకృతి కోసం కాటేజ్ చీజ్‌ను, రుచికరమైన రుచి పెంపు కోసం మృదువైన మోజారెల్లా చీజ్‌ను రెండింటినీ చేర్చడం ప్రత్యేకంగా హైలైట్ చేయబడింది, అదనపు ఉప్పు లేకుండా.", "tags": [], "ing": ["8 large eggs (whisked very well)", "1/2 cup normal dairy milk (essential for making the eggs fluffier and less rubbery)", "1/2 cup no-salt-added or low-sodium cottage cheese (creamy protein booster)", "1/4 cup mild shredded mozzarella cheese (low-sodium or fresh mozzarella finely shredded is best)", "1 cup spinach, finely chopped (adds iron and fiber)", "1/2 cup carrots, finely grated (supports healthy digestion)", "1/2 cup bell peppers, finely diced", "1/2 tsp turmeric and a pinch of black pepper (anti-inflammatory profile)", "Optional swap: 1/4 cup crumbled paneer can be mixed in with the cheese if desired"], "ing_te": ["8 పెద్ద గుడ్లు (చాలా బాగా గిలకొట్టినవి)", "1/2 cup సాధారణ డైరీ పాలు (గుడ్లు మరింత మెత్తగా, రబ్బరులా కాకుండా ఉండటానికి అవసరం)", "1/2 cup ఉప్పు వేయని లేదా తక్కువ సోడియం ఉన్న కాటేజ్ చీజ్ (క్రీమీ ప్రోటీన్ బూస్టర్)", "1/4 cup మృదువైన తురిమిన మోజారెల్లా చీజ్ (తక్కువ సోడియం లేదా తాజా మోజారెల్లాను సన్నగా తురిమినది ఉత్తమం)", "1 cup పాలకూర, సన్నగా తరిగినది (ఐరన్, ఫైబర్ జోడిస్తుంది)", "1/2 cup క్యారెట్లు, సన్నగా తురిమినవి (ఆరోగ్యకరమైన జీర్ణక్రియకు తోడ్పడతాయి)", "1/2 cup బెల్ పెప్పర్లు, సన్నగా తరిగినవి", "1/2 tsp పసుపు, చిటికెడు నల్ల మిరియాలు (యాంటీ-ఇన్‌ఫ్లమేటరీ ప్రొఫైల్)", "ఐచ్ఛిక మార్పు: కావాలనుకుంటే చీజ్‌తో పాటు 1/4 cup నలిపిన పనీర్ కలపవచ్చు"], "steps": ["Sauté the Vegetables (Moisture Control Step) Heat a small splash of ghee or avocado oil in a pan over medium heat. Quickly sauté the finely chopped spinach, grated carrots, and diced bell peppers for 2 to 3 minutes.", "Why this matters: Sautéing draws out the excess water from the vegetables. This ensures your egg muffins stay firm and don't turn soggy or \"watery\" when stored in the fridge.", "Whisk the Egg and Cheese Base In a large mixing bowl, vigorously whisk the 8 large eggs, 1/2 cup of dairy milk, turmeric, and black pepper together. Whisk in the 1/2 cup of cottage cheese and 1/4 cup of shredded mozzarella cheese until well combined with the egg mixture.", "Combine Ingredients Stir the sautéed vegetables directly into the egg, cottage cheese, and mozzarella mixture, distributing them evenly throughout the liquid.", "Fill the Tin Preheat your oven to 180°C (350°F). Generously grease a 12-cup mini muffin tin with avocado oil or ghee to prevent sticking. Carefully pour or ladle the egg mixture into each cup, filling them about 3/4 of the way full to leave room for expansion.", "Bake Bake at 180°C (350°F) for 18 to 20 minutes. The muffins are done when the centers are fully set to the touch and the tops display a light golden tint.", "The Cool Down Remove the tin from the oven and let the muffins sit undisturbed in the pan for 5 minutes. They will deflate slightly as they cool, making them incredibly easy to pop right out of the tin without tearing."], "steps_te": ["కూరగాయలను వేయించండి (తేమ నియంత్రణ దశ) బాణలిలో చిన్న చుక్క నెయ్యి లేదా అవకాడో నూనెను మధ్యస్థ మంటపై వేడి చేయండి. సన్నగా తరిగిన పాలకూర, తురిమిన క్యారెట్లు, తరిగిన బెల్ పెప్పర్లను 2 to 3 minutes వేగంగా వేయించండి.", "ఇది ఎందుకు ముఖ్యం: వేయించడం వల్ల కూరగాయల్లోని అదనపు నీరు బయటకు వస్తుంది. దీనివల్ల ఎగ్ మఫిన్స్ ఫ్రిజ్‌లో నిల్వ చేసినప్పుడు గట్టిగా ఉండి, మెత్తగా లేదా “నీరుగా” మారవు.", "గుడ్డు, చీజ్ బేస్‌ను గిలకొట్టండి పెద్ద మిక్సింగ్ బౌల్‌లో 8 పెద్ద గుడ్లు, 1/2 cup డైరీ పాలు, పసుపు, నల్ల మిరియాలను గట్టిగా గిలకొట్టండి. 1/2 cup కాటేజ్ చీజ్, 1/4 cup తురిమిన మోజారెల్లా చీజ్‌ను గుడ్డు మిశ్రమంతో బాగా కలిసేవరకు గిలకొట్టండి.", "పదార్థాలను కలపండి వేయించిన కూరగాయలను నేరుగా గుడ్డు, కాటేజ్ చీజ్, మోజారెల్లా మిశ్రమంలో కలపండి, ద్రవంలో సమానంగా పంపిణీ అయ్యేలా.", "టిన్ నింపండి ఓవెన్‌ను 180°C (350°F) వరకు వేడి చేయండి. అంటుకోకుండా 12-cup మినీ మఫిన్ టిన్‌కు అవకాడో నూనె లేదా నెయ్యిని ఉదారంగా పూయండి. గుడ్డు మిశ్రమాన్ని ప్రతి కప్పులో జాగ్రత్తగా పోయండి లేదా గరిటెతో వేయండి, విస్తరణకు చోటు ఉండేలా సుమారు 3/4 వరకు నింపండి.", "బేక్ చేయండి 180°C (350°F) వద్ద 18 to 20 minutes బేక్ చేయండి. మధ్య భాగాలు తాకితే పూర్తిగా గట్టిగా, పైన లేత బంగారు రంగు వచ్చినప్పుడు మఫిన్స్ సిద్ధం.", "చల్లబరచడం ఓవెన్ నుండి టిన్ తీసి, మఫిన్స్‌ను పాన్‌లోనే కదపకుండా 5 minutes ఉంచండి. చల్లబడుతున్నప్పుడు అవి కొంచెం తగ్గుతాయి, దీనివల్ల చిరగకుండా టిన్ నుండి చాలా సులభంగా బయటకు వస్తాయి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.586Z"}, {"n": 76, "title": "Homemade Chicken Biryani", "title_te": "ఇంట్లో తయారుచేసిన చికెన్ బిర్యానీ", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://ministryofcurry.com/wp-content/uploads/2024/06/chicken-biryani-2.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "Line Spacing: 1.25", "desc_te": "లైన్ స్పేసింగ్: 1.25", "tags": [], "ing": ["To make this flavorful biryani, you will need the following ingredients:", "For the Chicken Marinade", "Chicken: 2 lbs (approx. 1 kg) chicken legs and thighs, bone-in and skinless, with deep cuts", "Yogurt: 1 cup plain whole milk yogurt", "Turmeric Powder: 1/2 teaspoon", "Red Chili Powder: 2 teaspoons (adjust to taste)", "Salt: 1.5 teaspoons (or to taste)", "Coriander Powder: 1 teaspoon", "Garam Masala: 1 teaspoon", "Lemon Juice: From 1/2 large lemon", "Ginger-Garlic Paste: 1 tablespoon", "Fried Onions (Birista): 1/2 cup", "Green Chilies: 4-5, slit lengthwise", "Fresh Mint: 1/4 cup, chopped", "Fresh Cilantro: 1/4 cup, chopped", "Ghee: 1 tablespoon", "Whole Spices for Marinade", "Bay Leaf: 2 pieces", "Cinnamon Stick: 1-inch piece", "Cloves: 4-5 pieces", "Cardamom Pods: 3-4 pieces", "Star Anise: 1 piece", "For the Rice", "Basmati Rice: 3 cups, soaked for 30 minutes", "Water: Large pot for boiling", "Whole Spices: Bay leaf, cloves, and cardamom for the boiling water", "Salt: 1 tablespoon (the water should taste like the sea)", "For Assembly and Garnish", "Fried Onions: 1/4 cup", "Fresh Mint and Cilantro: 1/4 cup, chopped", "Food Color/Saffron Milk: A pinch of turmeric or saffron mixed with 2 tablespoons of milk"], "ing_te": ["ఈ రుచికరమైన బిర్యానీ తయారు చేయడానికి మీకు కావలసిన పదార్థాలు:", "చికెన్ మ్యారినేడ్ కోసం", "చికెన్: 2 lbs (approx. 1 kg) ఎముకతో, చర్మం లేని చికెన్ లెగ్స్ మరియు థైస్, లోతుగా కోతలు పెట్టినవి", "పెరుగు: 1 cup సాదా ఫుల్ మిల్క్ పెరుగు", "పసుపు పొడి: 1/2 teaspoon", "కారం పొడి: 2 teaspoons (రుచికి తగ్గట్టు సర్దుకోండి)", "ఉప్పు: 1.5 teaspoons (లేదా రుచికి తగ్గట్టు)", "ధనియాల పొడి: 1 teaspoon", "గరం మసాలా: 1 teaspoon", "నిమ్మరసం: 1/2 పెద్ద నిమ్మకాయ నుండి", "అల్లం-వెల్లుల్లి పేస్ట్: 1 tablespoon", "వేయించిన ఉల్లిపాయలు (బిరిస్తా): 1/2 cup", "పచ్చిమిర్చి: 4-5, పొడవుగా చీల్చినవి", "తాజా పుదీనా: 1/4 cup, తరిగినది", "తాజా కొత్తిమీర: 1/4 cup, తరిగినది", "నెయ్యి: 1 tablespoon", "మ్యారినేడ్ కోసం గరం మసాలా దినుసులు", "బిర్యానీ ఆకు: 2 pieces", "దాల్చినచెక్క: 1-inch ముక్క", "లవంగాలు: 4-5 pieces", "యాలకులు: 3-4 pieces", "స్టార్ ఆనిస్: 1 piece", "అన్నం కోసం", "బాస్మతి బియ్యం: 3 cups, 30 minutes నానబెట్టినవి", "నీరు: మరిగించడానికి పెద్ద పాత్ర", "గరం మసాలా దినుసులు: మరిగే నీటి కోసం బిర్యానీ ఆకు, లవంగాలు మరియు యాలకులు", "ఉప్పు: 1 tablespoon (నీరు సముద్రపు నీటిలా ఉప్పగా ఉండాలి)", "అలంకరణ మరియు పేర్చడం కోసం", "వేయించిన ఉల్లిపాయలు: 1/4 cup", "తాజా పుదీనా మరియు కొత్తిమీర: 1/4 cup, తరిగినవి", "ఫుడ్ కలర్/కుంకుమపువ్వు పాలు: చిటికెడు పసుపు లేదా కుంకుమపువ్వును 2 tablespoons పాలలో కలిపినది"], "steps": ["Step 1: Marinate the Chicken In a large mixing bowl, combine the chicken pieces with turmeric, salt, red chili powder, coriander powder, garam masala, lemon juice, ginger-garlic paste, fried onions, green chilies, mint, cilantro, ghee, and whole spices. Mix thoroughly, ensuring the marinade enters the cuts in the chicken. Add the yogurt and mix again until well combined. For the best flavor, let it marinate for at least 30 minutes (or several hours in the refrigerator).", "Step 2: Prepare the Rice Boil a large pot of water with whole spices and salt. Once boiling, add the soaked basmati rice. Cook until the rice is about 80% done (it should still have a slight bite). Drain the rice completely.", "Step 3: Layering Spread the marinated chicken evenly at the bottom of a large oven-safe tray or heavy-bottomed pot. Sprinkle some fried onions, mint, and cilantro over the raw chicken. Layer the 80% cooked rice evenly over the top.", "Step 4: Final Touches Garnish the top layer of rice with the remaining fried onions, mint, and cilantro. Drizzle the turmeric or saffron milk over the top for color and aroma.", "Step 5: Baking/Cooking Cover the tray or pot tightly with aluminum foil to trap the steam (Dum process). Oven Temperature Cooking Time 475°F (245°C) 45 Minutes 450°F (230°C) 1 Hour Once cooked, let it rest for 10 minutes before opening the foil. Serve hot with raita or salan."], "steps_te": ["స్టెప్ 1: చికెన్‌ను మ్యారినేట్ చేయండి ఒక పెద్ద మిక్సింగ్ బౌల్‌లో చికెన్ ముక్కలను పసుపు, ఉప్పు, కారం పొడి, ధనియాల పొడి, గరం మసాలా, నిమ్మరసం, అల్లం-వెల్లుల్లి పేస్ట్, వేయించిన ఉల్లిపాయలు, పచ్చిమిర్చి, పుదీనా, కొత్తిమీర, నెయ్యి మరియు గరం మసాలా దినుసులతో కలపండి. మ్యారినేడ్ చికెన్‌లోని కోతల్లోకి వెళ్లేలా బాగా కలపండి

. పెరుగు వేసి మళ్లీ బాగా కలిసేవరకు కలపండి. ఉత్తమ రుచి కోసం కనీసం 30 minutes (లేదా ఫ్రిజ్‌లో చాలా గంటలు) మ్యారినేట్ అవ్వనివ్వండి.", "స్టెప్ 2: అన్నం సిద్ధం చేయండి గరం మసాలా దినుసులు మరియు ఉప్పుతో ఒక పెద్ద పాత్ర నీరు మరిగించండి. మరిగిన తర్వాత నానబెట్టిన బాస్మతి బియ్యం వేయండి. అన్నం సుమారు 80% ఉడికేవరకు ఉడికించండి (కొంచెం గట్టిగా ఉండాలి). అన్నాన్ని పూర్తిగా వడకండి.", "స్టెప్ 3: పొరలు పేర్చండి మ్యారినేట్ చేసిన చికెన్‌ను ఒక పెద్ద ఓవెన్-సేఫ్ ట్రే లేదా మందపాటి అడుగు ఉన్న పాత్ర అడుగున సమానంగా పరచండి. పచ్చి చికెన్‌పై కొన్ని వేయించిన ఉల్లిపాయలు, పుదీనా మరియు కొత్తిమీర చల్లండి. పైన 80% ఉడికిన అన్నాన్ని సమానంగా పరచండి.", "స్టెప్ 4: చివరి అలంకరణ అన్నం పై పొరపై మిగిలిన వేయించిన ఉల్లిపాయలు, పుదీనా మరియు కొత్తిమీరతో అలంకరించండి. రంగు మరియు సువాసన కోసం పైన పసుపు లేదా కుంకుమపువ్వు పాలు చల్లండి.", "స్టెప్ 5: బేకింగ్/వండడం ఆవిరి బయటకు పోకుండా (దమ్ ప్రక్రియ) ట్రే లేదా పాత్రను అల్యూమినియం ఫాయిల్‌తో గట్టిగా మూసివేయండి. ఓవెన్ ఉష్ణోగ్రత వండే సమయం 475°F (245°C) 45 Minutes 450°F (230°C) 1 Hour వండిన తర్వాత ఫాయిల్ తెరవడానికి ముందు 10 minutes విశ్రాంతి ఇవ్వండి. రైతా లేదా సాలన్‌తో వేడిగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:06:17.493Z"}, {"n": 4, "title": "Homemade Protein Yogurt Drinks (Chobani-style)", "title_te": "ఇంట్లో తయారు చేసిన ప్రోటీన్ పెరుగు పానీయాలు (చోబానీ తరహా)", "cat": "Adult", "section": "adult", "emoji": "🍿", "image": "https://unhurriedhomemaker.com/wp-content/uploads/2023/03/6228001C-ED1C-4BAA-94F9-88CC54D32CCD-768x768.jpeg", "prep": "—", "cook": "—", "yield": "about 2 jars (amounts make 4 small bottles in the video)", "desc": "Blended berry Greek-yogurt drink bottled for grab-and-go high-protein breakfasts, made to replace pricey store versions.", "desc_te": "ఖరీదైన స్టోర్ పానీయాలకు బదులుగా తయారు చేసిన, సీసాల్లో నింపి ఎక్కడికైనా తీసుకెళ్లగలిగే, బెర్రీ గ్రీక్ పెరుగు పానీయం; అధిక ప్రోటీన్ అల్పాహారం కోసం.", "tags": ["vegetarian", "contains dairy", "breakfast", "snack", "quick"], "ing": ["3/4 cup plain nonfat Greek yogurt", "Just over 1/2 cup milk (fat-free; higher-fat milk adds protein)", "2 tsp monk fruit sweetener", "1 tsp chia seeds", "1/4 tsp vanilla extract", "1 tsp lemon juice", "3/4 cup frozen berry medley"], "ing_te": ["3/4 cup సాదా నాన్‌ఫ్యాట్ గ్రీక్ పెరుగు", "1/2 cup కంటే కొంచెం ఎక్కువ పాలు (ఫ్యాట్ లేనివి; ఎక్కువ ఫ్యాట్ ఉన్న పాలు ప్రోటీన్‌ను పెంచుతాయి)", "2 tsp మాంక్ ఫ్రూట్ స్వీటెనర్", "1 tsp చియా గింజలు", "1/4 tsp వనిల్లా ఎక్స్‌ట్రాక్ట్", "1 tsp నిమ్మరసం", "3/4 cup ఫ్రోజెన్ బెర్రీ మెడ్లీ"], "steps": ["Add the yogurt, milk, sweetener, chia seeds, vanilla and lemon juice to a blender.", "Add the frozen berries and blend until smooth and pink-purple.", "Pour through a funnel into small bottles, seal and refrigerate.", "Optional tweaks from the creator: add a banana for sweetness, a handful of spinach, or a scoop of vanilla protein powder; thin with more milk or water plus fresh fruit for a drinkable consistency."], "steps_te": ["పెరుగు, పాలు, స్వీటెనర్, చియా గింజలు, వనిల్లా, నిమ్మరసాన్ని బ్లెండర్‌లో వేయండి.", "ఫ్రోజెన్ బెర్రీలు వేసి మృదువుగా, పింక్-పర్పుల్ రంగు వచ్చేవరకు బ్లెండ్ చేయండి.", "గరాటు ద్వారా చిన్న సీసాల్లో పోసి, మూసి, ఫ్రిజ్‌లో ఉంచండి.", "తయారీదారు సూచించిన ఐచ్ఛిక మార్పులు: తీపి కోసం అరటిపండు, గుప్పెడు పాలకూర, లేదా ఒక స్కూప్ వనిల్లా ప్రోటీన్ పౌడర్ కలపండి; తాగడానికి వీలుగా మరికొంత పాలు లేదా నీరు, తాజా పండ్లు కలిపి పలచబరచండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:02:39.203Z"}, {"n": 21, "title": "Iffa Chicken", "title_te": "ఇఫ్ఫా చికెన్", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://www.foodvlove.com/wp-content/uploads/2025/12/Pic-10-1.jpg", "prep": "not stated (marinade while sauce is made)", "cook": "about 13-15 minutes", "yield": "not stated (whole dish)", "desc": "Yogurt-marinated chicken thighs finished with a creamy blended egg-white, garlic and cheese sauce; whole dish about 835 kcal and 123g protein.", "desc_te": "పెరుగులో మ్యారినేట్ చేసిన చికెన్ తొడలపై క్రీమీగా బ్లెండ్ చేసిన గుడ్డు తెల్లసొన, వెల్లుల్లి మరియు చీజ్ సాస్ వేసి వడ్డించే వంటకం; మొత్తం వంటకంలో సుమారు 835 kcal మరియు 123g ప్రోటీన్ ఉంటుంది.", "tags": ["non-vegetarian", "contains dairy", "dinner", "lunch"], "ing": ["125 g Greek yogurt", "1 tbsp ginger garlic paste", "1 tsp Kashmiri chilli powder", "1/4 tsp turmeric powder", "1 tsp coriander powder", "1/2 tsp pepper powder", "1/2 tsp garam masala", "1 tsp salt", "1 tsp vinegar", "500 g boneless skinless chicken thighs", "2 boiled egg whites", "2 garlic cloves", "1 cheese slice (25 g)", "1 tsp vinegar (for sauce)", "80 ml skim milk", "1/4 tsp salt (for sauce)", "1/2 tsp sugar", "1 tsp oil", "Chopped coriander leaves"], "ing_te": ["125 g గ్రీక్ పెరుగు", "1 tbsp అల్లం వెల్లుల్లి పేస్ట్", "1 tsp కాశ్మీరీ కారం పొడి", "1/4 tsp పసుపు పొడి", "1 tsp ధనియాల పొడి", "1/2 tsp మిరియాల పొడి", "1/2 tsp గరం మసాలా", "1 tsp ఉప్పు", "1 tsp వెనిగర్", "500 g ఎముకలు లేని, చర్మం లేని చికెన్ తొడలు", "2 ఉడికించిన గుడ్డు తెల్లసొనలు", "2 వెల్లుల్లి రెబ్బలు", "1 చీజ్ స్లైస్ (25 g)", "1 tsp వెనిగర్ (సాస్ కోసం)", "80 ml స్కిమ్ పాలు", "1/4 tsp ఉప్పు (సాస్ కోసం)", "1/2 tsp చక్కెర", "1 tsp నూనె", "తరిగిన కొత్తిమీర ఆకులు"], "steps": ["Mix the Greek yogurt, ginger garlic paste, Kashmiri chilli powder, turmeric, coriander powder, pepper powder, garam masala, salt and vinegar in a bowl.", "Add the chicken thighs, mix well and let marinate while the sauce is made.", "Blend the boiled egg whites, garlic, cheese slice, vinegar, skim milk, salt and sugar and set aside.", "Heat 1 tsp oil in a pan on high heat and cook the marinated chicken about 4-5 minutes on each side, then a bit longer till the gravy thickens (3-5 more minutes).", "Drizzle the creamy sauce all over, bring the flame to low, cover and cook about 3 minutes.", "Sprinkle chopped coriander leaves and serve."], "steps_te": ["ఒక గిన్నెలో గ్రీక్ పెరుగు, అల్లం వెల్లుల్లి పేస్ట్, కాశ్మీరీ కారం పొడి, పసుపు, ధనియాల పొడి, మిరియాల పొడి, గరం మసాలా, ఉప్పు మరియు వెనిగర్ కలపండి.", "చికెన్ తొడలు వేసి బాగా కలిపి, సాస్ తయారుచేసేంత వరకు మ్యారినేట్ అవనివ్వండి.", "ఉడికించిన గుడ్డు తెల్లసొనలు, వెల్లుల్లి, చీజ్ స్లైస్, వెనిగర్, స్కిమ్ పాలు, ఉప్పు మరియు చక్కెరను బ్లెండ్ చేసి పక్కన పెట్టండి.", "ఒక పాన్‌లో 1 tsp నూనెను అధిక మంటపై వేడి చేసి, మ్యారినేట్ చేసిన చికెన్‌ను ప్రతి వైపు సుమారు 4-5 నిమిషాలు, ఆ తర్వాత గ్రేవీ చిక్కబడే వరకు మరో 3-5 నిమిషాలు ఉడికించండి.", "క్రీమీ సాస్‌ను పైన చల్లి, మంటను తగ్గించి, మూత పెట్టి సుమారు 3 నిమిషాలు ఉడికించండి.", "తరిగిన కొత్తిమీర ఆకులు చల్లి వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:15.532Z"}, {"n": 72, "title": "Instant Jowar Dosa", "title_te": "ఇన్‌స్టంట్ జొన్న దోస", "cat": "Adult", "section": "adult", "emoji": "🥗", "image": "https://www.spiceupthecurry.com/wp-content/uploads/2024/03/jowar-dosa-1.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "This crispy, instant dosa is a healthy, gluten-free breakfast option made with sorghum (jowar) flour. It mimics the texture of a traditional Rava Dosa but uses millet for added nutrition.", "desc_te": "ఈ కరకరలాడే ఇన్‌స్టంట్ దోస జొన్న పిండితో చేసిన ఆరోగ్యకరమైన, గ్లూటెన్-రహిత అల్పాహారం. ఇది సాంప్రదాయ రవా దోస ఆకృతిని పోలి ఉంటుంది కానీ ఎక్కువ పోషణ కోసం మిల్లెట్‌ను వాడుతుంది.", "tags": [], "ing": ["Dosa Batter", "Ingredient", "Quantity"], "ing_te": ["దోస పిండి", "పదార్థం", "పరిమాణం"], "steps": ["Prepare the Batter In a large mixing bowl, combine the jowar flour, rava, and rice flour. Add the salt, crushed pepper, green chillies, curry leaves, and cumin seeds. Gradually add 3 cups of water, whisking continuously to ensure there are no lumps. The batter should have a thin, watery consistency.", "Resting Period Cover the bowl and let the batter rest for 10–15 minutes. After resting, stir the batter. If the rava has thickened the mixture, add a small amount of water to return it to a pouring consistency. Stir in the fresh coriander.", "Cooking the Dosa Heat a non-stick pan or tawa on high heat. Test the heat by sprinkling water; it should sizzle and evaporate instantly. Spread a thin layer of chopped onions directly onto the hot pan. Stir the batter thoroughly (as the flour tends to settle at the bottom). Pour a ladleful of batter starting from the edges and moving toward the center. Do not spread it like a regular dosa; let the natural holes form for a lacey texture. Drizzle ghee around the edges. Reduce the flame to low and cook for 4–5 minutes until the edges are golden brown and crispy. Carefully fold and serve hot. Shopping List Produce Fresh Coriander Curry Leaves Green Chillies Onions Ginger (for optional chutney) Fresh Mint (for optional chutney) Lemon Pantry & Dry Goods Jowar Flour (Sorghum) Rava (Upma Semolina) Rice Flour Peanuts Cumin Seeds Black Peppercorns Salt Sugar Coconut (Fresh or Desiccated) Dairy/Fats Ghee"], "steps_te": ["పిండి సిద్ధం చేయండి ఒక పెద్ద మిక్సింగ్ బౌల్‌లో జొన్న పిండి, రవా మరియు బియ్యం పిండి కలపండి. ఉప్పు, నలిపిన మిరియాలు, పచ్చిమిర్చి, కరివేపాకు మరియు జీలకర్ర వేయండి. క్రమంగా 3 cups నీరు వేస్తూ గడ్డలు లేకుండా నిరంతరం కలపండి. పిండి సన్నని, నీళ్లలాంటి స్థిరత్వంతో ఉండాలి.", "నానబెట్టే సమయం గిన్నెను మూసి పిండిని 10–15 minutes నాననివ్వండి. నానిన తర్వాత పిండిని కలపండి. రవా మిశ్రమాన్ని చిక్కగా చేసి ఉంటే, పోసే స్థిరత్వం వచ్చేలా కొద్దిగా నీరు కలపండి. తాజా కొత్తిమీర కలపండి.", "దోస వండడం నాన్-స్టిక్ పాన్ లేదా తవాను అధిక మంటపై వేడి చేయండి. నీరు చల్లి వేడిని పరీక్షించండి; అది చిటపటలాడి వెంటనే ఆవిరైపోవాలి. తరిగిన ఉల్లిపాయల సన్నని పొరను నేరుగా వేడి పాన్‌పై పరచండి. పిండిని బాగా కలపండి (పిండి అడుగున కూరుకుపోతుంది కాబట్టి). అంచుల నుండి మధ్య వైపుగా ఒక గరిటెడు పిండి పోయండి. సాధారణ దోసలా పరచకండి; లేస్ లాంటి ఆకృతి కోసం సహజంగా రంధ్రాలు ఏర్పడనివ్వండి. అంచుల చుట్టూ నెయ్యి చల్లండి. మంటను తక్కువకు తగ్గించి అంచులు బంగారు గోధుమ రంగులో, కరకరలాడేవరకు 4–5 minutes వండండి. జాగ్రత్తగా మడిచి వేడిగా వడ్డించండి. షాపింగ్ జాబితా కూరగాయలు తాజా కొత్తిమీర కరివేపాకు పచ్చిమిర్చి ఉల్లిపాయలు అల్లం (ఐచ్ఛిక చట్నీ కోసం) తాజా పుదీనా (ఐచ్ఛిక చట్నీ కోసం) నిమ్మకాయ ప్యాంట్రీ & డ్రై గూడ్స్ జొన్న పిండి (సోర్గమ్) రవా (ఉప్మా సెమోలినా) బియ్యం పిండి వేరుశనగలు జీలకర్ర నల్ల మిరియాలు ఉప్పు చక్కెర కొబ్బరి (తాజా లేదా ఎండినది) డైరీ/కొవ్వులు నెయ్యి"], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:06:17.365Z"}, {"n": 20, "title": "Kadai Chicken (Dhaba-style)", "title_te": "కడాయ్ చికెన్ (ధాబా శైలి)", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://d3sftlgbtusmnv.cloudfront.net/blog/wp-content/uploads/2024/08/Chicken-Kadai.jpg", "prep": "30 minutes to 1 hour (marinade; overnight ideal)", "cook": "—", "yield": "6 (about 300 g each)", "desc": "Homemade dhaba-style kadai chicken with a freshly roasted kadai masala; 6 servings, about 270 kcal and 26g protein per serving.", "desc_te": "తాజాగా వేయించిన కడాయ్ మసాలాతో చేసిన ఇంట్లో తయారుచేసిన ధాబా శైలి కడాయ్ చికెన్; 6 servings, about 270 kcal and 26g protein per serving.", "tags": ["non-vegetarian", "contains dairy", "dinner", "lunch"], "ing": ["1 kg bone-in chicken", "100 g curd", "2 tbsp ginger-garlic paste", "2 tsp Kashmiri chilli powder", "1 tsp turmeric", "1 tsp coriander powder", "1 tsp garam masala", "2 tsp lemon juice", "Salt to taste", "1 tsp mustard oil", "2 tbsp coriander seeds", "1 tsp cumin seeds", "1 tsp fennel seeds", "1 tsp peppercorns", "5-6 dried red chillies", "1 tbsp ghee", "1 bay leaf", "1 inch cinnamon", "1 black cardamom", "2 green cardamom", "2 medium onions, chopped", "1 tbsp garlic paste", "250 g tomato puree", "Hot water as needed", "1 tsp ghee (to finish)", "1 large onion, cubed", "1 capsicum, cubed", "Salt", "50 ml cream (diluted with water) or half-and-half", "1 tsp kasuri methi", "4-5 slit green chillies", "1/2 inch ginger julienne", "1 tbsp chopped coriander leaves"], "ing_te": ["1 kg ఎముకతో ఉన్న చికెన్", "100 g పెరుగు", "2 tbsp అల్లం-వెల్లుల్లి పేస్ట్", "2 tsp కాశ్మీరీ కారం పొడి", "1 tsp పసుపు", "1 tsp ధనియాల పొడి", "1 tsp గరం మసాలా", "2 tsp నిమ్మరసం", "రుచికి తగినంత ఉప్పు", "1 tsp ఆవ నూనె", "2 tbsp ధనియాలు", "1 tsp జీలకర్ర", "1 tsp సోంపు గింజలు", "1 tsp మిరియాలు", "5-6 ఎండబెట్టిన ఎర్ర మిరపకాయలు", "1 tbsp నెయ్యి", "1 బిర్యానీ ఆకు (బే లీఫ్)", "1 inch దాల్చినచెక్క", "1 నల్ల ఏలకు", "2 పచ్చ ఏలకులు", "2 మధ్యస్థ ఉల్లిపాయలు, తరిగినవి", "1 tbsp వెల్లుల్లి పేస్ట్", "250 g టమోటా ప్యూరీ", "అవసరమైనంత వేడి నీరు", "1 tsp నెయ్యి (ముగింపుకు)", "1 పెద్ద ఉల్లిపాయ, చతురస్ర ముక్కలుగా చేసినది", "1 క్యాప్సికమ్, చతురస్ర ముక్కలుగా చేసినది", "ఉప్పు", "50 ml క్రీమ్ (నీటితో పలచగా చేసినది) లేదా హాఫ్-అండ్-హాఫ్", "1 tsp కసూరి మేథీ", "4-5 చీల్చిన పచ్చి మిరపకాయలు", "1/2 inch అల్లం, సన్నని పొడవాటి ముక్కలు (జూలియన్)", "1 tbsp తరిగిన కొత్తిమీర ఆకులు"], "steps": ["Marinate the chicken with curd, ginger-garlic paste, Kashmiri chilli powder, turmeric, coriander powder, garam masala, lemon juice, salt and mustard oil; rest at least 30 minutes to 1 hour, overnight ideal.", "Dry roast the coriander seeds, cumin, fennel, peppercorns and dried red chillies; crush to a coarse powder and set aside.", "Heat 1 tbsp ghee, add the bay leaf, cinnamon, black and green cardamom.", "Add the chopped onions and garlic paste and cook till golden brown.", "Add the kadai masala, then the tomato puree; cook till the raw smell goes.", "Add the marinated chicken and a little hot water; cover and cook till the chicken is done and the gravy thickens.", "Separately, on high heat with very little ghee, stir-fry the onion and capsicum cubes with a pinch of salt till just charred; fold into the gravy.", "Finish with cream, kasuri methi, slit green chillies, ginger julienne and coriander; serve hot."], "steps_te": ["చికెన్‌ను పెరుగు, అల్లం-వెల్లుల్లి పేస్ట్, కాశ్మీరీ కారం పొడి, పసుపు, ధనియాల పొడి, గరం మసాలా, నిమ్మరసం, ఉప్పు మరియు ఆవ నూనెతో మెరినేట్ చేయండి; కనీసం 30 minutes నుండి 1 hour వరకు, రాత్రంతా ఉంచడం ఉత్తమం.", "ధనియాలు, జీలకర్ర, సోంపు, మిరియాలు మరియు ఎండబెట్టిన ఎర్ర మిరపకాయలను పొడిగా వేయించి, ముతక పొడిగా నలిపి పక్కన పెట్టండి.", "1 tbsp నెయ్యిని వేడి చేసి బిర్యానీ ఆకు, దాల్చినచెక్క, నల్ల మరియు పచ్చ ఏలకులు వేయండి.", "తరిగిన ఉల్లిపాయలు మరియు వెల్లుల్లి పేస్ట్ వేసి బంగారు రంగులోకి వచ్చేవరకు ఉడికించండి.", "కడాయ్ మసాలా వేసి, ఆ తర్వాత టమోటా ప్యూరీ వేసి, పచ్చి వాసన పోయేవరకు ఉడికించండి.", "మెరినేట్ చేసిన చికెన్ మరియు కొద్దిగా వేడి నీరు వేసి, మూత పెట్టి చికెన్ ఉడికి, గ్రేవీ చిక్కబడేవరకు ఉడికించండి.", "విడిగా, అధిక మంటపై చాలా తక్కువ నెయ్యితో ఉల్లిపాయ మరియు క్యాప్సికమ్ ముక్కలను చిటికెడు ఉప్పుతో కొద్దిగా కాలినట్లు అయ్యేవరకు వేయించి, గ్రేవీలో కలపండి.", "క్రీమ్, కసూరి మేథీ, చీల్చిన పచ్చి మిరపకాయలు, అల్లం జూలియన్ మరియు కొత్తిమీరతో ముగించి వేడిగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:15.492Z"}, {"n": 136, "title": "Kaija’s Nut-Butter-Free Sweet Potato Brownies", "title_te": "కైజా నట్-బటర్-ఫ్రీ స్వీట్ పొటాటో బ్రౌనీలు", "cat": "Adult", "section": "adult", "emoji": "🥘", "image": "https://therealfooddietitians.com/wp-content/uploads/2016/10/Sweet-Potato-Brownies-016.jpg", "prep": "15 minutes (plus ~50 minutes for roasting sweet potatoes)", "cook": "—", "yield": "8x8 baking pan (~9–12 brownies)", "desc": "Bake Time: 30–35 minutes", "desc_te": "బేక్ సమయం: 30–35 minutes", "tags": [], "ing": ["1 cup mashed sweet potatoes (roast at 400°F for 50 minutes for extra sweetness)", "3 eggs", "1/2 cup maple syrup", "1/4 cup honey", "1 tsp vanilla extract", "3 tbsp cacao powder (such as Navitas Organics)", "1/4 cup + 2 tbsp oat flour", "1/4 tsp salt", "1 tsp baking soda", "1/2 cup dark chocolate chips (+ extra for sprinkling on top)"], "ing_te": ["1 cup మెత్తగా చేసిన చిలగడదుంపలు (అదనపు తీపి కోసం 400°F వద్ద 50 minutes రోస్ట్ చేయండి)", "3 గుడ్లు", "1/2 cup మేపుల్ సిరప్", "1/4 cup తేనె", "1 tsp వెనిల్లా ఎక్స్‌ట్రాక్ట్", "3 tbsp కాకో పౌడర్ (ఉదాహరణకు నవిటాస్ ఆర్గానిక్స్)", "1/4 cup + 2 tbsp ఓట్ పిండి", "1/4 tsp ఉప్పు", "1 tsp బేకింగ్ సోడా", "1/2 cup డార్క్ చాక్లెట్ చిప్స్ (+ పైన చల్లడానికి అదనంగా)"], "steps": ["Prep: Preheat oven to 350°F (175°C). Line an 8x8 baking dish with parchment paper.", "Wet Ingredients: In a large bowl, mash the roasted sweet potatoes. Whisk in the eggs, maple syrup, honey, and vanilla until smooth and thoroughly combined.", "Dry Ingredients: Add the cacao powder, oat flour, salt, and baking soda. Stir with a wooden spoon or spatula until combined.", "Fold in Chocolate: Gently fold in 1/2 cup dark chocolate chips.", "Bake: Pour the batter into the prepared dish and sprinkle additional chocolate chips evenly on top. Bake for 30–35 minutes — pull out when still slightly underdone for a fudgy center.", "Serve: Slice and enjoy warm for a rich, fudgy texture. Notes Sweet potatoes and cacao are great for the luteal phase, making this recipe cycle-syncing friendly. It is also an ideal alternative for anyone sensitive to nut butter."], "steps_te": ["సిద్ధం చేయండి: ఓవెన్‌ను 350°F (175°C) వరకు వేడి చేయండి. 8x8 బేకింగ్ డిష్‌కు పార్చ్మెంట్ పేపర్ పరచండి.", "తడి పదార్థాలు: పెద్ద గిన్నెలో రోస్ట్ చేసిన చిలగడదుంపలను మెత్తగా చేయండి. గుడ్లు, మేపుల్ సిరప్, తేనె, వెనిల్లాను మృదువుగా, పూర్తిగా కలిసేవరకు గిలకొట్టండి.", "పొడి పదార్థాలు: కాకో పౌడర్, ఓట్ పిండి, ఉప్పు, బేకింగ్ సోడా వేయండి. చెక్క గరిటె లేదా స్పాటులాతో కలిసేవరకు కలపండి.", "చాక్లెట్ కలపండి: 1/2 cup డార్క్ చాక్లెట్ చిప్స్‌ను మెల్లగా కలపండి.", "బేక్ చేయండి: పిండిని సిద్ధం చేసిన డిష్‌లో పోసి, పైన అదనపు చాక్లెట్ చిప్స్‌ను సమానంగా చల్లండి. 30–35 minutes బేక్ చేయండి — ఫడ్జీ మధ్య భాగం కోసం కొంచెం ముందే తీయండి.", "వడ్డించండి: గొప్ప, ఫడ్జీ ఆకృతి కోసం వేడిగా ముక్కలు చేసి ఆస్వాదించండి. గమనికలు: చిలగడదుంపలు, కాకో లూటియల్ దశకు గొప్పవి, దీనివల్ల ఈ రెసిపీ సైకిల్-సింకింగ్‌కు అనుకూలం. నట్ బటర్‌కు సున్నితంగా ఉండే వారికి ఇది అనువైన ప్రత్యామ్నాయం కూడా."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.280Z"}, {"n": 2, "title": "Khatta Mug", "title_te": "ఖట్టా మూగ్", "cat": "Adult", "section": "adult", "emoji": "🍲", "image": "https://aahaaramonline.com/wp-content/uploads/2019/05/Khatta_Mug_Gujarat.jpg", "prep": "not stated", "cook": "Instant Pot 10 minutes on High Pressure plus natural release, then simmer 10-15 minutes", "yield": "not stated", "desc": "A savory and sour Gujarati dal made with yogurt. Comforting, hearty and simple.", "desc_te": "పెరుగుతో చేసిన రుచికరమైన, పుల్లని గుజరాతీ పప్పు. ఓదార్పునిచ్చే, కడుపు నిండే, సులభమైన వంటకం.", "tags": ["vegetarian", "contains dairy", "lunch", "dinner"], "ing": ["1 cup rinsed whole green moong dal", "1 tsp salt", "2.5 cups water", "1/8 tsp turmeric powder", "1/2 cup Greek or regular yogurt", "1/2 cup water", "2 tbsp besan", "1.5 tbsp ghee", "1 tsp mustard seeds", "2 tsp cumin seeds", "2 finely chopped green chilis", "6 curry leaves", "1/4 tsp turmeric powder", "1/2 tsp red chili powder", "1 tsp finely grated ginger", "1 tbsp chopped garlic", "1/2 tsp salt", "1/2 tsp coriander powder", "1/4 tsp garam masala"], "ing_te": ["1 cup కడిగిన పచ్చి పెసర పప్పు (whole green moong dal)", "1 tsp ఉప్పు", "2.5 cups నీరు", "1/8 tsp పసుపు పొడి", "1/2 cup గ్రీక్ లేదా సాధారణ పెరుగు", "1/2 cup నీరు", "2 tbsp శనగ పిండి (besan)", "1.5 tbsp నెయ్యి", "1 tsp ఆవాలు", "2 tsp జీలకర్ర", "2 సన్నగా తరిగిన పచ్చి మిరపకాయలు", "6 కరివేపాకు ఆకులు", "1/4 tsp పసుపు పొడి", "1/2 tsp కారం పొడి", "1 tsp సన్నగా తురిమిన అల్లం", "1 tbsp తరిగిన వెల్లుల్లి", "1/2 tsp ఉప్పు", "1/2 tsp ధనియాల పొడి", "1/4 tsp గరం మసాలా"], "steps": ["In an Instant Pot combine rinsed moong dal with 1 tsp salt, 2.5 cups water and 1/8 tsp turmeric; set for 10 minutes on High Pressure and let it naturally release.", "In a mixing bowl whisk together yogurt, 1/2 cup water and besan.", "Heat ghee in a large pot over medium heat; once hot, add mustard seeds; when they pop add cumin seeds, green chilis, curry leaves, turmeric powder and red chili powder; swirl so it does not brown.", "Add ginger and garlic and cook for a couple minutes, then add the yogurt-besan mixture and cook over a low flame for about 5 minutes while stirring.", "Once slightly thickened, add the cooked moong dal along with salt, coriander powder and garam masala; simmer gently for about 10-15 minutes on low heat.", "Remove from heat, taste and adjust salt or spice as needed; serve with roti and raw onion salad, or with rice, extra ghee and papad."], "steps_te": ["Instant Pot లో కడిగిన పెసర పప్పును 1 tsp ఉప్పు, 2.5 cups నీరు, 1/8 tsp పసుపుతో కలపండి; High Pressure పై 10 minutes పెట్టి, సహజంగా విడుదల కానివ్వండి.", "ఒక మిక్సింగ్ గిన్నెలో పెరుగు, 1/2 cup నీరు, శనగ పిండిని గిలకొట్టండి.", "పెద్ద పాత్రలో మీడియం మంటపై నెయ్యి వేడి చేయండి; వేడెక్కిన తర్వాత ఆవాలు వేయండి; అవి చిటపటలాడినప్పుడు జీలకర్ర, పచ్చి మిరపకాయలు, కరివేపాకు, పసుపు పొడి, కారం పొడి వేయండి; గోధుమ రంగులోకి మారకుండా తిప్పండి.", "అల్లం, వెల్లుల్లి వేసి రెండు నిమిషాలు వేయించండి, తర్వాత పెరుగు-శనగ పిండి మిశ్రమం వేసి తక్కువ మంటపై కలుపుతూ సుమారు 5 minutes ఉడికించండి.", "కొద్దిగా చిక్కబడిన తర్వాత ఉడికిన పెసర పప్పుతో పాటు ఉప్పు, ధనియాల పొడి, గరం మసాలా వేసి తక్కువ మంటపై సుమారు 10-15 minutes మెల్లగా మరిగించండి.", "మంట నుండి తీసి, రుచి చూసి అవసరమైతే ఉప్పు లేదా కారం సర్దండి; రోటీ, పచ్చి ఉల్లిపాయ సలాడ్‌తో లేదా అన్నంతో, అదనపు నెయ్యి, పాపడ్‌తో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:01:28.276Z"}, {"n": 71, "title": "Loaded Triple-Layer Burrito", "title_te": "లోడెడ్ ట్రిపుల్-లేయర్ బురిటో", "cat": "Adult", "section": "adult", "emoji": "🍲", "image": "https://img.cdn4dd.com/cdn-cgi/image/fit=contain,width=1200,height=672,format=auto/https://doordash-static.s3.amazonaws.com/media/photos/35f80d94-6ec0-447e-b45f-44a8dac48a30-retina-large.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "This high-protein, loaded burrito features three distinct layers: a fresh salad mix, roasted paneer and vegetables, and creamy Mexican-style mashed beans.", "desc_te": "ఈ హై-ప్రోటీన్, లోడెడ్ బురిటోలో మూడు విభిన్న పొరలు ఉంటాయి: తాజా సలాడ్ మిక్స్, వేయించిన పనీర్ మరియు కూరగాయలు, మరియు క్రీమీ మెక్సికన్ శైలి మెదిపిన బీన్స్.", "tags": [], "ing": ["1 chopped onion", "½ cup boiled corn", "1 chopped tomato", "1 chopped cucumber", "A handful of chopped lettuce", "Seasoning: salt, pepper, ½ tsp lemon juice, 2 tbsp chopped green coriander leaves, and 1 tsp olive oil", "Toss all ingredients together in a bowl and set aside.", "200g low-fat paneer (cut into strips)", "1 cup chopped bell pepper", "2 par-boiled potatoes (cut into cubes)", "Marinade: 1 tsp paprika, 1 tsp cumin powder, ½ tsp coriander powder, ½ tsp garlic powder, ½ tsp oregano, salt, and 1 tbsp oil", "Mix thoroughly and bake or air-fry at 200°C for 10–12 minutes until roasted and slightly charred.", "1 cup boiled rajma", "2 tbsp water", "Seasoning: 1 tsp chili powder, 1 tsp cumin, ½ tsp smoked paprika, ½ tsp garlic powder, and salt", "Add rajma to a pan and mash slightly while cooking. Add water and seasonings, then cook for 3–4 minutes until thick and creamy."], "ing_te": ["1 తరిగిన ఉల్లిపాయ", "½ cup ఉడికించిన మొక్కజొన్న", "1 తరిగిన టమాటా", "1 తరిగిన దోసకాయ", "గుప్పెడు తరిగిన లెట్యూస్", "సీజనింగ్: ఉప్పు, మిరియాలు, ½ tsp నిమ్మరసం, 2 tbsp తరిగిన పచ్చి కొత్తిమీర ఆకులు, మరియు 1 tsp ఆలివ్ నూనె", "అన్ని పదార్థాలను ఒక గిన్నెలో కలిపి పక్కన పెట్టండి.", "200g తక్కువ కొవ్వు పనీర్ (స్ట్రిప్స్‌గా కోసినది)", "1 cup తరిగిన బెల్ పెప్పర్", "2 సగం ఉడికించిన బంగాళాదుంపలు (క్యూబ్స్‌గా కోసినవి)", "మ్యారినేడ్: 1 tsp పప్రికా, 1 tsp జీలకర్ర పొడి, ½ tsp ధనియాల పొడి, ½ tsp వెల్లుల్లి పొడి, ½ tsp ఒరెగానో, ఉప్పు, మరియు 1 tbsp నూనె", "బాగా కలిపి వేయించి కొంచెం కాలేవరకు 200°C వద్ద 10–12 minutes బేక్ లేదా ఎయిర్-ఫ్రై చేయండి.", "1 cup ఉడికించిన రాజ్మా", "2 tbsp నీరు", "సీజనింగ్: 1 tsp చిల్లీ పౌడర్, 1 tsp జీలకర్ర, ½ tsp స్మోక్డ్ పప్రికా, ½ tsp వెల్లుల్లి పొడి, మరియు ఉప్పు", "రాజ్మాను పాన్‌లో వేసి వండుతూ కొద్దిగా మెదపండి. నీరు మరియు మసాలాలు వేసి, చిక్కగా, క్రీమీగా అయ్యేవరకు 3–4 minutes వండండి."], "steps": ["Spread 1 tbsp yogurt chipotle sauce on a tortilla base.", "Add a generous spoonful of the Fresh Mix Salad.", "Add 2–3 tbsp of the Baked Paneer-Veg Filling.", "Top with 2 tbsp of the Mashed Rajma.", "Fold the sides and roll tightly.", "Toast on a pan for 1–2 minutes until golden and crispy on both sides."], "steps_te": ["టోర్టిల్లా బేస్‌పై 1 tbsp పెరుగు చిపోట్లే సాస్ పరచండి.", "ఫ్రెష్ మిక్స్ సలాడ్‌ను గరిటెడు వేయండి.", "2–3 tbsp బేక్డ్ పనీర్-వెజ్ ఫిల్లింగ్ వేయండి.", "పైన 2 tbsp మెదిపిన రాజ్మా వేయండి.", "పక్కలు మడిచి గట్టిగా చుట్టండి.", "రెండు వైపులా బంగారు రంగులో, కరకరలాడేవరకు పాన్‌పై 1–2 minutes టోస్ట్ చేయండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:06:17.279Z"}, {"n": 7, "title": "Marry Me Tofu", "title_te": "మ్యారీ మీ టోఫు", "cat": "Adult", "section": "adult", "emoji": "🍢", "image": "https://fullofplants.com/wp-content/uploads/2025/09/tasty-marry-me-tofu-vegan-dish-with-cashew-cream-15.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "Crispy air-fried tofu in a creamy, garlicky tomato sauce with melted mozzarella, about 43g protein per serving.", "desc_te": "కరకరలాడే ఎయిర్ ఫ్రైడ్ టోఫు, క్రీమీ, వెల్లుల్లి టమోటా సాస్‌లో కరిగిన మోజరెల్లాతో; ఒక్కో సర్వింగ్‌లో సుమారు 43g ప్రోటీన్.", "tags": ["vegetarian", "contains dairy", "dinner"], "ing": ["200g firm/extra-firm tofu", "2 tsp cornflour", "1/2 tsp Kashmiri chilli powder", "1/2 tsp Italian seasoning", "1 tsp soy sauce", "1 tsp oil", "Salt and black pepper", "1 tsp oil (for sauce)", "1/2 small onion, finely chopped", "1 tbsp minced garlic", "1 medium tomato, finely chopped", "1-1.5 tbsp tomato ketchup", "1/2 tsp Kashmiri chilli powder (sauce)", "1/2 tsp Italian seasoning (sauce)", "1/2-1 tsp chilli flakes", "120g Greek yogurt", "20g grated mozzarella (about 2.5 tbsp)", "Chilli flakes, to finish", "Fresh coriander/parsley"], "ing_te": ["200g గట్టి/ఎక్స్‌ట్రా-గట్టి టోఫు", "2 tsp కార్న్‌ఫ్లోర్", "1/2 tsp కాశ్మీరీ కారం పొడి", "1/2 tsp ఇటాలియన్ సీజనింగ్", "1 tsp సోయా సాస్", "1 tsp నూనె", "ఉప్పు, నల్ల మిరియాలు", "1 tsp నూనె (సాస్ కోసం)", "1/2 చిన్న ఉల్లిపాయ, సన్నగా తరిగినది", "1 tbsp తరిగిన వెల్లుల్లి", "1 మీడియం టమోటా, సన్నగా తరిగినది", "1-1.5 tbsp టమోటా కెచప్", "1/2 tsp కాశ్మీరీ కారం పొడి (సాస్)", "1/2 tsp ఇటాలియన్ సీజనింగ్ (సాస్)", "1/2-1 tsp చిల్లీ ఫ్లేక్స్", "120g గ్రీక్ పెరుగు", "20g తురిమిన మోజరెల్లా (సుమారు 2.5 tbsp)", "చిల్లీ ఫ్లేక్స్, పైన వేయడానికి", "తాజా కొత్తిమీర/పార్స్లీ"], "steps": ["Tear the tofu into bite-sized pieces and toss with cornflour, Kashmiri chilli powder, Italian seasoning, soy sauce, salt, pepper and 1 tsp oil.", "Air fry at 200C for 12-15 minutes, shaking halfway, until golden and crispy.", "Heat 1 tsp oil and saute the onion and garlic.", "Add the tomato, ketchup, spices, salt and pepper and cook until jammy.", "Turn the heat off completely, stir in the Greek yogurt until creamy, then add the crispy tofu and coat in the sauce.", "Top with mozzarella, cover and let it melt, then finish with chilli flakes and fresh coriander/parsley."], "steps_te": ["టోఫును చిన్న ముక్కలుగా చింపి కార్న్‌ఫ్లోర్, కాశ్మీరీ కారం పొడి, ఇటాలియన్ సీజనింగ్, సోయా సాస్, ఉప్పు, మిరియాలు, 1 tsp నూనెతో కలపండి.", "200C వద్ద 12-15 minutes ఎయిర్ ఫ్రై చేయండి, మధ్యలో కదిలిస్తూ, బంగారు రంగు, కరకరలాడే వరకు.", "1 tsp నూనె వేడి చేసి ఉల్లిపాయ, వెల్లుల్లి వేయించండి.", "టమోటా, కెచప్, మసాలాలు, ఉప్పు, మిరియాలు వేసి జామ్‌లా అయ్యేవరకు ఉడికించండి.", "మంటను పూర్తిగా ఆపి, గ్రీక్ పెరుగు కలిపి క్రీమీగా చేసి, తర్వాత కరకరలాడే టోఫు వేసి సాస్‌లో పూర్తిగా కలపండి.", "పైన మోజరెల్లా వేసి, మూత పెట్టి కరిగనివ్వండి, తర్వాత చిల్లీ ఫ్లేక్స్, తాజా కొత్తిమీర/పార్స్లీతో ముగించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:02:39.380Z"}, {"n": 144, "title": "Masoor Dal Khichdi", "title_te": "మసూర్ దాల్ ఖిచ్డీ", "cat": "Adult", "section": "adult", "emoji": "🍲", "image": "https://sinfullyspicy.com/wp-content/uploads/2021/11/0BA86078-9A5E-4DE8-B0F9-645D9498C232-scaled.jpeg", "prep": "—", "cook": "—", "yield": "—", "desc": "For 8 people, you will want a total of 4 cups of grains.", "desc_te": "8 మందికి, మీకు మొత్తం 4 cups ధాన్యాలు కావాలి.", "tags": [], "ing": ["Rice: 2 cups (Basmati or short-grain)", "Masoor Dal (Red Lentils): 2 cups", "Water: 10 cups (For that perfect, slightly creamy khichdi texture)", "Onions: 2 large (sliced thin)", "Green Chillies: 3 to 4 (slit)", "Ghee or Oil: 3 tablespoons", "Cumin Seeds (Jeera): 1.5 teaspoons", "Turmeric Powder: 1 teaspoon", "Salt: 4 teaspoons (adjust to taste)"], "ing_te": ["బియ్యం: 2 cups (బాస్మతి లేదా షార్ట్-గ్రెయిన్)", "మసూర్ దాల్ (ఎర్ర కందిపప్పు): 2 cups", "నీరు: 10 cups (ఆ సరైన, కొంచెం క్రీమీ ఖిచ్డీ ఆకృతి కోసం)", "ఉల్లిపాయలు: 2 పెద్దవి (సన్నగా తరిగినవి)", "పచ్చిమిర్చి: 3 to 4 (చీల్చినవి)", "నెయ్యి లేదా నూనె: 3 tablespoons", "జీలకర్ర గింజలు (జీరా): 1.5 teaspoons", "పసుపు పొడి: 1 teaspoon", "ఉప్పు: 4 teaspoons (రుచికి తగ్గట్టు సర్దుకోండి)"], "steps": ["Rinse the Grains — 5 mins — Mix the 2 cups of rice and 2 cups of masoor dal together. Rinse them thoroughly under cold water until the water runs clear. Drain well.", "Sauté the Aromatics — 5 mins — Turn your Instant Pot to Saute Mode. Add the ghee or oil. Once hot, drop in the cumin seeds and let them sizzle. Add the sliced onions and green chillies, sautéing until the onions turn soft and golden brown.", "Deglaze the Pot — 2 mins — Add the rinsed rice, masoor dal, turmeric, and salt. Pour in the 10 cups of water. Take a wooden spoon and vigorously scrape the bottom of the inner pot to clear off any stuck onion bits. This completely prevents the \"Burn\" error.", "Pressure Cook — 6 mins — Cancel Saute Mode. Secure the Instant Pot lid and turn the steam valve to Sealing. Select Pressure Cook (or Manual) on High Pressure for 6 minutes.", "Natural Release — 10 mins — When the timer goes off, leave the pot alone for 10 minutes to let the pressure drop naturally (Natural Pressure Release/NPR). After 10 minutes, turn the valve to Venting to release any leftover steam, then open the lid.", "Give everything a gentle stir to combine the creamy dal and rice. Serve it hot with a dollop of fresh ghee on top, yogurt, or pickle!"], "steps_te": ["ధాన్యాలను కడగండి — 5 mins — 2 cups బియ్యం, 2 cups మసూర్ దాల్‌ను కలపండి. నీరు తేటగా వచ్చేవరకు చల్లని నీటి కింద బాగా కడగండి. బాగా వడకట్టండి.", "సువాసన పదార్థాలను వేయించండి — 5 mins — మీ ఇన్‌స్టంట్ పాట్‌ను సాటే మోడ్‌కు మార్చండి. నెయ్యి లేదా నూనె వేయండి. వేడెక్కిన తర్వాత, జీలకర్ర గింజలు వేసి చిటపటలాడనివ్వండి. తరిగిన ఉల్లిపాయలు, పచ్చిమిర్చి వేసి, ఉల్లిపాయలు మెత్తగా, బంగారు గోధుమ రంగు వచ్చేవరకు వేయించండి.", "పాట్‌ను డీగ్లేజ్ చేయండి — 2 mins — కడిగిన బియ్యం, మసూర్ దాల్, పసుపు, ఉప్పు వేయండి. 10 cups నీరు పోయండి. చెక్క గరిటె తీసుకుని లోపలి పాట్ అడుగు భాగాన్ని గట్టిగా గీకి అంటుకున్న ఉల్లిపాయ ముక్కలను తొలగించండి. ఇది “Burn” ఎర్రర్‌ను పూర్తిగా నివారిస్తుంది.", "ప్రెషర్ కుక్ చేయండి — 6 mins — సాటే మోడ్‌ను రద్దు చేయండి. ఇన్‌స్టంట్ పాట్ మూతను భద్రపరచి, స్టీమ్ వాల్వ్‌ను సీలింగ్‌కు తిప్పండి. హై ప్రెషర్‌పై 6 minutes పాటు ప్రెషర్ కుక్ (లేదా మాన్యువల్) ఎంచుకోండి.", "సహజ రిలీజ్ — 10 mins — టైమర్ మోగినప్పుడు, ఒత్తిడి సహజంగా తగ్గడానికి 10 minutes పాటు పాట్‌ను అలాగే ఉంచండి (నేచురల్ ప్రెషర్ రిలీజ్/NPR). 10 minutes తర్వాత, మిగిలిన ఆవిరిని విడిచేందుకు వాల్వ్‌ను వెంటింగ్‌కు తిప్పి, తర్వాత మూత తెరవండి.", "క్రీమీ దాల్, బియ్యం కలిసేలా అన్నింటినీ మెల్లగా కలపండి. పైన తాజా నెయ్యి చుక్క, పెరుగు, లేదా పచ్చడితో వేడిగా వడ్డించండి!"], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.554Z"}, {"n": 77, "title": "Mild Baked Chickpea & Sweet Pea Falafel Nuggets with Lemon-Yogurt Dip", "title_te": "మైల్డ్ బేక్డ్ చిక్‌పీ & స్వీట్ పీ ఫలాఫెల్ నగెట్స్, లెమన్-యోగర్ట్ డిప్‌తో", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍽️", "image": "https://cookingsteps.com/wp-content/uploads/2025/08/Image_3-86.png", "prep": "15 minutes", "cook": "18 minutes", "yield": "14–16 mini nuggets", "desc": "A toddler-adapted version of classic falafel that avoids sharp raw onion or excessive chili. Sweet green peas are blended alongside cooked chickpeas, which adds natural sweetness and keeps the nuggets moist and tender on the inside rather than dry or crumbly. Served with a calcium-rich lemon Greek yogurt dipping sauce.", "desc_te": "క్లాసిక్ ఫలాఫెల్ యొక్క పసిపిల్లలకు అనువైన వెర్షన్ — ఘాటైన పచ్చి ఉల్లిపాయ లేదా అధిక కారం లేకుండా. తీపి పచ్చి బఠానీలను వండిన చిక్‌పీస్‌తో కలిపి బ్లెండ్ చేయడం వల్ల సహజ తీపి వస్తుంది, నగెట్స్ లోపల తేమగా, మెత్తగా ఉంటాయి, పొడిగా లేదా విరిగిపోయేలా ఉండవు. కాల్షియం అధికంగా ఉండే నిమ్మ గ్రీక్ పెరుగు డిప్పింగ్ సాస్‌తో వడ్డిస్తారు.", "tags": [], "ing": ["For the Falafel Nuggets:", "1.5 cups cooked chickpeas (rinsed and drained thoroughly)", "1/2 cup sweet green peas (steamed or thawed frozen)", "1/4 cup fresh cilantro or flat-leaf parsley leaves", "1/3 cup rolled oats (ground into fine flour) or whole wheat breadcrumbs", "1 tbsp olive oil (plus extra for brushing)", "1/2 tsp ground cumin", "1/4 tsp mild ground coriander", "1/4 tsp garlic powder", "1 tbsp fresh lemon juice", "For the Lemon-Yogurt Dip:", "1/3 cup whole-milk plain Greek yogurt", "1 tsp fresh lemon juice", "1/2 tsp olive oil", "1 tsp finely minced fresh mint or dill (optional)"], "ing_te": ["ఫలాఫెల్ నగెట్స్ కోసం:", "1.5 cups వండిన చిక్‌పీస్ (బాగా కడిగి, నీరు వడకినవి)", "1/2 cup తీపి పచ్చి బఠానీలు (ఆవిరిలో ఉడికించినవి లేదా కరిగించిన ఫ్రోజెన్)", "1/4 cup తాజా కొత్తిమీర లేదా ఫ్లాట్-లీఫ్ పార్స్లీ ఆకులు", "1/3 cup రోల్డ్ ఓట్స్ (సన్నని పిండిగా రుబ్బినవి) లేదా హోల్ వీట్ బ్రెడ్‌క్రంబ్స్", "1 tbsp ఆలివ్ నూనె (బ్రష్ చేయడానికి అదనంగా)", "1/2 tsp గ్రౌండ్ జీలకర్ర", "1/4 tsp మైల్డ్ గ్రౌండ్ ధనియాలు", "1/4 tsp వెల్లుల్లి పొడి", "1 tbsp తాజా నిమ్మరసం", "లెమన్-యోగర్ట్ డిప్ కోసం:", "1/3 cup హోల్-మిల్క్ సాదా గ్రీక్ పెరుగు", "1 tsp తాజా నిమ్మరసం", "1/2 tsp ఆలివ్ నూనె", "1 tsp సన్నగా తరిగిన తాజా పుదీనా లేదా దిల్ (ఐచ్ఛికం)"], "steps": ["Preheat & Line: Preheat oven to 375°F (190°C) and line a baking sheet with parchment paper.", "Process Dough: In a food processor, add the chickpeas, sweet green peas, fresh cilantro/parsley, ground cumin, coriander, garlic powder, lemon juice, olive oil, and oat flour. Pulse 10–12 times until the mixture forms a coarse, moist paste that easily sticks together when pressed. Do not over-process into liquid hummus.", "Shape Nuggets: Scoop 1 heaping tablespoon of mixture and shape with your hands into small, slightly flattened oval nuggets or balls (about 1.5 inches wide).", "Bake: Place nuggets on the prepared baking sheet. Lightly brush or spray the tops with olive oil. Bake for 16–18 minutes, flipping halfway through, until golden brown on both sides.", "Make Dip: In a small bowl, whisk together the Greek yogurt, lemon juice, olive oil, and mint/dill.", "Serve: Let the falafel cool for 5 minutes until safely warm. Serve alongside the dip for self-dipping."], "steps_te": ["ప్రీహీట్ & లైన్: ఓవెన్‌ను 375°F (190°C) వద్ద ప్రీహీట్ చేసి బేకింగ్ షీట్‌కు పార్చ్‌మెంట్ పేపర్ వేయండి.", "పిండి ప్రాసెస్ చేయండి: ఫుడ్ ప్రాసెసర్‌లో చిక్‌పీస్, తీపి పచ్చి బఠానీలు, తాజా కొత్తిమీర/పార్స్లీ, గ్రౌండ్ జీలకర్ర, ధనియాలు, వెల్లుల్లి పొడి, నిమ్మరసం, ఆలివ్ నూనె మరియు ఓట్ పిండి వేయండి. నొక్కినప్పుడు సులభంగా అంటుకునే ముతక, తేమగల పేస్ట్ అయ్యేవరకు 10–12 సార్లు పల్స్ చేయండి. ద్రవ హమ్మస్‌లా అయ్యేవరకు ఎక్కువగా ప్రాసెస్ చేయవద్దు.", "నగెట్స్ ఆకారం ఇవ్వండి: 1 heaping tablespoon మిశ్రమాన్ని తీసుకుని చేతులతో చిన్న, కొద్దిగా చదును చేసిన గుండ్రని నగెట్స్ లేదా బంతులుగా (సుమారు 1.5 inches వెడల్పు) ఆకారం ఇవ్వండి.", "బేక్ చేయండి: నగెట్స్‌ను సిద్ధం చేసిన బేకింగ్ షీట్‌పై ఉంచండి. పైన ఆలివ్ నూనెను తేలికగా బ్రష్ చేయండి లేదా స్ప్రే చేయండి. రెండు వైపులా బంగారు గోధుమ రంగు వచ్చేవరకు సగంలో తిప్పుతూ 16–18 minutes బేక్ చేయండి.", "డిప్ చేయండి: ఒక చిన్న గిన్నెలో గ్రీక్ పెరుగు, నిమ్మరసం, ఆలివ్ నూనె మరియు పుదీనా/దిల్‌ను గిలకొట్టి కలపండి.", "వడ్డించండి: ఫలాఫెల్‌ను 5 minutes చల్లారనివ్వండి, సురక్షితంగా గోరువెచ్చగా అయ్యేవరకు. స్వయంగా ముంచడానికి డిప్‌తో పాటు వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:06:17.536Z"}, {"n": 106, "title": "Mild Paneer & Green Peas Pulao (Matar Paneer Rice)", "title_te": "మైల్డ్ పనీర్ & పచ్చి బఠానీల పులావ్ (మటర్ పనీర్ రైస్)", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍚", "image": "https://shwetainthekitchen.com/wp-content/uploads/2020/05/IMG_7969-scaled.jpg", "prep": "10 minutes", "cook": "18 minutes", "yield": "3–4 toddler portions", "desc": "Inspired by Swasthi's Recipes and GK Food Diary", "desc_te": "స్వస్తీస్ రెసిపీస్ మరియు జీకే ఫుడ్ డైరీ నుండి ప్రేరణ పొందినది", "tags": [], "ing": ["1/2 cup Basmati rice (or preferred long-grain rice), thoroughly rinsed and soaked in water for 15 minutes", "100g (approx. 3/4 cup) paneer, cut into tender 1/2-inch bite-sized cubes", "1/3 cup sweet green peas (fresh or frozen, thawed)", "1/3 cup carrots, peeled and finely diced", "1 tbsp ghee (clarified butter)", "1/2 tsp cumin seeds (jeera)", "1/4 tsp ginger paste (or finely grated ginger)", "1/4 tsp turmeric powder", "1/4 tsp mild coriander powder", "1 cup water (or low-sodium vegetable broth)", "Pinch of salt (optional; omit for children under 12 months)"], "ing_te": ["1/2 cup బాస్మతి అన్నం (లేదా ఇష్టమైన పొడవైన గింజల అన్నం), బాగా కడిగి 15 minutes పాటు నీటిలో నానబెట్టినది", "100g (సుమారు 3/4 cup) పనీర్, మెత్తని 1/2-inch కాటు పరిమాణ ముక్కలుగా కత్తిరించినది", "1/3 cup తీపి పచ్చి బఠానీలు (తాజావి లేదా ఫ్రోజెన్, కరిగించినవి)", "1/3 cup క్యారెట్లు, పొట్టు తీసి సన్నగా ముక్కలు చేసినవి", "1 tbsp నెయ్యి (క్లారిఫైడ్ బటర్)", "1/2 tsp జీలకర్ర గింజలు (జీరా)", "1/4 tsp అల్లం పేస్ట్ (లేదా సన్నగా తురిమిన అల్లం)", "1/4 tsp పసుపు పొడి", "1/4 tsp మైల్డ్ ధనియాల పొడి", "1 cup నీరు (లేదా తక్కువ-సోడియం వెజిటబుల్ బ్రాత్)", "చిటికెడు ఉప్పు (ఐచ్ఛికం; 12 months లోపు పిల్లలకు వద్దు)"], "steps": ["Sauté Paneer: Heat ghee in a medium saucepan over medium-low heat. Add paneer cubes and gently sauté for 1–2 minutes until soft and warm (avoid browning too much to keep them soft and tender for toddler chewing). Transfer paneer to a plate.", "Bloom Spices: In the same pan, add cumin seeds and let them sizzle for 30 seconds until fragrant. Add ginger paste, diced carrots, and sweet peas. Sauté gently for 1 minute.", "Add Spices & Rice: Stir in turmeric and coriander powder. Drain soaked rice and add to the pot, stirring gently for 30 seconds to coat grains with ghee and aromatics.", "Simmer: Pour in 1 cup of water (and optional pinch of salt). Bring to a gentle boil. Reduce heat to low, cover with a tight lid, and simmer undisturbed for 12–14 minutes until the water is fully absorbed and rice is soft.", "Combine & Rest: Turn off the heat. Gently fold in the sautéed paneer cubes. Cover and let rest for 5 minutes so the steam warms the paneer and settles the rice.", "Serve: Fluff gently with a fork. Slightly mash with the back of a spoon if serving younger toddlers. Serve warm with mild plain yogurt."], "steps_te": ["పనీర్ వేయించండి: మీడియం-తక్కువ మంటపై మీడియం సాస్‌పాన్‌లో నెయ్యి వేడి చేయండి. పనీర్ ముక్కలు వేసి, మెత్తగా, వెచ్చగా అయ్యేవరకు 1–2 minutes పాటు మెల్లగా వేయించండి (పసిపిల్లలు నమలడానికి మెత్తగా, మృదువుగా ఉండటానికి ఎక్కువగా బ్రౌన్ చేయవద్దు). పనీర్‌ను ప్లేట్‌లోకి తీసుకోండి.", "మసాలాలు బ్లూమ్ చేయండి: అదే పాన్‌లో జీలకర్ర గింజలు వేసి సువాసన వచ్చేవరకు 30 seconds పాటు చిటపటలాడనివ్వండి. అల్లం పేస్ట్, ముక్కలు చేసిన క్యారెట్లు, తీపి బఠానీలు వేయండి. 1 minute పాటు మెల్లగా వేయించండి.", "మసాలాలు & అన్నం వేయండి: పసుపు, ధనియాల పొడి కలపండి. నానబెట్టిన అన్నం నీరు వంపేసి గిన్నెలో వేసి, గింజలకు నెయ్యి, సుగంధ ద్రవ్యాలు పట్టేలా 30 seconds పాటు మెల్లగా కలపండి.", "సిమ్మర్ చేయండి: 1 cup నీరు (మరియు ఐచ్ఛిక చిటికెడు ఉప్పు) పోయండి. మెల్లగా మరిగించండి. మంటను తక్కువకు తగ్గించి, గట్టి మూత పెట్టి, నీరు పూర్తిగా పీల్చుకుని అన్నం మెత్తగా అయ్యేవరకు 12–14 minutes పాటు కదపకుండా సిమ్మర్ చేయండి.", "కలిపి విశ్రాంతి: మంట ఆపండి. వేయించిన పనీర్ ముక్కలను మెల్లగా కలపండి. మూత పెట్టి 5 minutes పాటు ఉంచండి, ఆవిరి పనీర్‌ను వేడి చేసి అన్నం స్థిరపడేలా.", "వడ్డించండి: ఫోర్క్‌తో మెల్లగా పొడిపొడిగా చేయండి. చిన్న పసిపిల్లలకు వడ్డిస్తుంటే చెంచా వెనుక భాగంతో కొద్దిగా మెదపండి. మైల్డ్ ప్లెయిన్ పెరుగుతో వెచ్చగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:56.514Z"}, {"n": 89, "title": "Mini Chickpea & Sweet Potato Shepherd's Pie Cups", "title_te": "మినీ చిక్‌పీ & స్వీట్ పొటాటో షెపర్డ్స్ పై కప్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍽️", "image": "https://martharecipes.com/wp-content/uploads/2025/11/Mini_Shepherds_Pie_3.webp", "prep": "15 minutes", "cook": "25 minutes", "yield": "12 mini shepherd's pie cups", "desc": "Individual comfort-food cups baked directly in a muffin tin. A rich, savory stew of tender chickpeas, diced carrots, and sweet green peas is spooned into the bottom, then crowned with a pillowy swirl of naturally sweet mashed sweet potatoes. High in plant protein, beta-carotene, and dietary fiber.", "desc_te": "నేరుగా మఫిన్ టిన్‌లో బేక్ చేసిన వ్యక్తిగత కంఫర్ట్-ఫుడ్ కప్స్. మెత్తని చిక్‌పీస్, చిన్నగా కోసిన క్యారెట్లు మరియు తీపి పచ్చి బఠానీలతో చేసిన గొప్ప, రుచికరమైన స్ట్యూను అడుగున వేసి, పైన సహజంగా తీపి మెదిపిన చిలగడదుంపల మెత్తని సుడితో అలంకరిస్తారు. వృక్ష ప్రోటీన్, బీటా-కెరోటిన్ మరియు డైటరీ ఫైబర్ అధికంగా ఉంటాయి.", "tags": [], "ing": ["For the Sweet Potato Topping:", "2 medium sweet potatoes, peeled, cubed, and steamed until fork-tender (approx. 2 cups mashed)", "1 tbsp butter or olive oil", "2 tbsp whole milk (or breastmilk/formula)", "Pinch of ground cinnamon or nutmeg", "For the Chickpea Vegetable Filling:", "1.5 cups cooked chickpeas (rinsed and lightly mashed with a fork so they don't roll)", "1/2 cup carrots, finely diced", "1/2 cup sweet green peas (fresh or frozen)", "1/2 cup sweet corn kernels", "1 tbsp olive oil", "1/2 tsp dried parsley or Italian herbs", "1/4 tsp garlic powder", "1 tbsp tomato paste", "1/2 cup low-sodium vegetable broth", "1 tsp cornstarch (dissolved in 1 tbsp water to thicken)"], "ing_te": ["స్వీట్ పొటాటో టాపింగ్ కోసం:", "2 medium చిలగడదుంపలు, తొక్క తీసి, క్యూబ్స్‌గా కోసి, ఫోర్క్‌తో గుచ్చేంత మెత్తగా ఆవిరిలో ఉడికించినవి (approx. 2 cups మెదిపినవి)", "1 tbsp వెన్న లేదా ఆలివ్ నూనె", "2 tbsp హోల్ మిల్క్ (లేదా బ్రెస్ట్‌మిల్క్/ఫార్ములా)", "చిటికెడు గ్రౌండ్ దాల్చినచెక్క లేదా జాజికాయ", "చిక్‌పీ వెజిటబుల్ ఫిల్లింగ్ కోసం:", "1.5 cups వండిన చిక్‌పీస్ (కడిగి, దొర్లకుండా ఫోర్క్‌తో తేలికగా మెదిపినవి)", "1/2 cup క్యారెట్లు, సన్నగా కోసినవి", "1/2 cup తీపి పచ్చి బఠానీలు (తాజా లేదా ఫ్రోజెన్)", "1/2 cup తీపి మొక్కజొన్న గింజలు", "1 tbsp ఆలివ్ నూనె", "1/2 tsp ఎండిన పార్స్లీ లేదా ఇటాలియన్ మూలికలు", "1/4 tsp వెల్లుల్లి పొడి", "1 tbsp టమాటా పేస్ట్", "1/2 cup తక్కువ సోడియం వెజిటబుల్ బ్రాత్", "1 tsp కార్న్‌స్టార్చ్ (చిక్కబరచడానికి 1 tbsp నీటిలో కరిగించినది)"], "steps": ["Preheat & Prep: Preheat oven to 375°F (190°C). Grease a standard 12-cup muffin tin well with olive oil or butter.", "Make Mash: In a bowl, mash the steamed sweet potatoes with butter, milk, and a pinch of cinnamon until completely smooth and fluffy.", "Cook Filling: Heat olive oil in a skillet over medium heat. Add diced carrots, sweet peas, and corn; sauté for 3 minutes until slightly tender.", "Simmer Sauce: Stir in the mashed chickpeas, tomato paste, garlic powder, herbs, and vegetable broth. Bring to a simmer. Stir in the cornstarch slurry and cook for 1–2 minutes until the sauce turns thick and glossy, binding the vegetables and chickpeas together.", "Assemble Cups: Spoon 2 heaping tablespoons of the chickpea-vegetable filling into each muffin cup. Top each with a generous dollop of mashed sweet potato. Smooth the tops or create fun peaks with a fork.", "Bake: Bake at 375°F for 18–20 minutes until heated through and the sweet potato tops are lightly golden at the edges.", "Serve: Let cool in the pan for 10 minutes before gently scooping out with a spoon. Serve warm in a toddler bowl."], "steps_te": ["ప్రీహీట్ & సిద్ధం: ఓవెన్‌ను 375°F (190°C) వద్ద ప్రీహీట్ చేయండి. స్టాండర్డ్ 12-cup మఫిన్ టిన్‌కు ఆలివ్ నూనె లేదా వెన్నతో బాగా నూనె రాయండి.", "మాష్ చేయండి: ఒక గిన్నెలో ఆవిరిలో ఉడికించిన చిలగడదుంపలను వెన్న, పాలు మరియు చిటికెడు దాల్చినచెక్కతో పూర్తిగా మెత్తగా, నురుగులా అయ్యేవరకు మెదపండి.", "ఫిల్లింగ్ వండండి: మీడియం మంటపై స్కిల్లెట్‌లో ఆలివ్ నూనె వేడి చేయండి. కోసిన క్యారెట్లు, తీపి బఠానీలు మరియు మొక్కజొన్న వేసి కొద్దిగా మెత్తబడేవరకు 3 minutes వేయించండి.", "సాస్ ఉడికించండి: మెదిపిన చిక్‌పీస్, టమాటా పేస్ట్, వెల్లుల్లి పొడి, మూలికలు మరియు వెజిటబుల్ బ్రాత్ కలపండి. మరిగించండి. కార్న్‌స్టార్చ్ స్లర్రీ కలిపి సాస్ చిక్కగా, మెరిసేలా అయ్యి కూరగాయలు మరియు చిక్‌పీస్‌ను బంధించేవరకు 1–2 minutes వండండి.", "కప్స్ అమర్చండి: ప్రతి మఫిన్ కప్‌లో 2 heaping tablespoons చిక్‌పీ-వెజిటబుల్ ఫిల్లింగ్ వేయండి. ప్రతి దానిపై ఉదారంగా మెదిపిన చిలగడదుంప వేయండి. పైభాగాలను సమానం చేయండి లేదా ఫోర్క్‌తో సరదా శిఖరాలు సృష్టించండి.", "బేక్ చేయండి: 375°F వద్ద 18–20 minutes బేక్ చేయండి, పూర్తిగా వేడెక్కి చిలగడదుంప పైభాగాలు అంచుల వద్ద తేలికగా బంగారు రంగులో అయ్యేవరకు.", "వడ్డించండి: చెంచాతో మెల్లగా తీసే ముందు పాన్‌లోనే 10 minutes చల్లారనివ్వండి. పసిపిల్లల గిన్నెలో గోరువెచ్చగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:26.732Z"}, {"n": 116, "title": "Mini Steamed Moong Dal & Veggie Idlis (Steamed Protein Cakes)", "title_te": "మినీ స్టీమ్డ్ మూంగ్ దాల్ & వెజ్జీ ఇడ్లీలు (స్టీమ్డ్ ప్రోటీన్ కేక్‌లు)", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍲", "image": "https://images.boldsky.com/kn/img/2026/03/moongdalveggieidlirecipe-1773380623.jpg", "prep": "10 mins (+ 2–3 hrs soaking)", "cook": "12 mins", "yield": "12–14 mini idlis", "desc": "Description", "desc_te": "వివరణ", "tags": [], "ing": ["1 cup yellow split moong dal (washed and soaked for 2–3 hours)", "¼ cup plain yogurt or curd", "⅓ cup finely grated carrot", "2 tbsp finely chopped fresh cilantro", "½ tsp cumin seeds (jeera)", "¼ tsp turmeric powder (haldi)", "1 tsp ghee (for greasing and flavor)", "¼ tsp baking soda or fruit salt (Eno) (optional, for maximum fluffiness)", "2–3 tbsp water (for blending)", "Pinch of mild pink salt (optional)"], "ing_te": ["1 cup పసుపు స్ప్లిట్ మూంగ్ దాల్ (కడిగి 2–3 hours నానబెట్టినది)", "¼ cup ప్లెయిన్ యోగర్ట్ లేదా పెరుగు", "⅓ cup సన్నగా తురిమిన క్యారెట్", "2 tbsp సన్నగా తరిగిన తాజా కొత్తిమీర", "½ tsp జీలకర్ర గింజలు (jeera)", "¼ tsp పసుపు పొడి (haldi)", "1 tsp నెయ్యి (గ్రీజ్ చేయడానికి మరియు రుచి కోసం)", "¼ tsp బేకింగ్ సోడా లేదా ఫ్రూట్ సాల్ట్ (Eno) (optional, గరిష్ఠ మెత్తదనం కోసం)", "2–3 tbsp నీరు (బ్లెండ్ చేయడానికి)", "Pinch of mild పింక్ ఉప్పు (optional)"], "steps": ["Grind Batter: Drain the soaked moong dal thoroughly. Transfer to a blender with yogurt and 2–3 tablespoons of water. Grind to a smooth, thick batter.", "Add Veggies & Spices: Pour the batter into a bowl. Stir in the grated carrots, cilantro, cumin seeds, turmeric powder, and optional salt.", "Aerate: Gently mix in the baking soda or fruit salt right before steaming to make the idlis light and airy.", "Steam: Grease mini idli plates or silicone muffin cups with ghee. Spoon batter into each cavity. Steam over medium heat for 10–12 minutes until a toothpick inserted in the center comes out clean.", "Serve: Cool for 2 minutes, demold, and brush lightly with warm ghee. Toddler Nutrition & Storage Tips", "Digestibility: Yellow moong dal is one of the easiest plant proteins for toddlers to digest.", "Serving Idea: Serve warm with mild coconut chutney or a little warm ghee."], "steps_te": ["బ్యాటర్ రుబ్బండి: నానబెట్టిన మూంగ్ దాల్‌ను బాగా వడకట్టండి. పెరుగు మరియు 2–3 tablespoons నీటితో బ్లెండర్‌కు మార్చండి. మృదువైన, మందపాటి బ్యాటర్ అయ్యేవరకు రుబ్బండి.", "కూరగాయలు & మసాలాలు వేయండి: బ్యాటర్‌ను గిన్నెలో పోయండి. తురిమిన క్యారెట్లు, కొత్తిమీర, జీలకర్ర గింజలు, పసుపు పొడి మరియు optional ఉప్పును కలపండి.", "గాలితో నింపండి: ఇడ్లీలు తేలికగా గాలిలా ఉండటానికి ఆవిరిలో ఉడికించే ముందే బేకింగ్ సోడా లేదా ఫ్రూట్ సాల్ట్‌ను మెల్లగా కలపండి.", "ఆవిరిలో ఉడికించండి: మినీ ఇడ్లీ ప్లేట్లు లేదా సిలికాన్ మఫిన్ కప్పులకు నెయ్యితో గ్రీజ్ చేయండి. ప్రతి గుంతలో బ్యాటర్ వేయండి. మధ్యలో గుచ్చిన టూత్‌పిక్ శుభ్రంగా వచ్చేవరకు మధ్యస్థ మంటపై 10–12 minutes ఆవిరిలో ఉడికించండి.", "వడ్డించండి: 2 minutes చల్లార్చి, మోల్డ్ నుండి తీసి, వెచ్చని నెయ్యితో తేలికగా పూయండి. టాడ్లర్ పోషణ & నిల్వ చిట్కాలు", "జీర్ణశక్తి: పసుపు మూంగ్ దాల్ పిల్లలు జీర్ణించుకోవడానికి సులభమైన ప్లాంట్ ప్రోటీన్‌లలో ఒకటి.", "వడ్డించే ఆలోచన: mild కొబ్బరి చట్నీతో లేదా కొద్దిగా వెచ్చని నెయ్యితో వెచ్చగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:18.702Z"}, {"n": 146, "title": "Moonglet V2", "title_te": "మూంగ్‌లెట్ V2", "cat": "Adult", "section": "adult", "emoji": "🍲", "image": "https://cookingwpar.wpenginepowered.com/wp-content/uploads/2020/10/moonglet-3.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "This Moonglet is a soft, fluffy, and nutritious pancake made from yellow moong dal. It is packed with protein and fiber, making it an excellent breakfast or snack for both adults and toddlers.", "desc_te": "ఈ మూంగ్‌లెట్ పసుపు పెసరపప్పుతో చేసిన మెత్తని, మెత్తటి, పోషకమైన పాన్‌కేక్. ఇందులో ప్రోటీన్, ఫైబర్ పుష్కలంగా ఉండటం వల్ల పెద్దలు, చిన్నారులు ఇద్దరికీ అల్పాహారం లేదా స్నాక్‌గా అద్భుతమైనది.", "tags": [], "ing": ["Category", "Ingredients", "Base Batter", "1 cup Moong Dal (soaked 2+ hours), 1-inch Ginger, pinch of Turmeric", "Vegetables", "Finely chopped Onion, Carrots, Tomatoes, Capsicum", "Aromatics", "1 tsp Cumin Seeds, chopped Coriander, Curry Leaves", "Leavening", "1 tsp Eno (Fruit Salt) or Baking Powder", "Seasoning", "Salt to taste (reduce for toddlers)"], "ing_te": ["వర్గం", "పదార్థాలు", "బేస్ బ్యాటర్", "1 cup పెసరపప్పు (2+ hours నానబెట్టినది), 1-inch అల్లం, చిటికెడు పసుపు", "కూరగాయలు", "సన్నగా తరిగిన ఉల్లిపాయ, క్యారెట్లు, టమోటాలు, క్యాప్సికమ్", "సువాసనలు", "1 tsp జీలకర్ర గింజలు, తరిగిన కొత్తిమీర, కరివేపాకు", "లీవెనింగ్", "1 tsp ఈనో (ఫ్రూట్ సాల్ట్) లేదా బేకింగ్ పౌడర్", "సీజనింగ్", "రుచికి తగ్గట్టు ఉప్పు (చిన్నారుల కోసం తగ్గించండి)"], "steps": ["Grind the Dal: Drain the soaked moong dal. Grind it with ginger and turmeric using very little water to create a thick, smooth batter.", "Mix Veggies: Stir in the chopped onions, carrots, tomatoes, capsicum, cumin seeds, salt, and herbs. Mix well to incorporate all the nutrients.", "Aerate: Just before cooking, add the Eno or baking powder and stir gently. The batter will become light and frothy.", "Cook: Heat a non-stick pan with a little oil or ghee. Pour a thick layer of batter. Cover with a lid and cook on low-medium heat for 3-4 minutes. The steam helps it stay soft.", "Flip: Once the bottom is golden brown, flip the moonglet and cook the other side until golden. Serve warm. Serving Tip for Toddlers Cut into small bite-sized triangles. Serve plain or with a mild yogurt dip to keep the meal low in sodium and high in probiotics."], "steps_te": ["పప్పు రుబ్బండి: నానబెట్టిన పెసరపప్పును వడకట్టండి. అల్లం, పసుపుతో కలిపి చాలా తక్కువ నీరు వాడి మందపాటి, మృదువైన పిండిగా రుబ్బండి.", "కూరగాయలు కలపండి: తరిగిన ఉల్లిపాయలు, క్యారెట్లు, టమోటాలు, క్యాప్సికమ్, జీలకర్ర గింజలు, ఉప్పు, మూలికలు కలపండి. పోషకాలన్నీ కలిసేలా బాగా కలపండి.", "గాలి కలపండి: వండే ముందు ఈనో లేదా బేకింగ్ పౌడర్ వేసి మెల్లగా కలపండి. పిండి తేలికగా, నురుగులా అవుతుంది.", "ఉడికించండి: నాన్-స్టిక్ పాన్‌ను కొంచెం నూనె లేదా నెయ్యితో వేడి చేయండి. మందపాటి పొరగా పిండి పోయండి. మూత పెట్టి తక్కువ-మధ్యస్థ మంటపై 3-4 minutes ఉడికించండి. ఆవిరి దీన్ని మెత్తగా ఉంచడానికి సహాయపడుతుంది.", "తిప్పండి: అడుగు భాగం బంగారు గోధుమ రంగు వచ్చిన తర్వాత, మూంగ్‌లెట్‌ను తిప్పి మరో వైపు బంగారు రంగు వచ్చేవరకు ఉడికించండి. వేడిగా వడ్డించండి. చిన్నారుల కోసం వడ్డించే చిట్కా: చిన్న కొరుకుడు పరిమాణంలో త్రిభుజాలుగా కోయండి. తక్కువ సోడియం, ఎక్కువ ప్రోబయోటిక్స్ కోసం సాదాగా లేదా మృదువైన పెరుగు డిప్‌తో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:52.609Z"}, {"n": 103, "title": "No-Bake Sunflower Butter & Chia Energy Bites", "title_te": "నో-బేక్ సన్‌ఫ్లవర్ బటర్ & చియా ఎనర్జీ బైట్స్", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍽️", "image": "https://www.farmboy.ca/wp-content/uploads/2026/01/SunflowerSeedButterEnergyBites_006-1-1024x683.jpg", "prep": "10 minutes", "cook": "0 minutes", "yield": "14–16 mini bites", "desc": "A quick, no-cook snack packed with whole rolled oats, creamy sunflower seed butter (or peanut butter), chia seeds, and ground flaxseed. Sweetened naturally with pure maple syrup or mashed ripe banana (100% honey-free for toddler safety), these bites are rich in healthy fats, fiber, and protein.", "desc_te": "హోల్ రోల్డ్ ఓట్స్, క్రీమీ సన్‌ఫ్లవర్ సీడ్ బటర్ (లేదా వేరుశనగ బటర్), చియా గింజలు, పొడి చేసిన అవిసె గింజలతో నిండిన త్వరిత, ఉడికించని స్నాక్. స్వచ్ఛమైన మేపుల్ సిరప్ లేదా మెదిపిన పండిన అరటిపండుతో సహజంగా తీపి చేసినవి (పసిపిల్లల భద్రత కోసం 100% తేనె లేకుండా), ఈ బైట్స్‌లో ఆరోగ్యకరమైన కొవ్వులు, ఫైబర్, ప్రోటీన్ సమృద్ధిగా ఉంటాయి.", "tags": [], "ing": ["1 cup old-fashioned rolled oats (blended briefly into coarse meal)", "1/2 cup creamy sunflower seed butter (or smooth unsweetened peanut/almond butter)", "2 tbsp pure maple syrup (or 1 small very ripe banana, mashed completely smooth)", "2 tbsp chia seeds", "2 tbsp ground flaxseed", "1/2 tsp pure vanilla extract", "1/4 tsp ground cinnamon", "2 tbsp mini dairy-free chocolate chips or finely chopped raisins (optional)"], "ing_te": ["1 cup ఓల్డ్-ఫ్యాషన్డ్ రోల్డ్ ఓట్స్ (కొద్దిసేపు బ్లెండ్ చేసి ముతక మీల్‌లా చేసినవి)", "1/2 cup క్రీమీ సన్‌ఫ్లవర్ సీడ్ బటర్ (లేదా మెత్తని తీపి లేని వేరుశనగ/ఆల్మండ్ బటర్)", "2 tbsp స్వచ్ఛమైన మేపుల్ సిరప్ (లేదా 1 చిన్న బాగా పండిన అరటిపండు, పూర్తిగా మెత్తగా మెదిపినది)", "2 tbsp చియా గింజలు", "2 tbsp పొడి చేసిన అవిసె గింజలు", "1/2 tsp స్వచ్ఛమైన వనిల్లా ఎక్స్‌ట్రాక్ట్", "1/4 tsp దాల్చినచెక్క పొడి", "2 tbsp మినీ డైరీ-ఫ్రీ చాక్లెట్ చిప్స్ లేదా సన్నగా తరిగిన ఎండుద్రాక్ష (ఐచ్ఛికం)"], "steps": ["Combine Ingredients: In a medium mixing bowl, add the coarse rolled oats, sunflower seed butter, maple syrup (or mashed banana), chia seeds, ground flaxseed, vanilla extract, and cinnamon.", "Mix: Stir well with a spatula until a thick, cohesive dough forms. If the mixture feels a little dry, add 1 teaspoon of water or milk; if too sticky, add 1–2 tablespoons of additional oats. Fold in mini chocolate chips or raisins if using.", "Chill Briefly: Place the bowl in the refrigerator for 10–15 minutes to make rolling easier and less sticky.", "Roll: Scoop tablespoon-sized portions and roll between clean hands into smooth, 1-inch bite-sized balls.", "Serve & Store: Serve immediately at room temperature or chilled from the fridge."], "steps_te": ["పదార్థాలు కలపండి: మీడియం మిక్సింగ్ గిన్నెలో ముతక రోల్డ్ ఓట్స్, సన్‌ఫ్లవర్ సీడ్ బటర్, మేపుల్ సిరప్ (లేదా మెదిపిన అరటిపండు), చియా గింజలు, పొడి చేసిన అవిసె గింజలు, వనిల్లా ఎక్స్‌ట్రాక్ట్, దాల్చినచెక్క వేయండి.", "కలపండి: చిక్కని, కలిసిపోయే పిండి అయ్యేవరకు స్పాటులాతో బాగా కలపండి. మిశ్రమం కొద్దిగా పొడిగా అనిపిస్తే 1 teaspoon నీరు లేదా పాలు కలపండి; చాలా జిగురుగా ఉంటే 1–2 tablespoons అదనపు ఓట్స్ కలపండి. వాడుతుంటే మినీ చాక్లెట్ చిప్స్ లేదా ఎండుద్రాక్ష కలపండి.", "కొద్దిసేపు చల్లబరచండి: చుట్టడం సులభంగా, తక్కువ జిగురుగా ఉండటానికి గిన్నెను 10–15 minutes పాటు ఫ్రిజ్‌లో ఉంచండి.", "చుట్టండి: టేబుల్‌స్పూన్ పరిమాణ భాగాలు తీసుకుని శుభ్రమైన చేతుల మధ్య చుట్టి మెత్తని, 1-inch కాటు పరిమాణ బంతులు చేయండి.", "వడ్డించండి & నిల్వ చేయండి: గది ఉష్ణోగ్రత వద్ద లేదా ఫ్రిజ్ నుండి చల్లగా వెంటనే వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:08:56.416Z"}, {"n": 18, "title": "Oatmeal Nuts and Seeds Energy Bars (Orange)", "title_te": "ఓట్‌మీల్ నట్స్ మరియు సీడ్స్ ఎనర్జీ బార్స్ (ఆరెంజ్)", "cat": "Adult", "section": "adult", "emoji": "🥣", "image": "https://theforkedspoon.com/wp-content/uploads/2017/04/img-23.jpg", "prep": "10 minutes (flax rest)", "cook": "15 minutes", "yield": "about 10 bars", "desc": "No-refined-sugar baked bars of oats, nuts, seeds and raisins with orange juice and zest.", "desc_te": "ఆరెంజ్ రసం మరియు తొక్కతో చేసిన, శుద్ధి చేసిన చక్కెర లేని, ఓట్స్, గింజలు, విత్తనాలు మరియు ఎండుద్రాక్షతో కాల్చిన బార్స్.", "tags": ["vegetarian", "breakfast", "snack"], "ing": ["1.25 cups oats", "1/4 cup almonds", "1/4 cup pumpkin seeds", "1/4 cup peanuts", "1/4 cup walnuts", "1/4 cup sunflower seeds", "1/4 cup raisins", "1 tbsp flaxseed powder", "3 tbsp water", "1/3 cup honey", "3 tbsp peanut butter", "2 tbsp orange juice", "2 tsp orange zest (optional)", "1/4 tsp salt"], "ing_te": ["1.25 cups ఓట్స్", "1/4 cup బాదం", "1/4 cup గుమ్మడి గింజలు", "1/4 cup వేరుశనగ", "1/4 cup వాల్‌నట్స్", "1/4 cup పొద్దుతిరుగుడు గింజలు", "1/4 cup ఎండుద్రాక్ష", "1 tbsp అవిసె గింజల పొడి", "3 tbsp నీరు", "1/3 cup తేనె", "3 tbsp వేరుశనగ వెన్న", "2 tbsp ఆరెంజ్ రసం", "2 tsp ఆరెంజ్ తొక్క (ఐచ్ఛికం)", "1/4 tsp ఉప్పు"], "steps": ["Roast the oats, nuts and seeds separately, then chop into small pieces.", "In a bowl combine the oats, almonds, walnuts, peanuts, pumpkin seeds, sunflower seeds and raisins.", "Mix the flaxseed powder with water and rest 10 minutes until gelatinous.", "Add the flax gel, peanut butter, honey, orange juice and salt to the bowl and mix well.", "Transfer to a lined tray and shape into a rectangle.", "Bake at 350F for 15 minutes.", "Cool completely, slice into bars and enjoy."], "steps_te": ["ఓట్స్, గింజలు మరియు విత్తనాలను విడివిడిగా వేయించి, ఆ తర్వాత చిన్న ముక్కలుగా కత్తిరించండి.", "ఒక గిన్నెలో ఓట్స్, బాదం, వాల్‌నట్స్, వేరుశనగ, గుమ్మడి గింజలు, పొద్దుతిరుగుడు గింజలు మరియు ఎండుద్రాక్ష కలపండి.", "అవిసె గింజల పొడిని నీటితో కలిపి జెల్లీలా అయ్యేవరకు 10 minutes విశ్రాంతి ఇవ్వండి.", "అవిసె జెల్, వేరుశనగ వెన్న, తేనె, ఆరెంజ్ రసం మరియు ఉప్పును గిన్నెలో వేసి బాగా కలపండి.", "పేపర్ పరచిన ట్రేలోకి మార్చి దీర్ఘచతురస్రాకారంలో ఆకారం ఇవ్వండి.", "350F వద్ద 15 minutes కాల్చండి.", "పూర్తిగా చల్లారనివ్వండి, బార్స్‌లా కత్తిరించి ఆస్వాదించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:00.836Z"}, {"n": 51, "title": "Oats and Dates Cookies for Kids", "title_te": "పిల్లల కోసం ఓట్స్ మరియు ఖర్జూర కుకీలు", "cat": "Kid & Toddler", "section": "kid", "emoji": "🥣", "image": "https://bakeorbreak.com/wp-content/uploads/2025/01/Oatmeal-Date-Cookies-34.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "No Refined Sugar | Egg-Free | Toddler-Friendly | Makes ~8–10 Small Cookies", "desc_te": "శుద్ధి చేసిన చక్కెర లేదు | గుడ్డు లేదు | చిన్న పిల్లలకు అనుకూలం | ~8–10 చిన్న కుకీలు అవుతాయి", "tags": [], "ing": ["1 cup rolled oats", "6–8 soft seedless dates", "2 tablespoons peanut butter", "2–3 tablespoons milk (dairy, almond, oat, or preferred milk)", "1/4 teaspoon cinnamon powder (optional)", "1/2 teaspoon vanilla extract (optional)"], "ing_te": ["1 cup రోల్డ్ ఓట్స్", "6–8 మెత్తని, గింజలు లేని ఖర్జూరాలు", "2 tablespoons వేరుశెనగ వెన్న", "2–3 tablespoons పాలు (డెయిరీ, బాదం, ఓట్ లేదా నచ్చిన పాలు)", "1/4 teaspoon దాల్చినచెక్క పొడి (ఐచ్ఛికం)", "1/2 teaspoon వెనిల్లా ఎక్స్‌ట్రాక్ట్ (ఐచ్ఛికం)"], "steps": ["Soften the Dates If your dates feel firm or dry, soak them in warm water for 5 to 10 minutes, then drain thoroughly.", "Blend the Date Paste Place the soaked dates into a food processor or blender and process until a smooth, sticky paste forms.", "Mix the Dough In a mixing bowl, combine the rolled oats, date paste, peanut butter, milk, cinnamon, and vanilla extract. Mix well until a soft, slightly sticky dough forms.", "Consistency Check: If the mixture feels too dry or crumbly, stir in an extra splash of milk. If it feels too wet, add a small pinch of oats until it holds shape easily.", "Shape the Cookies Roll small portions of the dough into balls, then place them on a lined baking sheet and flatten them slightly into cookie discs using your fingers or the back of a spoon.", "Bake Preheat your oven to 180°C / 350°F for 10 minutes. Bake the cookies for 12 to 15 minutes, or until the edges are lightly golden and set.", "Cool and Serve Allow the cookies to cool on the baking tray for 5 minutes after removing from the oven; they will firm up as they cool down while retaining a soft, chewable interior. Alternative Cooking Methods Method Temperature / Heat Time Instructions Air Fryer 180°C / 350°F 8–10 minutes Arrange in a single layer on parchment paper and cook until set and lightly golden. Stovetop Pan Low heat 5–7 minutes per side Place in a non-stick skillet over low heat, gently flip midway, and cook until set."], "steps_te": ["ఖర్జూరాలు గట్టిగా లేదా పొడిగా అనిపిస్తే, వాటిని 5 to 10 minutes పాటు గోరువెచ్చని నీటిలో నానబెట్టి, తర్వాత బాగా నీరు వంపేయండి.", "ఖర్జూర పేస్ట్ చేయండి: నానబెట్టిన ఖర్జూరాలను ఫుడ్ ప్రాసెసర్ లేదా బ్లెండర్‌లో వేసి మృదువైన, జిగురు పేస్ట్ అయ్యేవరకు బ్లెండ్ చేయండి.", "పిండి కలపండి: మిక్సింగ్ బౌల్‌లో రోల్డ్ ఓట్స్, ఖర్జూర పేస్ట్, వేరుశెనగ వెన్న, పాలు, దాల్చినచెక్క మరియు వెనిల్లా ఎక్స్‌ట్రాక్ట్ కలపండి. మృదువైన, కొంచెం జిగురు పిండి అయ్యేవరకు బాగా కలపండి.", "స్థిరత్వం చూడండి: మిశ్రమం చాలా పొడిగా లేదా పొడిపొడిగా అనిపిస్తే, కొంచెం పాలు కలపండి. చాలా తడిగా అనిపిస్తే, సులభంగా ఆకారం పట్టేవరకు కొంచెం ఓట్స్ కలపండి.", "కుకీల ఆకారం ఇవ్వండి: పిండిని చిన్న చిన్న ఉండలుగా చేసి, లైనింగ్ వేసిన బేకింగ్ షీట్‌పై ఉంచి, వేళ్లతో లేదా చెంచా వెనుక భాగంతో కొంచెం చదును చేసి కుకీ డిస్క్‌లుగా చేయండి.", "బేక్ చేయండి: మీ ఓవెన్‌ను 180°C / 350°F వద్ద 10 minutes పాటు వేడి చేయండి. కుకీలను 12 to 15 minutes పాటు, అంచులు తేలికగా బంగారు రంగులోకి వచ్చి గట్టిపడేవరకు బేక్ చేయండి.", "చల్లార్చి వడ్డించండి: ఓవెన్ నుంచి తీసిన తర్వాత కుకీలను బేకింగ్ ట్రేపైనే 5 minutes పాటు చల్లారనివ్వండి; చల్లారేకొద్దీ అవి గట్టిపడతాయి, లోపల మృదువుగా, నమలడానికి సులభంగా ఉంటాయి. ఇతర వండే పద్ధతులు: పద్ధతి ఉష్ణోగ్రత / వేడి సమయం సూచనలు ఎయిర్ ఫ్రైయర్ 180°C / 350°F 8–10 minutes పార్చ్మెంట్ పేపర్‌పై ఒకే పొరగా అమర్చి, గట్టిపడి తేలికగా బంగారు రంగు వచ్చేవరకు వండండి. స్టవ్‌టాప్ పాన్ తక్కువ వేడి ప్రతి వైపు 5–7 minutes నాన్-స్టిక్ పాన్‌లో తక్కువ వేడిపై ఉంచి, మధ్యలో మెల్లగా తిప్పి, గట్టిపడేవరకు వండండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:05:25.458Z"}, {"n": 82, "title": "One-Pot Chicken Donne Biryani", "title_te": "వన్-పాట్ చికెన్ దొన్నె బిర్యానీ", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://masaladiaries.com/wp-content/uploads/2024/12/Donne-Chicken-Biryani-Recipe.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "A fragrant, herb-based chicken biryani made in a pressure cooker for a quick yet authentic taste.", "desc_te": "ప్రెషర్ కుక్కర్‌లో తయారయ్యే సువాసనభరితమైన, మూలికల ఆధారిత చికెన్ బిర్యానీ — త్వరగా అయినా అసలైన రుచితో.", "tags": [], "ing": ["For the Marinade", "Chicken: 500g, bone-in pieces", "Curd (Yogurt): 1/2 cup", "Turmeric powder: 1/2 teaspoon", "Coriander (Daniya) powder: 1 teaspoon", "Biryani masala: 1 tablespoon", "Salt: to taste", "Lemon juice: 1 tablespoon", "For the Green Masala", "Oil: 1 tablespoon", "Onion: 1/2, roughly chopped", "Tomato: 1/2, roughly chopped", "Mint leaves: 1/2 cup", "Coriander leaves: 1/2 cup", "Green chilies: 4-5 pieces", "Ginger-garlic paste: 1 tablespoon", "Dried fenugreek leaves (Kasuri Methi): 1 teaspoon", "For the Rice", "Seeraga Samba rice (or Basmati): 2 glasses", "Water: 4 glasses", "Ghee: 1 tablespoon", "Whole spices (Bay leaf, cloves, cinnamon)", "Sliced onions and green chilies: for tempering"], "ing_te": ["మ్యారినేడ్ కోసం", "చికెన్: 500g, ఎముకతో కూడిన ముక్కలు", "పెరుగు: 1/2 cup", "పసుపు పొడి: 1/2 teaspoon", "ధనియాల (దనియా) పొడి: 1 teaspoon", "బిర్యానీ మసాలా: 1 tablespoon", "ఉప్పు: రుచికి తగ్గట్టు", "నిమ్మరసం: 1 tablespoon", "గ్రీన్ మసాలా కోసం", "నూనె: 1 tablespoon", "ఉల్లిపాయ: 1/2, ముతకగా తరిగినది", "టమాటా: 1/2, ముతకగా తరిగినది", "పుదీనా ఆకులు: 1/2 cup", "కొత్తిమీర ఆకులు: 1/2 cup", "పచ్చిమిర్చి: 4-5 pieces", "అల్లం-వెల్లుల్లి పేస్ట్: 1 tablespoon", "ఎండిన మెంతి ఆకులు (కసూరి మేథి): 1 teaspoon", "అన్నం కోసం", "సీరగ సాంబా బియ్యం (లేదా బాస్మతి): 2 glasses", "నీరు: 4 glasses", "నెయ్యి: 1 tablespoon", "గరం మసాలా దినుసులు (బిర్యానీ ఆకు, లవంగాలు, దాల్చినచెక్క)", "తరిగిన ఉల్లిపాయలు మరియు పచ్చిమిర్చి: తాలింపు కోసం"], "steps": ["Marinate the Chicken: Combine chicken with curd, turmeric, coriander powder, biryani masala, salt, and lemon juice. Let it rest for at least 30 minutes.", "Prepare the Green Paste: Sauté chopped onions, tomato, mint, coriander, and green chilies in a little oil until they wilt. Let it cool, then blend with ginger-garlic paste and kasuri methi into a smooth green paste.", "Sauté Aromatics: In a pressure cooker, heat ghee and oil. Add whole spices, sliced onions, and green chilies. Fry until the onions turn translucent.", "Cook Chicken and Paste: Stir in the green masala paste and sauté for a minute. Add the marinated chicken and cook for 5-7 minutes until the chicken is partially cooked.", "Add Rice and Water: Add the soaked rice and 4 glasses of water. Check for salt and adjust.", "Pressure Cook: Close the lid and pressure cook for 2 whistles (or according to your cooker's settings for rice). Let the pressure release naturally. Fluff gently and serve with raita."], "steps_te": ["చికెన్‌ను మ్యారినేట్ చేయండి: చికెన్‌ను పెరుగు, పసుపు, ధనియాల పొడి, బిర్యానీ మసాలా, ఉప్పు మరియు నిమ్మరసంతో కలపండి. కనీసం 30 minutes నాననివ్వండి.", "గ్రీన్ పేస్ట్ సిద్ధం చేయండి: తరిగిన ఉల్లిపాయలు, టమాటా, పుదీనా, కొత్తిమీర మరియు పచ్చిమిర్చిని కొద్దిగా నూనెలో వాడిపోయేవరకు వేయించండి. చల్లారనివ్వండి, తర్వాత అల్లం-వెల్లుల్లి పేస్ట్ మరియు కసూరి మేథితో కలిపి మెత్తని గ్రీన్ పేస్ట్‌గా రుబ్బండి.", "సువాసన దినుసులు వేయించండి: ప్రెషర్ కుక్కర్‌లో నెయ్యి మరియు నూనె వేడి చేయండి. గరం మసాలా దినుసులు, తరిగిన ఉల్లిపాయలు మరియు పచ్చిమిర్చి వేయండి. ఉల్లిపాయలు పారదర్శకంగా అయ్యేవరకు వేయించండి.", "చికెన్ మరియు పేస్ట్ వండండి: గ్రీన్ మసాలా పేస్ట్ వేసి ఒక నిమిషం వేయించండి. మ్యారినేట్ చేసిన చికెన్ వేసి చికెన్ సగం ఉడికేవరకు 5-7 minutes వండండి.", "అన్నం మరియు నీరు వేయండి: నానబెట్టిన బియ్యం మరియు 4 glasses నీరు వేయండి. ఉప్పు చూసుకుని సర్దుకోండి.", "ప్రెషర్ కుక్ చేయండి: మూత మూసి 2 విజిల్స్ వరకు ప్రెషర్ కుక్ చేయండి (లేదా మీ కుక్కర్‌లో అన్నం కోసం ఉన్న సెట్టింగ్ ప్రకారం). ప్రెషర్ సహజంగా తగ్గనివ్వండి. మెల్లగా కలపండి, రైతాతో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:06:17.689Z"}, {"n": 12, "title": "One-Pot Ghee Chicken Rice", "title_te": "వన్-పాట్ నెయ్యి చికెన్ రైస్", "cat": "Adult", "section": "adult", "emoji": "🍗", "image": "https://theartisticcook.com/wp-content/uploads/2025/07/chicken-rice-one-pot-1200x2139.jpg", "prep": "15-20 minutes (rice soak)", "cook": "12-15 minutes (plus 5-6 minutes rest)", "yield": "2-3", "desc": "Cozy one-pot chicken rice with whole spices and biryani masala, somewhere between yakhni pulao and biryani.", "desc_te": "మొత్తం మసాలాలు మరియు బిర్యానీ మసాలాతో చేసిన హాయిగా ఉండే వన్-పాట్ చికెన్ రైస్, యఖ్ని పులావ్ మరియు బిర్యానీ మధ్యలో ఉండే వంటకం.", "tags": ["non-vegetarian", "contains dairy", "dinner", "lunch"], "ing": ["1-2 tbsp ghee", "1 tsp jeera (cumin seeds)", "2 elaichi (cardamom)", "2 cloves", "2-3 peppercorns", "1 medium sliced onion", "4-5 garlic cloves, minced", "2 Thai red chilli or green chilli", "350 g bite-sized chicken thigh pieces", "Salt", "1/4 tsp black pepper (or more to taste)", "1.5 tsp biryani masala", "220 g soaked rice (soaked 15-20 minutes)", "400 ml hot water", "Fresh coriander", "Lemon, for squeezing", "Raita, optional, to serve"], "ing_te": ["1-2 tbsp నెయ్యి", "1 tsp జీలకర్ర (జీరా)", "2 ఏలకులు (ఏలకులు)", "2 లవంగాలు", "2-3 మిరియాలు", "1 మధ్యస్థ ఉల్లిపాయ, సన్నగా తరిగినది", "4-5 వెల్లుల్లి రెబ్బలు, సన్నగా తరిగినవి", "2 థాయ్ ఎర్ర మిరపకాయలు లేదా పచ్చి మిరపకాయలు", "350 g చిన్న ముక్కలుగా చేసిన చికెన్ తొడలు", "ఉప్పు", "1/4 tsp నల్ల మిరియాల పొడి (లేదా రుచికి తగినంత ఎక్కువ)", "1.5 tsp బిర్యానీ మసాలా", "220 g నానబెట్టిన బియ్యం (15-20 minutes నానబెట్టినవి)", "400 ml వేడి నీరు", "తాజా కొత్తిమీర", "నిమ్మకాయ, పిండడానికి", "రైతా, ఐచ్ఛికం, వడ్డించడానికి"], "steps": ["Heat the ghee and add the jeera, elaichi, cloves and peppercorns.", "Add the sliced onion, minced garlic and chilli; cook until the onions are browned.", "Add the chicken, salt, black pepper and biryani masala; cook 5 minutes.", "Add the soaked rice and roast 5 minutes.", "Pour in the hot water, cover and cook on low-medium 12-15 minutes.", "Rest 5-6 minutes, then finish with fresh coriander and a squeeze of lemon.", "Serve as is or with raita."], "steps_te": ["నెయ్యిని వేడి చేసి జీలకర్ర, ఏలకులు, లవంగాలు మరియు మిరియాలు వేయండి.", "సన్నగా తరిగిన ఉల్లిపాయ, సన్నగా తరిగిన వెల్లుల్లి మరియు మిరపకాయ వేసి ఉల్లిపాయలు గోధుమ రంగులోకి వచ్చేవరకు ఉడికించండి.", "చికెన్, ఉప్పు, నల్ల మిరియాలు మరియు బిర్యానీ మసాలా వేసి 5 minutes ఉడికించండి.", "నానబెట్టిన బియ్యం వేసి 5 minutes వేయించండి.", "వేడి నీరు పోసి, మూత పెట్టి, తక్కువ-మధ్యస్థ మంటపై 12-15 minutes ఉడికించండి.", "5-6 minutes విశ్రాంతి ఇచ్చి, ఆ తర్వాత తాజా కొత్తిమీర మరియు నిమ్మరసం పిండి ముగించండి.", "అలాగే వడ్డించండి లేదా రైతాతో వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:02:50.614Z"}, {"n": 27, "title": "Palak Paneer (Paneer-Puree Style)", "title_te": "పాలక్ పనీర్ (పనీర్-ప్యూరీ శైలి)", "cat": "Adult", "section": "adult", "emoji": "🧀", "image": "https://www.spiceupthecurry.com/wp-content/uploads/2022/01/palak-paneer-1.jpg", "prep": "—", "cook": "about 8-10 minutes", "yield": "3", "desc": "High-protein palak paneer made by blending paneer into the spinach gravy, finished with a garlic-chilli tadka; 270 kcal and 20g protein per serving.", "desc_te": "పాలకూర గ్రేవీలో పనీర్‌ను బ్లెండ్ చేసి చేసిన అధిక ప్రోటీన్ పాలక్ పనీర్; చివరలో వెల్లుల్లి-కారం తడక వేయబడుతుంది; ఒక్కో భాగంలో 270 kcal మరియు 20g ప్రోటీన్ ఉంటుంది.", "tags": ["vegetarian", "contains dairy", "dinner", "lunch"], "ing": ["1 tsp oil", "1 large onion (about 120 g), thinly sliced", "1 tsp ginger garlic paste", "1/4 tsp turmeric", "1/2 tsp chilli powder", "1 tsp coriander powder", "1/2 tsp garam masala", "120 g tomato puree", "1/2 tsp salt", "250 g chopped palak (spinach)", "200 g soft paneer", "1/3 cup hot water (for blending)", "1 tbsp oil (for tadka)", "3/4 tsp cumin seeds", "1 tsp Kashmiri chilli powder", "3 garlic cloves, finely chopped", "Handful of chopped coriander"], "ing_te": ["1 tsp నూనె", "1 పెద్ద ఉల్లిపాయ (సుమారు 120 g), సన్నగా ముక్కలు చేసినది", "1 tsp అల్లం వెల్లుల్లి పేస్ట్", "1/4 tsp పసుపు", "1/2 tsp కారం పొడి", "1 tsp ధనియాల పొడి", "1/2 tsp గరం మసాలా", "120 g టమోటా ప్యూరీ", "1/2 tsp ఉప్పు", "250 g తరిగిన పాలకూర (పాలక్)", "200 g మెత్తని పనీర్", "1/3 cup వేడి నీరు (బ్లెండింగ్ కోసం)", "1 tbsp నూనె (తడక కోసం)", "3/4 tsp జీలకర్ర గింజలు", "1 tsp కాశ్మీరీ కారం పొడి", "3 వెల్లుల్లి రెబ్బలు, సన్నగా తరిగినవి", "గుప్పెడు తరిగిన కొత్తిమీర"], "steps": ["Heat 1 tsp oil in a pan on medium heat; add the onion and ginger garlic paste and cook till golden brown.", "Add the turmeric, chilli powder, coriander powder and garam masala; mix well and cook a minute.", "Add the tomato puree and salt; mix well and cook 2 minutes until thick and glossy.", "Add the chopped palak and mix well on low flame; cook 3 minutes.", "Blend the soft paneer with 1/3 cup hot water into a puree and add to the cooking spinach; mix well and simmer only 1-2 minutes.", "Make a tadka: heat 1 tbsp oil, add cumin seeds, Kashmiri chilli powder and finely chopped garlic.", "Mix in the tadka, switch off the flame, garnish with chopped coriander and serve."], "steps_te": ["ఒక పాన్‌లో మధ్యస్థ మంటపై 1 tsp నూనె వేడి చేసి, ఉల్లిపాయ మరియు అల్లం వెల్లుల్లి పేస్ట్ వేసి బంగారు రంగు వచ్చే వరకు ఉడికించండి.", "పసుపు, కారం పొడి, ధనియాల పొడి మరియు గరం మసాలా వేసి బాగా కలిపి ఒక నిమిషం ఉడికించండి.", "టమోటా ప్యూరీ మరియు ఉప్పు వేసి బాగా కలిపి, చిక్కగా మరియు మెరిసేలా అయ్యే వరకు 2 నిమిషాలు ఉడికించండి.", "తరిగిన పాలకూర వేసి తక్కువ మంటపై బాగా కలిపి 3 నిమిషాలు ఉడికించండి.", "మెత్తని పనీర్‌ను 1/3 cup వేడి నీటితో ప్యూరీలా బ్లెండ్ చేసి, ఉడుకుతున్న పాలకూరలో వేసి బాగా కలిపి కేవలం 1-2 నిమిషాలు మాత్రమే సిమ్మర్ చేయండి.", "తడక చేయండి: 1 tbsp నూనె వేడి చేసి, జీలకర్ర గింజలు, కాశ్మీరీ కారం పొడి మరియు సన్నగా తరిగిన వెల్లుల్లి వేయండి.", "తడక కలిపి, మంట ఆపి, తరిగిన కొత్తిమీరతో అలంకరించి వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-22T16:03:26.449Z"}, {"n": 127, "title": "Paneer & Veggie Stuffed Besan Cheela (Chickpea Flour Crepes)", "title_te": "పనీర్ & వెజ్జీ స్టఫ్డ్ బేసన్ చీలా (చిక్‌పీ పిండి క్రెప్స్)", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍳", "image": "https://dy3rma73kowlp.cloudfront.net/uploads/2025/09/besan-paneer-Recipe.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "A protein-packed, savory Indian pancake made from besan (gram flour) and stuffed with fresh grated paneer and vegetables.", "desc_te": "బేసన్ (శనగ పిండి)తో చేసిన ప్రోటీన్ నిండిన, రుచికరమైన భారతీయ పాన్‌కేక్, తాజా తురిమిన పనీర్ మరియు కూరగాయలతో స్టఫ్ చేయబడింది.", "tags": [], "ing": ["Batter", "1/2 cup besan (gram flour / chickpea flour)", "1/4 tsp roasted cumin powder (jeera)", "1/8 tsp turmeric powder (haldi)", "1/4 tsp carom seeds (ajwain), crushed between palms", "Pinch of salt (optional / minimal for toddlers)", "1/3 cup water (plus 1–2 tbsp as needed for pourable batter)", "Filling / Veggies", "1/3 cup fresh paneer, finely grated or crumbled", "2 tbsp finely grated carrot", "2 tbsp finely grated zucchini or finely chopped baby spinach", "1 tsp ghee or olive oil (for cooking)"], "ing_te": ["పిండి", "1/2 cup బేసన్ (శనగ పిండి / చిక్‌పీ పిండి)", "1/4 tsp వేయించిన జీలకర్ర పొడి (jeera)", "1/8 tsp పసుపు పొడి (haldi)", "1/4 tsp వాము గింజలు (ajwain), అరచేతుల మధ్య నలిపినవి", "Pinch of ఉప్పు (optional / పిల్లలకు కనీసం)", "1/3 cup నీరు (పోయగల బ్యాటర్ కోసం అవసరమైతే అదనంగా 1–2 tbsp)", "ఫిల్లింగ్ / కూరగాయలు", "1/3 cup తాజా పనీర్, సన్నగా తురిమినది లేదా నలిపినది", "2 tbsp సన్నగా తురిమిన క్యారెట్", "2 tbsp సన్నగా తురిమిన జుచిని లేదా సన్నగా తరిగిన బేబీ పాలకూర", "1 tsp నెయ్యి లేదా ఆలివ్ నూనె (వండడానికి)"], "steps": ["Prepare the Batter: In a bowl, whisk together the besan, cumin powder, turmeric, crushed ajwain, and pinch of salt. Gradually add water and whisk into a smooth, lump-free batter with a pouring consistency (similar to pancake batter).", "Prepare Filling: In a small bowl, toss together the grated paneer, grated carrot, and grated zucchini/spinach.", "Cook Cheela: Heat a non-stick tawa or skillet over medium-low heat and grease lightly with a few drops of ghee.", "Pour & Spread: Pour a small ladleful (about 1/4 cup) of batter onto the center and gently spread in circular motions to make a 4- to 5-inch circle.", "Add Filling: Immediately sprinkle 2 tablespoons of the paneer-veggie mixture over the wet surface, pressing down lightly with a spatula so it adheres, or reserve the paneer to fold inside like a taco/roll.", "Flip & Finish: Drizzle a few drops of ghee around the edges. Cover and cook on medium-low heat for 2 minutes until the bottom is golden. Flip gently and cook for 1 minute on the other side.", "Serve: Roll or cut into bite-sized strips for easy toddler finger grasp."], "steps_te": ["బ్యాటర్ సిద్ధం చేయండి: ఒక గిన్నెలో బేసన్, జీలకర్ర పొడి, పసుపు, నలిపిన ajwain మరియు చిటికెడు ఉప్పును కలపండి. క్రమంగా నీరు వేసి మృదువైన, ఉండలు లేని, పోయగల బ్యాటర్‌గా (పాన్‌కేక్ బ్యాటర్ లాగా) గిలకొట్టండి.", "ఫిల్లింగ్ సిద్ధం చేయండి: చిన్న గిన్నెలో తురిమిన పనీర్, తురిమిన క్యారెట్ మరియు తురిమిన జుచిని/పాలకూరను కలపండి.", "చీలా వండండి: మధ్యస్థ-తక్కువ మంటపై నాన్-స్టిక్ తవా లేదా స్కిల్లెట్‌ను వేడి చేసి కొన్ని చుక్కల నెయ్యితో తేలికగా గ్రీజ్ చేయండి.", "పోసి పరచండి: మధ్యలో చిన్న గరిటెడు (సుమారు 1/4 cup) బ్యాటర్ పోసి, వృత్తాకార చలనాలతో మెల్లగా పరచి 4- to 5-inch వృత్తం చేయండి.", "ఫిల్లింగ్ వేయండి: వెంటనే తడి ఉపరితలంపై 2 tablespoons పనీర్-వెజ్జీ మిశ్రమాన్ని చల్లండి, స్పాచులాతో తేలికగా నొక్కి అంటుకునేలా చేయండి, లేదా టాకో/రోల్ లాగా మడిచేందుకు పనీర్‌ను లోపల పెట్టడానికి ఉంచండి.", "తిప్పి పూర్తి చేయండి: అంచుల చుట్టూ కొన్ని చుక్కల నెయ్యి చల్లండి. కవర్ చేసి మధ్యస్థ-తక్కువ మంటపై అడుగు భాగం బంగారు రంగు వచ్చేవరకు 2 minutes వండండి. మెల్లగా తిప్పి మరో వైపు 1 minute వండండి.", "వడ్డించండి: పిల్లలు వేళ్లతో సులభంగా పట్టుకోవడానికి రోల్ చేయండి లేదా చిన్న ముక్కలుగా కోయండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:19.165Z"}, {"n": 128, "title": "Paneer & Veggie Stuffed Mini Parathas", "title_te": "పనీర్ & వెజ్జీ స్టఫ్డ్ మినీ పరాఠాలు", "cat": "Kid & Toddler", "section": "kid", "emoji": "🍳", "image": "https://www.cookwithmanali.com/wp-content/uploads/2019/07/Recipe-Paneer-Paratha.jpg", "prep": "15 mins", "cook": "10 mins", "yield": "—", "desc": "Ingredients:", "desc_te": "పదార్థాలు:", "tags": [], "ing": ["1 cup whole wheat flour (atta)", "1/2 cup crumbled paneer (cottage cheese)", "1/4 cup finely grated carrots and zucchini", "1/4 cup boiled mashed green peas", "1/4 tsp cumin powder", "Pinch of turmeric powder and salt", "1 tsp ghee (for cooking)"], "ing_te": ["1 cup హోల్ వీట్ పిండి (atta)", "1/2 cup నలిపిన పనీర్ (కాటేజ్ చీజ్)", "1/4 cup సన్నగా తురిమిన క్యారెట్లు మరియు జుచిని", "1/4 cup ఉడికించి మెదిపిన ఆకుపచ్చ బఠానీలు", "1/4 tsp జీలకర్ర పొడి", "Pinch of పసుపు పొడి మరియు ఉప్పు", "1 tsp నెయ్యి (వండడానికి)"], "steps": ["In a bowl, knead whole wheat flour with water into a soft, smooth dough. In another bowl, mix crumbled paneer, grated carrots, zucchini, mashed peas, cumin powder, turmeric, and salt to prepare the filling. Divide dough into small lemon-sized balls. Roll each ball slightly, place 1 tablespoon of paneer-veggie filling in the center, and seal the edges. Flatten gently and roll into a small, thin pancake (paratha). Heat a tawa or skillet over medium heat. Cook the paratha with a tiny drop of ghee on both sides until golden spots appear. Cut into bite-sized quarters or finger foods for easy toddler eating."], "steps_te": ["ఒక గిన్నెలో హోల్ వీట్ పిండిని నీటితో మృదువైన, మెత్తని పిండిగా పిసకండి. మరో గిన్నెలో నలిపిన పనీర్, తురిమిన క్యారెట్లు, జుచిని, మెదిపిన బఠానీలు, జీలకర్ర పొడి, పసుపు మరియు ఉప్పును కలిపి ఫిల్లింగ్ సిద్ధం చేయండి. పిండిని చిన్న నిమ్మకాయ పరిమాణంలో బంతులుగా విభజించండి. ప్రతి బంతిని కొద్దిగా రోల్ చేసి, మధ్యలో 1 tablespoon పనీర్-వెజ్జీ ఫిల్లింగ్ ఉంచి, అంచులను మూసివేయండి. మెల్లగా చదును చేసి చిన్న, సన్నని పాన్‌కేక్ (పరాఠా)గా రోల్ చేయండి. మధ్యస్థ మంటపై తవా లేదా స్కిల్లెట్‌ను వేడి చేయండి. బంగారు మచ్చలు వచ్చేవరకు రెండు వైపులా కొద్దిగా నెయ్యితో పరాఠాను వండండి. పిల్లలు సులభంగా తినడానికి చిన్న క్వార్టర్‌లుగా లేదా ఫింగర్ ఫుడ్‌లుగా కోయండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:09:19.198Z"}, {"n": 75, "title": "Paneer Bhurji Rice", "title_te": "పనీర్ భుర్జీ రైస్", "cat": "Adult", "section": "adult", "emoji": "🍚", "image": "https://www.awesomecuisine.com/wp-content/uploads/2025/08/one-pot-paneer-bhurji-rice.jpg", "prep": "—", "cook": "—", "yield": "—", "desc": "A quick and delicious rice dish made with crumbled paneer, vibrant vegetables, and aromatic spices.", "desc_te": "చిదిమిన పనీర్, రంగురంగుల కూరగాయలు మరియు సువాసనభరితమైన మసాలాలతో చేసిన త్వరితమైన, రుచికరమైన అన్నం వంటకం.", "tags": [], "ing": ["Basmati rice: 2 cups, cooked (or leftover rice)", "Paneer (Indian cottage cheese): 200g, crumbled", "Butter: 2 tablespoons", "Cumin seeds: 1 teaspoon", "Onion: 1 medium, finely chopped", "Capsicum (Bell pepper): 1/2 cup, finely chopped", "Tomato: 1 medium, finely chopped", "Red chili powder: 1 teaspoon", "Turmeric powder: 1/2 teaspoon", "Garam masala: 1/2 teaspoon", "Coriander powder: 1 teaspoon", "Salt: to taste", "Lemon juice: 1 tablespoon", "Fried onions (Biryani style): 1/4 cup", "Fresh coriander: for garnish", "Chaat masala: 1/2 teaspoon"], "ing_te": ["బాస్మతి బియ్యం: 2 cups, వండినది (లేదా మిగిలిన అన్నం)", "పనీర్ (ఇండియన్ కాటేజ్ చీజ్): 200g, చిదిమినది", "వెన్న: 2 tablespoons", "జీలకర్ర: 1 teaspoon", "ఉల్లిపాయ: 1 medium, సన్నగా తరిగినది", "క్యాప్సికమ్ (బెల్ పెప్పర్): 1/2 cup, సన్నగా తరిగినది", "టమాటా: 1 medium, సన్నగా తరిగినది", "కారం పొడి: 1 teaspoon", "పసుపు పొడి: 1/2 teaspoon", "గరం మసాలా: 1/2 teaspoon", "ధనియాల పొడి: 1 teaspoon", "ఉప్పు: రుచికి తగ్గట్టు", "నిమ్మరసం: 1 tablespoon", "వేయించిన ఉల్లిపాయలు (బిర్యానీ శైలి): 1/4 cup", "తాజా కొత్తిమీర: అలంకరణ కోసం", "చాట్ మసాలా: 1/2 teaspoon"], "steps": ["Sauté Vegetables: Heat butter in a large pan or wok. Add cumin seeds. Once they sizzle, add chopped onions and capsicum. Sauté until softened.", "Add Spices and Tomatoes: Add chopped tomatoes followed by red chili powder, turmeric, coriander powder, and garam masala. Cook until the tomatoes are mushy. Season with salt.", "Incorporate Paneer: Add the crumbled paneer to the masala and mix well. Sauté for 2-3 minutes to allow the paneer to absorb the flavors.", "Mix with Rice: Add the cooked rice to the pan. Toss gently on high heat until the rice is well-coated with the paneer mixture.", "Finish and Garnish: Add lemon juice, fried onions, fresh coriander, and a sprinkle of chaat masala. Mix one last time and serve hot."], "steps_te": ["కూరగాయలు వేయించండి: ఒక పెద్ద పాన్ లేదా వోక్‌లో వెన్న వేడి చేయండి. జీలకర్ర వేయండి. అవి చిటపటలాడిన తర్వాత తరిగిన ఉల్లిపాయలు మరియు క్యాప్సికమ్ వేయండి. మెత్తబడేవరకు వేయించండి.", "మసాలాలు మరియు టమాటాలు వేయండి: తరిగిన టమాటాలు వేసి, ఆ తర్వాత కారం పొడి, పసుపు, ధనియాల పొడి మరియు గరం మసాలా వేయండి. టమాటాలు మెత్తబడేవరకు వండండి. ఉప్పుతో రుచి సర్దుకోండి.", "పనీర్ కలపండి: చిదిమిన పనీర్‌ను మసాలాలో వేసి బాగా కలపండి. పనీర్ రుచులు పీల్చుకునేలా 2-3 minutes వేయించండి.", "అన్నంతో కలపండి: వండిన అన్నాన్ని పాన్‌లో వేయండి. పనీర్ మిశ్రమం అన్నానికి బాగా పట్టేవరకు అధిక మంటపై మెల్లగా కలపండి.", "ముగించి అలంకరించండి: నిమ్మరసం, వేయించిన ఉల్లిపాయలు, తాజా కొత్తిమీర మరియు చిటికెడు చాట్ మసాలా వేయండి. చివరిసారి కలిపి వేడిగా వడ్డించండి."], "notes": "", "notes_te": "", "added_at": "2026-10-23T19:06:17.465Z"}, {"n": 28, "title": "Paneer Egg Idli", "title_te": "పనీర్ ఎగ్ ఇడ్లీ", "cat": "Adult", "section": "adult", "emoji": "🍳", "image": "https://piwebsiteimages.s3.ap-south-2.amazonaws.com/images/newsletter/june2026-reciepe.png", "prep": "—", "cook": "15 minutes (steaming)", "yield": "—", "desc": "Flour-free steamed idlis from eggs,
